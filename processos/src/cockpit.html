<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nano ProcessOS — Cockpit</title>
<link rel="stylesheet" href="/assets/bpmn/diagram-js.css" />
<link rel="stylesheet" href="/assets/bpmn/bpmn-embedded.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: #0a0a0b; color: #e4e4e7; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  /* The shell fills the viewport exactly and never scrolls itself; only #main scrolls. The grid
     items get min-height/min-width:0 so a tall/wide #main can't stretch the row past 100vh and
     drag the page (and the rail) into the document scroll. */
  .app { display: grid; grid-template-columns: 220px 1fr; height: 100vh; overflow: hidden; }
  /* left rail — pinned so it never scrolls out of view; #main is the scroll container */
  .rail { border-right: 1px solid #1f1f23; padding: 18px 14px; background: #0c0c0e; height: 100vh; overflow-y: auto; min-height: 0; }
  #main { height: 100vh; overflow-y: auto; min-height: 0; min-width: 0; }
  .brand { display: block; font-weight: 700; font-size: 16px; letter-spacing: .02em; margin-bottom: 2px; }
  .brand .dot { color: #a5b4fc; }
  .tag { color: #71717a; font-size: 11px; margin-bottom: 20px; }
  .nav a { display: block; padding: 7px 10px; border-radius: 7px; color: #a1a1aa; font-weight: 500; margin-bottom: 2px; cursor: pointer; }
  .nav a:hover { background: #18181b; color: #e4e4e7; }
  .nav a.active { background: #1d1d22; color: #c7d2fe; }
  .nav a.with-dot { display: flex; align-items: center; }
  .dot-status { width: 9px; height: 9px; border-radius: 50%; margin-left: auto; flex: none; background: #52525b; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .dot-status.on { background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.18); }
  .dot-status.off { background: #eab308; box-shadow: 0 0 0 2px rgba(234,179,8,.16); }
  .dot-status.loading { background: #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,.18); animation: dotpulse 1.1s ease-in-out infinite; }
  @keyframes dotpulse { 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
  /* main */
  main { padding: 26px 30px; max-width: 1180px; }
  .crumbs { color: #71717a; font-size: 12px; margin-bottom: 14px; }
  .crumbs a { color: #a5b4fc; cursor: pointer; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px; }
  .lede { color: #a1a1aa; font-size: 13px; margin: 0 0 18px; max-width: 720px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #141417; border: 1px solid #26262b; border-radius: 10px; padding: 13px 16px; min-width: 120px; }
  .card .n { font-size: 22px; font-weight: 650; }
  .card .l { color: #8b8b93; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
  .tile { background: #141417; border: 1px solid #26262b; border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .tile:hover { border-color: #3f3f6a; transform: translateY(-1px); }
  .tile h3 { margin: 0 0 4px; font-size: 15px; font-family: ui-monospace, monospace; color: #c7d2fe; }
  .sc-star { background: none; border: none; padding: 0 2px; cursor: pointer; font-size: 15px; line-height: 1; color: #6b7280; vertical-align: middle; }
  .sc-star:hover { color: #fbbf24; }
  .sc-star.on { color: #fbbf24; }
  .tile .meta { color: #8b8b93; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.run { background: #0c2a4a; color: #93c5fd; }
  .pill.wait { background: #3a2e07; color: #fcd34d; }
  .pill.accept { background: #06301c; color: #6ee7b7; }
  .pill.stop { background: #2a0a0a; color: #fca5a5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #1f1f23; }
  th { color: #8b8b93; font-weight: 500; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #1d1d22; color: #e4e4e7; border: 1px solid #34343c; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn:hover { border-color: #555; }
  .btn.primary { background: #4338ca; border-color: #4338ca; color: #eef2ff; }
  .btn.primary:hover { background: #4f46e5; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: #fca5a5; background: #1f0a0a; border: 1px solid #3a1414; padding: 12px 16px; border-radius: 8px; }
  .muted { color: #71717a; }
  /* stepper */
  .stepper { display: flex; gap: 0; margin: 8px 0 24px; }
  .step { flex: 1; position: relative; padding: 14px 16px; border: 1px solid #26262b; background: #131316; }
  .step:first-child { border-radius: 10px 0 0 10px; }
  .step:last-child { border-radius: 0 10px 10px 0; }
  .step + .step { border-left: none; }
  .step .k { font-size: 11px; color: #6b6b73; text-transform: uppercase; letter-spacing: .05em; }
  .step .t { font-weight: 650; margin: 3px 0; }
  .step .d { font-size: 12px; color: #9b9ba3; min-height: 16px; }
  .step.done { border-color: #1f3a2a; background: #0e1a12; }
  .step.done .t { color: #6ee7b7; }
  .step.active { border-color: #4338ca; background: #14132a; box-shadow: inset 0 2px 0 #6366f1; }
  .step.active .t { color: #c7d2fe; }
  .step .badge { position: absolute; top: 12px; right: 14px; font-size: 13px; }
  /* cockpit layout: detail + droid pane */
  .cockpit { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  .pane { background: #0e0e11; border: 1px solid #26262b; border-radius: 12px; padding: 14px 16px; }
  .pane h2 { margin-top: 0; }
  .convo { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
  .turn { padding: 9px 12px; border-radius: 10px; font-size: 13px; }
  .turn .who { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .turn.engine { background: #121216; border: 1px solid #26262b; }
  .turn.engine .who { color: #8b8b93; }
  .turn.droid { background: #11142a; border: 1px solid #28306a; }
  .turn.droid .who { color: #a5b4fc; }
  .turn.pilot { background: #1b1407; border: 1px solid #4a3a12; }
  .turn.pilot .who { color: #fcd34d; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  /* ranked-candidates table + fidelity-tier badges */
  table.rank { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rank th, table.rank td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #1f1f24; vertical-align: top; }
  table.rank th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #8b8b93; }
  table.rank td.num, table.rank th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tier { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tier.l2 { background: #052e1b; border: 1px solid #14532d; color: #6ee7b7; }
  .tier.l3 { background: #2a1c05; border: 1px solid #5a3d12; color: #fcd34d; }
  .tier.bad { background: #2a0d0d; border: 1px solid #5a1a1a; color: #fca5a5; }
  .tier.unknown { background: #16161a; border: 1px solid #2a2a30; color: #8b8b93; }
  .hero { font-size: 30px; font-weight: 700; color: #6ee7b7; }
  .hero.sub { font-size: 12px; color: #8b8b93; font-weight: 400; }
  dialog { background: #141417; color: #e4e4e7; border: 1px solid #34343c; border-radius: 12px; padding: 0; max-width: 520px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dlg-body { padding: 20px 22px; }
  .dlg-body label { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 4px; }
  .dlg-body input, .dlg-body select { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .lbl { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 4px; }
  #promptEditor input, #promptEditor textarea, #cpromptEditor input, #cpromptEditor textarea, #personaEditor input, #personaEditor textarea { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; box-sizing: border-box; }
  #promptEditor textarea, #cpromptEditor textarea, #personaEditor textarea { font: 12px/1.5 ui-monospace, monospace; resize: vertical; }
  #promptEditor input:disabled, #promptEditor textarea:disabled, #cpromptEditor input:disabled, #cpromptEditor textarea:disabled, #personaEditor input:disabled, #personaEditor textarea:disabled { opacity: .6; }
  #pilotNote { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; resize: vertical; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid #26262b; }
  /* workspace investigation surface */
  .ws-model { background: #fafafa; border: 1px solid #26262b; border-radius: 12px; height: 460px; margin: 14px 0; }
  .ws-grid { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 13px; margin: 10px 0; }
  .ws-grid b { color: #a1a1aa; font-weight: 500; }
  .obj-row { display: flex; gap: 8px; align-items: center; }
  .obj-row input { flex: 1; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .notebook { margin-top: 14px; }
  .step { border: 1px solid #26262b; border-radius: 9px; margin-bottom: 8px; background: #0c0c0e; }
  .step summary { cursor: pointer; padding: 9px 12px; font-family: ui-monospace, monospace; font-size: 12px; color: #c7d2fe; }
  .step pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, monospace; color: #a1a1aa; max-height: 320px; overflow: auto; }
  .step .args { color: #71717a; padding: 0 12px 6px; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .conclusion { border: 1px solid #3730a3; background: #14142b; border-radius: 12px; padding: 16px 18px; margin-top: 14px; white-space: pre-wrap; }
  /* interactive cockpit chat */
  .chat-wrap { display: flex; gap: 12px; margin-top: 14px; align-items: stretch; }
  .chat-wrap .chat { margin-top: 0; flex: 1; min-width: 0; }
  .chat-sessions { width: 214px; flex: none; border: 1px solid #26262b; border-radius: 12px; background: #0c0c0e; display: flex; flex-direction: column; max-height: 64vh; }
  .cs-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #1f1f25; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8b8b93; font-weight: 700; }
  .cs-head .btn { font-size: 12px; padding: 3px 8px; }
  .cs-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .cs-empty { color: #71717a; font-size: 12px; padding: 10px; text-align: center; }
  .cs-tab { display: flex; align-items: center; gap: 4px; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; flex-wrap: wrap; }
  .cs-tab:hover { background: #131318; }
  .cs-tab.on { background: #11142a; border-color: #28306a; }
  .cs-main { flex: 1; min-width: 0; }
  .cs-name { font-size: 15px; font-weight: 600; color: #e4e4e7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cs-tab.on .cs-name { color: #c7d2fe; }
  .cs-spin { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border: 2px solid #3b3b52; border-top-color: #818cf8; border-radius: 50%; animation: cs-spin 0.7s linear infinite; }
  @keyframes cs-spin { to { transform: rotate(360deg); } }
  .cs-meta { font-size: 10.5px; color: #6b7280; margin-top: 1px; }
  .cs-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .1s; }
  .cs-tab:hover .cs-actions, .cs-tab.on .cs-actions { opacity: 1; }
  .cs-btn { background: none; border: 0; color: #71717a; cursor: pointer; padding: 2px 4px; border-radius: 5px; font-size: 11px; line-height: 1; }
  .cs-btn:hover { background: #1f1f27; color: #e5e7eb; }
  .cs-caret { background: none; border: 0; color: #71717a; cursor: pointer; padding: 2px 4px; border-radius: 5px; font-size: 10px; line-height: 1; transition: transform .12s; }
  .cs-caret:hover { color: #c7d2fe; }
  .cs-caret.open { transform: rotate(180deg); color: #c7d2fe; }
  .cs-models { flex-basis: 100%; margin: 4px 2px 2px; padding: 6px 8px; border-top: 1px dashed #26262b; font-size: 11px; color: #9ca3af; display: flex; flex-direction: column; gap: 3px; }
  .cs-models .csm-lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; font-weight: 700; }
  .cs-models .csm-item { font-family: ui-monospace, monospace; color: #c7d2fe; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cs-models .csm-none { color: #6b7280; font-style: italic; }
  .chat { border: 1px solid #26262b; border-radius: 12px; background: #0c0c0e; margin-top: 14px; display: flex; flex-direction: column; height: 64vh; --chat-font: 15px; }
  .chat-tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid #1c1c22; }
  .chat-tabs .ctab { background: none; border: 1px solid transparent; border-bottom: none; color: #8b8b93; cursor: pointer; padding: 6px 14px; border-radius: 8px 8px 0 0; font: 600 12px/1 inherit; letter-spacing: .02em; }
  .chat-tabs .ctab:hover { color: #c7d2fe; }
  .chat-tabs .ctab.active { color: #e4e4e7; background: #11142a; border-color: #28306a; }
  .chat-export { position: relative; margin-left: auto; }
  .export-menu { position: absolute; right: 0; top: calc(100% + 2px); z-index: 30; background: #14141a; border: 1px solid #2a2a33; border-radius: 8px; padding: 4px; min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .export-menu[hidden] { display: none; }
  .export-menu .em-group { color: #8b8b93; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px 2px; }
  .export-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: #d4d4d8; cursor: pointer; padding: 6px 8px; border-radius: 6px; font: 500 12px/1.2 inherit; }
  .export-menu button:hover { background: #1d1d28; color: #c7d2fe; }
  .chatdebug { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 160px; }
  .chatdebug .empty { color: #71717a; font-size: 13px; margin: 30px auto; text-align: center; max-width: 460px; }
  .dbg-round { border: 1px solid #26262b; border-radius: 10px; background: #0b0b14; margin-bottom: 10px; }
  .dbg-round > summary { cursor: pointer; padding: 8px 12px; font: 600 12px/1.4 inherit; color: #c7d2fe; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dbg-round > summary .dim { color: #6b7280; font-weight: 400; font-family: ui-monospace, monospace; font-size: 11px; }
  .dbg-round > summary .dbg-ts { margin-left: auto; color: #6b7280; font-weight: 500; font-family: ui-monospace, monospace; font-size: 11px; white-space: nowrap; }
  .dbg-round .dbg-actions { padding: 0 12px 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .dbg-round .dbg-actions .copybtn { float: none; margin: 0; border: 1px solid #34343c; border-radius: 6px; padding: 3px 9px; font-size: 11px; color: #a1a1aa; }
  .dbg-round .dbg-actions .copybtn:hover { color: #c7d2fe; border-color: #4b5563; }
  .dbg-msg { border-top: 1px solid #1c1c22; padding: 8px 12px; }
  .dbg-msg .role { font: 700 10px/1 inherit; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; display: inline-block; margin-bottom: 5px; }
  .dbg-msg .role.system { color: #fcd34d; background: rgba(252,211,77,.1); }
  .dbg-msg .role.user { color: #93c5fd; background: rgba(147,197,253,.1); }
  .dbg-msg .role.assistant { color: #a5b4fc; background: rgba(165,180,252,.1); }
  .dbg-msg .role.tool { color: #86efac; background: rgba(134,239,172,.1); }
  .dbg-msg pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 ui-monospace, monospace; color: #cbd5e1; max-height: 320px; overflow: auto; }
  .dbg-msg .meta { color: #6b7280; font: 11px/1.4 ui-monospace, monospace; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .dbg-tools { border-top: 1px solid #1c1c22; padding: 8px 12px; }
  .dbg-tools summary { cursor: pointer; color: #8b8b93; font: 600 11px/1.4 inherit; }
  .dbg-tools .meta { color: #71717a; font: 11px/1.5 ui-monospace, monospace; padding-top: 5px; white-space: pre-wrap; }
  /* Simulations tab — Alternate Reality Engine runs */
  .chatsims { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 160px; }
  .chatsims .empty { color: #71717a; font-size: 13px; margin: 30px auto; text-align: center; max-width: 460px; }
  .simrun { border: 1px solid #26262b; border-radius: 10px; background: #0b0b14; margin-bottom: 10px; }
  .simrun > summary { cursor: pointer; padding: 8px 12px; list-style: none; }
  .simrun > summary::-webkit-details-marker { display: none; }
  .sim-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sim-tool { font: 700 10px/1 inherit; text-transform: uppercase; letter-spacing: .06em; color: #c4b5fd; background: rgba(196,181,253,.12); padding: 3px 8px; border-radius: 999px; }
  .sim-meta { color: #6b7280; font: 11px/1.4 ui-monospace, monospace; }
  .sim-head .dbg-ts { margin-left: auto; color: #6b7280; font: 500 11px/1 ui-monospace, monospace; white-space: nowrap; }
  .sim-note { margin: 0 12px 8px; color: #fcd34d; font-size: 12px; }
  .simcand { border-top: 1px solid #1c1c22; padding: 10px 12px; position: relative; }
  .simcand.best { background: rgba(134,239,172,.04); }
  .sim-badge { position: absolute; top: 10px; right: 12px; z-index: 1; font: 700 9px/1 inherit; text-transform: uppercase; letter-spacing: .06em; color: #86efac; background: rgba(134,239,172,.12); padding: 3px 7px; border-radius: 999px; }
  .sim-baseline { color: #a1a1aa; font-size: 12px; padding: 6px 0; }
  .sim-baseline .dim { color: #6b7280; }
  .sc { margin-top: 8px; }
  .sc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
  .sc-cell { background: #11111a; border: 1px solid #1f1f27; border-radius: 8px; padding: 6px 9px; }
  .sc-k { display: block; color: #6b7280; font: 600 10px/1.4 inherit; text-transform: uppercase; letter-spacing: .04em; }
  .sc-v { display: block; color: #d4d4d8; font: 600 13px/1.3 ui-monospace, monospace; margin-top: 2px; word-break: break-word; }
  .sc-conf { color: #71717a; font-size: 11px; margin-top: 6px; }
  .sc-pending { color: #6b7280; font-size: 12px; font-style: italic; }
  .sc-bad { border: 1px solid rgba(252,165,165,.35); border-radius: 8px; padding: 8px 10px; background: rgba(252,165,165,.05); }
  .sc-bad .sc-verdict { color: #fca5a5; font: 700 11px/1 inherit; text-transform: uppercase; letter-spacing: .05em; }
  .sc-bad .sc-err { color: #fca5a5; font: 11.5px/1.5 ui-monospace, monospace; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
  .sc-bad .sc-hint { color: #fcd34d; font-size: 11.5px; margin-top: 5px; }
  .chatlog { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 160px; }
  .chatlog .empty { color: #71717a; font-size: 13px; margin: auto; text-align: center; max-width: 420px; }
  .bub { padding: 10px 13px; border-radius: 12px; font-size: var(--chat-font, 15px); line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-width: 88%; }
  .bub .who { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .bub.user { align-self: flex-end; background: #1b2540; border: 1px solid #2c3c66; }
  .bub.user .who { color: #93c5fd; }
  .bub.droid { align-self: flex-start; background: #11142a; border: 1px solid #28306a; }
  .bub.droid .who { color: #a5b4fc; }
  .bub.droid .who .who-model { font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0; color: #6b7280; }

<script src="/assets/bpmn/bpmn-auto-layout.js"></script>
<script>
const $ = s => document.querySelector(s);
// #main hosts two panes: #viewHost for the console/processes/prompts/etc renderers (which clobber
// their innerHTML freely) and a persistent #cockpitHost for the investigation surface. The cockpit
// is only ever hidden (display:none), never destroyed, so navigating away and back retains its
// view, the selected chat/tab, and any text typed in the compose box. `main` aliases the view pane
// so the existing renderers keep working unchanged.
const main = $('#viewHost');
const cockpitHost = () => $('#cockpitHost');
let STATE = { view: 'console', proc: null, exp: null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Minimal, XSS-safe Markdown → HTML for droid answers (headings, bold/italic, inline + fenced
// code, ordered/unordered lists, http(s) links, paragraphs). Escapes all input first; only
// http(s) links are emitted, so model output can never inject markup.
function mdToHtml(src){
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks = [];
  // Render a code blob: large blobs (and BPMN/XML the model often dumps inline while it
  // "thinks out loud") are folded into a collapsed disclosure so they don't dominate the
  // panel and look like a stalled render. Returns the placeholder token.
  const pushCode = (lang, code) => {
    const body = e(code.replace(/\n+$/,''));
    const nLines = body.split('\n').length;
    const looksXml = /^\s*(<\?xml|<(?:\w+:)?(?:definitions|process)[\s>])/.test(code);
    const label = (looksXml ? 'BPMN XML' : (lang ? lang.toUpperCase() : 'code'));
    if(body.length > 600 || nLines > 14){
      blocks.push('<details class="md-codefold"><summary>'+esc(label)+' \u00b7 '+nLines+' lines</summary>'+
        '<pre class="md-code">'+body+'</pre></details>');
    } else {
      blocks.push('<pre class="md-code">'+body+'</pre>');
    }
    return '\n\u0000B'+(blocks.length-1)+'\u0000\n';
  };
  src = String(src||'');
  // Fenced code first.
  src = src.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => pushCode(lang, code));
  // Then any *unfenced* BPMN/XML document the model dumped straight into its prose — bounded
  // by the matching close tag — so a raw model dump folds away the same as a fenced one.
  src = src.replace(/(?:<\?xml[\s\S]*?\?>\s*)?<(\w+:)?(definitions|process)\b[\s\S]*?<\/\1?\2>/g,
    (m) => (m.length > 200 ? pushCode('xml', m) : m));
  // An *in-flight* XML dump (open tag, no close yet) — common while the droid streams a model
  // into its reasoning live. Fold the trailing blob so the thinking panel doesn't balloon and
  // look stalled as the XML is authored token by token.
  src = src.replace(/(?:<\?xml[\s\S]*?\?>\s*)?<(\w+:)?(definitions|process)\b[\s\S]*$/,
    (m) => (m.length > 200 ? pushCode('xml', m) : m));
  const inline = t => {
    t = e(t);
    t = t.replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return t;
  };
  const lines = src.split(/\r?\n/);
  let html = '', i = 0, para = [];
  const flush = () => { if(para.length){ html += '<p>'+para.map(inline).join('<br>')+'</p>'; para = []; } };
  while(i < lines.length){
    const ln = lines[i];
    const bm = ln.match(/^\u0000B(\d+)\u0000$/);
    if(bm){ flush(); html += blocks[+bm[1]]; i++; continue; }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flush(); html += '<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>'; i++; continue; }
    // GitHub-style table: a header row followed by a |:---|---:| separator row.
    if(ln.indexOf('|')!==-1 && i+1<lines.length && /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/.test(lines[i+1])){
      flush();
      const cellsOf = r => { let s = r.trim(); if(s.startsWith('|')) s = s.slice(1); if(s.endsWith('|')) s = s.slice(0,-1); return s.split('|').map(c=>c.trim()); };
      const header = cellsOf(lines[i]);
      const aligns = cellsOf(lines[i+1]).map(c => { const l = c.startsWith(':'), r = c.endsWith(':'); return (l&&r)?'center':(r?'right':(l?'left':'')); });
      i += 2;
      let tb = '<table class="md-table"><thead><tr>';
      header.forEach((c,ci)=>{ tb += '<th'+(aligns[ci]?' style="text-align:'+aligns[ci]+'"':'')+'>'+inline(c)+'</th>'; });
      tb += '</tr></thead><tbody>';
      while(i<lines.length && lines[i].indexOf('|')!==-1 && !/^\s*$/.test(lines[i])){
        const cells = cellsOf(lines[i]);
        tb += '<tr>';
        for(let ci=0; ci<header.length; ci++){ const a = aligns[ci]; tb += '<td'+(a?' style="text-align:'+a+'"':'')+'>'+inline(cells[ci]||'')+'</td>'; }
        tb += '</tr>'; i++;
      }
      tb += '</tbody></table>';
      html += tb; continue;
    }
    if(/^\s*([-*+])\s+/.test(ln)){
      flush(); html += '<ul>';
      while(i<lines.length && /^\s*([-*+])\s+/.test(lines[i])){ html += '<li>'+inline(lines[i].replace(/^\s*([-*+])\s+/,''))+'</li>'; i++; }
      html += '</ul>'; continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      flush(); html += '<ol>';
      while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ html += '<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>'; i++; }
      html += '</ol>'; continue;
    }
    if(/^\s*$/.test(ln)){ flush(); i++; continue; }
    para.push(ln); i++;
  }
  flush();
  return html;
}
function ms(v){ return v==null ? '—' : (v>=1000 ? (v/1000).toFixed(2)+'s' : Math.round(v)+'ms'); }
function pct(v){ return v==null ? '—' : (v*100).toFixed(1)+'%'; }
function tierBadge(t){
  const m = {
    'recorded-replay': ['l2','L2 · replay'],
    'requires-generative-mock': ['l3','L3 · mock'],
    'infeasible': ['bad','infeasible'],
  }[t] || ['unknown','—'];
  return '<span class="tier '+m[0]+'">'+m[1]+'</span>';
}
function ago(t){ if(!t) return ''; const s=(Date.now()-t)/1000; if(s<60) return Math.round(s)+'s ago'; if(s<3600) return Math.round(s/60)+'m ago'; return Math.round(s/3600)+'h ago'; }
// Clock time for a chat message stamp; includes the date when it isn't today.
function fmtTime(t){
  if(!t) return '';
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? hm : (d.toLocaleDateString([], {month:'short', day:'numeric'})+' '+hm);
}

// Like fmtTime but with seconds — debug rounds often fire seconds apart.
function fmtClock(t){
  if(!t) return '';
  const d = new Date(t), now = new Date();
  const hms = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? hms : (d.toLocaleDateString([], {month:'short', day:'numeric'})+' '+hms);
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const txt = await r.text();
  const d = txt ? JSON.parse(txt) : {};
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}

  return '<span class="pill accept">done</span>';
}

  const ranking = d.rankingSummary;

    ranking.forEach(c => {

async function decide(key, decision){
  document.querySelectorAll('.actions .btn').forEach(b=>b.disabled=true);
  const noteEl = document.getElementById('pilotNote');
  const note = noteEl ? noteEl.value.trim() : '';
  try { await api('/api/cockpit/experiments/'+key+'/decision', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision, note})}); }
  catch(e){ alert('Decision failed: '+e.message); }
  setTimeout(()=>renderExp(key), 600);
}

// ---- LLM sidecars (first-class) ----
// The supervised local llama.cpp sidecars: ProcessOS ships several sidecar-capable profiles and
// runs up to TWO llama-server processes at once (each on an auto-assigned port) — so an investigation can
// pair a primary model with a sparring-partner / loop-monitor model. This view lists the profiles,
// shows which are active/running, and lets the operator start/stop/switch each — the same controls
// the Settings cog exposes, promoted to a first-class nav surface with a live status dot.
let LLAMA_DOT_TIMER = null;

// Paint the rail status dot green (≥1 sidecar process is up) or yellow (off). Best-effort.
async function refreshLlamaDot(){
  const dot = document.getElementById('navLlamaDot');
  if(!dot) return;
  let st; try { st = await api('/api/llama/status'); } catch(e){ st = null; }
  const running = !!(st && st.running);
  const anyReady = !!(st && st.anyReady);
  // Three states: green = a model is actually serving; blue pulse = a sidecar is up but its model
  // is still downloading/loading (not usable yet); yellow = nothing running.
  const loading = running && !anyReady;
  dot.classList.toggle('on', anyReady);
  dot.classList.toggle('loading', loading);
  dot.classList.toggle('off', !running);
  const phaseLabel = (s) => s.detail || (s.phase ? s.phase : (s.running?'running':'off'));
  const names = (st && st.sidecars || []).map(s => (s.profileId||'?')+' — '+phaseLabel(s));
  dot.title = running
    ? ('local sidecars: '+(names.join('; ')||'?')+' ('+(st.count||names.length)+'/'+(st.max||2)+')')
    : 'local sidecars: off';
  // Keep the chat roster's dots in sync when the composer is on screen.
  if(document.getElementById('chatRoster')) refreshChatRoster();
}
// Poll the dot on a slow timer so the rail reflects sidecar state from any view.
function startLlamaDotPoll(){
  if(LLAMA_DOT_TIMER) return;
  refreshLlamaDot();
  LLAMA_DOT_TIMER = setInterval(refreshLlamaDot, 4000);
}

async function renderSidecars(){
  STATE.view='sidecars'; setActive(); main.innerHTML='Loading…';
  let s, st;
  try { s = await api('/api/settings') || {}; } catch(e){ return fail(e); }
  try { st = await api('/api/llama/status'); } catch(e){ st = {running:false, sidecars:[], count:0, max:2}; }
  const profiles = (s.profiles||[]).filter(p => p.sidecar).slice();
  const active = s.activeProfile;
  const sidecars = st.sidecars || [];
  const max = st.max || 2;
  const runById = {}; sidecars.forEach(r => { if(r.profileId) runById[r.profileId] = r; });
  // Per-profile download state: which models are already cached, and which are downloading now.
  const downloadedById = {}; (st.models||[]).forEach(m => { downloadedById[m.profileId] = !!m.downloaded; });
  const dlById = {}; (st.downloads||[]).forEach(d => { if(d.profileId) dlById[d.profileId] = d; });
  const fmtGB = (b) => (b==null) ? '' : (b/1073741824).toFixed(1)+' GB';
  const atCap = sidecars.length >= max;
  // Card order: starred first, then ready-to-use models (running or already downloaded) ahead of
  // ones that still need a download — so the operator's pinned and usable models float to the top.
  const rank = (p) => (p.starred?0:4) + ((runById[p.id]||downloadedById[p.id])?0:2) + (dlById[p.id]?-1:0);
  profiles.sort((a,b) => rank(a)-rank(b));
  // Map a running sidecar's lifecycle phase to a pill + a human one-liner. A spawned llama-server
  // is NOT immediately usable: it downloads the model, then loads it into memory, then serves.
  const phaseMeta = (r) => {
    switch(r && r.phase){
      case 'ready':       return {pill:'<span class="pill accept">ready</span>',        border:'#14532d', detail:''};
      case 'loading':     return {pill:'<span class="pill wait">loading model…</span>',  border:'#3f3f12', detail:(r.detail||'loading model into memory…')};
      case 'downloading': return {pill:'<span class="pill wait">downloading…</span>',     border:'#1e3a5f', detail:(r.detail||'downloading model…')};
      case 'starting':    return {pill:'<span class="pill wait">starting…</span>',        border:'#1e3a5f', detail:(r.detail||'starting llama-server…')};
      default:            return {pill:'<span class="pill accept">running</span>',        border:'#14532d', detail:''};
    }
  };

  let h = '<h1>LLM sidecars</h1>'
    + '<p class="lede">Local models ProcessOS supervises itself via <code>llama-server</code> (llama.cpp). '
    + 'Up to <b>'+max+'</b> run at once (each on an auto-assigned port) — so an investigation can pair a primary '
    + 'model with a sparring-partner or loop-monitor. The dot in the menu is green while any sidecar is up.</p>'
    + '<div class="btnrow" style="margin:0 0 14px"><button class="btn ghost" id="llConfigProfiles">\u2699 Configure LLM profiles</button></div>';

  // Live status banner: one row per running sidecar.
  if(sidecars.length){
    const anyReady = sidecars.some(r => r.phase==='ready');
    h += '<div class="tile" style="cursor:default;border-color:'+(anyReady?'#14532d':'#1e3a5f')+'">'
      + '<h3 style="color:'+(anyReady?'#6ee7b7':'#7dd3fc')+'">'+(anyReady?'Running':'Starting up')+' <span class="pill '+(anyReady?'accept':'wait')+'">'+sidecars.length+'/'+max+'</span></h3>'
      + sidecars.map(r => {
          const pm = phaseMeta(r);
          return '<div class="meta" style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
          + '<b style="color:#d1fae5">'+esc(r.profileId||'?')+'</b> '+pm.pill+' · '+esc(r.model||'')+(r.port?(' · port '+r.port):'')+(r.pid?(' · pid '+r.pid):'')
          + '<button class="btn warn" data-stop="'+esc(r.profileId||'')+'" style="padding:2px 8px">Stop</button>'
          + '<button class="btn ghost" data-logs="'+esc(r.profileId||'')+'" style="padding:2px 8px">Logs</button>'
          + (pm.detail?('<div class="meta" style="flex-basis:100%;color:#93c5fd;margin-top:2px">'+esc(pm.detail)+'</div>'):'')
          + '</div>';
        }).join('')
      + (anyReady?'':'<div class="meta" style="margin-top:8px;color:#93c5fd">A model is not ready to chat until it finishes downloading and loading — this can take several minutes for large models. Use <b>Logs</b> to watch progress.</div>')
      + '<div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="llStopAll">Stop all</button></div></div>';
  } else {
    h += '<div class="tile" style="cursor:default"><h3>Off <span class="pill wait">idle</span></h3>'
      + '<div class="meta">No sidecar is running. Start one below.'
      + (st.error?(' · last error: '+esc(st.error)):'')+'</div></div>';
  }

  h += '<h2>Sidecar profiles ('+profiles.length+')</h2>';
  if(!profiles.length){
    h += '<p class="muted">No sidecar-capable profiles. <a href="#" id="llAddProfile">Add one in the LLM config</a> (choose the "Managed sidecar" type).</p>';
  } else {
    h += '<div class="grid">' + profiles.map(p => {
      const isActive = p.id===active;
      const isRunning = !!runById[p.id];
      const dl = dlById[p.id];               // active background download, if any
      const isDownloading = !!dl;
      const isDownloaded = !!downloadedById[p.id];
      const pm = isRunning ? phaseMeta(runById[p.id]) : null;
      // A small state pill so "configured / downloaded / available" is legible at a glance.
      const statePill = isRunning ? ''                                            // phase pill already shown
        : isDownloading ? '<span class="pill wait">downloading…</span>'
        : isDownloaded ? '<span class="pill accept">downloaded</span>'
        : '<span class="pill">not downloaded</span>';
      const pills = (isActive?'<span class="pill run">active</span> ':'')
                  + (isRunning?pm.pill:statePill);
      // Start is disabled only if this one already runs or the pool is full — ports are
      // auto-assigned at start, so there is never a pre-start port clash to guard against.
      const startDisabled = (isRunning || atCap) ? 'disabled' : '';
      const startTitle = isRunning ? 'Already running'
                       : atCap ? ('Already running '+max+' sidecars — stop one first')
                       : 'Start this sidecar';
      const runPort = isRunning ? runById[p.id].port : null;
      // The action button reflects the lifecycle: download the weights, then start (serve) them.
      let actions;
      if(isRunning){
        actions = '<button class="btn warn" data-stop="'+esc(p.id)+'">Stop</button>';
      } else if(isDownloading){
        const gb = fmtGB(dl.bytes);
        actions = '<button class="btn ghost" data-logs="'+esc(p.id)+'">Logs</button>'
                + '<button class="btn warn" data-cancel-dl="'+esc(p.id)+'">Cancel download</button>'
                + '<span class="meta" style="color:#7dd3fc;align-self:center">downloading'+(gb?(' · '+esc(gb)):'')+'…</span>';
      } else if(isDownloaded){
        actions = '<button class="btn primary" data-start="'+esc(p.id)+'" '+startDisabled+' title="'+esc(startTitle)+'">Start</button>';
      } else {
        actions = '<button class="btn primary" data-download="'+esc(p.id)+'" title="Download this model in the background">Download</button>'
                + '<button class="btn ghost" data-start="'+esc(p.id)+'" '+startDisabled+' title="Start now (downloads first, then serves)">Start</button>';
      }
      return '<div class="tile" style="cursor:default">'
        + '<h3>'+esc(p.name||p.id)+' '+pills
        + ' <button class="sc-star'+(p.starred?' on':'')+'" data-star="'+esc(p.id)+'" data-starred="'+(p.starred?'1':'0')+'" title="'+(p.starred?'Unstar':'Star (pin to top)')+'">'+(p.starred?'\u2605':'\u2606')+'</button>'
        + '</h3>'
        + '<div class="meta">'+esc(p.modelFile||p.model||'')+(runPort?(' · port '+esc(String(runPort))):'')+'</div>'
        + (pm && pm.detail?('<div class="meta" style="margin-top:4px;color:#93c5fd">'+esc(pm.detail)+'</div>'):'')
        + (p.sidecarArgs?('<div class="meta" style="margin-top:4px;color:#8b8b93">'+esc(p.sidecarArgs)+'</div>'):'')
        + '<div class="btnrow" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'
        + actions
        + (isActive ? '' : '<button class="btn ghost" data-active="'+esc(p.id)+'">Make active</button>')
        + '<button class="btn ghost" data-config="'+esc(p.id)+'">Edit profile</button>'
        + '</div></div>';
    }).join('') + '</div>';
  }

  main.innerHTML = h;

  const startBtn = (id) => api('/api/llama/start', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId:id})});
  main.querySelectorAll('[data-start]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Starting…';
    try { await startBtn(b.dataset.start); } catch(e){ window.alert('Could not start: '+(e.message||e)); }
    refreshLlamaDot(); renderSidecars();
  });
  // Download a model's weights in the background (separate from running it). The background
  // downloader auto-stops once the GGUF is fully cached, flipping the tile to "downloaded → Start".
  main.querySelectorAll('[data-download]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Starting download…';
    try {
      const r = await api('/api/llama/download', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId:b.dataset.download})});
      if(r && r.alreadyDownloaded){ /* nothing to do — re-render shows Start */ }
    } catch(e){ window.alert('Could not start download: '+(e.message||e)); }
    renderSidecars();
  });
  main.querySelectorAll('[data-cancel-dl]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Cancelling…';
    try { await api('/api/llama/download/cancel', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId:b.dataset.cancelDl})}); } catch(e){ window.alert('Could not cancel: '+(e.message||e)); }
    renderSidecars();
  });
  const stopOne = async (b, id) => { if(b){ b.disabled=true; b.textContent='Stopping…'; } try { await api('/api/llama/stop', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(id?{profileId:id}:{})}); } catch(e){ window.alert('Could not stop: '+(e.message||e)); } refreshLlamaDot(); renderSidecars(); };
  const stopAllBtn = document.getElementById('llStopAll'); if(stopAllBtn) stopAllBtn.onclick = () => stopOne(stopAllBtn, null);
  main.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => stopOne(b, b.dataset.stop || null));
  main.querySelectorAll('[data-active]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await api('/api/settings', {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({activeProfile:b.dataset.active})});
      try { window.dispatchEvent(new CustomEvent('processos:settings-changed')); } catch(e){}
    } catch(e){ window.alert('Could not switch active model: '+(e.message||e)); }
    renderSidecars();
  });
  const showLogs = (id) => openLogStream(id || null);
  main.querySelectorAll('[data-logs]').forEach(b => b.onclick = () => showLogs(b.dataset.logs || null));
  const openConfig = (id) => {
    if(typeof window.processosOpenSettings === 'function') window.processosOpenSettings(id || undefined);
    else { const cog = document.getElementById('cog'); if(cog) cog.click(); }
  };
  const cfgBtn = document.getElementById('llConfigProfiles'); if(cfgBtn) cfgBtn.onclick = () => openConfig(null);
  const addBtn = document.getElementById('llAddProfile'); if(addBtn) addBtn.onclick = (e) => { e.preventDefault(); openConfig(null); };
  main.querySelectorAll('[data-config]').forEach(b => b.onclick = () => openConfig(b.dataset.config));
  main.querySelectorAll('[data-star]').forEach(b => b.onclick = async () => {
    const want = b.dataset.starred !== '1';
    b.disabled = true;
    try {
      await api('/api/settings/profiles/'+encodeURIComponent(b.dataset.star), {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({starred:want})});
    } catch(e){ window.alert('Could not update star: '+(e.message||e)); }
    renderSidecars();
  });

  // While any sidecar is still downloading/loading (not yet ready) OR a background model download
  // is active, re-render on a timer so the operator watches progress without manually refreshing.
  // Guarded so it stops once the view changes or everything is settled.
  const stillWarming = sidecars.some(r => r.phase && r.phase!=='ready');
  const anyDownloading = (st.downloads||[]).length > 0;
  if(stillWarming || anyDownloading){
    setTimeout(() => { if(STATE.view==='sidecars') renderSidecars(); }, 3000);
  }
}

// Streaming sidecar log viewer. A body-level fixed overlay (so a #main re-render can't destroy
// it) that polls /api/llama/logs?profileId=…&since=N every second, appending only the new lines
// and auto-scrolling. Polling stops when the overlay is closed or the process is no longer running.
// `profileId` may be null to follow the single running sidecar.
let LOG_STREAM_TIMER = null;
function closeLogStream(){
  if(LOG_STREAM_TIMER){ clearTimeout(LOG_STREAM_TIMER); LOG_STREAM_TIMER = null; }
  const back = document.getElementById('logModalBack');
  if(back) back.remove();
}
function openLogStream(profileId){
  closeLogStream();
  const qsId = profileId ? ('profileId='+encodeURIComponent(profileId)+'&') : '';
  const back = document.createElement('div');
  back.className = 'log-modal'; back.id = 'logModalBack';
  back.innerHTML =
    '<div class="lm-box">'
    + '<div class="lm-head">'
    +   '<span class="lm-title"><span id="lmDot" class="dot-status off" style="margin:0"></span> Logs · '+esc(profileId||'sidecar')+' <span id="lmPhase" class="muted" style="font-weight:400"></span></span>'
    +   '<span class="lm-actions">'
    +     '<button class="btn warn" id="lmStop" style="padding:3px 10px">Stop sidecar</button>'
    +     '<button class="btn ghost" id="lmClose" style="padding:3px 10px">Close</button>'
    +   '</span>'
    + '</div>'
    + '<pre class="lm-body" id="lmBody">Loading logs…</pre>'
    + '</div>';
  document.body.appendChild(back);
  const body = back.querySelector('#lmBody');
  const dot = back.querySelector('#lmDot');
  const phaseEl = back.querySelector('#lmPhase');
  back.addEventListener('mousedown', (e) => { if(e.target===back) closeLogStream(); });
  back.querySelector('#lmClose').onclick = closeLogStream;
  back.querySelector('#lmStop').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'Stopping…';
    // The same button stops a serving sidecar OR cancels a background download (whichever this is);
    // the inapplicable call is a harmless no-op.
    try { await api('/api/llama/stop', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(profileId?{profileId}:{})}); } catch(err){}
    if(profileId){ try { await api('/api/llama/download/cancel', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId})}); } catch(err){} }
    refreshLlamaDot(); if(STATE.view==='sidecars') renderSidecars();
  };
  document.addEventListener('keydown', function esc(ev){ if(ev.key==='Escape'){ closeLogStream(); document.removeEventListener('keydown', esc); } });

  let offset = 0, started = false;
  const nearBottom = () => (body.scrollHeight - body.scrollTop - body.clientHeight) < 60;
  const poll = async () => {
    let r; try { r = await api('/api/llama/logs?'+qsId+'since='+offset); } catch(e){ r = null; }
    if(!document.getElementById('logModalBack')) return; // closed mid-flight
    if(r){
      const lines = r.lines || [];
      if(lines.length){
        const stick = nearBottom();
        if(!started){ body.textContent = ''; started = true; }
        body.textContent += (body.textContent?'\n':'') + lines.join('\n');
        if(stick) body.scrollTop = body.scrollHeight;
      } else if(!started){
        body.textContent = '(no output yet)';
      }
      if(typeof r.nextOffset === 'number') offset = r.nextOffset;
      // Reflect the live phase in the header (downloading/loading/ready).
      try {
        const st = await api('/api/llama/status');
        const sc = (st.sidecars||[]).find(s => !profileId || s.profileId===profileId);
        const dl = (st.downloads||[]).find(d => !profileId || d.profileId===profileId);
        if(sc){ dot.className = 'dot-status '+(sc.phase==='ready'?'on':'loading'); phaseEl.textContent = '· '+(sc.detail||sc.phase||''); }
        else if(dl){ const gb = (dl.bytes==null)?'':(' '+(dl.bytes/1073741824).toFixed(1)+' GB'); dot.className = 'dot-status loading'; phaseEl.textContent = '· downloading model…'+gb; }
        else { dot.className = 'dot-status off'; phaseEl.textContent = '· stopped'; }
      } catch(e){}
    }
    LOG_STREAM_TIMER = setTimeout(poll, 1000);
  };
  poll();
}

  $('#chatSendMenu').onclick = (e) => { e.stopPropagation(); toggleProfileMenu(); };
  $('#chatWrapup').onclick = () => wrapUpChat(ws, proc);
  $('#wsObjSave').onclick = () => saveObjective(ws, proc, p);
  $('#chatBox').addEventListener('keydown', e => {
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); submitCompose(ws, proc); return; }
    const box = e.target;
    // Shell-style history: Up recalls earlier prompts only when the caret is on the
    // first line; Down moves forward only when it's on the last line. A plain caret
    // (no selection, no modifier) so normal multi-line editing is untouched.
    if(e.key==='ArrowUp' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && box.selectionStart===box.selectionEnd){
      if(box.value.slice(0, box.selectionStart).indexOf('\n') === -1){ if(historyPrev(box)) e.preventDefault(); }
    } else if(e.key==='ArrowDown' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && box.selectionStart===box.selectionEnd && STATE.promptHistIdx!==null){
      if(box.value.slice(box.selectionEnd).indexOf('\n') === -1){ if(historyNext(box)) e.preventDefault(); }
    }
  });
  $('#chatFontDown').onclick = () => bumpChatFont(-1);
  $('#chatFontUp').onclick = () => bumpChatFont(1);

    if(pr){ $('#chatBox').value = pr.text; $('#chatBox').focus(); }
    e.target.value = '';
  };
  $('#chatSave').onclick = saveChatPrompt;
  $('#chatReset').onclick = () => resetChat(ws, proc);
}

// ── chat text size (user-adjustable, persisted) ──────────────────────────────
function applyChatFont(){
  const px = Math.min(24, Math.max(11, parseInt(localStorage.getItem('processos.chatFont')||'15', 10)||15));
  // Set on the .chat container so both the transcript (.chatlog .bub) and the compose box
  // (.compose textarea) inherit one font size and resize together.
  const chat = $('#chatLog') && $('#chatLog').closest('.chat');
  if(chat) chat.style.setProperty('--chat-font', px+'px');
  return px;
}
function bumpChatFont(dir){
  const px = Math.min(24, Math.max(11, applyChatFont() + dir*1));
  localStorage.setItem('processos.chatFont', String(px));
  applyChatFont();
}

// ── Export the investigation transcript ──────────────────────────────────────
function wireExportMenu(ws, proc){
  const btn = $('#chatExport'), menu = $('#chatExportMenu');
  if(!btn || !menu) return;
  btn.onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  menu.querySelectorAll('button[data-mode]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); menu.hidden = true; exportInvestigation(ws, proc, b.dataset.mode, b.dataset.format); };
  });
  document.addEventListener('click', () => { menu.hidden = true; });
}
async function exportInvestigation(ws, proc, mode, format){
  const sid = STATE.sessionId;
  if(!sid){ window.alert('No chat session to export yet.'); return; }
  const url = '/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)
    + '/chat/sessions/'+encodeURIComponent(sid)+'/export?mode='+encodeURIComponent(mode)+'&format='+encodeURIComponent(format);
  try {
    const r = await fetch(url);
    if(!r.ok){ window.alert('Export failed ('+r.status+')'); return; }
    const blob = await r.blob();
    const cd = r.headers.get('content-disposition') || '';
    const m = /filename="?([^"]+)"?/.exec(cd);
    const name = m ? m[1] : ('investigation-'+mode+'.'+(format==='txt'?'txt':'md'));
    const a = document.createElement('a');
    const href = URL.createObjectURL(blob);
    a.href = href; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(() => URL.revokeObjectURL(href), 1000);
  } catch(e){ window.alert('Export failed: '+(e.message||e)); }
}

function switchChatTab(tab, ws, proc){
  STATE.chatTab = tab;
  const onChat = tab === 'chat', onSims = tab === 'sims', onDebug = tab === 'debug';
  const log = $('#chatLog'), sims = $('#chatSims'), dbg = $('#chatDebug'), compose = $('#chatCompose');
  if(log) log.style.display = onChat ? '' : 'none';

// Render the Alternate Reality Engine runs for this session — persisted runs (whole transcript)
// plus any from the in-flight turn (not yet saved). Each run shows its variant model(s) and the
// fidelity scorecard, so the operator can follow the droid's exploration.
function renderSimsCombined(){
  const host = $('#chatSims'); if(!host) return;
  const sid = STATE.sessionId;
  const live = (STATE.liveSimsSid === sid && Array.isArray(STATE.liveSims)) ? STATE.liveSims : [];
  const persisted = Array.isArray(STATE.simPersisted) ? STATE.simPersisted : [];
  host.innerHTML = renderSims(persisted.concat(live));
  observeModelCards(host);
}

async function loadSims(ws, proc){
  const host = $('#chatSims'); if(!host) return;
  const sid = STATE.sessionId;
  if(!sid){ STATE.simPersisted = []; renderSimsCombined(); return; }
  try {
    const data = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(sid)+'/simulations');
    if(STATE.sessionId !== sid) return; // session switched while fetching
    STATE.simPersisted = (data && data.runs) || [];
  } catch(e){ if(!Array.isArray(STATE.simPersisted)) STATE.simPersisted = []; }
  renderSimsCombined();
}

function fmtSimMs(n){ if(n==null||isNaN(n)) return '\u2014'; n = Number(n); return n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'s' : Math.round(n)+'ms'; }
function fmtSimPct(r){ if(r==null||isNaN(r)) return '\u2014'; return Math.round(Number(r)*100)+'%'; }

// The outcome panel for one candidate's scorecard — the headline fidelity numbers, or the deploy
// error when the variant didn't parse.
function scorecardSummaryHtml(sc){
  if(!sc || typeof sc !== 'object') return '<div class="sc sc-pending">awaiting scorecard\u2026</div>';
  if(sc.deployError || sc.feasible === false){
    return '<div class="sc sc-bad"><span class="sc-verdict">did not deploy</span>'+
      '<div class="sc-err">'+esc(sc.deployError || (sc.report && sc.report.error) || 'infeasible')+'</div>'+
      (sc.fixHint?'<div class="sc-hint">'+esc(sc.fixHint)+'</div>':'')+'</div>';
  }
  const rep = sc.report || {};
  const rows = [
    ['fidelity', esc(sc.fidelityTier || '\u2014')],
    ['conserved', (rep.conserved!=null?(rep.conserved+'/'+(rep.instancesTotal!=null?rep.instancesTotal:'?')):'\u2014')+' \u00b7 '+fmtSimPct(rep.conservedRate)],
    ['avg latency', fmtSimMs(rep.avgE2eLatencyMs)],
    ['p99 latency', fmtSimMs(rep.p99E2eLatencyMs)],
  ];
  if(sc.requiresNewWorkers && sc.requiresNewWorkers.length) rows.push(['needs workers', esc(sc.requiresNewWorkers.join(', '))]);
  if(sc.mockedWorkers && sc.mockedWorkers.length) rows.push(['mocked', esc(sc.mockedWorkers.join(', '))]);
  if(rep.divergentKeys && rep.divergentKeys.length) rows.push(['divergent', esc(rep.divergentKeys.map(k => (k && k.key) || JSON.stringify(k)).join(', '))]);
  const cells = rows.map(([k,v]) => '<div class="sc-cell"><span class="sc-k">'+k+'</span><span class="sc-v">'+v+'</span></div>').join('');
  return '<div class="sc"><div class="sc-grid">'+cells+'</div>'+(sc.confidence?'<div class="sc-conf">'+esc(sc.confidence)+'</div>':'')+'</div>';
}

// Render simulation runs: one <details> per simulate/compare_variants call, each with its
// variant model card(s) (reusing the suggested-model renderer) beside the fidelity scorecard.
function renderSims(runs){
  if(!runs || !runs.length) return '<div class="empty">No simulations yet. In the Experiment Designer persona, the droid forks the model and replays it against the dataset; each run appears here with its variant and scorecard.</div>';
  return runs.map((run, i) => {
    let args = run.arguments; if(typeof args === 'string'){ try { args = JSON.parse(args); } catch(_){ args = {}; } }
    let res = run.result; if(typeof res === 'string'){ try { res = JSON.parse(res); } catch(_){ res = { raw: run.result }; } }
    const ts = run.ts ? '<span class="dbg-ts" title="'+esc(new Date(run.ts).toLocaleString())+'">'+esc(fmtClock(run.ts))+'</span>' : '';
    let candidates = []; // {name, xml, sc, best}
    if(run.tool === 'compare_variants'){
      const argMap = {};
      ((args && args.candidates) || []).forEach(c => { if(c && c.name) argMap[c.name] = c.model; });
      const best = res && res.best;
      candidates = ((res && res.candidates) || []).map(c => ({ name: c.name, xml: argMap[c.name], sc: c, best: best && c.name === best }));
      if(!candidates.length){ candidates = ((args && args.candidates) || []).map(c => ({ name: c.name, xml: c.model, sc: null, best: false })); }
    } else {
      const sc = res ? (res.scorecard || res) : null;
      candidates = [{ name: (args && args.name) || (sc && sc.name) || 'variant', xml: args && args.model, sc, best: false }];
    }
    const head = '<div class="sim-head"><span class="sim-tool">'+(run.tool==='compare_variants'?'compare variants':'simulate')+'</span>'+
      '<span class="sim-meta">'+candidates.length+' model'+(candidates.length===1?'':'s')+
      (res && res.datasetSize!=null ? (' \u00b7 '+res.datasetSize+' instances replayed') : '')+'</span>'+ts+'</div>';
    const note = (res && res.replayable === false)
      ? '<div class="sim-note">'+esc(res.note || 'not replayable \u2014 needs Tier-2 recorded-input capture (c8 nano --capture)')+'</div>' : '';
    const body = candidates.map(c => {
      const card = c.xml ? modelCardHtml({ name: c.name, xml: c.xml })
        : '<div class="sim-baseline">'+esc(c.name||'baseline')+' <span class="dim">(current model)</span></div>';
      return '<div class="simcand'+(c.best?' best':'')+'">'+(c.best?'<span class="sim-badge">best</span>':'')+card+scorecardSummaryHtml(c.sc)+'</div>';
    }).join('');
    return '<details class="simrun"'+(i===runs.length-1?' open':'')+'><summary>'+head+'</summary>'+note+body+'</details>';
  }).join('');
}

async function loadDebug(ws, proc){
  const host = $('#chatDebug'); if(!host) return;
  const sid = STATE.sessionId;
  if(!sid){ host.innerHTML = '<div class="empty">Start a conversation to capture a request.</div>'; return; }
  // Show in-flight payloads for this session immediately (the endpoint only fills in once the
  // turn finishes), so switching to Debug while the droid is thinking isn't a blank panel.
  const live = (STATE.liveDebugSid === sid && Array.isArray(STATE.liveDebug)) ? STATE.liveDebug : [];
  if(live.length) host.innerHTML = renderDebug({ requests: live });
  try {
    const data = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(sid)+'/debug');
    if(STATE.sessionId !== sid) return; // session switched while fetching
    const reqs = (data && data.requests) || [];
    // Prefer the persisted payloads, but don't clobber a live view with an empty endpoint.
    if(reqs.length || !live.length) host.innerHTML = renderDebug(data);
  } catch(e){ if(!live.length) host.innerHTML = '<div class="empty">'+esc(e.message||e)+'</div>'; }
}

// Render the captured request payloads (one <details> per round) showing the full message
// array the model received: system prompt, prior transcript, tool specs and the latest message.
function renderDebug(data){
  const reqs = (data && data.requests) || [];
  if(!reqs.length) return '<div class="empty">No request captured for this chat yet. Send a message and it will appear here.</div>';
  const roleClass = r => ({system:'system', user:'user', assistant:'assistant', tool:'tool'}[r] || 'assistant');
  return reqs.map((entry, idx) => {
    const b = entry.body || {};
    const msgs = b.messages || [];
    const tools = b.tools || [];
    const head = 'Round '+(entry.round!=null?entry.round:(idx+1))+
      ' <span class="dim">'+esc(b.model||'')+(b.temperature!=null?(' · temp '+esc(b.temperature)):'')+(b.max_tokens!=null?(' · max_tokens '+esc(b.max_tokens)):'')+' · '+msgs.length+' messages</span>'+
      (entry.ts?'<span class="dbg-ts" title="'+esc(new Date(entry.ts).toLocaleString())+'">'+esc(fmtClock(entry.ts))+'</span>':'');
    const copyJson = esc(JSON.stringify(b, null, 2));
    const msgHtml = msgs.map(m => {
      const rc = roleClass(m.role);
      let body = '';
      if(m.content) body += '<pre>'+esc(typeof m.content==='string'?m.content:JSON.stringify(m.content,null,2))+'</pre>';
      if(m.tool_calls && m.tool_calls.length){
        body += '<div class="meta">tool_calls: '+esc(m.tool_calls.map(c => (c.function&&c.function.name)+'('+((c.function&&c.function.arguments)||'')+')').join(', '))+'</div>';
      }
      if(m.tool_call_id) body += '<div class="meta">tool_call_id: '+esc(m.tool_call_id)+'</div>';
      if(!body) body = '<pre>(empty)</pre>';
      return '<div class="dbg-msg"><span class="role '+rc+'">'+esc(m.role||'?')+'</span>'+body+'</div>';
    }).join('');
    const toolHtml = tools.length ? '<details class="dbg-tools"><summary>'+tools.length+' tool'+(tools.length===1?'':'s')+' offered</summary><div class="meta">'+
      esc(tools.map(t => (t.function&&t.function.name)+' — '+((t.function&&t.function.description)||'').split('\n')[0]).join('\n'))+'</div></details>' : '';
    return '<details class="dbg-round"'+(idx===reqs.length-1?' open':'')+'>'+
      '<summary>'+head+'</summary>'+
      '<div class="dbg-actions"><button class="copybtn" title="Copy the full JSON payload" data-copy="'+copyJson+'">Copy JSON payload</button></div>'+
      msgHtml + toolHtml +
      '</details>';
  }).join('');
}

// ── smart Python escape-hatch label ──────────────────────────────────────────
async function refreshPythonLabel(){
  const text = $('#chatPyText'); const cb = $('#chatPy'); if(!text) return;
  let s;
  try { s = await api('/api/python/status'); }
  catch(e){ return; }
  if(!s.configured || !s.interpreterRuns){
    // No usable interpreter — disable the toggle, link to configure instructions.
    if(cb){ cb.checked = false; cb.disabled = true; }
    text.innerHTML = '<span class="pylink" id="pyConfigure">Configure Python</span>';
    const l = $('#pyConfigure'); if(l) l.onclick = pyConfigurePopup;
  } else if(s.dataScience){
    if(cb){ cb.disabled = false; cb.checked = (localStorage.getItem('processos.allowPython')==='1'); }
    text.textContent = 'Enable Python Data Science tools';
  } else {
    if(cb){ cb.disabled = false; cb.checked = (localStorage.getItem('processos.allowPython')==='1'); }
    const missing = (s.missing||[]).join(', ');
    text.innerHTML = 'Enable Python (Optional: <span class="pylink" id="pyInstall">Install Data Science tools</span>)';
    const l = $('#pyInstall'); if(l) l.onclick = () => pyInstallPopup(missing);
  }
  if(cb) cb.onchange = () => { if(!cb.disabled) localStorage.setItem('processos.allowPython', cb.checked ? '1' : '0'); };
}
