<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nano ProcessOS — Cockpit</title>
<link rel="stylesheet" href="/assets/bpmn/diagram-js.css" />
<link rel="stylesheet" href="/assets/bpmn/bpmn-embedded.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: #0a0a0b; color: #e4e4e7; }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  /* left rail */
  .rail { border-right: 1px solid #1f1f23; padding: 18px 14px; background: #0c0c0e; }
  .brand { display: block; font-weight: 700; font-size: 16px; letter-spacing: .02em; margin-bottom: 2px; }

  .tag { color: #71717a; font-size: 11px; margin-bottom: 20px; }

  .nav a:hover { background: #18181b; color: #e4e4e7; }
  .nav a.active { background: #1d1d22; color: #c7d2fe; }

  main { padding: 26px 30px; max-width: 1180px; }
  .crumbs { color: #71717a; font-size: 12px; margin-bottom: 14px; }

  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px; }
  .lede { color: #a1a1aa; font-size: 13px; margin: 0 0 18px; max-width: 720px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #141417; border: 1px solid #26262b; border-radius: 10px; padding: 13px 16px; min-width: 120px; }
  .card .n { font-size: 22px; font-weight: 650; }
  .card .l { color: #8b8b93; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
  .tile { background: #141417; border: 1px solid #26262b; border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .tile:hover { border-color: #3f3f6a; transform: translateY(-1px); }

  .pill.accept { background: #06301c; color: #6ee7b7; }
  .pill.stop { background: #2a0a0a; color: #fca5a5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #1f1f23; }
  th { color: #8b8b93; font-weight: 500; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #1d1d22; color: #e4e4e7; border: 1px solid #34343c; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }

  .btn.primary:hover { background: #4f46e5; }

  .muted { color: #71717a; }
  /* stepper */
  .stepper { display: flex; gap: 0; margin: 8px 0 24px; }
  .step { flex: 1; position: relative; padding: 14px 16px; border: 1px solid #26262b; background: #131316; }
  .step:first-child { border-radius: 10px 0 0 10px; }
  .step:last-child { border-radius: 0 10px 10px 0; }
  .step + .step { border-left: none; }
  .step .k { font-size: 11px; color: #6b6b73; text-transform: uppercase; letter-spacing: .05em; }
  .step .t { font-weight: 650; margin: 3px 0; }
  .step .d { font-size: 12px; color: #9b9ba3; min-height: 16px; }

  .cockpit { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  .pane { background: #0e0e11; border: 1px solid #26262b; border-radius: 12px; padding: 14px 16px; }

  dialog::backdrop { background: rgba(0,0,0,.6); }

  .dlg-body label { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 4px; }
  .dlg-body input, .dlg-body select { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .lbl { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 4px; }
  #promptEditor input, #promptEditor textarea, #cpromptEditor input, #cpromptEditor textarea, #personaEditor input, #personaEditor textarea { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; box-sizing: border-box; }
  #promptEditor textarea, #cpromptEditor textarea, #personaEditor textarea { font: 12px/1.5 ui-monospace, monospace; resize: vertical; }
  #promptEditor input:disabled, #promptEditor textarea:disabled, #cpromptEditor input:disabled, #cpromptEditor textarea:disabled, #personaEditor input:disabled, #personaEditor textarea:disabled { opacity: .6; }
  #pilotNote { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; resize: vertical; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid #26262b; }
  /* workspace investigation surface */
  .ws-model { background: #fafafa; border: 1px solid #26262b; border-radius: 12px; height: 460px; margin: 14px 0; }
  .ws-grid { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 13px; margin: 10px 0; }
  .ws-grid b { color: #a1a1aa; font-weight: 500; }
  .obj-row { display: flex; gap: 8px; align-items: center; }
  .obj-row input { flex: 1; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .notebook { margin-top: 14px; }
  .step { border: 1px solid #26262b; border-radius: 9px; margin-bottom: 8px; background: #0c0c0e; }
  .step summary { cursor: pointer; padding: 9px 12px; font-family: ui-monospace, monospace; font-size: 12px; color: #c7d2fe; }
  .step pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, monospace; color: #a1a1aa; max-height: 320px; overflow: auto; }
  .step .args { color: #71717a; padding: 0 12px 6px; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .conclusion { border: 1px solid #3730a3; background: #14142b; border-radius: 12px; padding: 16px 18px; margin-top: 14px; white-space: pre-wrap; }
  /* interactive cockpit chat */
  .chat-wrap { display: flex; gap: 12px; margin-top: 14px; align-items: stretch; }
  .chat-wrap .chat { margin-top: 0; flex: 1; min-width: 0; }
  .chat-sessions { width: 214px; flex: none; border: 1px solid #26262b; border-radius: 12px; background: #0c0c0e; display: flex; flex-direction: column; max-height: 64vh; }
  .cs-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #1f1f25; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8b8b93; font-weight: 700; }
  .cs-head .btn { font-size: 12px; padding: 3px 8px; }
  .cs-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .cs-empty { color: #71717a; font-size: 12px; padding: 10px; text-align: center; }
  .cs-tab { display: flex; align-items: center; gap: 4px; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; }

  .cs-main { flex: 1; min-width: 0; }

  .cs-tab:hover .cs-actions, .cs-tab.on .cs-actions { opacity: 1; }
  .cs-btn { background: none; border: 0; color: #71717a; cursor: pointer; padding: 2px 4px; border-radius: 5px; font-size: 11px; line-height: 1; }
  .cs-btn:hover { background: #1f1f27; color: #e5e7eb; }
  .chat { border: 1px solid #26262b; border-radius: 12px; background: #0c0c0e; margin-top: 14px; display: flex; flex-direction: column; max-height: 64vh; }
  .chat-tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid #1c1c22; }
  .chat-tabs .ctab { background: none; border: 1px solid transparent; border-bottom: none; color: #8b8b93; cursor: pointer; padding: 6px 14px; border-radius: 8px 8px 0 0; font: 600 12px/1 inherit; letter-spacing: .02em; }
  .chat-tabs .ctab:hover { color: #c7d2fe; }
  .chat-tabs .ctab.active { color: #e4e4e7; background: #11142a; border-color: #28306a; }
  .chatdebug { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 160px; }
  .chatdebug .empty { color: #71717a; font-size: 13px; margin: 30px auto; text-align: center; max-width: 460px; }
  .dbg-round { border: 1px solid #26262b; border-radius: 10px; background: #0b0b14; margin-bottom: 10px; }

  .dbg-round .dbg-actions { padding: 0 12px 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .dbg-round .dbg-actions .copybtn { float: none; margin: 0; border: 1px solid #34343c; border-radius: 6px; padding: 3px 9px; font-size: 11px; color: #a1a1aa; }
  .dbg-round .dbg-actions .copybtn:hover { color: #c7d2fe; border-color: #4b5563; }
  .dbg-msg { border-top: 1px solid #1c1c22; padding: 8px 12px; }

  .dbg-msg .role.system { color: #fcd34d; background: rgba(252,211,77,.1); }
  .dbg-msg .role.user { color: #93c5fd; background: rgba(147,197,253,.1); }
  .dbg-msg .role.assistant { color: #a5b4fc; background: rgba(165,180,252,.1); }
  .dbg-msg .role.tool { color: #86efac; background: rgba(134,239,172,.1); }
  .dbg-msg pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 ui-monospace, monospace; color: #cbd5e1; max-height: 320px; overflow: auto; }
  .dbg-msg .meta { color: #6b7280; font: 11px/1.4 ui-monospace, monospace; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .dbg-tools { border-top: 1px solid #1c1c22; padding: 8px 12px; }
  .dbg-tools summary { cursor: pointer; color: #8b8b93; font: 600 11px/1.4 inherit; }
  .dbg-tools .meta { color: #71717a; font: 11px/1.5 ui-monospace, monospace; padding-top: 5px; white-space: pre-wrap; }
  .chatlog { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 160px; --chat-font: 15px; }
  .chatlog .empty { color: #71717a; font-size: 13px; margin: auto; text-align: center; max-width: 420px; }
  .bub { padding: 10px 13px; border-radius: 12px; font-size: var(--chat-font, 15px); line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-width: 88%; }
  .bub .who { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }

  .bub .think .think-body.md pre.md-code { background: #0c0c0e; border: 1px solid #26262b; border-radius: 6px; padding: 8px 10px; margin: 5px 0; overflow: auto; max-height: 240px; white-space: pre; font: 11px/1.5 ui-monospace, monospace; color: #9ca3af; }
  .bub .think .think-body.md strong { color: #cbd5e1; }
  .bub .who .ts { float: right; font-weight: 500; text-transform: none; letter-spacing: 0; color: #6b7280; font-size: 10px; }
  .bub .steps { margin-top: 8px; }

  .bub .think .think-tl .toolcall .args { color: #71717a; padding: 0 10px 5px; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  .bub .think .think-tl .toolcall pre, .bub .think .think-tl .toolcall .result { margin: 0; padding: 0 10px 10px; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, monospace; color: #a1a1aa; max-height: 280px; overflow: auto; }
  /* copy-to-clipboard button on a droid bubble */

  .bub .answer.md li { margin: 2px 0; }
  .bub .answer.md code { background: #0c0c0e; border: 1px solid #26262b; border-radius: 4px; padding: 1px 4px; font: 0.88em ui-monospace, monospace; color: #fca5a5; }

  .bub .answer.md pre.md-code { white-space: pre; font: 12px/1.5 ui-monospace, monospace; color: #a1a1aa; }
  .bub .answer.md a { color: #93c5fd; }

<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="/">Nano Process<span class="dot">OS</span></a>
    <div class="tag">the cockpit</div>
    <nav class="nav">
      <a href="/workspace">Workspaces</a>

      <a data-view="prompts">Prompts</a>
      <a data-view="experiments">Experiments</a>
    </nav>
  </aside>
  <main id="main">Loading…</main>
</div>

<dialog id="newDlg">
  <div class="dlg-body">
    <h2 style="margin-top:0">New experiment</h2>
    <p class="muted" style="font-size:12px">Fork an experiment on <b id="dlgProc" style="font-family:ui-monospace,monospace;color:#c7d2fe"></b>. The droid proposes redesigns; the engine proves them on the recorded dataset; you decide.</p>
    <label>Droid prompt (the experimental variable)</label>
    <select id="dlgPrompt"></select>
    <label>Iteration budget (max rounds)</label>
    <input id="dlgIters" type="number" min="1" max="50" value="2" />
  </div>
  <div class="dlg-foot">
    <button class="btn ghost" onclick="document.getElementById('newDlg').close()">Cancel</button>
    <button class="btn primary" id="dlgGo">Start experiment</button>
  </div>
</dialog>

<script src="/assets/bpmn/bpmn-navigated-viewer.js"></script>
<script>
const $ = s => document.querySelector(s);
const main = $('#main');
let STATE = { view: 'console', proc: null, exp: null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Minimal, XSS-safe Markdown → HTML for droid answers (headings, bold/italic, inline + fenced
// code, ordered/unordered lists, http(s) links, paragraphs). Escapes all input first; only
// http(s) links are emitted, so model output can never inject markup.
function mdToHtml(src){
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks = [];
  src = String(src||'').replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre class="md-code">'+e(code.replace(/\n$/,''))+'</pre>');
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });
  const inline = t => {
    t = e(t);
    t = t.replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return t;
  };
  const lines = src.split(/\r?\n/);
  let html = '', i = 0, para = [];
  const flush = () => { if(para.length){ html += '<p>'+para.map(inline).join('<br>')+'</p>'; para = []; } };
  while(i < lines.length){
    const ln = lines[i];
    const bm = ln.match(/^\u0000B(\d+)\u0000$/);
    if(bm){ flush(); html += blocks[+bm[1]]; i++; continue; }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flush(); html += '<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>'; i++; continue; }
    // GitHub-style table: a header row followed by a |:---|---:| separator row.
    if(ln.indexOf('|')!==-1 && i+1<lines.length && /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/.test(lines[i+1])){
      flush();
      const cellsOf = r => { let s = r.trim(); if(s.startsWith('|')) s = s.slice(1); if(s.endsWith('|')) s = s.slice(0,-1); return s.split('|').map(c=>c.trim()); };
      const header = cellsOf(lines[i]);
      const aligns = cellsOf(lines[i+1]).map(c => { const l = c.startsWith(':'), r = c.endsWith(':'); return (l&&r)?'center':(r?'right':(l?'left':'')); });
      i += 2;
      let tb = '<table class="md-table"><thead><tr>';
      header.forEach((c,ci)=>{ tb += '<th'+(aligns[ci]?' style="text-align:'+aligns[ci]+'"':'')+'>'+inline(c)+'</th>'; });
      tb += '</tr></thead><tbody>';
      while(i<lines.length && lines[i].indexOf('|')!==-1 && !/^\s*$/.test(lines[i])){
        const cells = cellsOf(lines[i]);
        tb += '<tr>';
        for(let ci=0; ci<header.length; ci++){ const a = aligns[ci]; tb += '<td'+(a?' style="text-align:'+a+'"':'')+'>'+inline(cells[ci]||'')+'</td>'; }
        tb += '</tr>'; i++;
      }
      tb += '</tbody></table>';
      html += tb; continue;
    }
    if(/^\s*([-*+])\s+/.test(ln)){
      flush(); html += '<ul>';
      while(i<lines.length && /^\s*([-*+])\s+/.test(lines[i])){ html += '<li>'+inline(lines[i].replace(/^\s*([-*+])\s+/,''))+'</li>'; i++; }
      html += '</ul>'; continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      flush(); html += '<ol>';
      while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ html += '<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>'; i++; }
      html += '</ol>'; continue;
    }
    if(/^\s*$/.test(ln)){ flush(); i++; continue; }
    para.push(ln); i++;
  }
  flush();
  return html;
}
function ms(v){ return v==null ? '—' : (v>=1000 ? (v/1000).toFixed(2)+'s' : Math.round(v)+'ms'); }
function pct(v){ return v==null ? '—' : (v*100).toFixed(1)+'%'; }
function tierBadge(t){
  const m = {
    'recorded-replay': ['l2','L2 · replay'],
    'requires-generative-mock': ['l3','L3 · mock'],
    'infeasible': ['bad','infeasible'],
  }[t] || ['unknown','—'];
  return '<span class="tier '+m[0]+'">'+m[1]+'</span>';
}
function ago(t){ if(!t) return ''; const s=(Date.now()-t)/1000; if(s<60) return Math.round(s)+'s ago'; if(s<3600) return Math.round(s/60)+'m ago'; return Math.round(s/3600)+'h ago'; }
// Clock time for a chat message stamp; includes the date when it isn't today.
function fmtTime(t){
  if(!t) return '';
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? hm : (d.toLocaleDateString([], {month:'short', day:'numeric'})+' '+hm);
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const txt = await r.text();
  const d = txt ? JSON.parse(txt) : {};
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}

function setActive(){ document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view===STATE.view)); }

function expPill(e){
  if(e.awaitingPilot) return '<span class="pill wait">awaiting you</span>';
  if(e.outcome!=='completed') return '<span class="pill run">running</span>';
  return '<span class="pill accept">done</span>';
}

// ---- Console ----
async function renderConsole(){
  STATE.view='console'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/overview'); } catch(e){ return fail(e); }
  const totI = d.processes.reduce((a,p)=>a+p.instances,0);
  const totX = d.experiments.length;
  const waiting = d.experiments.filter(e=>e.awaitingPilot).length;
  let h = '<h1>Console</h1><p class="lede">Processes that optimize themselves — with a human copilot in the loop. Read production, hypothesize better variants, prove them on real engines, roll winners to production in cohorts.</p>';
  h += '<div class="cards">'
     + card(d.processes.length,'processes') + card(totI,'instances (sampled)')
     + card(totX,'experiments') + card(waiting,'awaiting you') + '</div>';
  h += '<h2>Processes</h2>';
  h += d.processes.length ? '<div class="grid">'+d.processes.map(procTile).join('')+'</div>'
     : '<p class="muted">No target processes sampled yet. Start some instances on the cluster.</p>';
  h += '<h2>Recent experiments</h2>' + expTable(d.experiments.slice(0,8));
  main.innerHTML = h;
}
function card(n,l){ return '<div class="card"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>'; }
function procTile(p){
  return '<div class="tile" onclick="goProcess(\''+esc(p.processId)+'\')">'
    + '<h3>'+esc(p.processId)+'</h3>'
    + '<div class="meta">'+p.instances+' instances · '+p.completed+' completed · avg '+ms(p.avgDurationMs)+' · p95 '+ms(p.p95DurationMs)+'</div>'
    + '<div class="meta" style="margin-top:6px">'+(p.bottleneck?('bottleneck <b style="color:#fca5a5">'+esc(p.bottleneck)+'</b> · '):'')
    + '<b style="color:#c7d2fe">'+p.experiments+'</b> experiment'+(p.experiments===1?'':'s')+'</div></div>';
}

// ---- Processes ----
async function renderProcesses(){
  STATE.view='processes'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/overview'); } catch(e){ return fail(e); }
  let h = '<h1>Processes</h1><p class="lede">Deployed target processes. Open one to see its production baseline and its experiments.</p>';
  h += d.processes.length ? '<div class="grid">'+d.processes.map(procTile).join('')+'</div>' : '<p class="muted">No processes yet.</p>';
  main.innerHTML = h;
}

function goProcess(pid){ STATE.proc=pid; renderProcess(pid); }
async function renderProcess(pid){
  STATE.view='processes'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/overview'); } catch(e){ return fail(e); }
  const p = d.processes.find(x=>x.processId===pid);
  const xs = d.experiments.filter(e=>e.targetProcessId===pid);
  let h = '<div class="crumbs"><a onclick="renderProcesses()">Processes</a> / '+esc(pid)+'</div>';
  h += '<h1 style="font-family:ui-monospace,monospace;color:#c7d2fe">'+esc(pid)+'</h1>';
  if(p){
    h += '<div class="cards" style="margin-top:10px">'
       + card(p.instances,'instances') + card(p.completed,'completed')
       + card(ms(p.avgDurationMs),'avg e2e') + card(ms(p.p95DurationMs),'p95 e2e')
       + card(p.incidentInstances,'with incidents') + '</div>';
  }
  h += '<div style="display:flex;align-items:center;justify-content:space-between"><h2>Experiments</h2>'
     + '<button class="btn primary" onclick="openNew(\''+esc(pid)+'\')">+ New experiment</button></div>';
  h += expTable(xs);
  main.innerHTML = h;
}

// ---- Experiments list ----
async function renderExperiments(){
  STATE.view='experiments'; setActive(); main.innerHTML='Loading…';
  let xs; try { xs = await api('/api/cockpit/experiments'); } catch(e){ return fail(e); }
  let h = '<h1>Experiments</h1><p class="lede">Every optimization run across the fleet. An experiment is a pilot loop on the engine: the droid proposes, the engine proves, you decide.</p>';
  h += expTable(xs);
  main.innerHTML = h;
}
function expTable(xs){
  if(!xs || !xs.length) return '<p class="muted">No experiments yet.</p>';
  let h = '<table><thead><tr><th>Experiment</th><th>Target</th><th>Best candidate</th><th class="num">conserved</th><th class="num">round</th><th>status</th></tr></thead><tbody>';
  for(const e of xs){
    h += '<tr style="cursor:pointer" onclick="goExp(\''+esc(e.instanceKey)+'\')">'
      + '<td><b>#'+esc(e.instanceKey)+'</b> <span class="muted">'+ago(e.startedAt)+'</span></td>'
      + '<td style="font-family:ui-monospace,monospace;color:#c7d2fe">'+esc(e.targetProcessId||'—')+'</td>'
      + '<td>'+esc(e.bestName||'—')+'</td>'
      + '<td class="num">'+pct(e.bestConservedRate)+'</td>'
      + '<td class="num">'+(e.iteration==null?'—':e.iteration+(e.maxIterations?(' / '+e.maxIterations):''))+'</td>'
      + '<td>'+expPill(e)+'</td></tr>';
  }
  return h+'</tbody></table>';
}

// ---- Experiment detail (the cockpit) ----
function goExp(key){ STATE.exp=key; renderExp(key); }
async function renderExp(key){
  STATE.view='experiments'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/experiments/'+key); } catch(e){ return fail(e); }
  const s = d.summary;
  let h = '<div class="crumbs"><a onclick="renderExperiments()">Experiments</a> / #'+esc(key)+'</div>';
  h += '<div style="display:flex;align-items:baseline;gap:12px"><h1>Experiment #'+esc(key)+'</h1>'+expPill(s)+'</div>';
  h += '<p class="lede">Optimizing <b style="font-family:ui-monospace,monospace;color:#c7d2fe">'+esc(s.targetProcessId||'—')+'</b>'
     + (s.promptId ? ' · droid prompt <b style="color:#a5b4fc">'+esc(s.promptId)+'</b>' : ' · built-in prompt')
     + '. The shared instrument is the verifier’s gradient — the conserved-rate of the production boundary on real recorded traces.</p>';

  // stepper
  h += '<div class="stepper">'+d.steps.map(st => {
    const badge = st.status==='done' ? '✓' : (st.status==='active' ? '◆' : '');
    return '<div class="step '+st.status+'"><div class="badge">'+badge+'</div>'
      + '<div class="k">'+esc(st.label)+'</div>'
      + '<div class="t">'+({baseline:'Observe',hypotheses:'Hypothesize',rank:'Test',decision:'Confirm'}[st.id]||'')+'</div>'
      + '<div class="d">'+esc(st.detail||'')+'</div></div>';
  }).join('')+'</div>';

  // cockpit: hero + decision on the left, droid pane on the right
  h += '<div class="cockpit"><div>';
  h += '<div class="pane"><h2>Verifier gradient</h2>'
     + '<div class="hero">'+pct(s.bestConservedRate)+'</div>'
     + '<div class="hero sub">boundary conserved by “'+esc(s.bestName||'—')+'” on real traces</div>';
  if(d.pendingUserTaskKey){
    h += '<label class="lbl" for="pilotNote" style="margin-top:14px">Note to the droid (optional — steers the next round)</label>'
       + '<textarea id="pilotNote" rows="2" placeholder="e.g. cut the tail latency; keep the summarize step"></textarea>';
    h += '<div class="actions">'
      + '<button class="btn primary" onclick="decide(\''+esc(key)+'\',\'accept\')">Accept</button>'
      + '<button class="btn" onclick="decide(\''+esc(key)+'\',\'iterate\')">Ask droid to iterate</button>'
      + '<button class="btn ghost" onclick="decide(\''+esc(key)+'\',\'stop\')">Stop loop</button></div>'
      + '<p class="muted" style="font-size:12px;margin-top:8px">Iterate is available while round &lt; budget ('+(s.maxIterations||'?')+'). Your note is saved to the conversation and fed to the droid.</p>';
  } else if(s.outcome==='completed'){
    h += '<p class="muted" style="margin-top:12px">Loop finished — '+esc(d.finalOutcome||'')+'.</p>';
  } else {
    h += '<p class="muted" style="margin-top:12px">The droid is working — proposing and proving a round on the engine…</p>';
  }
  h += '</div>';
  // ranked candidates — §7.8 step 3: fidelity tier, metrics, confidence, new workers
  const ranking = d.rankingSummary;
  if(Array.isArray(ranking) && ranking.length){
    h += '<div class="pane"><h2>Ranked candidates</h2>'
       + '<p class="muted" style="font-size:12px;margin:-4px 0 10px">Every result carries its fidelity tier — a measured Level-2 replay is never collapsed into the same number as a speculative Level-3 estimate.</p>'
       + '<table class="rank"><thead><tr><th>Candidate</th><th>Tier</th><th class="num">conserved</th><th class="num">e2e</th><th>requires new workers</th><th>confidence</th></tr></thead><tbody>';
    ranking.forEach(c => {
      const nw = Array.isArray(c.requiresNewWorkers)&&c.requiresNewWorkers.length ? c.requiresNewWorkers.map(esc).join(', ') : '—';
      const lat = (c.avgE2eLatencyMs!=null) ? Math.round(c.avgE2eLatencyMs)+'ms' : '—';
      h += '<tr><td>'+esc(c.name||'candidate')+(c.feasible===false?' <span class="muted">(infeasible)</span>':'')+'</td>'
         + '<td>'+tierBadge(c.fidelityTier)+'</td>'
         + '<td class="num">'+pct(c.conservedRate)+'</td>'
         + '<td class="num">'+lat+'</td>'
         + '<td>'+nw+'</td>'
         + '<td class="muted" style="font-size:12px">'+esc(c.confidence||'')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  // droid pane
  h += '<div class="pane"><h2>Cockpit conversation</h2><div class="convo">'
     + d.conversation.map(t => '<div class="turn '+esc(t.role)+'"><div class="who">'+({engine:'Engine',droid:'Droid',pilot:'Pilot'}[t.role]||t.role)+'</div>'+esc(t.text)+'</div>').join('')
     + '</div></div>';
  h += '</div>';
  main.innerHTML = h;
}

async function decide(key, decision){
  document.querySelectorAll('.actions .btn').forEach(b=>b.disabled=true);
  const noteEl = document.getElementById('pilotNote');
  const note = noteEl ? noteEl.value.trim() : '';
  try { await api('/api/cockpit/experiments/'+key+'/decision', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision, note})}); }
  catch(e){ alert('Decision failed: '+e.message); }
  setTimeout(()=>renderExp(key), 600);
}

// ---- Prompts (authoring) ----
let PROMPTS = [];
let CHAT_PROMPTS = [];
let PERSONAS = [];
async function renderPrompts(){
  STATE.view='prompts'; setActive(); main.innerHTML='Loading…';
  let xs;
  try { xs = await api('/api/prompts'); } catch(e){ return fail(e); }
  PROMPTS = Array.isArray(xs)?xs:(xs.prompts||[]);
  try { const cps = await api('/api/chat-prompts'); CHAT_PROMPTS = Array.isArray(cps)?cps:[]; }
  catch(e){ CHAT_PROMPTS = []; }
  try { const ps = await api('/api/personas'); PERSONAS = Array.isArray(ps)?ps:[]; }
  catch(e){ PERSONAS = []; }
  main.innerHTML =
    '<h1>Prompts</h1>'
    + '<p class="lede">Three libraries the droid draws on. <b>Personas</b> are the standing system prompts that set the droid\u2019s lens for a cockpit chat (pick one per chat). <b>Investigation chat prompts</b> are the message templates you load into the compose box to interrogate a dataset. <b>Hypothesis system prompts</b> are the skills that drive experiment generation.</p>'
    + '<h2>Personas</h2><div id="personasWrap"></div>'
    + '<h2 style="margin-top:28px">Investigation chat prompts</h2><div id="chatPromptsWrap"></div>'
    + '<h2 style="margin-top:28px">Hypothesis system prompts</h2><div id="sysPromptsWrap"></div>';
  drawPersonas(PERSONAS.length ? PERSONAS[0].id : null);
  drawChatPrompts(CHAT_PROMPTS.length ? CHAT_PROMPTS[0].id : null);
  drawPrompts(PROMPTS.length ? PROMPTS[0].id : null);
}

// --- persona library (selectable chat system prompts) inside the Prompts view ---
function drawPersonas(selId){

// ── chat text size (user-adjustable, persisted) ──────────────────────────────
function applyChatFont(){
  const px = Math.min(24, Math.max(11, parseInt(localStorage.getItem('processos.chatFont')||'15', 10)||15));
  const log = $('#chatLog'); if(log) log.style.setProperty('--chat-font', px+'px');
  return px;
}
function bumpChatFont(dir){
  const px = Math.min(24, Math.max(11, applyChatFont() + dir*1));
  localStorage.setItem('processos.chatFont', String(px));
  applyChatFont();
}

// ── Chat / Debug tab switcher (Debug shows exactly what was sent to the model) ─

async function loadDebug(ws, proc){
  const host = $('#chatDebug'); if(!host) return;
  const sid = STATE.sessionId;
  if(!sid){ host.innerHTML = '<div class="empty">Start a conversation to capture a request.</div>'; return; }
  // Show in-flight payloads for this session immediately (the endpoint only fills in once the
  // turn finishes), so switching to Debug while the droid is thinking isn't a blank panel.
  const live = (STATE.liveDebugSid === sid && Array.isArray(STATE.liveDebug)) ? STATE.liveDebug : [];
  if(live.length) host.innerHTML = renderDebug({ requests: live });
  try {
    const data = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(sid)+'/debug');
    if(STATE.sessionId !== sid) return; // session switched while fetching
    const reqs = (data && data.requests) || [];
    // Prefer the persisted payloads, but don't clobber a live view with an empty endpoint.
    if(reqs.length || !live.length) host.innerHTML = renderDebug(data);
  } catch(e){ if(!live.length) host.innerHTML = '<div class="empty">'+esc(e.message||e)+'</div>'; }
}

// Render the captured request payloads (one <details> per round) showing the full message
// array the model received: system prompt, prior transcript, tool specs and the latest message.
function renderDebug(data){
  const reqs = (data && data.requests) || [];
  if(!reqs.length) return '<div class="empty">No request captured for this chat yet. Send a message and it will appear here.</div>';
  const roleClass = r => ({system:'system', user:'user', assistant:'assistant', tool:'tool'}[r] || 'assistant');
  return reqs.map((entry, idx) => {
    const b = entry.body || {};
    const msgs = b.messages || [];
    const tools = b.tools || [];
    const head = 'Round '+(entry.round!=null?entry.round:(idx+1))+
      ' <span class="dim">'+esc(b.model||'')+(b.temperature!=null?(' · temp '+esc(b.temperature)):'')+(b.max_tokens!=null?(' · max_tokens '+esc(b.max_tokens)):'')+' · '+msgs.length+' messages</span>';
    const copyJson = esc(JSON.stringify(b, null, 2));
    const msgHtml = msgs.map(m => {
      const rc = roleClass(m.role);
      let body = '';
      if(m.content) body += '<pre>'+esc(typeof m.content==='string'?m.content:JSON.stringify(m.content,null,2))+'</pre>';
      if(m.tool_calls && m.tool_calls.length){
        body += '<div class="meta">tool_calls: '+esc(m.tool_calls.map(c => (c.function&&c.function.name)+'('+((c.function&&c.function.arguments)||'')+')').join(', '))+'</div>';
      }
      if(m.tool_call_id) body += '<div class="meta">tool_call_id: '+esc(m.tool_call_id)+'</div>';
      if(!body) body = '<pre>(empty)</pre>';
      return '<div class="dbg-msg"><span class="role '+rc+'">'+esc(m.role||'?')+'</span>'+body+'</div>';
    }).join('');
    const toolHtml = tools.length ? '<details class="dbg-tools"><summary>'+tools.length+' tool'+(tools.length===1?'':'s')+' offered</summary><div class="meta">'+
      esc(tools.map(t => (t.function&&t.function.name)+' — '+((t.function&&t.function.description)||'').split('\n')[0]).join('\n'))+'</div></details>' : '';
    return '<details class="dbg-round"'+(idx===reqs.length-1?' open':'')+'>'+
      '<summary>'+head+'</summary>'+
      '<div class="dbg-actions"><button class="copybtn" title="Copy the full JSON payload" data-copy="'+copyJson+'">Copy JSON payload</button></div>'+
      msgHtml + toolHtml +
      '</details>';
  }).join('');
}

    if(cb){ cb.disabled = false; cb.checked = (localStorage.getItem('processos.allowPython')==='1'); }

// Pull <think>/<thinking> reasoning out of the answer text so it can be shown collapsed,
// returning { think, answer } where answer is the cleaned prose.
function splitThinking(text){
  let t = text || '';
  let think = '';
  // Greedy across the whole string; tolerate an unterminated trailing <think> (streaming).
  t = t.replace(/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/gi, (_, body) => { think += (think?'\n\n':'')+body.trim(); return ''; });
  const open = t.match(/<think(?:ing)?>([\s\S]*)$/i);
  if(open){ think += (think?'\n\n':'')+open[1].trim(); t = t.slice(0, open.index); }
  return { think: think.trim(), answer: t.trim() };
}

function droidName(){ return STATE.profileName || 'Droid'; }
// The droid's bubble title: the active profile name, with the model id in a smaller, dimmer
// parenthetical — e.g. "Remote Qwen 3.6 (UNSLOTH/QWEN3.6-35B-A3B-GGUF:UD-Q6_K)".
function droidWhoHtml(){
  const name = STATE.profileName || 'Droid';
  const model = STATE.modelName || '';
  return esc(name) + (model ? ' <span class="who-model">('+esc(model)+')</span>' : '');
}

function chatBub(t){
  const time = t.ts ? '<span class="ts" title="'+esc(new Date(t.ts).toLocaleString())+'">'+esc(fmtTime(t.ts))+'</span>' : '';
  if(t.role==='user') return '<div class="bub user"><div class="who">You'+time+'</div>'+esc(t.text)+'</div>';
  let answer = t.text || '';
  // Prefer the backend's interleaved reasoning/tool timeline; fall back to splitting <think>
  // out of the answer + appending flat steps for any legacy turn without a `thought` array.
  let items = t.thought || [];
  if(!items.length){
    const sp = splitThinking(answer); answer = sp.answer;
    items = [];
    if(sp.think) items.push({ kind:'reasoning', text: sp.think });
    (t.steps||[]).forEach(s => items.push({ kind:'tool', tool:s.tool, arguments:s.arguments, result:s.result }));
  }
  let ti = 0; let toolCount = 0;
  const inner = items.map(it => {
    if(it.kind === 'tool'){
      ti++; toolCount++;
      return '<details class="toolcall"><summary>'+esc(it.tool)+' · '+ti+'</summary>'+
        '<div class="args">'+esc(JSON.stringify(it.arguments))+'</div>'+
        '<pre>'+esc(it.result)+'</pre></details>';
    }
    return '<div class="think-body md">'+mdToHtml(it.text)+'</div>';
  }).join('');
  const summary = 'Thinking' + (toolCount ? ' · '+toolCount+' tool call'+(toolCount===1?'':'s') : '');
  const thinkHtml = inner ? '<details class="think"><summary>'+esc(summary)+'</summary><div class="think-tl">'+inner+'</div></details>' : '';
  const copyBtn = answer ? '<button class="copybtn" title="Copy response" data-copy="'+esc(answer)+'">\u29C9</button>' : '';
  return '<div class="bub droid"><div class="who">'+droidWhoHtml()+copyBtn+time+'</div>'+thinkHtml+
    '<div class="answer md">'+(answer ? mdToHtml(answer) : (inner ? '' : '(no answer)'))+'</div></div>';
}

// Copy-to-clipboard for droid bubbles (delegated once; survives chat re-renders).
if(!window.__copyWired){
  window.__copyWired = true;
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest && e.target.closest('.copybtn');
    if(!btn) return;
    const txt = btn.getAttribute('data-copy') || '';
    let ok = false;
    try { if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); ok = true; } } catch(_){}
    if(!ok){ try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); } catch(_){} }
    const prev = btn.textContent;
    btn.textContent = ok ? '\u2713' : '\u2717'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('done'); }, 1200);
  });
}

// ── chat sessions (tabs) ─────────────────────────────────────────────────────
async function loadSessions(ws, proc, preferId){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions');
    STATE.sessions = r.sessions || [];
  } catch(e){ STATE.sessions = []; }
  // Choose the active session: explicit preference, else the current one if still present,
  // else the most recent (the list is newest-first).
  const want = preferId || STATE.sessionId;
  let active = STATE.sessions.find(s => s.id===want) || STATE.sessions[0];
  STATE.sessionId = active ? active.id : null;
  drawSessions(ws, proc);
  await loadChat(ws, proc);
}

function drawSessions(ws, proc){
  const list = $('#chatTabs'); if(!list) return;

  if(!ss.length){ list.innerHTML = '<div class="cs-empty">No chats yet.</div>'; return; }

  const meta = (STATE.sessions||[]).find(s => s.id===STATE.sessionId);

// Build the live "pending" droid bubble whose regions fill in as SSE events stream.
function livePendingHtml(){
  return '<div class="bub droid pending" id="chatPending">'+
    '<div class="who">'+droidWhoHtml()+'</div>'+
    '<details class="think live" open id="liveThinkWrap" style="display:none"><summary>Thinking…</summary>'+
      '<div class="think-tl" id="liveTimeline"></div>'+
    '</details>'+
    '<div class="answer md" id="liveAnswer"></div>'+
    '<div class="muted live-status" id="liveStatus">reasoning over the dataset…</div>'+
    '</div>';

async function sendChat(ws, proc){
  const box = $('#chatBox'); const msg = box.value.trim();
  if(!msg) return;
  const send = $('#chatSend'); const log = $('#chatLog'); const hint = $('#chatHint');
  const wrap = $('#chatWrapup');
  const allowPython = $('#chatPy').checked && !$('#chatPy').disabled;
  send.disabled = true; box.disabled = true;
  if(wrap){ wrap.style.display = ''; wrap.disabled = false; }
  if(log.querySelector('.empty')) log.innerHTML = '';
  log.insertAdjacentHTML('beforeend', chatBub({role:'user', text:msg}));
  log.insertAdjacentHTML('beforeend', livePendingHtml());
  log.scrollTop = log.scrollHeight;
  box.value = '';

  const pend = $('#chatPending');
  const liveThinkWrap = $('#liveThinkWrap'), liveTimeline = $('#liveTimeline');
  const liveAnswer = $('#liveAnswer'), liveStatus = $('#liveStatus');
  let answerBuf = '';
  // Request payloads captured this turn. Stored on STATE (scoped to the session) so switching
  // to the Debug tab mid-flight can show them — the persisted endpoint only fills in once the
  // turn completes.
  const liveDebug = [];
  STATE.liveDebug = liveDebug; STATE.liveDebugSid = STATE.sessionId;
  let curReason = null, curReasonBuf = ''; // the reasoning block currently streaming
  const pendingSteps = []; // FIFO of {tool, el} awaiting their result
  const nearBottom = () => (log.scrollHeight - log.scrollTop - log.clientHeight) < 80;
  const autoscroll = () => { if(nearBottom()) log.scrollTop = log.scrollHeight; };

  function handleEvent(ev){
    if(ev.type==='round'){ if(liveStatus) liveStatus.textContent = 'round '+ev.n+' — investigating…'; }
    else if(ev.type==='request'){
      liveDebug.push({ round: ev.round, body: ev.body });
      if(STATE.chatTab==='debug'){ const host=$('#chatDebug'); if(host) host.innerHTML = renderDebug({ requests: liveDebug }); }
    }
    else if(ev.type==='reasoning'){
      if(liveThinkWrap) liveThinkWrap.style.display='';
      // Append to the open reasoning block, or start a new one (e.g. after a tool call).
      if(!curReason && liveTimeline){ curReason = document.createElement('div'); curReason.className = 'think-body md'; curReasonBuf = ''; liveTimeline.appendChild(curReason); }
      curReasonBuf += ev.text; if(curReason) curReason.innerHTML = mdToHtml(curReasonBuf); autoscroll();
    }
    else if(ev.type==='answer'){
      answerBuf += ev.text; if(liveAnswer) liveAnswer.innerHTML = mdToHtml(answerBuf); autoscroll();
    }
    else if(ev.type==='tool'){
      if(liveThinkWrap) liveThinkWrap.style.display='';
      curReason = null; // close the current reasoning block so later thinking lands after this tool
      const el = document.createElement('details');
      el.className = 'toolcall'; el.open = true;
      el.innerHTML = '<summary>▶ '+esc(ev.tool)+' …</summary>'+
        '<div class="args">'+esc(JSON.stringify(ev.arguments))+'</div>'+
        '<pre class="result">running…</pre>';
      if(liveTimeline) liveTimeline.appendChild(el); pendingSteps.push({ tool: ev.tool, el });
      if(liveStatus) liveStatus.textContent = 'running '+ev.tool+'…';
      autoscroll();
    }
    else if(ev.type==='toolResult'){
      const i = pendingSteps.findIndex(s => s.tool===ev.tool);
      const s = i>=0 ? pendingSteps.splice(i,1)[0] : null;
      if(s){ s.el.querySelector('summary').textContent = ev.tool+' ✓'; s.el.querySelector('.result').textContent = ev.result; s.el.open = false; }
      autoscroll();
    }
    else if(ev.type==='done'){
      drawChat(ev.turns);
      const ds = ev.dataset || {};
      hint.textContent = (ev.rounds!=null?('round '+ev.rounds+' · '):'') +
        (ds.instances!=null?(ds.instances+' instances · '+ds.jobs+' jobs · '+ds.incidents+' incidents'):'');
      // Refresh the tab list so the active chat's last-message time + count update.
      loadSessionsQuiet(ws, proc, STATE.sessionId);
      if(STATE.chatTab==='debug') loadDebug(ws, proc);
    }
    else if(ev.type==='error'){
      if(pend) pend.remove();
      log.insertAdjacentHTML('beforeend', '<div class="bub droid"><div class="who">'+droidWhoHtml()+'</div><span style="color:#fca5a5">'+esc(ev.message)+'</span></div>');
    }
  }

  try {
    const qs = STATE.sessionId ? ('?session='+encodeURIComponent(STATE.sessionId)) : '';
    const resp = await fetch('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/stream'+qs, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg, allowPython, personaId: ($('#chatPersona')||{}).value || undefined })
    });
    if(!resp.ok || !resp.body){
      let m = 'stream failed ('+resp.status+')';
      try { const j = await resp.json(); m = j.error || m; } catch(e){}
      throw new Error(m);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', finished = false;
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        const frame = buf.slice(0, idx); buf = buf.slice(idx+2);
        const dataLine = frame.split('\n').find(l => l.startsWith('data:'));
        if(!dataLine) continue;
        const payload = dataLine.slice(5).trim();
        if(!payload) continue;
        let ev; try { ev = JSON.parse(payload); } catch(e){ continue; }
        handleEvent(ev);
        if(ev.type==='done' || ev.type==='error') finished = true;
      }
    }
    if(!finished){
      // Stream closed without a terminal event — fall back to the persisted transcript.
      try { const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):'')); drawChat(r.turns); }
      catch(e){ if(pend) pend.remove(); }
    }
  } catch(e){
    if(pend) pend.remove();
    log.insertAdjacentHTML('beforeend', '<div class="bub droid"><div class="who">'+droidWhoHtml()+'</div><span style="color:#fca5a5">'+esc(e.message||e)+'</span></div>');
    box.value = msg; // restore so the operator can retry
  } finally {
    send.disabled = false; box.disabled = false; box.focus();
    if(wrap) wrap.style.display = 'none';
  }
}

// Refresh the tab list (metadata only) without reloading the chat log — used after a turn
// completes so the active chat's timestamp and message count update in place.
async function loadSessionsQuiet(ws, proc, keepId){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions');
    STATE.sessions = r.sessions || [];
    if(keepId) STATE.sessionId = keepId;
    drawSessions(ws, proc);
    applyPersonaState();
  } catch(e){ /* tab refresh is best-effort */ }
}

// Ask an in-flight investigation to stop and report its findings so far. The live bubble keeps
// streaming — the wrap-up answer arrives as further `answer` events.
async function wrapUpChat(ws, proc){
  const wrap = $('#chatWrapup'); if(wrap) wrap.disabled = true;
  const st = $('#liveStatus'); if(st) st.textContent = 'wrapping up — reporting findings so far…';
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/wrapup'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), { method:'POST' });
    $('#chatHint').textContent = 'asked the droid to wrap up…';
  } catch(e){ $('#chatHint').textContent = 'wrap-up request failed: '+(e.message||e); }
}

async function saveChatPrompt(){
  const text = $('#chatBox').value.trim();
  if(!text){ $('#chatHint').textContent = 'nothing in the compose box to save'; return; }
  const name = window.prompt('Name this prompt:');
  if(name==null) return;
  const id = (name.trim()||'prompt').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || ('prompt-'+Date.now());
  try {
    await api('/api/chat-prompts', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ id, name: name.trim()||id, text })
    });
    await loadChatPrompts();
    $('#chatHint').textContent = 'saved prompt “'+(name.trim()||id)+'”';
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function resetChat(ws, proc){
  if(!window.confirm('Forget this conversation?')) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/reset'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), { method:'POST' });
    drawChat([]); $('#chatHint').textContent = '';
    loadSessionsQuiet(ws, proc, STATE.sessionId);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function renderWsModel(url){
  const el = document.getElementById('wsModel');
  if(!el || typeof BpmnJS === 'undefined'){ if(el) el.innerHTML='<p class="muted" style="padding:12px">viewer unavailable</p>'; return; }
  try {
    const xml = await (await fetch(url)).text();
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(xml);
    viewer.get('canvas').zoom('fit-viewport', 'auto');
  } catch(e){ el.innerHTML = '<p class="err" style="padding:12px">could not render model: '+esc(e.message||e)+'</p>'; }
}

document.querySelectorAll('.nav a[data-view]').forEach(a => a.onclick = () => {
  const v = a.dataset.view;
  if(v==='console') renderConsole();
  else if(v==='processes') renderProcesses();
  else if(v==='prompts') renderPrompts();
  else if(v==='experiments') renderExperiments();
});

// Boot: a workspace-process deep-link (?workspace=&process=) opens the
// investigation surface; otherwise the default console.
(function(){
  const q = new URLSearchParams(location.search);
  const ws = q.get('workspace'), proc = q.get('process');
  if(ws && proc) renderWorkspace(ws, proc);
  else renderConsole();
})();
</script>
<script src="/assets/settings.js"></script>
</body>
</html>
