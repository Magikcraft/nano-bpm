// ── busy state + steering ────────────────────────────────────────────────────
// While the droid is working we DON'T lock the compose box. The Send button stays
// live and becomes "Steer <profile>" so the operator can redirect the in-flight
// investigation (a queued user turn injected at the next round boundary); it
// reverts to "Investigate with <profile> →" when the turn finishes.
function setChatBusy(busy){
  STATE.chatBusy = busy;
  const btn = $('#chatSend');
  if(btn){
    if(busy){ btn.textContent = 'Steer ' + (STATE.profileName || 'the droid'); }
    else { labelSendButton(); }
  }
  // Start/stop the spinner next to the active session in the left-hand list.
  if(STATE.ws && STATE.wsProc) drawSessions(STATE.ws, STATE.wsProc);
}

// While a needed local sidecar is starting/downloading/loading we DISABLE the Send button (the
// existing .btn:disabled rule dims it) so the operator can't fire a message at a model that can't
// answer yet, and label it so the wait is obvious. Reverts via labelSendButton() when off.
function setChatWarming(on){
  STATE.chatWarming = on;
  const send = $('#chatSend'); const caret = $('#chatSendMenu');
  if(send){ send.disabled = on; if(on) send.textContent = 'Starting model…'; else if(!STATE.chatBusy) labelSendButton(); }
  if(caret){ caret.disabled = on; }
}

// ── Investigate warm-up bubble ───────────────────────────────────────────────
// A live droid bubble shown while a needed sidecar warms up, so the operator gets real feedback
// (Starting → downloading model… X GB → loading into memory…) instead of an apparently dead button.
function warmupBubbleHtml(){
  return '<div class="bub droid pending" id="chatWarmup">'
    + '<div class="who">'+droidWhoHtml()+'</div>'
    + '<div class="answer" id="warmStatus">Starting the local model…</div>'
    + '<div class="muted" style="margin-top:6px;font-size:12px">The model has to download and load before it can answer — this can take a few minutes for large models. <a href="#" id="warmLogs">view logs</a></div>'
    + '</div>';
}
function ensureWarmupBubble(msg){
  const log = $('#chatLog'); if(!log) return;
  if($('#chatWarmup')) return;
  if(log.querySelector('.empty')) log.innerHTML = '';
  if(typeof msg === 'string' && msg) log.insertAdjacentHTML('beforeend', chatBub({role:'user', text:msg}));
  log.insertAdjacentHTML('beforeend', warmupBubbleHtml());
  const ll = $('#warmLogs'); if(ll) ll.onclick = (e) => { e.preventDefault(); openLogStream(STATE.warmupLogsTarget || null); };
  log.scrollTop = log.scrollHeight;
}
function updateWarmupBubble(text){
  const el = $('#warmStatus'); if(el) el.textContent = text;
  const log = $('#chatLog'); if(log && (log.scrollHeight - log.scrollTop - log.clientHeight) < 120) log.scrollTop = log.scrollHeight;
}
function removeWarmupBubble(){ const b = $('#chatWarmup'); if(b) b.remove(); }
function failWarmupBubble(text){
  const b = $('#chatWarmup'); if(!b) return;
  b.classList.remove('pending');
  if(text){ const el = $('#warmStatus'); if(el) el.textContent = text; }
}

// The Send button and Cmd/Ctrl+Enter route to steering while a turn is in flight,
// and to a fresh investigation otherwise.
function submitCompose(ws, proc){
  if(STATE.chatWarming) return;   // a sidecar is still starting up — Send is disabled
  if(STATE.chatBusy) steerChat(ws, proc);
  else sendChat(ws, proc);
}

// Queue a steering instruction for the running turn. Optimistically shows it as a
// user bubble (the persisted transcript redraws on `done`), clears the box, and
// does NOT open a new stream — the live stream picks the instruction up.
async function steerChat(ws, proc){
  const box = $('#chatBox'); const msg = box.value.trim();
  if(!msg) return;
  const log = $('#chatLog'); const hint = $('#chatHint');
  pushPromptHistory(msg);
  const pend = $('#chatPending');
  if(pend) pend.insertAdjacentHTML('beforebegin', chatBub({ role:'user', text:msg, ts: Date.now() }));
  else if(log) log.insertAdjacentHTML('beforeend', chatBub({ role:'user', text:msg, ts: Date.now() }));
  if(log) log.scrollTop = log.scrollHeight;
  box.value = '';
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/steer'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg })
    });
    if(hint) hint.textContent = 'steering the droid…';
  } catch(e){
    box.value = msg; // restore so the operator can retry
    if(hint) hint.textContent = 'steer failed: '+(e.message||e);
  }
}

// ── compose prompt history (shell-style up/down recall) ──────────────────────
function pushPromptHistory(msg){
  STATE.promptHistory = STATE.promptHistory || [];
  if(STATE.promptHistory[STATE.promptHistory.length-1] !== msg) STATE.promptHistory.push(msg);
  STATE.promptHistIdx = null; STATE.promptDraft = '';
}
function placeCursorEnd(box){ const n = box.value.length; box.selectionStart = box.selectionEnd = n; }
// Up on the first line steps back through earlier prompts (saving the current draft);
// Down on the last line steps forward, restoring the draft past the newest entry.
function historyPrev(box){
  const h = STATE.promptHistory || [];
  if(!h.length) return false;
  if(STATE.promptHistIdx === null){ STATE.promptDraft = box.value; STATE.promptHistIdx = h.length; }
  if(STATE.promptHistIdx > 0){ STATE.promptHistIdx--; box.value = h[STATE.promptHistIdx]; placeCursorEnd(box); }
  return true;
}
function historyNext(box){
  const h = STATE.promptHistory || [];
  if(STATE.promptHistIdx === null) return false;
  if(STATE.promptHistIdx < h.length - 1){ STATE.promptHistIdx++; box.value = h[STATE.promptHistIdx]; }
  else { STATE.promptHistIdx = null; box.value = STATE.promptDraft || ''; }
  placeCursorEnd(box);
  return true;
}

// ── profile picker on the split Send button ──────────────────────────────────
// The caret beside "Investigate with …" drops a menu of every configured LLM profile so the
// operator can switch the model that answers the next message without opening Settings.
async function toggleProfileMenu(){
  const menu = $('#chatProfileMenu'); const caret = $('#chatSendMenu');
  if(!menu) return;
  if(!menu.hidden){ closeProfileMenu(); return; }
  let s;
  try { s = await api('/api/settings'); }
  catch(e){ $('#chatHint').textContent = 'could not load profiles: '+(e.message||e); return; }
  // A sidecar profile is only a usable option once its model is actually on disk. Pull the
  // download/run state so configured-but-not-downloaded sidecars are hidden from the menu, and
  // so each listed sidecar can show a status light (green = running/ready, blue = starting).
  let avail = null;
  let phaseById = {};
  try {
    const st = await api('/api/llama/status') || {};
    avail = new Set();
    (st.models||[]).forEach(m => { if(m && m.profileId && m.downloaded) avail.add(m.profileId); });
    (st.sidecars||[]).forEach(x => {
      if(!x || !x.profileId) return;
      if(x.phase==='ready') avail.add(x.profileId);
      phaseById[x.profileId] = x.phase || '';
    });
  } catch(e){ avail = null; }   // status unavailable → don't hide anything
  // Keep remote profiles (no local download) and any sidecar whose model is downloaded/ready.
  const profiles = (s.profiles||[]).filter(p => !p.sidecar || !avail || avail.has(p.id));
  // The model already acting as the partner (pair/monitor) can't also be the primary you send to.
  const partners = partnerProfileIds();
  // Map a sidecar's phase to one of the shared status-dot classes; running sidecars get the
  // green "on" light the operator asked for. Non-running sidecars (downloaded but stopped) and
  // remote profiles get no light.
  const dotFor = (p) => {
    if(!p.sidecar) return '';
    const ph = phaseById[p.id];
    if(ph==='ready') return '<span class="dot-status on mi-dot" title="sidecar running"></span>';
    if(ph==='starting' || ph==='loading' || ph==='downloading')
      return '<span class="dot-status loading mi-dot" title="sidecar '+esc(ph)+'…"></span>';
    return '<span class="dot-status off mi-dot" title="sidecar stopped"></span>';
  };
  menu.innerHTML = profiles.length ? profiles.map(p => {
    const active = p.id===s.activeProfile;
    const isPartner = partners.has(p.id) && !active;
    return '<button data-id="'+esc(p.id)+'"'+(active?' class="on"':'')+(isPartner?' disabled title="In use as this investigation\'s partner"':'')+'>'+
      dotFor(p)+
      '<span class="mi-name">'+esc(p.name||p.id)+'</span>'+
      (p.model?' <span class="mi-model">'+esc(p.model)+'</span>':'')+
      (active?' <span class="mi-on">✓</span>':'')+
      (isPartner?' <span class="mi-model">partner</span>':'')+'</button>';
  }).join('') : '<div class="mi-empty">No available models — download a sidecar model or add a remote profile</div>';
  menu.querySelectorAll('button[data-id]:not([disabled])').forEach(b => {
    b.onclick = () => selectProfile(b.getAttribute('data-id'), b.getAttribute('data-id')===s.activeProfile);
  });
  menu.hidden = false; caret.setAttribute('aria-expanded','true');
  setTimeout(() => document.addEventListener('click', closeProfileMenu, { once:true }), 0);
}
function closeProfileMenu(){
  const menu = $('#chatProfileMenu'); const caret = $('#chatSendMenu');
  if(menu) menu.hidden = true;
  if(caret) caret.setAttribute('aria-expanded','false');
}
// Make the chosen profile active so the next send (and the button label) use its model.
async function selectProfile(id, alreadyActive){
  closeProfileMenu();
  if(alreadyActive) return;
  try {
    await api('/api/settings', { method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({ activeProfile: id }) });
    await labelSendButton();
    $('#chatHint').textContent = 'next message goes to '+(STATE.profileName||'the selected profile');
    try { window.dispatchEvent(new CustomEvent('processos:settings-changed')); } catch(e){}
  } catch(e){ $('#chatHint').textContent = 'could not switch profile: '+(e.message||e); }
}

// Persist an edited objective on the process config (round-trips the full config).
async function saveObjective(ws, proc, p){
  const v = $('#wsObjective').value.trim();
  const btn = $('#wsObjSave'); btn.disabled = true;
  try {
    const cfg = {
      displayName: p.displayName||proc,
      objective: v || null
    };
    if(p.binding==='dataset' && p.datasetPath) cfg.dataset = p.datasetPath;
    if(p.binding && p.binding!=='dataset' && p.binding!=='unbound') cfg.targetUrl = p.targetUrl;
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc), {
      method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify(cfg)
    });
    p.objective = v;
    $('#chatHint').textContent = 'objective saved — it now frames new conversations';
  } catch(e){ $('#chatHint').textContent = 'objective save failed: '+(e.message||e); }
  finally { btn.disabled = false; }
}

// Pull <think>/<thinking> reasoning out of the answer text so it can be shown collapsed,
// returning { think, answer } where answer is the cleaned prose.
function splitThinking(text){
  let t = text || '';
  let think = '';
  // Greedy across the whole string; tolerate an unterminated trailing <think> (streaming).
  t = t.replace(/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/gi, (_, body) => { think += (think?'\n\n':'')+body.trim(); return ''; });
  const open = t.match(/<think(?:ing)?>([\s\S]*)$/i);
  if(open){ think += (think?'\n\n':'')+open[1].trim(); t = t.slice(0, open.index); }
  return { think: think.trim(), answer: t.trim() };
}

function droidName(){ return STATE.profileName || 'Droid'; }
// Render an error as a droid bubble. Context-window exhaustion (the most common hard failure
// for local models on long investigations) is detected and explained, so the operator knows to
// start a fresh chat or trim context rather than staring at a raw provider error.
function chatErrorHtml(msg){
  const raw = (msg==null ? '' : String(msg));
  const low = raw.toLowerCase();
  const ctx = low.includes('context') && (low.includes('length') || low.includes('exceed') || low.includes('window') || low.includes('too long') || low.includes('maximum'));
  let body = '<span style="color:#fca5a5">'+esc(raw)+'</span>';
  if(ctx){
    body = '<span style="color:#fca5a5">⚠ The model ran out of context (its input window filled up).</span>'+
      '<div style="color:#a1a1aa;font-size:12px;margin-top:4px">This investigation got too long for the model. Start a new chat, or switch to a model with a larger context window, then continue.</div>'+
      '<details style="margin-top:4px"><summary style="cursor:pointer;color:#71717a;font-size:11px">details</summary><span style="color:#a1a1aa;font-size:11px">'+esc(raw)+'</span></details>';
  }
  return '<div class="bub droid"><div class="who">'+droidWhoHtml()+'</div>'+body+'</div>';
}

// The droid's bubble title. For a HISTORICAL turn we use the model that actually answered it
// (persisted server-side as t.model), so the byline doesn't re-label when the operator switches
// models later. For live/in-flight bubbles (no turnModel) we fall back to the active profile.
function droidWhoHtml(turnModel){
  if(turnModel){
    return esc('Droid') + ' <span class="who-model">('+esc(turnModel)+')</span>';
  }
  const name = STATE.profileName || 'Droid';
  const model = STATE.modelName || '';
  return esc(name) + (model ? ' <span class="who-model">('+esc(model)+')</span>' : '');
}

function chatBub(t){
  const time = t.ts ? '<span class="ts" title="'+esc(new Date(t.ts).toLocaleString())+'">'+esc(fmtTime(t.ts))+'</span>' : '';
  if(t.role==='user') return '<div class="bub user"><div class="who">You'+time+'</div>'+esc(t.text)+'</div>';
  let answer = t.text || '';
  // Prefer the backend's interleaved reasoning/tool timeline; fall back to splitting <think>
  // out of the answer + appending flat steps for any legacy turn without a `thought` array.
  let items = t.thought || [];
  if(!items.length){
    const sp = splitThinking(answer); answer = sp.answer;
    items = [];
    if(sp.think) items.push({ kind:'reasoning', text: sp.think });
    (t.steps||[]).forEach(s => items.push({ kind:'tool', tool:s.tool, arguments:s.arguments, result:s.result }));
  }
  let ti = 0; let toolCount = 0;
  const inner = items.map(it => {
    if(it.kind === 'tool'){
      ti++; toolCount++;
      return '<details class="toolcall"><summary>'+esc(it.tool)+' · '+ti+'</summary>'+
        '<div class="args">'+esc(JSON.stringify(it.arguments))+'</div>'+
        '<pre>'+esc(it.result)+'</pre></details>';
    }
    return '<div class="think-body md">'+mdToHtml(it.text)+'</div>';
  }).join('');
  const summary = 'Thinking' + (toolCount ? ' · '+toolCount+' tool call'+(toolCount===1?'':'s') : '');
  const thinkHtml = inner ? '<details class="think"><summary>'+esc(summary)+'</summary><div class="think-tl">'+inner+'</div></details>' : '';
  const copyBtn = answer ? '<button class="copybtn" title="Copy response" data-copy="'+esc(answer)+'">\u29C9</button>' : '';
  // Carry-forward: drop a quoted version of this answer into the composer, so the operator can hand
  // one model's conclusion to the next model (cross-provider refinement) on the following turn.
  const carryBtn = answer ? '<button class="carrybtn" title="Quote into composer for the next model" data-carry="'+esc(answer)+'">\u21AA</button>' : '';
  const modelsHtml = suggestedModelsHtml(items);
  if(t.role === 'pair'){
    const who = '<span class="pair-badge" title="Pair AI reviewer">\uD83E\uDD1D Pair AI'+(t.name?(' \u00B7 '+esc(t.name)):'')+'</span>';
    return '<div class="bub droid pair"><div class="who">'+who+copyBtn+carryBtn+time+'</div>'+thinkHtml+
      '<div class="answer md">'+(answer ? mdToHtml(answer) : (inner ? '' : '(no answer)'))+'</div>'+modelsHtml+'</div>';
  }
  return '<div class="bub droid"><div class="who">'+droidWhoHtml(t.model)+copyBtn+carryBtn+time+'</div>'+thinkHtml+
    '<div class="answer md">'+(answer ? mdToHtml(answer) : (inner ? '' : '(no answer)'))+'</div>'+modelsHtml+'</div>';
}

// ── Suggested-model cards ───────────────────────────────────────────────────
// The Experiment Designer proposes BPMN variants two ways: by passing them as the `model`
// argument of simulate / compare_variants, OR by AUTHORING them with edit_model (whose RESULT
// carries the new `model` XML). Surface every distinct candidate from either source as a tabbed
// (diagram / XML) card the operator can expand and download — otherwise an authored variant that
// was never simulated would leave no downloadable artefact.
function extractSuggestedModels(items){
  const out = [], seen = new Set();
  const add = (name, xml) => {
    if(typeof xml !== 'string') return;
    const x = xml.trim();
    if(!x || x.indexOf('<') === -1 || seen.has(x)) return;
    seen.add(x);
    out.push({ name: (name && String(name).trim()) || ('variant '+(out.length+1)), xml: x });
  };
  // A tool result may be a JSON string (persisted timeline) or an already-parsed object (live).
  const asObj = (r) => {
    if(r && typeof r === 'object') return r;
    if(typeof r === 'string'){ try { return JSON.parse(r); } catch(_){ return null; } }
    return null;
  };
  (items||[]).forEach(it => {
    if(it.kind !== 'tool') return;
    let a = it.arguments;
    if(typeof a === 'string'){ try { a = JSON.parse(a); } catch(_){ a = null; } }
    // Authored variants: edit_model returns { ok, model, appliedOps, ... }.
    if(it.tool === 'edit_model'){
      const r = asObj(it.result);
      if(r && typeof r.model === 'string'){
        const ops = Array.isArray(r.appliedOps) ? r.appliedOps : [];
        const name = (a && a.name) || (ops.length ? ('edited: '+ops[0]) : 'edited variant');
        add(name, r.model);
      }
    }
    if(!a || typeof a !== 'object') return;
    if(it.tool === 'simulate') add(a.name, a.model);
    else if(it.tool === 'compare_variants' && Array.isArray(a.candidates)){
      a.candidates.forEach(c => { if(c && typeof c === 'object') add(c.name, c.model); });
    }
  });
  return out;
}

function suggestedModelsHtml(items){
  const models = extractSuggestedModels(items);
  if(!models.length) return '';
  const cards = models.map(modelCardHtml).join('');
  const lbl = models.length === 1 ? '1 suggested model' : (models.length+' suggested models');
  return '<div class="models"><div class="models-lbl">'+esc(lbl)+'</div>'+cards+'</div>';
}

function modelCardHtml(m){
  return '<div class="modelcard" data-rendered="0">'+
    '<div class="mc-head">'+
      '<span class="mc-name" title="'+esc(m.name)+'">'+esc(m.name)+'</span>'+
      '<div class="mc-tabs">'+
        '<button class="mc-tab active" data-mc-tab="diagram">Diagram</button>'+
        '<button class="mc-tab" data-mc-tab="xml">XML</button>'+
      '</div>'+
      '<div class="mc-actions">'+
        '<button class="mc-btn mc-expand" title="Expand">\u2922</button>'+
        '<button class="mc-btn mc-dl" title="Download .bpmn">\u2913</button>'+
      '</div>'+
    '</div>'+
    '<div class="mc-body">'+
      '<div class="mc-pane mc-diagram"></div>'+
      '<pre class="mc-pane mc-xml" style="display:none">'+esc(m.xml)+'</pre>'+
    '</div></div>';
}

// Does this BPMN XML already carry diagram-interchange (layout) info? LLM-authored variants are
// usually pure semantics with no <bpmndi:BPMNDiagram>, which the viewer can't render
// ("no diagram to display") — those we auto-layout first.
function bpmnHasDi(xml){ return /BPMNDiagram|BPMNPlane/.test(xml || ''); }

// LLM-authored variants are sometimes a bare <bpmn:process> fragment with no <bpmn:definitions>
// root ("failed to parse document as <bpmn:Definitions>"). Wrap such fragments in a synthesized
// definitions envelope (the inner elements keep their own xmlns decls) so bpmn-moddle has a valid
// root. Full documents (already containing <...:definitions>) pass through unchanged.
function ensureBpmnDefinitions(xml){
  const s = (xml || '').trim();
  if(!s || /<(\w+:)?definitions[\s>]/.test(s)) return xml;
  const body = s.replace(/^<\?xml[^>]*\?>\s*/i, '');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" ' +
    'xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" ' +
    'xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" ' +
    'xmlns:di="http://www.omg.org/spec/DD/20100524/DI" ' +
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ' +
    'xmlns:zeebe="http://camunda.org/schema/zeebe" ' +
    'targetNamespace="http://bpmn.io/schema/bpmn">\n' + body + '\n</bpmn:definitions>';
}

// Add a generated layout to DI-less BPMN so the viewer can render it; returns the (definitions-
// wrapped) XML on any failure (the viewer will then surface its own message).
async function ensureBpmnLayout(xml){
  const doc = ensureBpmnDefinitions(xml);
  if(bpmnHasDi(doc) || typeof BpmnAutoLayout === 'undefined' || !BpmnAutoLayout.layoutProcess) return doc;
  try { return await BpmnAutoLayout.layoutProcess(doc); }
  catch(_){ return doc; }
}

// Render BPMN xml into a container with a fresh viewer; returns the viewer or null.
async function renderBpmnInto(el, xml){
  if(!el) return null;
  if(typeof BpmnJS === 'undefined'){ el.innerHTML = '<div class="mc-err">diagram viewer unavailable</div>'; return null; }
  try {
    el.innerHTML = '';
    const ready = await ensureBpmnLayout(xml);
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(ready);
    try { viewer.get('canvas').zoom('fit-viewport', 'auto'); } catch(_){}
    return viewer;
  } catch(e){
    el.innerHTML = '<div class="mc-err">could not render: '+esc((e&&e.message)||e)+'</div>';
    return null;
  }
}

function modelXmlOf(card){ const p = card.querySelector('.mc-xml'); return p ? p.textContent : ''; }
function modelNameOf(card){ const n = card.querySelector('.mc-name'); return (n ? n.textContent : 'model') || 'model'; }
function slugify(s){ return String(s||'model').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'model'; }

function downloadModel(card){
  const xml = modelXmlOf(card);
  const blob = new Blob([xml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = slugify(modelNameOf(card))+'.bpmn';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Render a card's diagram on demand (once), when first shown.
function ensureCardDiagram(card){
  if(!card || card.dataset.rendered === '1') return;
  card.dataset.rendered = '1';
  renderBpmnInto(card.querySelector('.mc-diagram'), modelXmlOf(card));
}

function switchModelTab(card, tab){
  card.querySelectorAll('.mc-tab').forEach(b => b.classList.toggle('active', b.dataset.mcTab === tab));
  const dia = card.querySelector('.mc-diagram'), xml = card.querySelector('.mc-xml');
  if(tab === 'xml'){ dia.style.display = 'none'; xml.style.display = ''; }
  else { xml.style.display = 'none'; dia.style.display = ''; ensureCardDiagram(card); }
}

// Big popover: a large diagram with an XML toggle + download, over a dark backdrop.
function openModelModal(card){
  const xml = modelXmlOf(card), name = modelNameOf(card);
  const back = document.createElement('div');
  back.className = 'model-modal';
  back.innerHTML = '<div class="mm-box">'+
    '<div class="mm-head"><span class="mm-title">'+esc(name)+'</span>'+
      '<div class="mm-actions">'+
        '<button class="btn mm-tab-dia">Diagram</button>'+
        '<button class="btn mm-tab-xml">XML</button>'+
        '<button class="btn mm-dl">Download .bpmn</button>'+
        '<button class="btn ghost mm-close">Close</button>'+
      '</div></div>'+
    '<div class="mm-body"><div class="mm-diagram"></div>'+
      '<pre class="mm-xml" style="display:none">'+esc(xml)+'</pre></div></div>';
  const close = () => back.remove();
  back.onclick = e => { if(e.target === back) close(); };
  document.body.appendChild(back);
  const dia = back.querySelector('.mm-diagram'), pre = back.querySelector('.mm-xml');
  back.querySelector('.mm-close').onclick = close;
  back.querySelector('.mm-dl').onclick = () => downloadModel(card);
  back.querySelector('.mm-tab-dia').onclick = () => { pre.style.display='none'; dia.style.display=''; };
  back.querySelector('.mm-tab-xml').onclick = () => { dia.style.display='none'; pre.style.display=''; };
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc); } });
  renderBpmnInto(dia, xml);
}

// Lazily render diagrams as cards scroll into view (cheap + avoids rendering a
// long backlog up-front). Re-used across chat redraws.
const modelCardObserver = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if(en.isIntersecting){ ensureCardDiagram(en.target); obs.unobserve(en.target); } });
    }, { root: null, rootMargin: '120px' })
  : null;

function observeModelCards(scope){
  (scope || document).querySelectorAll('.modelcard[data-rendered="0"]').forEach(card => {
    if(modelCardObserver) modelCardObserver.observe(card);
    else ensureCardDiagram(card); // no IO support: render immediately
  });
}

// One delegated handler for every model card (survives chat re-renders).
if(!window.__modelCardsWired){
  window.__modelCardsWired = true;
  document.addEventListener('click', e => {
    const t = e.target;
    const tab = t.closest && t.closest('.mc-tab');
    if(tab){ switchModelTab(tab.closest('.modelcard'), tab.dataset.mcTab); return; }
    const exp = t.closest && t.closest('.mc-expand');
    if(exp){ openModelModal(exp.closest('.modelcard')); return; }
    const dl = t.closest && t.closest('.mc-dl');
    if(dl){ downloadModel(dl.closest('.modelcard')); return; }
  });
}

// Copy-to-clipboard for droid bubbles (delegated once; survives chat re-renders).
if(!window.__copyWired){
  window.__copyWired = true;
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest && e.target.closest('.copybtn');
    if(!btn) return;
    const txt = btn.getAttribute('data-copy') || '';
    let ok = false;
    try { if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); ok = true; } } catch(_){}
    if(!ok){ try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); } catch(_){} }
    const prev = btn.textContent;
    btn.textContent = ok ? '\u2713' : '\u2717'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('done'); }, 1200);
  });
}

// Carry-forward handler: quote a prior answer into the composer so the next model picks up where
// the last one left off (cross-provider refinement / hand-off between turns).
if(!window.__carryWired){
  window.__carryWired = true;
  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('.carrybtn');
    if(!btn) return;
    const txt = btn.getAttribute('data-carry') || '';
    const box = $('#chatBox'); if(!box) return;
    const quoted = txt.split('\n').map(l => '> ' + l).join('\n');
    const lead = 'The previous model concluded:\n\n' + quoted + '\n\n';
    box.value = box.value ? (lead + box.value) : lead;
    box.focus(); box.setSelectionRange(box.value.length, box.value.length);
    const prev = btn.textContent; btn.textContent = '\u2713'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('done'); }, 1200);
  });
}

function drawChat(turns){
  const log = $('#chatLog');
  if(!log) return;
  if(!turns || !turns.length){ log.innerHTML = '<div class="empty">No messages yet. Ask the droid a question to begin investigating this dataset.</div>'; return; }
  log.innerHTML = turns.map(chatBub).join('');
  observeModelCards(log);
  log.scrollTop = log.scrollHeight;
}

async function loadChat(ws, proc){
  const sid = STATE.sessionId;
  try {
    const url = '/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(sid?('?session='+encodeURIComponent(sid)):'');
    const r = await api(url);
    if(r.sessionId) STATE.sessionId = r.sessionId;
    drawChat(r.turns);
    applyPersonaState();
    // This is a (possibly different) session: drop any cached simulation runs and refresh the
    // Simulations tab if it's open.
    STATE.simPersisted = []; STATE.liveSims = []; STATE.liveSimsSid = STATE.sessionId;
    if(STATE.chatTab==='sims') loadSims(ws, proc);
    // If an investigation is still running for this session (e.g. the page was reloaded mid-flight),
    // reattach to its live stream so the operator sees reasoning + console output as before.
    if(r.inflight){
      reattachLiveStream(ws, proc, r.inflight);
      return;
    }
    // Fresh conversation: pre-load the open-investigation prompt so the default action is
    // an unbiased investigation the operator can send or edit.
    if((!r.turns || !r.turns.length)){
      const box = $('#chatBox');
      const open = (STATE.prompts||[]).find(x => x.id==='open') || (STATE.prompts||[])[0];
      if(box && !box.value && open) box.value = open.text;
    }
  } catch(e){ const log=$('#chatLog'); if(log) log.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'; }
}

// ── chat sessions (tabs) ─────────────────────────────────────────────────────
async function loadSessions(ws, proc, preferId){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions');
    STATE.sessions = r.sessions || [];
  } catch(e){ STATE.sessions = []; }
  // Choose the active session: explicit preference, else the current one if still present,
  // else the most recent (the list is newest-first).
  const want = preferId || STATE.sessionId;
  let active = STATE.sessions.find(s => s.id===want) || STATE.sessions[0];
  STATE.sessionId = active ? active.id : null;
  drawSessions(ws, proc);
  await loadChat(ws, proc);
}

function drawSessions(ws, proc){
  const list = $('#chatTabs'); if(!list) return;
  const ss = STATE.sessions || [];
  if(!ss.length){ list.innerHTML = '<div class="cs-empty">No chats yet.</div>'; return; }
  const open = STATE.csModelsOpen || (STATE.csModelsOpen = new Set());
  list.innerHTML = ss.map(s => {
    const on = s.id===STATE.sessionId ? ' on' : '';
    const when = s.updated ? fmtTime(s.updated) : '';
    // Spinner next to whichever session is actively investigating (the in-flight turn always
    // belongs to the selected session); cleared on done/error via the setChatBusy redraw.
    const spin = (STATE.chatBusy && s.id===STATE.sessionId) ? '<span class="cs-spin" title="Investigating…"></span>' : '';
    const models = Array.isArray(s.models) ? s.models : [];
    const isOpen = open.has(s.id);
    const modelsPanel = isOpen ? (
      '<div class="cs-models">'+
        '<span class="csm-lbl">Model'+(models.length===1?'':'s')+' used</span>'+
        (models.length
          ? models.map(m => '<span class="csm-item" title="'+esc(m)+'">'+esc(m)+'</span>').join('')
          : '<span class="csm-none">No model recorded yet</span>')+
      '</div>') : '';
    return '<div class="cs-tab'+on+'" data-id="'+esc(s.id)+'">'+
      '<div class="cs-main">'+
        '<div class="cs-name" title="'+esc(s.name)+'">'+spin+esc(s.name)+'</div>'+
        '<div class="cs-meta">'+esc(when)+(s.turns?(' · '+s.turns+' msg'+(s.turns===1?'':'s')):'')+'</div>'+
      '</div>'+
      '<div class="cs-actions">'+
        '<button class="cs-caret'+(isOpen?' open':'')+'" title="Show the model(s) used in this chat">▾</button>'+
        '<button class="cs-btn cs-ren" title="Rename">✎</button>'+
        '<button class="cs-btn cs-del" title="Delete">✕</button>'+
      '</div>'+
      modelsPanel+
    '</div>';
  }).join('');
  list.querySelectorAll('.cs-tab').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('.cs-main').onclick = () => selectSession(ws, proc, id);
    el.querySelector('.cs-caret').onclick = (e) => {
      e.stopPropagation();
      if(open.has(id)) open.delete(id); else open.add(id);
      drawSessions(ws, proc);
    };
    el.querySelector('.cs-ren').onclick = (e) => { e.stopPropagation(); renameSession(ws, proc, id); };
    el.querySelector('.cs-del').onclick = (e) => { e.stopPropagation(); deleteSession(ws, proc, id); };
  });
}

async function selectSession(ws, proc, id){
  if(id===STATE.sessionId) return;
  STATE.sessionId = id;
  $('#chatHint').textContent = '';
  drawSessions(ws, proc);
  await loadChat(ws, proc);
  if(STATE.chatTab === 'debug') loadDebug(ws, proc);
}

async function newSession(ws, proc){
  try {
    const s = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({})
    });
    await loadSessions(ws, proc, s.id);
    const box = $('#chatBox'); if(box) box.focus();
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function renameSession(ws, proc, id){
  const cur = (STATE.sessions||[]).find(s => s.id===id);
  const name = window.prompt('Rename chat:', cur ? cur.name : '');
  if(name==null || !name.trim()) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(id)+'/rename', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ name: name.trim() })
    });
    await loadSessions(ws, proc, STATE.sessionId);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function deleteSession(ws, proc, id){
  const cur = (STATE.sessions||[]).find(s => s.id===id);
  if(!window.confirm('Delete chat “'+(cur?cur.name:'this chat')+'”? This cannot be undone.')) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(id), { method:'DELETE' });
    // If we deleted the active one, fall back to the most recent remaining session.
    const next = (id===STATE.sessionId) ? null : STATE.sessionId;
    STATE.sessionId = next;
    await loadSessions(ws, proc, next);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

// ── partner roles (pair / monitor) + active-model roster ─────────────────────
// An investigation runs a PRIMARY model plus, optionally, ONE partner — a sparring partner
// (Pair AI) or a loop monitor. A profile can hold only one role at a time, so the partner pickers
// exclude the primary (and each other), and the primary send-menu excludes whatever is the partner.

// The profile ids currently bound to an enabled partner role.
function partnerProfileIds(){
  const ids = new Set();
  const pr = pairRequest(); if(pr && pr.profileId) ids.add(pr.profileId);
  const mr = monitorRequest(); if(mr && mr.profileId) ids.add(mr.profileId);
  return ids;
}
// Re-fill both partner pickers (preserving each selection when still valid) so they always exclude
// the active primary and the other partner. Then repaint the active-model roster.
async function refreshPartnerPickers(){
  await fillPairProfiles();
  await fillMonitorProfiles();
  refreshChatRoster();
}
// Populate the Pair AI reviewer's LLM-profile picker. Excludes the active primary and the monitor's
// profile (one role per model). Defaults to a profile other than the active primary.
async function fillPairProfiles(){
  const sel = $('#chatPairProfile'); if(!sel) return;
  let s = {}; try { s = await api('/api/settings') || {}; } catch(e){}
  const monSel = $('#chatMonitorProfile');
  const monActive = $('#chatMonitorOn') && $('#chatMonitorOn').checked && monSel ? monSel.value : null;
  const taken = new Set([s.activeProfile, monActive].filter(Boolean));
  const profiles = (s.profiles || []).filter(p => !taken.has(p.id));
  const saved = localStorage.getItem('processos.pairProfile');
  const fallback = (profiles[0] || {}).id || '';
  const want = (saved && profiles.some(p => p.id===saved)) ? saved : ((sel.value && profiles.some(p=>p.id===sel.value)) ? sel.value : fallback);
  sel.innerHTML = profiles.length
    ? profiles.map(p => '<option value="'+esc(p.id)+'"'+(p.id===want?' selected':'')+'>'+esc(p.name||p.id)+(p.sidecar?' (sidecar)':'')+'</option>').join('')
    : '<option value="">No other profile available</option>';
  sel.onchange = () => { if(sel.value) localStorage.setItem('processos.pairProfile', sel.value); fillMonitorProfiles(); refreshChatRoster(); };
}
// Wire the Pair AI on/off toggle: reveal the reviewer config when on, persist the choice, and

function monitorRequest(){
  const on = $('#chatMonitorOn');

// Paint the active-model roster beside the Send button: the PRIMARY plus any enabled partner,
// each with a status dot (green = its sidecar is running, yellow = sidecar configured but off,
// blue = remote/non-sidecar). Lets the operator see at a glance which models this investigation
// will drive — and that the partner is a different model than the one being sent to.
async function refreshChatRoster(){
  const el = $('#chatRoster'); if(!el) return;
  let s = {}; try { s = await api('/api/settings') || {}; } catch(e){ el.textContent=''; return; }
  let st = {sidecars:[]}; try { st = await api('/api/llama/status') || {sidecars:[]}; } catch(e){}
  const phaseById = {}; (st.sidecars||[]).forEach(x => { if(x.profileId) phaseById[x.profileId] = x.phase || 'running'; });
  const byId = {}; (s.profiles||[]).forEach(p => byId[p.id]=p);
  const dot = (p) => {
    const ph = p ? phaseById[p.id] : null;
    const ready = ph==='ready';
    const warming = ph && ph!=='ready';   // running but downloading/loading — not usable yet
    const color = !p ? '#64748b' : (!p.sidecar ? '#3b82f6' : (ready ? '#22c55e' : (warming ? '#38bdf8' : '#eab308')));
    const tip = !p ? '' : (!p.sidecar ? 'remote model' : (ready ? 'sidecar ready' : (warming ? ('sidecar '+ph+'… not ready yet') : 'sidecar off')));
    return '<span title="'+esc(tip)+'" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+color+';margin-right:5px;vertical-align:0"></span>';
  };
  const chip = (p, role) => p ? (dot(p)+'<b style="color:#cbd5e1">'+esc(p.name||p.id)+'</b> <span style="opacity:.6">'+role+'</span>') : '';
  const primary = byId[s.activeProfile];
  const parts = [chip(primary, 'primary')];
  const pr = pairRequest(); if(pr && pr.profileId && byId[pr.profileId]) parts.push(chip(byId[pr.profileId], 'pair'));
  const mr = monitorRequest(); if(mr && mr.profileId && byId[mr.profileId]) parts.push(chip(byId[mr.profileId], 'monitor'));
  // Warn if the primary somehow equals an enabled partner (the send would hit the partner).
  const clash = primary && partnerProfileIds().has(primary.id);
  el.innerHTML = parts.filter(Boolean).join('<span style="opacity:.4">·</span> ')
    + (clash ? ' <span style="color:#f87171" title="Pick a different partner — you can\'t send to the model already acting as the partner">⚠ partner = primary</span>' : '');
}
// Ensure every sidecar this investigation needs is up: the PRIMARY (when it's a sidecar) plus any
// enabled partner (pair/monitor) that is a sidecar — up to two distinct local servers. Prompts
// once to start the missing ones, then waits for each to finish loading. Returns true to proceed
// with the send, false to abort (composer untouched). Any settings/status lookup failure is
// non-blocking — we proceed and let the chat call surface its own error.
// Ensure every needed sidecar (primary + any enabled pair/monitor partner that is a sidecar) is up
// and its model has finished loading before we send. `onProgress(text, info)` (optional) is called
// at each step — start, then every poll while downloading/loading — so the caller can show a live
// warm-up bubble. Returns true to proceed with the send, false to abort (declined or failed start).
async function ensureSidecarsReady(onProgress){
  let s; try { s = await api('/api/settings') || {}; } catch(e){ return true; }
  const byId = {}; (s.profiles||[]).forEach(p => byId[p.id]=p);
  const needed = new Map();   // id → profile
  const primary = byId[s.activeProfile];
  if(primary && primary.sidecar) needed.set(primary.id, primary);
  const addPartner = (req) => { if(req && req.profileId){ const p = byId[req.profileId]; if(p && p.sidecar) needed.set(p.id, p); } };
  addPartner(pairRequest()); addPartner(monitorRequest());
  if(!needed.size) return true;   // nothing local to start

  let st; try { st = await api('/api/llama/status') || {sidecars:[]}; } catch(e){ return true; }
  const ready = new Set((st.sidecars||[]).filter(x => x.phase==='ready').map(x => x.profileId));
  if([...needed.keys()].every(id => ready.has(id))) return true;   // all already serving — no wait
  // The first needed sidecar drives the warm-up bubble's "view logs" link.
  STATE.warmupLogsTarget = [...needed.keys()][0] || null;
  const running = new Set((st.sidecars||[]).map(x => x.profileId));
  const missing = [...needed.values()].filter(p => !running.has(p.id));
  const hint = $('#chatHint');
  const report = (t, info) => { if(hint) hint.textContent = t; if(typeof onProgress === 'function') onProgress(t, info); };
  if(missing.length){
    const names = missing.map(p => p.name||p.id).join(' + ');
    const word = missing.length>1 ? 'Sidecars' : 'Sidecar';
    if(!window.confirm(word+' not started: '+names+'. Start '+(missing.length>1?'them':'it')+' now?')){
      report('Message not sent — '+(missing.length>1?'sidecars':'sidecar')+' not started.', {aborted:true});
      return false;
    }
    for(const p of missing){
      report('Starting '+(p.name||p.id)+'…', {profileId:p.id, label:(p.name||p.id), phase:'starting'});
      try { await api('/api/llama/start', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId: p.id})}); }
      catch(e){ report('Could not start '+(p.name||p.id)+': '+(e.message||e), {profileId:p.id, label:(p.name||p.id), failed:true}); return false; }
    }
    refreshLlamaDot();
  }
  // Wait for each needed sidecar's model to finish loading before sending. This can take a while
  // for large models, so report ongoing status instead of leaving the operator staring at silence.
  for(const p of needed.values()){
    const label = p.name||p.id;
    report('Waiting for '+label+'…', {profileId:p.id, label, phase:'starting'});
    const ok = await waitForSidecarReady(undefined, p.id, (secs, info) => {
      const what = (info && info.detail) ? info.detail
                 : (info && info.phase==='loading') ? 'loading model into memory…'
                 : (info && info.phase==='downloading') ? 'downloading model…'
                 : 'starting llama-server…';
      report(label+': '+what+' ('+secs+'s)', {profileId:p.id, label, phase:(info&&info.phase), detail:(info&&info.detail)});
    });
    if(!ok) report(label+' is taking longer than expected — sending anyway; it may report a load error.', {profileId:p.id, label, slow:true});
  }
  refreshLlamaDot();
  return true;
}
// Poll /api/llama/ready until a sidecar's model has loaded and it answers chat, or a timeout.
// `profileId` targets a specific sidecar. `onTick(elapsedSeconds, readyInfo)` (optional) is called
// each poll so the caller can surface the live phase/detail. Returns true once ready; false on
// timeout (the caller proceeds anyway so the chat call can report a precise error if it's still not
// up). A large model can legitimately download for many minutes, so while the phase is actively
// progressing (downloading/loading) the deadline is pushed forward rather than giving up early.
async function waitForSidecarReady(timeoutMs, profileId, onTick){
  const start = Date.now();
  let deadline = start + (timeoutMs || 120000);
  const qs = profileId ? ('?profileId='+encodeURIComponent(profileId)) : '';
  while(Date.now() < deadline){
    let r; try { r = await api('/api/llama/ready'+qs); } catch(e){ r = null; }
    if(r && r.ready) return true;
    if(r && (r.phase==='downloading' || r.phase==='loading')){
      deadline = Math.max(deadline, Date.now() + 120000); // keep waiting while it's making progress
    }
    if(typeof onTick === 'function') onTick(Math.round((Date.now()-start)/1000), r);
    await new Promise(res => setTimeout(res, 1500));
  }
  return false;
}
function personaSummary(id){
  const p = (STATE.personas||[]).find(x => x.id===id);
  return p ? (p.summary || p.name || id) : 'Pick the droid\u2019s persona for this chat';
}
// Reflect a session's persona binding: if the session has started, show and lock its persona;
// otherwise leave the picker enabled at the default (or the operator's current choice).
function applyPersonaState(){
  const sel = $('#chatPersona'); if(!sel) return;
  const meta = (STATE.sessions||[]).find(s => s.id===STATE.sessionId);
  const bound = meta && meta.persona;
  if(bound){
    if([...sel.options].some(o => o.value===bound)) sel.value = bound;
    sel.disabled = true;
    sel.title = 'Persona is fixed once a chat has started — start a new chat to use a different one. ('+personaSummary(bound)+')';
  } else {
    sel.disabled = false;
    sel.title = personaSummary(sel.value);
  }
}

// Build the live "pending" droid bubble whose regions fill in as SSE events stream.
function livePendingHtml(whoHtml, cls){
  return '<div class="bub droid pending'+(cls?(' '+cls):'')+'" id="chatPending">'+
    '<div class="who">'+(whoHtml||droidWhoHtml())+'</div>'+
    '<details class="think live" open id="liveThinkWrap" style="display:none"><summary>Thinking…</summary>'+
      '<div class="think-tl" id="liveTimeline"></div>'+
    '</details>'+
    '<div class="answer md" id="liveAnswer"></div>'+
    '<div class="muted live-status" id="liveStatus">reasoning over the dataset…</div>'+
    '</div>';
}

async function sendChat(ws, proc){
  const box = $('#chatBox'); const msg = box.value.trim();
  if(!msg) return;
  // The message is sent to the PRIMARY model. Refuse if the primary is also the configured
  // partner (pair/monitor) — you can't send to the model that's meant to be the sparring partner.
  try {
    const s = await api('/api/settings') || {};
    if(s.activeProfile && partnerProfileIds().has(s.activeProfile)){
      const hint = $('#chatHint');
      if(hint) hint.textContent = 'Primary and partner are the same model — pick a different partner before sending.';
      refreshChatRoster();
      return;
    }
  } catch(e){ /* non-blocking */ }
  // If the primary or an enabled partner is a local sidecar that isn't up yet, offer to start it
  // and show a live warm-up bubble (downloading/loading progress) with Send disabled meanwhile. If
  // the operator declines, the message stays in the composer unsent.
  let warmShown = false;
  const onWarm = (text, info) => {
    if(info && (info.aborted)) return;   // decline handled below; no bubble
    if(!warmShown){ warmShown = true; ensureWarmupBubble(msg); setChatWarming(true); }
    updateWarmupBubble(text);
  };
  const ready = await ensureSidecarsReady(onWarm);
  if(!ready){
    if(warmShown){ failWarmupBubble(); setChatWarming(false); }   // keep the last reported error text
    return;
  }
  if(warmShown){ removeWarmupBubble(); setChatWarming(false); }
  const allowPython = $('#chatPy').checked && !$('#chatPy').disabled;
  pushPromptHistory(msg);
  box.value = '';
  const qs = STATE.sessionId ? ('?session='+encodeURIComponent(STATE.sessionId)) : '';
  await consumeLiveStream(ws, proc, {
    userText: warmShown ? '' : msg,   // the user bubble was already drawn during warm-up
    onErrorRestore: () => { box.value = msg; },
    fetchStream: () => fetch('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/stream'+qs, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg, allowPython, personaId: ($('#chatPersona')||{}).value || undefined, pair: pairRequest() || undefined, monitor: monitorRequest() || undefined })
    }),
  });
}

// Reattach to an in-flight investigation that is still running on the server (e.g. after a page
// reload). Renders the in-flight user bubble + a live pending bubble and follows the replayed
// event stream. Silently no-ops if the turn has already finished (404).
async function reattachLiveStream(ws, proc, inflight){
  const qs = STATE.sessionId ? ('?session='+encodeURIComponent(STATE.sessionId)) : '';
  await consumeLiveStream(ws, proc, {
    userText: (inflight && inflight.user) || '',
    onErrorRestore: null,
    quietMissing: true,
    fetchStream: () => fetch('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/stream/live'+qs, { method:'GET' }),
  });
}

// Drive a live investigation SSE stream into the chat log. Shared by sendChat (POST) and
// reattachLiveStream (GET reattach). `opts.fetchStream()` returns the fetch promise; `opts.userText`
// (if given) is drawn as the operator's bubble; `opts.onErrorRestore` runs on error (e.g. to put
// the prompt back); `opts.quietMissing` swallows a 404 (no live turn to reattach to).
async function consumeLiveStream(ws, proc, opts){
  const log = $('#chatLog'); const hint = $('#chatHint'); const wrap = $('#chatWrapup');
  setChatBusy(true);
  if(wrap){ wrap.style.display = ''; wrap.disabled = false; }
  if(log.querySelector('.empty')) log.innerHTML = '';
  if(opts.userText){ log.insertAdjacentHTML('beforeend', chatBub({role:'user', text:opts.userText})); }
  log.insertAdjacentHTML('beforeend', livePendingHtml());
  log.scrollTop = log.scrollHeight;

  let pend = $('#chatPending');
  let liveThinkWrap = $('#liveThinkWrap'), liveTimeline = $('#liveTimeline');
  let liveAnswer = $('#liveAnswer'), liveStatus = $('#liveStatus');
  let answerBuf = '';
  // Set when the turn ends in an error (a transport failure, or an SSE `error` event such
  // as the LLM backend returning 404/503). On any error we run onErrorRestore (see `finally`)
  // so the operator can resend the prompt without retyping.
  let errored = false;
  // Request payloads captured this turn. Stored on STATE (scoped to the session) so switching
  // to the Debug tab mid-flight can show them — the persisted endpoint only fills in once the
  // turn completes.
  const liveDebug = [];
  STATE.liveDebug = liveDebug; STATE.liveDebugSid = STATE.sessionId;
  // Alternate Reality Engine runs produced this turn (simulate / compare_variants), surfaced live
  // in the Simulations tab as the droid forks and replays variants.
  STATE.liveSims = []; STATE.liveSimsSid = STATE.sessionId;
  let curReason = null, curReasonBuf = ''; // the reasoning block currently streaming
  let pendingSteps = []; // FIFO of {tool, el} awaiting their result
  const nearBottom = () => (log.scrollHeight - log.scrollTop - log.clientHeight) < 80;
  const autoscroll = () => { if(nearBottom()) log.scrollTop = log.scrollHeight; };

  // Pair AI provenance: freeze the current agent's pending bubble into a finished one and open a
  // fresh attributed bubble for the next agent (the reviewer), so primary vs Pair AI output never
  // run together. The terminal `done` event later redraws everything from the persisted transcript.
  function beginAgent(ev){
    if(pend){ pend.classList.remove('pending'); pend.removeAttribute('id'); const st = pend.querySelector('.live-status'); if(st) st.remove(); }
    const who = '<span class="pair-badge" title="Pair AI reviewer">🤝 Pair AI · '+esc(ev.name||'reviewer')+'</span>';
    log.insertAdjacentHTML('beforeend', livePendingHtml(who, 'pair'));
    pend = $('#chatPending');
    liveThinkWrap = $('#liveThinkWrap'); liveTimeline = $('#liveTimeline');
    liveAnswer = $('#liveAnswer'); liveStatus = $('#liveStatus');
    answerBuf = ''; curReason = null; curReasonBuf = ''; pendingSteps = [];
    if(liveStatus) liveStatus.textContent = 'reviewing the droid\u2019s answer…';
    autoscroll();
  }

  function handleEvent(ev){
    if(ev.type==='agent'){ if(ev.role==='pair') beginAgent(ev); }
    else if(ev.type==='round'){ if(liveStatus) liveStatus.textContent = 'round '+ev.n+' — investigating…'; }
    else if(ev.type==='request'){
      liveDebug.push({ round: ev.round, ts: ev.ts || Date.now(), body: ev.body });
      if(STATE.chatTab==='debug'){ const host=$('#chatDebug'); if(host) host.innerHTML = renderDebug({ requests: liveDebug }); }
    }
    else if(ev.type==='reasoning'){
      if(liveThinkWrap) liveThinkWrap.style.display='';
      // Append to the open reasoning block, or start a new one (e.g. after a tool call).
      if(!curReason && liveTimeline){ curReason = document.createElement('div'); curReason.className = 'think-body md'; curReasonBuf = ''; liveTimeline.appendChild(curReason); }
      curReasonBuf += ev.text; if(curReason) curReason.innerHTML = mdToHtml(curReasonBuf); autoscroll();
    }
    else if(ev.type==='answer'){
      answerBuf += ev.text; if(liveAnswer) liveAnswer.innerHTML = mdToHtml(answerBuf); autoscroll();
    }
    else if(ev.type==='tool'){
      if(liveThinkWrap) liveThinkWrap.style.display='';
      curReason = null; // close the current reasoning block so later thinking lands after this tool
      const el = document.createElement('details');
      el.className = 'toolcall'; el.open = true;
      el.innerHTML = '<summary>▶ '+esc(ev.tool)+' …</summary>'+
        '<div class="args">'+esc(JSON.stringify(ev.arguments))+'</div>'+
        '<pre class="result">running…</pre>';
      if(liveTimeline) liveTimeline.appendChild(el); pendingSteps.push({ tool: ev.tool, el });
      if(liveStatus) liveStatus.textContent = 'running '+ev.tool+'…';
      if(ev.tool==='simulate' || ev.tool==='compare_variants'){
        STATE.liveSims.push({ tool: ev.tool, arguments: ev.arguments, result: null, ts: Date.now() });
        if(STATE.chatTab==='sims') renderSimsCombined();
      }
      autoscroll();
    }
    else if(ev.type==='toolResult'){
      const i = pendingSteps.findIndex(s => s.tool===ev.tool);
      const s = i>=0 ? pendingSteps.splice(i,1)[0] : null;
      if(s){ s.el.querySelector('summary').textContent = ev.tool+' ✓'; s.el.querySelector('.result').textContent = ev.result; s.el.open = false; }
      if(ev.tool==='simulate' || ev.tool==='compare_variants'){
        const rec = (STATE.liveSims||[]).slice().reverse().find(r => r.tool===ev.tool && r.result===null);
        if(rec){ try { rec.result = JSON.parse(ev.result); } catch(_){ rec.result = { raw: ev.result }; } }
        if(STATE.chatTab==='sims') renderSimsCombined();
      }
      autoscroll();
    }
    else if(ev.type==='monitor'){
      // The loop monitor stepped in: render a distinct inline note so the operator can see the
      // supervisor's reasoning. A 'steer' nudges the primary; a 'wrapup' forces it to conclude.
      const isWrap = ev.action==='wrapup';
      const label = isWrap ? 'Loop monitor — forcing wrap-up' : 'Loop monitor — steering';
      const detail = isWrap ? (ev.reason||'') : (ev.steer || ev.reason || '');
      log.insertAdjacentHTML('beforeend',
        '<div class="bub monitor"><div class="who">🔍 '+esc(label)+'</div>'+esc(detail)+'</div>');
      autoscroll();
    }
    else if(ev.type==='done'){
      drawChat(ev.turns);
      const ds = ev.dataset || {};
      hint.textContent = (ev.rounds!=null?('round '+ev.rounds+' · '):'') +
        (ds.instances!=null?(ds.instances+' instances · '+ds.jobs+' jobs · '+ds.incidents+' incidents'):'');
      // Refresh the tab list so the active chat's last-message time + count update.
      loadSessionsQuiet(ws, proc, STATE.sessionId);
      if(STATE.chatTab==='debug') loadDebug(ws, proc);
      // The persisted transcript now holds this turn's runs — reload them and drop the live copy
      // so the Simulations tab shows each run exactly once.
      STATE.liveSims = [];
      if(STATE.chatTab==='sims') loadSims(ws, proc);
    }
    else if(ev.type==='error'){
      errored = true;
      if(pend) pend.remove();
      log.insertAdjacentHTML('beforeend', chatErrorHtml(ev.message));
    }
  }

  try {
    const resp = await opts.fetchStream();
    if(resp.status===404 && opts.quietMissing){
      // Nothing live to reattach to — the turn finished. Drop the optimistic bubbles and reload
      // the persisted transcript so the completed answer shows.
      if(pend) pend.remove();
      try { const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):'')); drawChat(r.turns); } catch(e){}
      return;
    }
    if(!resp.ok || !resp.body){
      let m = 'stream failed ('+resp.status+')';
      try { const j = await resp.json(); m = j.error || m; } catch(e){}
      throw new Error(m);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', finished = false;
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        const frame = buf.slice(0, idx); buf = buf.slice(idx+2);
        const dataLine = frame.split('\n').find(l => l.startsWith('data:'));
        if(!dataLine) continue;
        const payload = dataLine.slice(5).trim();
        if(!payload) continue;
        let ev; try { ev = JSON.parse(payload); } catch(e){ continue; }
        // A single malformed/unexpected event must never take down the whole stream loop
        // (which previously could leave the page blank and the button stuck on "Steer").
        try { handleEvent(ev); } catch(err){ console.error('chat event handler failed', err, ev); }
        if(ev.type==='done' || ev.type==='error') finished = true;
      }
    }
    if(!finished){
      // Stream closed without a terminal event — fall back to the persisted transcript.
      try { const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):'')); drawChat(r.turns); }
      catch(e){ if(pend) pend.remove(); }
    }
  } catch(e){
    errored = true;
    if(pend) pend.remove();
    log.insertAdjacentHTML('beforeend', chatErrorHtml(e.message||e));
  } finally {
    setChatBusy(false);
    if(errored && opts.onErrorRestore) opts.onErrorRestore();
    box.focus();
    if(wrap) wrap.style.display = 'none';
  }
}

// Refresh the tab list (metadata only) without reloading the chat log — used after a turn
// completes so the active chat's timestamp and message count update in place.
async function loadSessionsQuiet(ws, proc, keepId){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions');
    STATE.sessions = r.sessions || [];
    if(keepId) STATE.sessionId = keepId;
    drawSessions(ws, proc);
    applyPersonaState();
  } catch(e){ /* tab refresh is best-effort */ }
}

// Ask an in-flight investigation to stop and report its findings so far. The live bubble keeps
// streaming — the wrap-up answer arrives as further `answer` events.
async function wrapUpChat(ws, proc){
  const wrap = $('#chatWrapup'); if(wrap) wrap.disabled = true;
  const st = $('#liveStatus'); if(st) st.textContent = 'wrapping up — reporting findings so far…';
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/wrapup'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), { method:'POST' });
    $('#chatHint').textContent = 'asked the droid to wrap up…';
  } catch(e){ $('#chatHint').textContent = 'wrap-up request failed: '+(e.message||e); }
}

async function saveChatPrompt(){
  const text = $('#chatBox').value.trim();
  if(!text){ $('#chatHint').textContent = 'nothing in the compose box to save'; return; }
  const name = window.prompt('Name this prompt:');
  if(name==null) return;
  const id = (name.trim()||'prompt').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || ('prompt-'+Date.now());
  try {
    await api('/api/chat-prompts', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ id, name: name.trim()||id, text })
    });
    await loadChatPrompts();
    $('#chatHint').textContent = 'saved prompt “'+(name.trim()||id)+'”';
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function resetChat(ws, proc){
  if(!window.confirm('Forget this conversation?')) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/reset'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), { method:'POST' });
    drawChat([]); $('#chatHint').textContent = '';
    loadSessionsQuiet(ws, proc, STATE.sessionId);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function renderWsModel(url){
  const el = document.getElementById('wsModel');
  if(!el || typeof BpmnJS === 'undefined'){ if(el) el.innerHTML='<p class="muted" style="padding:12px">viewer unavailable</p>'; return; }
  try {
    const xml = await (await fetch(url)).text();
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(await ensureBpmnLayout(xml));
    viewer.get('canvas').zoom('fit-viewport', 'auto');
  } catch(e){ el.innerHTML = '<p class="err" style="padding:12px">could not render model: '+esc(e.message||e)+'</p>'; }
}

// Reveal the persistent cockpit pane. It is never destroyed — only hidden — so the chat view,
// selected session/tab, and any half-typed prompt are retained across navigation. If it has never
// been opened this session, reopen the last process used (persisted) or invite the operator to pick.
function showCockpit(){
  STATE.view='cockpit'; setActive();
  const host = cockpitHost();
  $('#viewHost').style.display='none'; host.style.display='';
  if(host.dataset.ready==='1') return; // already rendered — just reveal, state intact
  let last=null; try { last = JSON.parse(localStorage.getItem('processos.lastCockpit')||'null'); } catch(e){}
  if(last && last.ws && last.proc) return renderWorkspace(last.ws, last.proc);
  host.innerHTML = '<h1>Cockpit</h1>'+
    '<p class="lede">The investigation surface for a process — chat with the droid about its traces, fork what-if variants, and prove them on the recorded dataset.</p>'+
    '<p class="muted">Open a process to begin: pick one from <a onclick="showView(\'processes\')" style="color:#a5b4fc;cursor:pointer">Processes</a>.</p>';
}

// Show a non-cockpit view: hide the cockpit pane, reveal the view pane, then run its renderer.
function showView(v){
  $('#cockpitHost').style.display='none';
  $('#viewHost').style.display='';
  if(v==='processes') return renderProcesses();
  if(v==='prompts') return renderPrompts();
  if(v==='experiments') return renderExperiments();
  if(v==='sidecars') return renderSidecars();
  return renderConsole();
}

document.querySelectorAll('.nav a[data-view]').forEach(a => a.onclick = () => {
  const v = a.dataset.view;
  if(v==='cockpit') return showCockpit();
  showView(v);
});

// Map a ?view= param (used by other pages linking into the cockpit) to its renderer.
function renderView(v){
  if(v==='cockpit') return showCockpit();
  return showView(v);
}

// Boot: a workspace-process deep-link (?workspace=&process=) opens the
// investigation surface; a ?view= param selects a named rail view; otherwise the
// default console. The rail's sidecar status dot polls regardless of the view.
(function(){
  startLlamaDotPoll();
  const q = new URLSearchParams(location.search);
  const ws = q.get('workspace'), proc = q.get('process');
  if(ws && proc) renderWorkspace(ws, proc);
  else renderView(q.get('view'));
})();
</script>
<script src="/assets/settings.js"></script>
