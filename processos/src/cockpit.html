          await api('/api/settings', {method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({activeProfile:p.primaryProfileId})});
          try{ window.dispatchEvent(new CustomEvent('processos:settings-changed')); }catch(_){}
        }
      } catch(e){}
    }
    labelSendButton();
    refreshChatRoster();
    reconcileSidecars();
  };
}
// Translate the selected pairing into the existing per-turn request objects. Exactly one of these
// is non-null (matching the pairing's mode); all are null for Solo. Downstream roster/sidecar
// helpers consume these unchanged.
function pairRequest(){
  const p = selectedPairing();
  if(!p || p.mode!=='pair') return null;
  return { enabled:true, profileId: p.secondaryProfileId || undefined, system: (p.system||'').trim() || undefined, name: p.name || undefined, tools: (p.secondaryTools&&p.secondaryTools.length)?p.secondaryTools:undefined };
}
function monitorRequest(){
  const p = selectedPairing();
  if(!p || p.mode!=='monitor') return null;
  return { enabled:true, profileId: p.secondaryProfileId || undefined, system: (p.system||'').trim() || undefined };
}
function subRequest(){
  const p = selectedPairing();
  if(!p || p.mode!=='subagent') return null;
  return { enabled:true, profileId: p.secondaryProfileId || undefined, system: (p.system||'').trim() || undefined, name: p.name || undefined, maxRounds: p.maxRounds || undefined, digestCap: p.digestCap || undefined, tools: (p.secondaryTools&&p.secondaryTools.length)?p.secondaryTools:undefined };
}
// The PRIMARY model's tool allowlist for this turn: the per-investigation "Configure tools"
// override (if set), else the selected pairing's primaryTools, else undefined (= all tools).
function primaryToolsForTurn(){
  if(Array.isArray(STATE.investigationTools)) return STATE.investigationTools.length ? STATE.investigationTools : undefined;
  const p = selectedPairing();
  if(p && p.primaryTools && p.primaryTools.length) return p.primaryTools;
  return undefined;
}

// ── partner roles (pair / monitor) + active-model roster ─────────────────────
// An investigation runs a PRIMARY model plus, optionally, ONE partner — a sparring partner
// (Pair AI) or a loop monitor. A profile can hold only one role at a time, so the partner pickers
// exclude the primary (and each other), and the primary send-menu excludes whatever is the partner.

// The profile ids currently bound to an enabled partner role.
function partnerProfileIds(){
  const ids = new Set();
  const pr = pairRequest(); if(pr && pr.profileId) ids.add(pr.profileId);
  const mr = monitorRequest(); if(mr && mr.profileId) ids.add(mr.profileId);
  const sr = subRequest(); if(sr && sr.profileId) ids.add(sr.profileId);
  return ids;
}
// Repaint the composer's pairing selector + active-model roster (e.g. after the primary changes).
async function refreshPartnerPickers(){
  fillPairingSelect();
  refreshChatRoster();
}

// Paint the active-model roster beside the Send button: the PRIMARY plus any enabled partner,
// each with a status dot (green = its sidecar is running, yellow = sidecar configured but off,
// blue = remote/non-sidecar). Lets the operator see at a glance which models this investigation
// will drive — and that the partner is a different model than the one being sent to.
async function refreshChatRoster(){
  const el = $('#chatRoster'); if(!el) return;
  let s = {}; try { s = await api('/api/settings') || {}; } catch(e){ el.textContent=''; return; }
  let st = {sidecars:[]}; try { st = await api('/api/llama/status') || {sidecars:[]}; } catch(e){}
  const phaseById = {}; (st.sidecars||[]).forEach(x => { if(x.profileId) phaseById[x.profileId] = x.phase || 'running'; });
  const byId = {}; (s.profiles||[]).forEach(p => byId[p.id]=p);
  const dot = (p) => {
    const ph = p ? phaseById[p.id] : null;
    const ready = ph==='ready';
    const warming = ph && ph!=='ready';   // running but downloading/loading — not usable yet
    const color = !p ? '#64748b' : (!p.sidecar ? '#3b82f6' : (ready ? '#22c55e' : (warming ? '#38bdf8' : '#eab308')));
    const tip = !p ? '' : (!p.sidecar ? 'remote model' : (ready ? 'sidecar ready' : (warming ? ('sidecar '+ph+'… not ready yet') : 'sidecar off')));
    return '<span title="'+esc(tip)+'" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+color+';margin-right:5px;vertical-align:0"></span>';
  };
  const chip = (p, role) => p ? (dot(p)+'<b style="color:#cbd5e1">'+esc(p.name||p.id)+'</b> <span style="opacity:.6">'+role+'</span>') : '';
  const primary = byId[s.activeProfile];
  const parts = [chip(primary, 'primary')];
  const pr = pairRequest(); if(pr && pr.profileId && byId[pr.profileId]) parts.push(chip(byId[pr.profileId], 'pair'));
  const mr = monitorRequest(); if(mr && mr.profileId && byId[mr.profileId]) parts.push(chip(byId[mr.profileId], 'monitor'));
  const sr = subRequest(); if(sr && sr.profileId && byId[sr.profileId]) parts.push(chip(byId[sr.profileId], 'subagent'));
  // Warn if the primary somehow equals an enabled partner (the send would hit the partner).
  const clash = primary && partnerProfileIds().has(primary.id);
  el.innerHTML = parts.filter(Boolean).join('<span style="opacity:.4">·</span> ')
    + (clash ? ' <span style="color:#f87171" title="Pick a different partner — you can\'t send to the model already acting as the partner">⚠ partner = primary</span>' : '');
}
// When a partner mode is turned off (switching back toward a single LLM), free the now-unused
// sidecar's memory: stop any running sidecar that is no longer the primary or an enabled partner.
// Never stops the primary's sidecar or a sidecar still claimed by another active mode.
async function reconcileSidecars(){
  let s; try { s = await api('/api/settings') || {}; } catch(e){ return; }
  const byId = {}; (s.profiles||[]).forEach(p => byId[p.id]=p);
  const needed = new Set();
  const primary = byId[s.activeProfile];
  if(primary && primary.sidecar) needed.add(primary.id);
  [pairRequest(), monitorRequest(), subRequest()].forEach(req => {
    if(req && req.profileId){ const p = byId[req.profileId]; if(p && p.sidecar) needed.add(p.id); }
  });
  let st; try { st = await api('/api/llama/status') || {sidecars:[]}; } catch(e){ return; }
  const stale = (st.sidecars||[]).map(x => x.profileId).filter(id => id && !needed.has(id));
  for(const id of stale){
    try { await api('/api/llama/stop', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId:id})}); } catch(e){}
  }
  if(stale.length) refreshLlamaDot();
}
// enabled partner (pair/monitor/subagent) that is a sidecar — up to two distinct local servers. Prompts
// once to start the missing ones, then waits for each to finish loading. Returns true to proceed
// with the send, false to abort (composer untouched). Any settings/status lookup failure is
// non-blocking — we proceed and let the chat call surface its own error.
// Ensure every needed sidecar (primary + any enabled pair/monitor/subagent partner that is a sidecar) is up
// and its model has finished loading before we send. `onProgress(text, info)` (optional) is called
// at each step — start, then every poll while downloading/loading — so the caller can show a live
// warm-up bubble. Returns true to proceed with the send, false to abort (declined or failed start).
async function ensureSidecarsReady(onProgress){
  let s; try { s = await api('/api/settings') || {}; } catch(e){ return true; }
  const byId = {}; (s.profiles||[]).forEach(p => byId[p.id]=p);
  const needed = new Map();   // id → profile
  const primary = byId[s.activeProfile];
  if(primary && primary.sidecar) needed.set(primary.id, primary);
  const addPartner = (req) => { if(req && req.profileId){ const p = byId[req.profileId]; if(p && p.sidecar) needed.set(p.id, p); } };
  addPartner(pairRequest()); addPartner(monitorRequest()); addPartner(subRequest());
  if(!needed.size) return true;   // nothing local to start

  let st; try { st = await api('/api/llama/status') || {sidecars:[]}; } catch(e){ return true; }
  const ready = new Set((st.sidecars||[]).filter(x => x.phase==='ready').map(x => x.profileId));
  if([...needed.keys()].every(id => ready.has(id))) return true;   // all already serving — no wait
  // The first needed sidecar drives the warm-up bubble's "view logs" link.
  STATE.warmupLogsTarget = [...needed.keys()][0] || null;
  const running = new Set((st.sidecars||[]).map(x => x.profileId));
  const missing = [...needed.values()].filter(p => !running.has(p.id));
  const hint = $('#chatHint');
  const report = (t, info) => { if(hint) hint.textContent = t; if(typeof onProgress === 'function') onProgress(t, info); };
  if(missing.length){
    const names = missing.map(p => p.name||p.id).join(' + ');
    const word = missing.length>1 ? 'Sidecars' : 'Sidecar';
    if(!window.confirm(word+' not started: '+names+'. Start '+(missing.length>1?'them':'it')+' now?')){
      report('Message not sent — '+(missing.length>1?'sidecars':'sidecar')+' not started.', {aborted:true});
      return false;
    }
    for(const p of missing){
      report('Starting '+(p.name||p.id)+'…', {profileId:p.id, label:(p.name||p.id), phase:'starting'});
      try { await api('/api/llama/start', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId: p.id})}); }
      catch(e){ report('Could not start '+(p.name||p.id)+': '+(e.message||e), {profileId:p.id, label:(p.name||p.id), failed:true}); return false; }
    }
    refreshLlamaDot();
  }
  // Wait for each needed sidecar's model to finish loading before sending. This can take a while
  // for large models, so report ongoing status instead of leaving the operator staring at silence.
  for(const p of needed.values()){
    const label = p.name||p.id;
    report('Waiting for '+label+'…', {profileId:p.id, label, phase:'starting'});
    const ok = await waitForSidecarReady(undefined, p.id, (secs, info) => {
      const what = (info && info.detail) ? info.detail
                 : (info && info.phase==='loading') ? 'loading model into memory…'
                 : (info && info.phase==='downloading') ? 'downloading model…'
                 : 'starting llama-server…';
      report(label+': '+what+' ('+secs+'s)', {profileId:p.id, label, phase:(info&&info.phase), detail:(info&&info.detail)});
    });
    if(!ok) report(label+' is taking longer than expected — sending anyway; it may report a load error.', {profileId:p.id, label, slow:true});
  }
  refreshLlamaDot();
  return true;
}
// Poll /api/llama/ready until a sidecar's model has loaded and it answers chat, or a timeout.
// `profileId` targets a specific sidecar. `onTick(elapsedSeconds, readyInfo)` (optional) is called
// each poll so the caller can surface the live phase/detail. Returns true once ready; false on
// timeout (the caller proceeds anyway so the chat call can report a precise error if it's still not
// up). A large model can legitimately download for many minutes, so while the phase is actively
// progressing (downloading/loading) the deadline is pushed forward rather than giving up early.
async function waitForSidecarReady(timeoutMs, profileId, onTick){
  const start = Date.now();
  let deadline = start + (timeoutMs || 120000);
  const qs = profileId ? ('?profileId='+encodeURIComponent(profileId)) : '';
  while(Date.now() < deadline){
    let r; try { r = await api('/api/llama/ready'+qs); } catch(e){ r = null; }
    if(r && r.ready) return true;
    if(r && (r.phase==='downloading' || r.phase==='loading')){
      deadline = Math.max(deadline, Date.now() + 120000); // keep waiting while it's making progress
    }
    if(typeof onTick === 'function') onTick(Math.round((Date.now()-start)/1000), r);
    await new Promise(res => setTimeout(res, 1500));
  }
  return false;
}
function personaSummary(id){
  const p = (STATE.personas||[]).find(x => x.id===id);
  return p ? (p.summary || p.name || id) : 'Pick the droid\u2019s persona for this chat';
}
// Reflect a session's persona binding: if the session has started, show and lock its persona;
// otherwise leave the picker enabled at the default (or the operator's current choice).
function applyPersonaState(){
  const sel = $('#chatPersona'); if(!sel) return;
  const meta = (STATE.sessions||[]).find(s => s.id===STATE.sessionId);
  const bound = meta && meta.persona;
  if(bound){
    if([...sel.options].some(o => o.value===bound)) sel.value = bound;
    sel.disabled = true;
    sel.title = 'Persona is fixed once a chat has started — start a new chat to use a different one. ('+personaSummary(bound)+')';
  } else {
    sel.disabled = false;
    sel.title = personaSummary(sel.value);
  }
}

// Build the live "pending" droid bubble whose regions fill in as SSE events stream.
function livePendingHtml(whoHtml, cls){
  return '<div class="bub droid pending'+(cls?(' '+cls):'')+'" id="chatPending">'+
    '<div class="who">'+(whoHtml||droidWhoHtml())+'</div>'+
    '<details class="think live" open id="liveThinkWrap" style="display:none"><summary>Thinking…</summary>'+
      '<div class="think-tl" id="liveTimeline"></div>'+
    '</details>'+
    '<div class="answer md" id="liveAnswer"></div>'+
    '<div class="muted live-status" id="liveStatus">reasoning over the dataset…</div>'+
    '</div>';
}

async function sendChat(ws, proc){
  const box = $('#chatBox'); const msg = box.value.trim();
  if(!msg) return;
  // The message is sent to the PRIMARY model. Refuse if the primary is also the configured
  // partner (pair/monitor) — you can't send to the model that's meant to be the sparring partner.
  try {
    const s = await api('/api/settings') || {};
    if(s.activeProfile && partnerProfileIds().has(s.activeProfile)){
      const hint = $('#chatHint');
      if(hint) hint.textContent = 'Primary and partner are the same model — pick a different partner before sending.';
      refreshChatRoster();
      return;
    }
  } catch(e){ /* non-blocking */ }
  // If the primary or an enabled partner is a local sidecar that isn't up yet, offer to start it
  // and show a live warm-up bubble (downloading/loading progress) with Send disabled meanwhile. If
  // the operator declines, the message stays in the composer unsent.
  let warmShown = false;
  const onWarm = (text, info) => {
    if(info && (info.aborted)) return;   // decline handled below; no bubble
    if(!warmShown){ warmShown = true; ensureWarmupBubble(msg); setChatWarming(true); }
    updateWarmupBubble(text);
  };
  const ready = await ensureSidecarsReady(onWarm);
  if(!ready){
    if(warmShown){ failWarmupBubble(); setChatWarming(false); }   // keep the last reported error text
    return;
  }
  if(warmShown){ removeWarmupBubble(); setChatWarming(false); }
  const allowPython = $('#chatPy').checked && !$('#chatPy').disabled;
  pushPromptHistory(msg);
  box.value = '';
  const qs = STATE.sessionId ? ('?session='+encodeURIComponent(STATE.sessionId)) : '';
  await consumeLiveStream(ws, proc, {
    userText: warmShown ? '' : msg,   // the user bubble was already drawn during warm-up
    onErrorRestore: () => { box.value = msg; },
    fetchStream: () => fetch('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/stream'+qs, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg, allowPython, personaId: ($('#chatPersona')||{}).value || undefined, pair: pairRequest() || undefined, monitor: monitorRequest() || undefined, subagent: subRequest() || undefined, tools: primaryToolsForTurn() })
    }),
  });
}

// Reattach to an in-flight investigation that is still running on the server (e.g. after a page
// reload). Renders the in-flight user bubble + a live pending bubble and follows the replayed
// event stream. Silently no-ops if the turn has already finished (404).
async function reattachLiveStream(ws, proc, inflight){
  const qs = STATE.sessionId ? ('?session='+encodeURIComponent(STATE.sessionId)) : '';
  await consumeLiveStream(ws, proc, {
    userText: (inflight && inflight.user) || '',
    onErrorRestore: null,
    quietMissing: true,
    fetchStream: () => fetch('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/stream/live'+qs, { method:'GET' }),
  });
}

// Drive a live investigation SSE stream into the chat log. Shared by sendChat (POST) and
// reattachLiveStream (GET reattach). `opts.fetchStream()` returns the fetch promise; `opts.userText`
// (if given) is drawn as the operator's bubble; `opts.onErrorRestore` runs on error (e.g. to put
// the prompt back); `opts.quietMissing` swallows a 404 (no live turn to reattach to).
async function consumeLiveStream(ws, proc, opts){
  const log = $('#chatLog'); const hint = $('#chatHint'); const wrap = $('#chatWrapup');
  setChatBusy(true);
  if(wrap){ wrap.style.display = ''; wrap.disabled = false; }
  if(log.querySelector('.empty')) log.innerHTML = '';
  if(opts.userText){ log.insertAdjacentHTML('beforeend', chatBub({role:'user', text:opts.userText})); }
  log.insertAdjacentHTML('beforeend', livePendingHtml());
  log.scrollTop = log.scrollHeight;

  let pend = $('#chatPending');
  let liveThinkWrap = $('#liveThinkWrap'), liveTimeline = $('#liveTimeline');
  let liveAnswer = $('#liveAnswer'), liveStatus = $('#liveStatus');
  let answerBuf = '';
  // Set when the turn ends in an error (a transport failure, or an SSE `error` event such
  // as the LLM backend returning 404/503). On any error we run onErrorRestore (see `finally`)
  // so the operator can resend the prompt without retyping.
  let errored = false;
  // Request payloads captured this turn. Stored on STATE (scoped to the session) so switching
  // to the Debug tab mid-flight can show them — the persisted endpoint only fills in once the
  // turn completes.
  const liveDebug = [];
  STATE.liveDebug = liveDebug; STATE.liveDebugSid = STATE.sessionId;
  // Alternate Reality Engine runs produced this turn (simulate / compare_variants), surfaced live
  // in the Simulations tab as the droid forks and replays variants.
  STATE.liveSims = []; STATE.liveSimsSid = STATE.sessionId;
  let curReason = null, curReasonBuf = ''; // the reasoning block currently streaming
  let pendingSteps = []; // FIFO of {tool, el} awaiting their result
  const nearBottom = () => (log.scrollHeight - log.scrollTop - log.clientHeight) < 80;
  const autoscroll = () => { if(nearBottom()) log.scrollTop = log.scrollHeight; };

  // Pair AI provenance: freeze the current agent's pending bubble into a finished one and open a
  // fresh attributed bubble for the next agent (the reviewer), so primary vs Pair AI output never
  // run together. The terminal `done` event later redraws everything from the persisted transcript.
  function beginAgent(ev){
    if(pend){ pend.classList.remove('pending'); pend.removeAttribute('id'); const st = pend.querySelector('.live-status'); if(st) st.remove(); }
    const who = '<span class="pair-badge" title="Pair AI reviewer">🤝 Pair AI · '+esc(ev.name||'reviewer')+'</span>';
    log.insertAdjacentHTML('beforeend', livePendingHtml(who, 'pair'));
    pend = $('#chatPending');
    liveThinkWrap = $('#liveThinkWrap'); liveTimeline = $('#liveTimeline');
    liveAnswer = $('#liveAnswer'); liveStatus = $('#liveStatus');
    answerBuf = ''; curReason = null; curReasonBuf = ''; pendingSteps = [];
    if(liveStatus) liveStatus.textContent = 'reviewing the droid\u2019s answer…';
    autoscroll();
  }

  function handleEvent(ev){
    if(ev.type==='agent'){ if(ev.role==='pair') beginAgent(ev); }
    else if(ev.type==='round'){ if(liveStatus) liveStatus.textContent = 'round '+ev.n+' — investigating…'; }
    else if(ev.type==='request'){
      liveDebug.push({ round: ev.round, ts: ev.ts || Date.now(), body: ev.body });
      if(STATE.chatTab==='debug'){ const host=$('#chatDebug'); if(host) host.innerHTML = renderDebug({ requests: liveDebug }); }
    }
    else if(ev.type==='monitorRequest'){
      // The loop monitor (second LLM) just evaluated the primary — capture the full exchange into
      // the Debug buffer so the operator can see everything it saw and said, not just the steer.
      liveDebug.push({ kind:'monitor', ts: ev.ts || Date.now(), action: ev.action, verdict: ev.verdict, injected: ev.injected, raw: ev.raw, body: ev.body });
      if(STATE.chatTab==='debug'){ const host=$('#chatDebug'); if(host) host.innerHTML = renderDebug({ requests: liveDebug }); }
    }
    else if(ev.type==='reasoning'){
      if(liveThinkWrap) liveThinkWrap.style.display='';
      // Append to the open reasoning block, or start a new one (e.g. after a tool call).
      if(!curReason && liveTimeline){ curReason = document.createElement('div'); curReason.className = 'think-body md'; curReasonBuf = ''; liveTimeline.appendChild(curReason); }
      curReasonBuf += ev.text; if(curReason) curReason.innerHTML = mdToHtml(curReasonBuf); autoscroll();
    }
    else if(ev.type==='answer'){
      answerBuf += ev.text; if(liveAnswer) liveAnswer.innerHTML = mdToHtml(answerBuf); autoscroll();
    }
    else if(ev.type==='tool'){
      if(liveThinkWrap) liveThinkWrap.style.display='';
      curReason = null; // close the current reasoning block so later thinking lands after this tool
      const el = document.createElement('details');
      el.className = 'toolcall'; el.open = true;
      el.innerHTML = '<summary>▶ '+esc(ev.tool)+' …</summary>'+
        '<div class="args">'+esc(JSON.stringify(ev.arguments))+'</div>'+
        '<pre class="result">running…</pre>';
      if(liveTimeline) liveTimeline.appendChild(el); pendingSteps.push({ tool: ev.tool, el });
      if(liveStatus) liveStatus.textContent = 'running '+ev.tool+'…';
      if(ev.tool==='simulate' || ev.tool==='compare_variants'){
        STATE.liveSims.push({ tool: ev.tool, arguments: ev.arguments, result: null, ts: Date.now() });
        if(STATE.chatTab==='sims') renderSimsCombined();
      }
      autoscroll();
    }
    else if(ev.type==='toolResult'){
      const i = pendingSteps.findIndex(s => s.tool===ev.tool);
      const s = i>=0 ? pendingSteps.splice(i,1)[0] : null;
      if(s){ s.el.querySelector('summary').textContent = ev.tool+' ✓'; s.el.querySelector('.result').textContent = ev.result; s.el.open = false; }
      if(ev.tool==='simulate' || ev.tool==='compare_variants'){
        const rec = (STATE.liveSims||[]).slice().reverse().find(r => r.tool===ev.tool && r.result===null);
        if(rec){ try { rec.result = JSON.parse(ev.result); } catch(_){ rec.result = { raw: ev.result }; } }
        if(STATE.chatTab==='sims') renderSimsCombined();
      }
      autoscroll();
    }
    else if(ev.type==='monitor'){
      // The loop monitor stepped in: render a distinct inline note so the operator can see the
      // supervisor's reasoning. A 'steer' nudges the primary; a 'wrapup' forces it to conclude.
      const isWrap = ev.action==='wrapup';
      const label = isWrap ? 'Loop monitor — forcing wrap-up' : 'Loop monitor — steering';
      // Show the monitor's reasoning AND the concrete instruction it injected into the primary, so
      // the operator sees the full thought, not just the terse one-line steer.
      const parts = [];
      if(ev.reason) parts.push('<div class="mon-reason">'+esc(ev.reason)+'</div>');
      if(!isWrap && ev.steer) parts.push('<div class="mon-steer">→ primary: '+esc(ev.steer)+'</div>');
      const detail = parts.length ? parts.join('') : esc(isWrap ? (ev.reason||'') : (ev.steer || ev.reason || ''));
      log.insertAdjacentHTML('beforeend',
        '<div class="bub monitor"><div class="who">🔍 '+esc(label)+'</div>'+detail+'</div>');
      autoscroll();
    }
    else if(ev.type==='done'){
      drawChat(ev.turns);
      const ds = ev.dataset || {};
      hint.textContent = (ev.rounds!=null?('round '+ev.rounds+' · '):'') +
        (ds.instances!=null?(ds.instances+' instances · '+ds.jobs+' jobs · '+ds.incidents+' incidents'):'');
      // Refresh the tab list so the active chat's last-message time + count update.
      loadSessionsQuiet(ws, proc, STATE.sessionId);
      if(STATE.chatTab==='debug') loadDebug(ws, proc);
      // The persisted transcript now holds this turn's runs — reload them and drop the live copy
      // so the Simulations tab shows each run exactly once.
      STATE.liveSims = [];
      if(STATE.chatTab==='sims') loadSims(ws, proc);
    }
    else if(ev.type==='error'){
      errored = true;
      if(pend) pend.remove();
      log.insertAdjacentHTML('beforeend', chatErrorHtml(ev.message));
    }
  }

  try {
    const resp = await opts.fetchStream();
    if(resp.status===404 && opts.quietMissing){
      // Nothing live to reattach to — the turn finished. Drop the optimistic bubbles and reload
      // the persisted transcript so the completed answer shows.
      if(pend) pend.remove();
      try { const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):'')); drawChat(r.turns); } catch(e){}
      return;
    }
    if(!resp.ok || !resp.body){
      let m = 'stream failed ('+resp.status+')';
      try { const j = await resp.json(); m = j.error || m; } catch(e){}
      throw new Error(m);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', finished = false;
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while((idx = buf.indexOf('\n\n')) >= 0){
        const frame = buf.slice(0, idx); buf = buf.slice(idx+2);
        const dataLine = frame.split('\n').find(l => l.startsWith('data:'));
        if(!dataLine) continue;
        const payload = dataLine.slice(5).trim();
        if(!payload) continue;
        let ev; try { ev = JSON.parse(payload); } catch(e){ continue; }
        // A single malformed/unexpected event must never take down the whole stream loop
        // (which previously could leave the page blank and the button stuck on "Steer").
        try { handleEvent(ev); } catch(err){ console.error('chat event handler failed', err, ev); }
        if(ev.type==='done' || ev.type==='error') finished = true;
      }
    }
    if(!finished){
      // Stream closed without a terminal event — fall back to the persisted transcript.
      try { const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):'')); drawChat(r.turns); }
      catch(e){ if(pend) pend.remove(); }
    }
  } catch(e){
    errored = true;
    if(pend) pend.remove();
    log.insertAdjacentHTML('beforeend', chatErrorHtml(e.message||e));
  } finally {
    setChatBusy(false);
    if(errored && opts.onErrorRestore) opts.onErrorRestore();
    box.focus();
    if(wrap) wrap.style.display = 'none';
  }
}

// Refresh the tab list (metadata only) without reloading the chat log — used after a turn
// completes so the active chat's timestamp and message count update in place.
async function loadSessionsQuiet(ws, proc, keepId){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions');
    STATE.sessions = r.sessions || [];
    if(keepId) STATE.sessionId = keepId;
    drawSessions(ws, proc);
    applyPersonaState();
  } catch(e){ /* tab refresh is best-effort */ }
}

// Ask an in-flight investigation to stop and report its findings so far. The live bubble keeps
// streaming — the wrap-up answer arrives as further `answer` events.
async function wrapUpChat(ws, proc){
  const wrap = $('#chatWrapup'); if(wrap) wrap.disabled = true;
  const st = $('#liveStatus'); if(st) st.textContent = 'wrapping up — reporting findings so far…';
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/wrapup'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), { method:'POST' });
    $('#chatHint').textContent = 'asked the droid to wrap up…';
  } catch(e){ $('#chatHint').textContent = 'wrap-up request failed: '+(e.message||e); }
}

async function saveChatPrompt(){
  const text = $('#chatBox').value.trim();
  if(!text){ $('#chatHint').textContent = 'nothing in the compose box to save'; return; }
  const name = window.prompt('Name this prompt:');
  if(name==null) return;
  const id = (name.trim()||'prompt').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || ('prompt-'+Date.now());
  try {
    await api('/api/chat-prompts', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ id, name: name.trim()||id, text })
    });
    await loadChatPrompts();
    $('#chatHint').textContent = 'saved prompt “'+(name.trim()||id)+'”';
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function resetChat(ws, proc){
  if(!window.confirm('Forget this conversation?')) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/reset'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), { method:'POST' });
    drawChat([]); $('#chatHint').textContent = '';
    loadSessionsQuiet(ws, proc, STATE.sessionId);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function renderWsModel(url){
  const el = document.getElementById('wsModel');
  if(!el || typeof BpmnJS === 'undefined'){ if(el) el.innerHTML='<p class="muted" style="padding:12px">viewer unavailable</p>'; return; }
  try {
    const xml = await (await fetch(url)).text();
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(await ensureBpmnLayout(xml));
    viewer.get('canvas').zoom('fit-viewport', 'auto');
  } catch(e){ el.innerHTML = '<p class="err" style="padding:12px">could not render model: '+esc(e.message||e)+'</p>'; }
}

// Reveal the persistent cockpit pane. It is never destroyed — only hidden — so the chat view,
// selected session/tab, and any half-typed prompt are retained across navigation. If it has never
// been opened this session, reopen the last process used (persisted) or invite the operator to pick.
function showCockpit(){
  STATE.view='cockpit'; setActive();
  const host = cockpitHost();
  $('#viewHost').style.display='none'; host.style.display='';
  if(host.dataset.ready==='1') return; // already rendered — just reveal, state intact
  let last=null; try { last = JSON.parse(localStorage.getItem('processos.lastCockpit')||'null'); } catch(e){}
  if(last && last.ws && last.proc) return renderWorkspace(last.ws, last.proc);
  host.innerHTML = '<h1>Cockpit</h1>'+
    '<p class="lede">The investigation surface for a process — chat with the droid about its traces, fork what-if variants, and prove them on the recorded dataset.</p>'+
    '<p class="muted">Open a process to begin: pick one from <a onclick="showView(\'processes\')" style="color:#a5b4fc;cursor:pointer">Processes</a>.</p>';
}

// Show a non-cockpit view: hide the cockpit pane, reveal the view pane, then run its renderer.
function showView(v){
  $('#cockpitHost').style.display='none';
  $('#viewHost').style.display='';
  if(v==='processes') return renderProcesses();
  if(v==='prompts') return renderPrompts();
  if(v==='pairings') return renderPairings();
  if(v==='tools') return renderTools();
  if(v==='experiments') return renderExperiments();
  if(v==='sidecars') return renderSidecars();
  return renderConsole();
}

document.querySelectorAll('.nav a[data-view]').forEach(a => a.onclick = () => {
  const v = a.dataset.view;
  if(v==='cockpit') return showCockpit();
  showView(v);
});

// Map a ?view= param (used by other pages linking into the cockpit) to its renderer.
function renderView(v){
  if(v==='cockpit') return showCockpit();
  return showView(v);
}

// Boot: a workspace-process deep-link (?workspace=&process=) opens the
// investigation surface; a ?view= param selects a named rail view; otherwise the
// default console. The rail's sidecar status dot polls regardless of the view.
(function(){
  startLlamaDotPoll();
  startDepsPoll();
  const q = new URLSearchParams(location.search);
  const ws = q.get('workspace'), proc = q.get('process');
  if(ws && proc) renderWorkspace(ws, proc);
  else renderView(q.get('view'));
})();
</script>
