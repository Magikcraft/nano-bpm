      </div>
    </div>`;
  if(p.hasModel) renderWsModel('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/model');
  // Mark the cockpit pane ready & remember this process so the rail's Cockpit item can reopen it
  // (after a reload) and so re-selecting Cockpit just reveals the preserved DOM.
  cockpitHost().dataset.ready = '1';
  cockpitHost().dataset.key = ws+'\u0000'+proc;
  try { localStorage.setItem('processos.lastCockpit', JSON.stringify({ws, proc})); } catch(e){}
  STATE.ws = ws; STATE.wsProc = proc; STATE.prompts = []; STATE.sessionId = null;
  STATE.chatTab = 'chat';
  applyChatFont();
  labelSendButton();
  refreshPythonLabel();
  await loadChatPrompts();
  await loadPersonas();
  await loadSessions(ws, proc);
  $('#chatNew').onclick = () => newSession(ws, proc);
  wireTraceImport(ws, proc);
  $('#tabChat').onclick = () => switchChatTab('chat', ws, proc);
  $('#tabSims').onclick = () => switchChatTab('sims', ws, proc);
  $('#tabDebug').onclick = () => switchChatTab('debug', ws, proc);
  wireExportMenu(ws, proc);
  $('#chatSend').onclick = () => submitCompose(ws, proc);
  $('#chatSendMenu').onclick = (e) => { e.stopPropagation(); toggleProfileMenu(); };
  $('#chatWrapup').onclick = () => wrapUpChat(ws, proc);
  $('#wsObjSave').onclick = () => saveObjective(ws, proc, p);
  $('#chatBox').addEventListener('keydown', e => {
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); submitCompose(ws, proc); return; }
    // Plain Enter sends; Shift+Enter inserts a newline (falls through to default).
    if(e.key==='Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); submitCompose(ws, proc); return; }
    const box = e.target;
    // Shell-style history: Up recalls earlier prompts only when the caret is on the
    // first line; Down moves forward only when it's on the last line. A plain caret
    // (no selection, no modifier) so normal multi-line editing is untouched.
    if(e.key==='ArrowUp' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && box.selectionStart===box.selectionEnd){
      if(box.value.slice(0, box.selectionStart).indexOf('\n') === -1){ if(historyPrev(box)) e.preventDefault(); }
    } else if(e.key==='ArrowDown' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && box.selectionStart===box.selectionEnd && STATE.promptHistIdx!==null){
      if(box.value.slice(box.selectionEnd).indexOf('\n') === -1){ if(historyNext(box)) e.preventDefault(); }
    }
  });
  $('#chatFontDown').onclick = () => bumpChatFont(-1);
  $('#chatFontUp').onclick = () => bumpChatFont(1);
  $('#chatPrompt').onchange = e => {
    const pr = (STATE.prompts||[]).find(x => x.id===e.target.value);
    if(pr){ $('#chatBox').value = pr.text; $('#chatBox').focus(); }
    e.target.value = '';
  };
  $('#chatSave').onclick = saveChatPrompt;
  $('#chatReset').onclick = () => resetChat(ws, proc);
}

// ── chat text size (user-adjustable, persisted) ──────────────────────────────
function applyChatFont(){
  const px = Math.min(24, Math.max(11, parseInt(localStorage.getItem('processos.chatFont')||'15', 10)||15));
  // Set on the .chat container so both the transcript (.chatlog .bub) and the compose box
  // (.compose textarea) inherit one font size and resize together.
  const chat = $('#chatLog') && $('#chatLog').closest('.chat');
  if(chat) chat.style.setProperty('--chat-font', px+'px');
  return px;
}
function bumpChatFont(dir){
  const px = Math.min(24, Math.max(11, applyChatFont() + dir*1));
  localStorage.setItem('processos.chatFont', String(px));
  applyChatFont();
}

// ── Export the investigation transcript ──────────────────────────────────────
function wireExportMenu(ws, proc){
  const btn = $('#chatExport'), menu = $('#chatExportMenu');
  if(!btn || !menu) return;
  btn.onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; };
  menu.querySelectorAll('button[data-mode]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); menu.hidden = true; exportInvestigation(ws, proc, b.dataset.mode, b.dataset.format); };
  });
  document.addEventListener('click', () => { menu.hidden = true; });
}
async function exportInvestigation(ws, proc, mode, format){
  const sid = STATE.sessionId;
  if(!sid){ window.alert('No chat session to export yet.'); return; }
  const base = '/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)
    + '/chat/sessions/'+encodeURIComponent(sid);
  // The psychological trace is a single shareable .zip (its own endpoint); the chat/debug
  // transcripts are markdown/text via the export endpoint.
  const url = mode === 'trace'
    ? base + '/trace'
    : base + '/export?mode='+encodeURIComponent(mode)+'&format='+encodeURIComponent(format);
  try {
    const r = await fetch(url);
    if(!r.ok){ window.alert('Export failed ('+r.status+')'); return; }
    const blob = await r.blob();
    const cd = r.headers.get('content-disposition') || '';
    const m = /filename="?([^"]+)"?/.exec(cd);
    const fallback = mode === 'trace' ? 'psych-trace.zip' : ('investigation-'+mode+'.'+(format==='txt'?'txt':'md'));
    const name = m ? m[1] : fallback;
    const a = document.createElement('a');
    const href = URL.createObjectURL(blob);
    a.href = href; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(() => URL.revokeObjectURL(href), 1000);
  } catch(e){ window.alert('Export failed: '+(e.message||e)); }
}

// ── Import a shared psychological trace (.zip) ────────────────────────────────
function wireTraceImport(ws, proc){
  const btn = $('#chatImport'), input = $('#chatImportFile');
  if(!btn || !input) return;
  btn.onclick = () => input.click();
  input.onchange = async () => {
    const file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    const prev = btn.textContent;
    btn.disabled = true; btn.textContent = 'Importing…';
    try {
      const buf = await file.arrayBuffer();
      const url = '/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/traces/import';
      const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/zip' }, body: buf });
      const data = await r.json().catch(() => ({}));
      if(!r.ok){ window.alert('Import failed: '+(data.error || r.status)); return; }
      await loadSessions(ws, proc, data.sessionId);
    } catch(e){ window.alert('Import failed: '+(e.message||e)); }
    finally { btn.disabled = false; btn.textContent = prev; }
  };
}

// ── Chat / Simulations / Debug tab switcher ──────────────────────────────────
function switchChatTab(tab, ws, proc){
  STATE.chatTab = tab;
  const onChat = tab === 'chat', onSims = tab === 'sims', onDebug = tab === 'debug';
  const log = $('#chatLog'), sims = $('#chatSims'), dbg = $('#chatDebug'), compose = $('#chatCompose');
  if(log) log.style.display = onChat ? '' : 'none';
  if(compose) compose.style.display = onChat ? '' : 'none';
  if(sims) sims.style.display = onSims ? '' : 'none';
  if(dbg) dbg.style.display = onDebug ? '' : 'none';
  const tc = $('#tabChat'), ts = $('#tabSims'), td = $('#tabDebug');
  if(tc) tc.classList.toggle('active', onChat);
  if(ts) ts.classList.toggle('active', onSims);
  if(td) td.classList.toggle('active', onDebug);
  if(onSims) loadSims(ws, proc);
  if(onDebug) loadDebug(ws, proc);
}

// Render the Alternate Reality Engine runs for this session — persisted runs (whole transcript)
// plus any from the in-flight turn (not yet saved). Each run shows its variant model(s) and the
// fidelity scorecard, so the operator can follow the droid's exploration.
function renderSimsCombined(){
  const host = $('#chatSims'); if(!host) return;
  const sid = STATE.sessionId;
  const live = (STATE.liveSimsSid === sid && Array.isArray(STATE.liveSims)) ? STATE.liveSims : [];
  const persisted = Array.isArray(STATE.simPersisted) ? STATE.simPersisted : [];
  host.innerHTML = renderSims(persisted.concat(live));
  observeModelCards(host);
}

async function loadSims(ws, proc){
  const host = $('#chatSims'); if(!host) return;
  const sid = STATE.sessionId;
  if(!sid){ STATE.simPersisted = []; renderSimsCombined(); return; }
  try {
    const data = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(sid)+'/simulations');
    if(STATE.sessionId !== sid) return; // session switched while fetching
    STATE.simPersisted = (data && data.runs) || [];
  } catch(e){ if(!Array.isArray(STATE.simPersisted)) STATE.simPersisted = []; }
  renderSimsCombined();
}

function fmtSimMs(n){ if(n==null||isNaN(n)) return '\u2014'; n = Number(n); return n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'s' : Math.round(n)+'ms'; }
function fmtSimPct(r){ if(r==null||isNaN(r)) return '\u2014'; return Math.round(Number(r)*100)+'%'; }

// The outcome panel for one candidate's scorecard — the headline fidelity numbers, or the deploy
// error when the variant didn't parse.
function scorecardSummaryHtml(sc){
  if(!sc || typeof sc !== 'object') return '<div class="sc sc-pending">awaiting scorecard\u2026</div>';
  if(sc.deployError || sc.feasible === false){
    return '<div class="sc sc-bad"><span class="sc-verdict">did not deploy</span>'+
      '<div class="sc-err">'+esc(sc.deployError || (sc.report && sc.report.error) || 'infeasible')+'</div>'+
      (sc.fixHint?'<div class="sc-hint">'+esc(sc.fixHint)+'</div>':'')+'</div>';
  }
  const rep = sc.report || {};
  const rows = [
    ['fidelity', esc(sc.fidelityTier || '\u2014')],
    ['conserved', (rep.conserved!=null?(rep.conserved+'/'+(rep.instancesTotal!=null?rep.instancesTotal:'?')):'\u2014')+' \u00b7 '+fmtSimPct(rep.conservedRate)],
    ['avg latency', fmtSimMs(rep.avgE2eLatencyMs)],
    ['p99 latency', fmtSimMs(rep.p99E2eLatencyMs)],
  ];
  if(sc.requiresNewWorkers && sc.requiresNewWorkers.length) rows.push(['needs workers', esc(sc.requiresNewWorkers.join(', '))]);
  if(sc.mockedWorkers && sc.mockedWorkers.length) rows.push(['mocked', esc(sc.mockedWorkers.join(', '))]);
  if(rep.divergentKeys && rep.divergentKeys.length) rows.push(['divergent', esc(rep.divergentKeys.map(k => (k && k.key) || JSON.stringify(k)).join(', '))]);
  const cells = rows.map(([k,v]) => '<div class="sc-cell"><span class="sc-k">'+k+'</span><span class="sc-v">'+v+'</span></div>').join('');
  return '<div class="sc"><div class="sc-grid">'+cells+'</div>'+(sc.confidence?'<div class="sc-conf">'+esc(sc.confidence)+'</div>':'')+'</div>';
}

// Render simulation runs: one <details> per simulate/compare_variants call, each with its
// variant model card(s) (reusing the suggested-model renderer) beside the fidelity scorecard.
function renderSims(runs){
  if(!runs || !runs.length) return '<div class="empty">No simulations yet. In the Experiment Designer persona, the droid forks the model and replays it against the dataset; each run appears here with its variant and scorecard.</div>';
  return runs.map((run, i) => {
    let args = run.arguments; if(typeof args === 'string'){ try { args = JSON.parse(args); } catch(_){ args = {}; } }
    let res = run.result; if(typeof res === 'string'){ try { res = JSON.parse(res); } catch(_){ res = { raw: run.result }; } }
    const ts = run.ts ? '<span class="dbg-ts" title="'+esc(new Date(run.ts).toLocaleString())+'">'+esc(fmtClock(run.ts))+'</span>' : '';
    let candidates = []; // {name, xml, sc, best}
    if(run.tool === 'compare_variants'){
      const argMap = {};
      ((args && args.candidates) || []).forEach(c => { if(c && c.name) argMap[c.name] = c.model; });
      const best = res && res.best;
      candidates = ((res && res.candidates) || []).map(c => ({ name: c.name, xml: argMap[c.name], sc: c, best: best && c.name === best }));
      if(!candidates.length){ candidates = ((args && args.candidates) || []).map(c => ({ name: c.name, xml: c.model, sc: null, best: false })); }
    } else {
      const sc = res ? (res.scorecard || res) : null;
      candidates = [{ name: (args && args.name) || (sc && sc.name) || 'variant', xml: args && args.model, sc, best: false }];
    }
    const head = '<div class="sim-head"><span class="sim-tool">'+(run.tool==='compare_variants'?'compare variants':'simulate')+'</span>'+
      '<span class="sim-meta">'+candidates.length+' model'+(candidates.length===1?'':'s')+
      (res && res.datasetSize!=null ? (' \u00b7 '+res.datasetSize+' instances replayed') : '')+'</span>'+ts+'</div>';
    const note = (res && res.replayable === false)
      ? '<div class="sim-note">'+esc(res.note || 'not replayable \u2014 needs Tier-2 recorded-input capture (c8 nano --capture)')+'</div>' : '';
    const body = candidates.map(c => {
      const card = c.xml ? modelCardHtml({ name: c.name, xml: c.xml })
        : '<div class="sim-baseline">'+esc(c.name||'baseline')+' <span class="dim">(current model)</span></div>';
      return '<div class="simcand'+(c.best?' best':'')+'">'+(c.best?'<span class="sim-badge">best</span>':'')+card+scorecardSummaryHtml(c.sc)+'</div>';
    }).join('');
    return '<details class="simrun"'+(i===runs.length-1?' open':'')+'><summary>'+head+'</summary>'+note+body+'</details>';
  }).join('');
}

async function loadDebug(ws, proc){
  const host = $('#chatDebug'); if(!host) return;
  const sid = STATE.sessionId;
  if(!sid){ host.innerHTML = '<div class="empty">Start a conversation to capture a request.</div>'; return; }
  // Show in-flight payloads for this session immediately (the endpoint only fills in once the
  // turn finishes), so switching to Debug while the droid is thinking isn't a blank panel.
  const live = (STATE.liveDebugSid === sid && Array.isArray(STATE.liveDebug)) ? STATE.liveDebug : [];
  if(live.length) host.innerHTML = renderDebug({ requests: live });
  try {
    const data = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(sid)+'/debug');
    if(STATE.sessionId !== sid) return; // session switched while fetching
    const reqs = (data && data.requests) || [];
    // Prefer the persisted payloads, but don't clobber a live view with an empty endpoint.
    if(reqs.length || !live.length) host.innerHTML = renderDebug(data);
  } catch(e){ if(!live.length) host.innerHTML = '<div class="empty">'+esc(e.message||e)+'</div>'; }
}

// Render the captured request payloads (one <details> per round) showing the full message
// array the model received: system prompt, prior transcript, tool specs and the latest message.
function renderDebug(data){
  const reqs = (data && data.requests) || [];
  if(!reqs.length) return '<div class="empty">No request captured for this chat yet. Send a message and it will appear here.</div>';
  const roleClass = r => ({system:'system', user:'user', assistant:'assistant', tool:'tool'}[r] || 'assistant');
  return reqs.map((entry, idx) => {
    if(entry.kind==='monitor') return renderMonitorDebug(entry, idx);
    const b = entry.body || {};
    const msgs = b.messages || [];
    const tools = b.tools || [];
    const head = 'Round '+(entry.round!=null?entry.round:(idx+1))+
      ' <span class="dim">'+esc(b.model||'')+(b.temperature!=null?(' · temp '+esc(b.temperature)):'')+(b.max_tokens!=null?(' · max_tokens '+esc(b.max_tokens)):'')+' · '+msgs.length+' messages</span>'+
      (entry.ts?'<span class="dbg-ts" title="'+esc(new Date(entry.ts).toLocaleString())+'">'+esc(fmtClock(entry.ts))+'</span>':'');
    const copyJson = esc(JSON.stringify(b, null, 2));
    // Resolve tool_call_id → tool name so a tool RESULT message can name the tool it answers.
    const callName = {};
    msgs.forEach(m => (m.tool_calls||[]).forEach(c => { if(c.id && c.function && c.function.name) callName[c.id] = c.function.name; }));
    const msgHtml = msgs.map(m => {
      const rc = roleClass(m.role);
      // Title hint: which tool(s) this message calls (assistant) or returns (tool role).
      let toolHint = '';
      if(m.tool_calls && m.tool_calls.length){
        toolHint = m.tool_calls.map(c => c.function && c.function.name).filter(Boolean).join(', ');
      } else if(m.role==='tool' && m.tool_call_id){
        toolHint = callName[m.tool_call_id] || '';
      }
      let body = '';
      if(m.content) body += '<pre>'+esc(typeof m.content==='string'?m.content:JSON.stringify(m.content,null,2))+'</pre>';
      if(m.tool_calls && m.tool_calls.length){
        body += '<div class="meta">tool_calls: '+esc(m.tool_calls.map(c => (c.function&&c.function.name)+'('+((c.function&&c.function.arguments)||'')+')').join(', '))+'</div>';
      }
      if(m.tool_call_id) body += '<div class="meta">tool_call_id: '+esc(m.tool_call_id)+'</div>';
      if(!body) body = '<pre>(empty)</pre>';
      return '<details class="dbg-msg"><summary><span class="role '+rc+'">'+esc(m.role||'?')+'</span>'+
        (toolHint?'<span class="dbg-tool">'+esc(toolHint)+'</span>':'')+'</summary>'+body+'</details>';
    }).join('');
    const toolHtml = tools.length ? '<details class="dbg-tools"><summary>'+tools.length+' tool'+(tools.length===1?'':'s')+' offered</summary><div class="meta">'+
      esc(tools.map(t => (t.function&&t.function.name)+' — '+((t.function&&t.function.description)||'').split('\n')[0]).join('\n'))+'</div></details>' : '';
    return '<details class="dbg-round">'+
      '<summary>'+head+'</summary>'+
      '<div class="dbg-actions"><button class="copybtn" title="Copy the full JSON payload" data-copy="'+copyJson+'">Copy JSON payload</button></div>'+
      msgHtml + toolHtml +
      '</details>';
  }).join('');
}

// Render one loop-monitor evaluation (the SECOND model). Amber/dashed and collapsed so it reads
// distinctly from the primary's rounds, showing the full verdict, exactly what (if anything) was
// injected into the primary, the monitor's raw reply, and the full request window it judged.
function renderMonitorDebug(entry, idx){
  const v = entry.verdict || {};
  const b = entry.body || {};
  const msgs = b.messages || [];
  const action = entry.action || 'none';
  const circling = !!v.circling;
  const verdictTag = circling ? '<span class="dbg-mon-circ">circling</span>' : '<span class="dbg-mon-ok">on track</span>';
  const head = '🔍 Loop monitor <span class="dbg-mon-act">'+esc(action)+'</span> '+verdictTag+
    ' <span class="dim">'+esc(b.model||'')+' · '+msgs.length+' messages</span>'+
    (entry.ts?'<span class="dbg-ts" title="'+esc(new Date(entry.ts).toLocaleString())+'">'+esc(fmtClock(entry.ts))+'</span>':'');
  let info = '';
  if(v.reason) info += '<div class="dbg-mon-row"><span class="dbg-mon-k">reason</span><span>'+esc(v.reason)+'</span></div>';
  if(v.steer) info += '<div class="dbg-mon-row"><span class="dbg-mon-k">steer</span><span>'+esc(v.steer)+'</span></div>';
  if(entry.injected){
    info += '<div class="dbg-mon-row dbg-mon-inj"><span class="dbg-mon-k">→ primary</span><span>'+esc(entry.injected)+'</span></div>';
  } else {
    info += '<div class="dbg-mon-row"><span class="dbg-mon-k">→ primary</span><span class="dim">nothing injected this round</span></div>';
  }
  const raw = entry.raw ? '<details class="dbg-msg"><summary><span class="role assistant">monitor reply</span></summary><pre>'+esc(entry.raw)+'</pre></details>' : '';
  const reqHtml = msgs.map(m => '<details class="dbg-msg"><summary><span class="role '+({system:'system',user:'user',assistant:'assistant',tool:'tool'}[m.role]||'assistant')+'">'+esc(m.role||'?')+'</span></summary><pre>'+esc(typeof m.content==='string'?m.content:JSON.stringify(m.content,null,2))+'</pre></details>').join('');
  const copyJson = esc(JSON.stringify(entry, null, 2));
  return '<details class="dbg-round dbg-mon">'+
    '<summary>'+head+'</summary>'+
    '<div class="dbg-actions"><button class="copybtn" title="Copy the full monitor record" data-copy="'+copyJson+'">Copy JSON</button></div>'+
    info+
    '<details class="dbg-mon-sent"><summary>request sent to monitor ('+msgs.length+' messages)</summary>'+reqHtml+raw+'</details>'+
    '</details>';
}

// The Send button and Cmd/Ctrl+Enter route to steering while a turn is in flight,
// and to a fresh investigation otherwise.
function submitCompose(ws, proc){
  if(STATE.chatWarming) return;   // a sidecar is still starting up — Send is disabled
  if(STATE.chatBusy) steerChat(ws, proc);
  else sendChat(ws, proc);
}

// Queue a steering instruction for the running turn. Optimistically shows it as a
// user bubble (the persisted transcript redraws on `done`), clears the box, and
// does NOT open a new stream — the live stream picks the instruction up.
async function steerChat(ws, proc){
  const box = $('#chatBox'); const msg = box.value.trim();
  if(!msg) return;
  const log = $('#chatLog'); const hint = $('#chatHint');
  pushPromptHistory(msg);
  const pend = $('#chatPending');
  if(pend) pend.insertAdjacentHTML('beforebegin', chatBub({ role:'user', text:msg, ts: Date.now() }));
  else if(log) log.insertAdjacentHTML('beforeend', chatBub({ role:'user', text:msg, ts: Date.now() }));
  if(log) log.scrollTop = log.scrollHeight;
  box.value = '';
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/steer'+(STATE.sessionId?('?session='+encodeURIComponent(STATE.sessionId)):''), {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg })
    });
    if(hint) hint.textContent = 'steering the droid…';
  } catch(e){
    box.value = msg; // restore so the operator can retry
    if(hint) hint.textContent = 'steer failed: '+(e.message||e);
  }
}

// ── compose prompt history (shell-style up/down recall) ──────────────────────
function pushPromptHistory(msg){
  STATE.promptHistory = STATE.promptHistory || [];
  if(STATE.promptHistory[STATE.promptHistory.length-1] !== msg) STATE.promptHistory.push(msg);
  STATE.promptHistIdx = null; STATE.promptDraft = '';
}
function placeCursorEnd(box){ const n = box.value.length; box.selectionStart = box.selectionEnd = n; }
// Up on the first line steps back through earlier prompts (saving the current draft);
// Down on the last line steps forward, restoring the draft past the newest entry.
function historyPrev(box){
  const h = STATE.promptHistory || [];
  if(!h.length) return false;
  if(STATE.promptHistIdx === null){ STATE.promptDraft = box.value; STATE.promptHistIdx = h.length; }
  if(STATE.promptHistIdx > 0){ STATE.promptHistIdx--; box.value = h[STATE.promptHistIdx]; placeCursorEnd(box); }
  return true;
}
function historyNext(box){
  const h = STATE.promptHistory || [];
  if(STATE.promptHistIdx === null) return false;
  if(STATE.promptHistIdx < h.length - 1){ STATE.promptHistIdx++; box.value = h[STATE.promptHistIdx]; }
  else { STATE.promptHistIdx = null; box.value = STATE.promptDraft || ''; }
  placeCursorEnd(box);
  return true;
}

// ── profile picker on the split Send button ──────────────────────────────────
// The caret beside "Investigate with …" drops a menu of every configured LLM profile so the
// operator can switch the model that answers the next message without opening Settings.
async function toggleProfileMenu(){
  const menu = $('#chatProfileMenu'); const caret = $('#chatSendMenu');
  if(!menu) return;
  if(!menu.hidden){ closeProfileMenu(); return; }
  let s;
  try { s = await api('/api/settings'); }
  catch(e){ $('#chatHint').textContent = 'could not load profiles: '+(e.message||e); return; }
  // A sidecar profile is only a usable option once its model is actually on disk. Pull the
  // download/run state so configured-but-not-downloaded sidecars are hidden from the menu, and
  // so each listed sidecar can show a status light (green = running/ready, blue = starting).
  let avail = null;
  let phaseById = {};
  try {
    const st = await api('/api/llama/status') || {};
    avail = new Set();
    (st.models||[]).forEach(m => { if(m && m.profileId && m.downloaded) avail.add(m.profileId); });
    (st.sidecars||[]).forEach(x => {
      if(!x || !x.profileId) return;
      if(x.phase==='ready') avail.add(x.profileId);
      phaseById[x.profileId] = x.phase || '';
    });
  } catch(e){ avail = null; }   // status unavailable → don't hide anything
  // Keep remote profiles (no local download) and any sidecar whose model is downloaded/ready.
  const profiles = (s.profiles||[]).filter(p => !p.sidecar || !avail || avail.has(p.id));
  // The model already acting as the partner (pair/monitor) can't also be the primary you send to.
  const partners = partnerProfileIds();
  // Map a sidecar's phase to one of the shared status-dot classes; running sidecars get the
  // green "on" light the operator asked for. Non-running sidecars (downloaded but stopped) and
  // remote profiles get no light.
  const dotFor = (p) => {
    if(!p.sidecar) return '';
    const ph = phaseById[p.id];
    if(ph==='ready') return '<span class="dot-status on mi-dot" title="sidecar running"></span>';
    if(ph==='starting' || ph==='loading' || ph==='downloading')
      return '<span class="dot-status loading mi-dot" title="sidecar '+esc(ph)+'…"></span>';
    return '<span class="dot-status off mi-dot" title="sidecar stopped"></span>';
  };
  menu.innerHTML = profiles.length ? profiles.map(p => {
    const active = p.id===s.activeProfile;
    const isPartner = partners.has(p.id) && !active;
    return '<button data-id="'+esc(p.id)+'"'+(active?' class="on"':'')+(isPartner?' disabled title="In use as this investigation\'s partner"':'')+'>'+
      dotFor(p)+
      '<span class="mi-name">'+esc(p.name||p.id)+'</span>'+
      (p.model?' <span class="mi-model">'+esc(p.model)+'</span>':'')+
      (active?' <span class="mi-on">✓</span>':'')+
      (isPartner?' <span class="mi-model">partner</span>':'')+'</button>';
  }).join('') : '<div class="mi-empty">No available models — download a sidecar model or add a remote profile</div>';
  menu.querySelectorAll('button[data-id]:not([disabled])').forEach(b => {
    b.onclick = () => selectProfile(b.getAttribute('data-id'), b.getAttribute('data-id')===s.activeProfile);
  });
  menu.hidden = false; caret.setAttribute('aria-expanded','true');
  setTimeout(() => document.addEventListener('click', closeProfileMenu, { once:true }), 0);
}
function closeProfileMenu(){
  const menu = $('#chatProfileMenu'); const caret = $('#chatSendMenu');
  if(menu) menu.hidden = true;
  if(caret) caret.setAttribute('aria-expanded','false');
}

// Pull <think>/<thinking> reasoning out of the answer text so it can be shown collapsed,
// returning { think, answer } where answer is the cleaned prose.
function splitThinking(text){
  let t = text || '';
  let think = '';
  // Greedy across the whole string; tolerate an unterminated trailing <think> (streaming).
  t = t.replace(/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/gi, (_, body) => { think += (think?'\n\n':'')+body.trim(); return ''; });
  const open = t.match(/<think(?:ing)?>([\s\S]*)$/i);
  if(open){ think += (think?'\n\n':'')+open[1].trim(); t = t.slice(0, open.index); }
  return { think: think.trim(), answer: t.trim() };
}

function droidName(){ return STATE.profileName || 'Droid'; }
// Render an error as a droid bubble. Context-window exhaustion (the most common hard failure
// for local models on long investigations) is detected and explained, so the operator knows to
// start a fresh chat or trim context rather than staring at a raw provider error.
function chatErrorHtml(msg){
  const raw = (msg==null ? '' : String(msg));
  const low = raw.toLowerCase();
  const ctx = low.includes('context') && (low.includes('length') || low.includes('exceed') || low.includes('window') || low.includes('too long') || low.includes('maximum'));
  let body = '<span style="color:#fca5a5">'+esc(raw)+'</span>';
  if(ctx){
    body = '<span style="color:#fca5a5">⚠ The model ran out of context (its input window filled up).</span>'+
      '<div style="color:#a1a1aa;font-size:12px;margin-top:4px">This investigation got too long for the model. Start a new chat, or switch to a model with a larger context window, then continue.</div>'+
      '<details style="margin-top:4px"><summary style="cursor:pointer;color:#71717a;font-size:11px">details</summary><span style="color:#a1a1aa;font-size:11px">'+esc(raw)+'</span></details>';
  }
  return '<div class="bub droid"><div class="who">'+droidWhoHtml()+'</div>'+body+'</div>';
}

// The droid's bubble title. For a HISTORICAL turn we use the model that actually answered it
// (persisted server-side as t.model), so the byline doesn't re-label when the operator switches
// models later. For live/in-flight bubbles (no turnModel) we fall back to the active profile.
function droidWhoHtml(turnModel){
  if(turnModel){
    return esc('Droid') + ' <span class="who-model">('+esc(turnModel)+')</span>';
  }
  const name = STATE.profileName || 'Droid';
  const model = STATE.modelName || '';
  return esc(name) + (model ? ' <span class="who-model">('+esc(model)+')</span>' : '');
}

function chatBub(t){
  const time = t.ts ? '<span class="ts" title="'+esc(new Date(t.ts).toLocaleString())+'">'+esc(fmtTime(t.ts))+'</span>' : '';
  if(t.role==='user') return '<div class="bub user"><div class="who">You'+time+'</div>'+esc(t.text)+'</div>';
  let answer = t.text || '';
  // Prefer the backend's interleaved reasoning/tool timeline; fall back to splitting <think>
  // out of the answer + appending flat steps for any legacy turn without a `thought` array.
  let items = t.thought || [];
  if(!items.length){
    const sp = splitThinking(answer); answer = sp.answer;
    items = [];
    if(sp.think) items.push({ kind:'reasoning', text: sp.think });
    (t.steps||[]).forEach(s => items.push({ kind:'tool', tool:s.tool, arguments:s.arguments, result:s.result }));
  }
  let ti = 0; let toolCount = 0;
  const inner = items.map(it => {
    if(it.kind === 'tool'){
      ti++; toolCount++;
      return '<details class="toolcall"><summary>'+esc(it.tool)+' · '+ti+'</summary>'+
        '<div class="args">'+esc(JSON.stringify(it.arguments))+'</div>'+
        '<pre>'+esc(it.result)+'</pre></details>';
    }
    return '<div class="think-body md">'+mdToHtml(it.text)+'</div>';
  }).join('');
  const summary = 'Thinking' + (toolCount ? ' · '+toolCount+' tool call'+(toolCount===1?'':'s') : '');
  const thinkHtml = inner ? '<details class="think"><summary>'+esc(summary)+'</summary><div class="think-tl">'+inner+'</div></details>' : '';
  const copyBtn = answer ? '<button class="copybtn" title="Copy response" data-copy="'+esc(answer)+'">\u29C9</button>' : '';
  // Carry-forward: drop a quoted version of this answer into the composer, so the operator can hand
  // one model's conclusion to the next model (cross-provider refinement) on the following turn.
  const carryBtn = answer ? '<button class="carrybtn" title="Quote into composer for the next model" data-carry="'+esc(answer)+'">\u21AA</button>' : '';
  const modelsHtml = suggestedModelsHtml(items);
  if(t.role === 'pair'){
    const who = '<span class="pair-badge" title="Pair AI reviewer">\uD83E\uDD1D Pair AI'+(t.name?(' \u00B7 '+esc(t.name)):'')+'</span>';
    return '<div class="bub droid pair"><div class="who">'+who+copyBtn+carryBtn+time+'</div>'+thinkHtml+
      '<div class="answer md">'+(answer ? mdToHtml(answer) : (inner ? '' : '(no answer)'))+'</div>'+modelsHtml+'</div>';
  }
  return '<div class="bub droid"><div class="who">'+droidWhoHtml(t.model)+copyBtn+carryBtn+time+'</div>'+thinkHtml+
    '<div class="answer md">'+(answer ? mdToHtml(answer) : (inner ? '' : '(no answer)'))+'</div>'+modelsHtml+'</div>';
}

// ── Suggested-model cards ───────────────────────────────────────────────────
// The Experiment Designer proposes BPMN variants two ways: by passing them as the `model`
// argument of simulate / compare_variants, OR by AUTHORING them with edit_model (whose RESULT
// carries the new `model` XML). Surface every distinct candidate from either source as a tabbed
// (diagram / XML) card the operator can expand and download — otherwise an authored variant that
// was never simulated would leave no downloadable artefact.
function extractSuggestedModels(items){
  const out = [], seen = new Set();
  const add = (name, xml) => {
    if(typeof xml !== 'string') return;
    const x = xml.trim();
    if(!x || x.indexOf('<') === -1 || seen.has(x)) return;
    seen.add(x);
    out.push({ name: (name && String(name).trim()) || ('variant '+(out.length+1)), xml: x });
  };
  // A tool result may be a JSON string (persisted timeline) or an already-parsed object (live).
  const asObj = (r) => {
    if(r && typeof r === 'object') return r;
    if(typeof r === 'string'){ try { return JSON.parse(r); } catch(_){ return null; } }
    return null;
  };
  (items||[]).forEach(it => {
    if(it.kind !== 'tool') return;
    let a = it.arguments;
    if(typeof a === 'string'){ try { a = JSON.parse(a); } catch(_){ a = null; } }
    // Authored variants: edit_model returns { ok, model, appliedOps, ... }.
    if(it.tool === 'edit_model'){
      const r = asObj(it.result);
      if(r && typeof r.model === 'string'){
        const ops = Array.isArray(r.appliedOps) ? r.appliedOps : [];
        const name = (a && a.name) || (ops.length ? ('edited: '+ops[0]) : 'edited variant');
        add(name, r.model);
      }
    }
    if(!a || typeof a !== 'object') return;
    if(it.tool === 'simulate') add(a.name, a.model);
    else if(it.tool === 'compare_variants' && Array.isArray(a.candidates)){
      a.candidates.forEach(c => { if(c && typeof c === 'object') add(c.name, c.model); });
    }
  });
  return out;
}

function suggestedModelsHtml(items){
  const models = extractSuggestedModels(items);
  if(!models.length) return '';
  const cards = models.map(modelCardHtml).join('');
  const lbl = models.length === 1 ? '1 suggested model' : (models.length+' suggested models');
  return '<div class="models"><div class="models-lbl">'+esc(lbl)+'</div>'+cards+'</div>';
}

function modelCardHtml(m){

// LLM-authored variants are sometimes a bare <bpmn:process> fragment with no <bpmn:definitions>
// root ("failed to parse document as <bpmn:Definitions>"). Wrap such fragments in a synthesized
// definitions envelope (the inner elements keep their own xmlns decls) so bpmn-moddle has a valid
// root. Full documents (already containing <...:definitions>) pass through unchanged.
function ensureBpmnDefinitions(xml){
  const s = (xml || '').trim();
  if(!s || /<(\w+:)?definitions[\s>]/.test(s)) return xml;
  const body = s.replace(/^<\?xml[^>]*\?>\s*/i, '');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" ' +
    'xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" ' +
    'xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" ' +
    'xmlns:di="http://www.omg.org/spec/DD/20100524/DI" ' +
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ' +
    'xmlns:zeebe="http://camunda.org/schema/zeebe" ' +
    'targetNamespace="http://bpmn.io/schema/bpmn">\n' + body + '\n</bpmn:definitions>';
}

// --- ELK-based BPMN layout ------------------------------------------------------------------
// LLM-authored models carry either no DI or our server's simple hand-rolled DI (which can show
// crossing edges and overlapping labels). We re-lay-out every model with ELK (the Eclipse Layout
// Kernel, layered algorithm) which does proper crossing minimization, orthogonal edge routing and
// edge-label placement, then write fresh BPMN DI. This is authoritative: any incoming DI is
// stripped first so ELK's layout always wins. Falls back to bpmn-auto-layout, then to the input.

let _moddleHostViewer = null;
// A hidden bpmn-js instance purely to borrow its BpmnModdle (parse/serialize BPMN <-> objects).
function getBpmnModdle(){
  if(_moddleHostViewer) return _moddleHostViewer.get('moddle');
  if(typeof BpmnJS === 'undefined') return null;
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;left:-9999px;top:-9999px';
  document.body.appendChild(host);
  _moddleHostViewer = new BpmnJS({ container: host });
  return _moddleHostViewer.get('moddle');
}

// Default on-canvas dimensions per BPMN element type (matches bpmn-js conventions).
function elkNodeSize(type){
  if(/Task$|CallActivity$|SubProcess$/.test(type)) return { w: 100, h: 80 };
  if(/Gateway$/.test(type)) return { w: 50, h: 50 };
  return { w: 36, h: 36 }; // events
}

const ELK_GRAPH_OPTS = {
  'elk.algorithm': 'layered',
  'elk.direction': 'RIGHT',
  'elk.edgeRouting': 'ORTHOGONAL',
  'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
  'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF',
  'elk.layered.spacing.nodeNodeBetweenLayers': '70',
  'elk.layered.spacing.edgeNodeBetweenLayers': '30',
  'elk.spacing.nodeNode': '50',
  'elk.spacing.edgeNode': '25',
  'elk.spacing.edgeEdge': '20',
  'elk.spacing.edgeLabel': '8',
  'elk.layered.spacing.edgeEdgeBetweenLayers': '15',
  'elk.layered.mergeEdges': 'true'
};

// Lay out DI-less BPMN with ELK and return BPMN XML carrying fresh DI. Throws on any problem so the
// caller can fall back.
async function elkBpmnLayout(xml){
  if(typeof ELK === 'undefined') throw new Error('ELK unavailable');
  const moddle = getBpmnModdle();
  if(!moddle) throw new Error('moddle unavailable');

  const { rootElement: defs } = await moddle.fromXML(ensureBpmnDefinitions(xml));

  // Pick the process with the most flow elements (handles bare collaborations/pools loosely).
  const procs = (defs.rootElements || []).filter(e => e.$type === 'bpmn:Process' && (e.flowElements||[]).length);
  if(!procs.length) throw new Error('no process with flow elements');
  const proc = procs.sort((a,b)=> (b.flowElements.length - a.flowElements.length))[0];
  const fe = proc.flowElements || [];

  const isFlow = (e)=> e.$type === 'bpmn:SequenceFlow';
  const isBoundary = (e)=> e.$type === 'bpmn:BoundaryEvent';
  const byId = {}; fe.forEach(e => { byId[e.id] = e; });

  // ELK children = every non-flow, non-boundary node. Boundary events become SOUTH ports on host.
  const children = [];
  fe.filter(e => !isFlow(e) && !isBoundary(e)).forEach(e => {
    const sz = elkNodeSize(e.$type);
    children.push({ id: e.id, width: sz.w, height: sz.h, ports: [], layoutOptions: {} });
  });
  const childById = {}; children.forEach(c => { childById[c.id] = c; });

  fe.filter(isBoundary).forEach(be => {
    const hostId = be.attachedToRef && be.attachedToRef.id;
    const host = hostId && childById[hostId];
    if(!host){ // orphan boundary: fall back to a normal node
      const sz = elkNodeSize(be.$type);
      children.push({ id: be.id, width: sz.w, height: sz.h, ports: [], layoutOptions: {} });
      childById[be.id] = children[children.length-1];
      return;
    }
    host.layoutOptions['elk.portConstraints'] = 'FIXED_SIDE';
    host.ports.push({ id: be.id, width: 36, height: 36, layoutOptions: { 'elk.port.side': 'SOUTH' } });
  });

  // ELK edges from sequence flows. A flow's name becomes an edge label so ELK reserves room for it.
  const edges = [];
  fe.filter(isFlow).forEach(f => {
    const src = f.sourceRef && f.sourceRef.id;
    const tgt = f.targetRef && f.targetRef.id;
    if(!src || !tgt) return;
    const edge = { id: f.id, sources: [src], targets: [tgt] };
    const name = (f.name || '').trim();
    if(name){
      edge.labels = [{ id: f.id+'_lbl', text: name,
        width: Math.min(160, name.length * 6 + 12), height: 16,
        layoutOptions: { 'elk.edgeLabels.placement': 'CENTER' } }];
    }
    edges.push(edge);
  });

  const graph = { id: 'root', layoutOptions: ELK_GRAPH_OPTS, children, edges };
  const elk = new ELK();
  const res = await elk.layout(graph);

  // --- Write DI from the laid-out graph. ---
  const shapes = [];
  (res.children||[]).forEach(c => {
    const el = byId[c.id];
    const attrs = { id: c.id+'_di', bpmnElement: el,
      bounds: moddle.create('dc:Bounds', { x: c.x, y: c.y, width: c.width, height: c.height }) };
    if(el && el.$type === 'bpmn:ExclusiveGateway') attrs.isMarkerVisible = true;
    shapes.push(moddle.create('bpmndi:BPMNShape', attrs));
    // Boundary-event ports -> their own shapes, positioned absolutely on the host edge.
    (c.ports||[]).forEach(p => {
      const be = byId[p.id]; if(!be) return;
      shapes.push(moddle.create('bpmndi:BPMNShape', {
        id: p.id+'_di', bpmnElement: be,
        bounds: moddle.create('dc:Bounds', { x: c.x + p.x, y: c.y + p.y, width: p.width, height: p.height })
      }));
    });
  });

  const edgeDis = [];
  (res.edges||[]).forEach(e => {
    const el = byId[e.id]; if(!el) return;
    const sec = (e.sections && e.sections[0]) || null;
    const pts = [];
    if(sec){
      pts.push(sec.startPoint);
      (sec.bendPoints||[]).forEach(bp => pts.push(bp));
      pts.push(sec.endPoint);
    }
    const waypoint = pts.map(pt => moddle.create('dc:Point', { x: pt.x, y: pt.y }));
    const edgeAttrs = { id: e.id+'_di', bpmnElement: el, waypoint };
    const lbl = e.labels && e.labels[0];
    if(lbl && typeof lbl.x === 'number'){
      edgeAttrs.label = moddle.create('bpmndi:BPMNLabel', {
        bounds: moddle.create('dc:Bounds', { x: lbl.x, y: lbl.y, width: lbl.width, height: lbl.height })
      });
    }
    edgeDis.push(moddle.create('bpmndi:BPMNEdge', edgeAttrs));
  });

  const plane = moddle.create('bpmndi:BPMNPlane', { id: 'BPMNPlane_elk', bpmnElement: proc, planeElement: shapes.concat(edgeDis) });
  const diagram = moddle.create('bpmndi:BPMNDiagram', { id: 'BPMNDiagram_elk', plane });
  defs.diagrams = [diagram];

  const { xml: out } = await moddle.toXML(defs, { format: true });
  return out;
}

// Strip any existing <bpmndi:BPMNDiagram> so a freshly computed layout is authoritative.
function stripBpmnDi(xml){
  return (xml || '').replace(/<(\w+:)?BPMNDiagram[\s\S]*?<\/(\w+:)?BPMNDiagram>/g, '');
}

// Add a generated layout to BPMN so the viewer can render it legibly. Prefers ELK; falls back to
// bpmn-auto-layout, then to the (definitions-wrapped) input on any failure.
async function ensureBpmnLayout(xml){
  const semantic = stripBpmnDi(ensureBpmnDefinitions(xml));
  try { return await elkBpmnLayout(semantic); }
  catch(_){ /* fall through to the simpler layout */ }
  try {
    if(typeof BpmnAutoLayout !== 'undefined' && BpmnAutoLayout.layoutProcess){
      return await BpmnAutoLayout.layoutProcess(semantic);
    }
  } catch(_){}
  return semantic;
}

// Render BPMN xml into a container with a fresh viewer; returns the viewer or null.
async function renderBpmnInto(el, xml){
  if(!el) return null;
  if(typeof BpmnJS === 'undefined'){ el.innerHTML = '<div class="mc-err">diagram viewer unavailable</div>'; return null; }
  try {
    el.innerHTML = '';
    const ready = await ensureBpmnLayout(xml);
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(ready);
    try { viewer.get('canvas').zoom('fit-viewport', 'auto'); } catch(_){}
    return viewer;
  } catch(e){
    el.innerHTML = '<div class="mc-err">could not render: '+esc((e&&e.message)||e)+'</div>';
    return null;
  }
}

function modelXmlOf(card){ const p = card.querySelector('.mc-xml'); return p ? p.textContent : ''; }
function modelNameOf(card){ const n = card.querySelector('.mc-name'); return (n ? n.textContent : 'model') || 'model'; }
function slugify(s){ return String(s||'model').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'model'; }

async function downloadModel(card){
  // Export the ELK-laid-out XML (fresh DI) so the file opens cleanly in other BPMN tools.
  let xml = modelXmlOf(card);
  try { xml = await ensureBpmnLayout(xml); } catch(_){}
  const blob = new Blob([xml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = slugify(modelNameOf(card))+'.bpmn';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Render a card's diagram on demand (once), when first shown.
function ensureCardDiagram(card){
  if(!card || card.dataset.rendered === '1') return;
  card.dataset.rendered = '1';
  renderBpmnInto(card.querySelector('.mc-diagram'), modelXmlOf(card));
}

function switchModelTab(card, tab){
  card.querySelectorAll('.mc-tab').forEach(b => b.classList.toggle('active', b.dataset.mcTab === tab));
  const dia = card.querySelector('.mc-diagram'), xml = card.querySelector('.mc-xml');
  if(tab === 'xml'){ dia.style.display = 'none'; xml.style.display = ''; }
  else { xml.style.display = 'none'; dia.style.display = ''; ensureCardDiagram(card); }
}

// Big popover: a large diagram with an XML toggle + download, over a dark backdrop.
function openModelModal(card){
  const xml = modelXmlOf(card), name = modelNameOf(card);
  const back = document.createElement('div');
  back.className = 'model-modal';
  back.innerHTML = '<div class="mm-box">'+
    '<div class="mm-head"><span class="mm-title">'+esc(name)+'</span>'+
      '<div class="mm-actions">'+
        '<button class="btn mm-tab-dia">Diagram</button>'+
        '<button class="btn mm-tab-xml">XML</button>'+
        '<button class="btn mm-dl">Download .bpmn</button>'+
        '<button class="btn ghost mm-close">Close</button>'+
      '</div></div>'+
    '<div class="mm-body"><div class="mm-diagram"></div>'+
      '<pre class="mm-xml" style="display:none">'+esc(xml)+'</pre></div></div>';
  const close = () => back.remove();
  back.onclick = e => { if(e.target === back) close(); };
  document.body.appendChild(back);
  const dia = back.querySelector('.mm-diagram'), pre = back.querySelector('.mm-xml');
  back.querySelector('.mm-close').onclick = close;
  back.querySelector('.mm-dl').onclick = () => downloadModel(card);
  back.querySelector('.mm-tab-dia').onclick = () => { pre.style.display='none'; dia.style.display=''; };
  back.querySelector('.mm-tab-xml').onclick = () => { dia.style.display='none'; pre.style.display=''; };
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc); } });
  renderBpmnInto(dia, xml);
}

// Lazily render diagrams as cards scroll into view (cheap + avoids rendering a
// long backlog up-front). Re-used across chat redraws.
const modelCardObserver = ('IntersectionObserver' in window)
  ? new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if(en.isIntersecting){ ensureCardDiagram(en.target); obs.unobserve(en.target); } });
    }, { root: null, rootMargin: '120px' })
  : null;

function observeModelCards(scope){
  (scope || document).querySelectorAll('.modelcard[data-rendered="0"]').forEach(card => {
    if(modelCardObserver) modelCardObserver.observe(card);
    else ensureCardDiagram(card); // no IO support: render immediately
  });
}

// One delegated handler for every model card (survives chat re-renders).
if(!window.__modelCardsWired){
  window.__modelCardsWired = true;
  document.addEventListener('click', e => {
    const t = e.target;
    const tab = t.closest && t.closest('.mc-tab');
    if(tab){ switchModelTab(tab.closest('.modelcard'), tab.dataset.mcTab); return; }
    const exp = t.closest && t.closest('.mc-expand');
    if(exp){ openModelModal(exp.closest('.modelcard')); return; }
    const dl = t.closest && t.closest('.mc-dl');
    if(dl){ downloadModel(dl.closest('.modelcard')); return; }
  });
}

// Copy-to-clipboard for droid bubbles (delegated once; survives chat re-renders).
if(!window.__copyWired){
  window.__copyWired = true;
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest && e.target.closest('.copybtn');
    if(!btn) return;
    const txt = btn.getAttribute('data-copy') || '';
    let ok = false;
    try { if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); ok = true; } } catch(_){}
    if(!ok){ try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); } catch(_){} }
    const prev = btn.textContent;
    btn.textContent = ok ? '\u2713' : '\u2717'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('done'); }, 1200);
  });
}

// Carry-forward handler: quote a prior answer into the composer so the next model picks up where
// the last one left off (cross-provider refinement / hand-off between turns).
if(!window.__carryWired){
  window.__carryWired = true;
  document.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('.carrybtn');
    if(!btn) return;
    const txt = btn.getAttribute('data-carry') || '';
    const box = $('#chatBox'); if(!box) return;
    const quoted = txt.split('\n').map(l => '> ' + l).join('\n');
    const lead = 'The previous model concluded:\n\n' + quoted + '\n\n';
    box.value = box.value ? (lead + box.value) : lead;
    box.focus(); box.setSelectionRange(box.value.length, box.value.length);
    const prev = btn.textContent; btn.textContent = '\u2713'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('done'); }, 1200);
  });
}

function drawChat(turns){
  const log = $('#chatLog');
  if(!log) return;
  if(!turns || !turns.length){ log.innerHTML = '<div class="empty">No messages yet. Ask the droid a question to begin investigating this dataset.</div>'; return; }
  log.innerHTML = turns.map(chatBub).join('');
  observeModelCards(log);
  log.scrollTop = log.scrollHeight;
}

async function loadChat(ws, proc){
  const sid = STATE.sessionId;
  try {
    const url = '/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat'+(sid?('?session='+encodeURIComponent(sid)):'');
    const r = await api(url);
    if(r.sessionId) STATE.sessionId = r.sessionId;
    drawChat(r.turns);
    applyPersonaState();
    // This is a (possibly different) session: drop any cached simulation runs and refresh the
    // Simulations tab if it's open.
    STATE.simPersisted = []; STATE.liveSims = []; STATE.liveSimsSid = STATE.sessionId;
    if(STATE.chatTab==='sims') loadSims(ws, proc);
    // If an investigation is still running for this session (e.g. the page was reloaded mid-flight),
    // reattach to its live stream so the operator sees reasoning + console output as before.
    if(r.inflight){
      reattachLiveStream(ws, proc, r.inflight);
      return;
    }
    // Fresh conversation: pre-load the open-investigation prompt so the default action is
    // an unbiased investigation the operator can send or edit.
    if((!r.turns || !r.turns.length)){
      const box = $('#chatBox');
      const open = (STATE.prompts||[]).find(x => x.id==='open') || (STATE.prompts||[])[0];
      if(box && !box.value && open) box.value = open.text;
    }
  } catch(e){ const log=$('#chatLog'); if(log) log.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'; }
}

// ── chat sessions (tabs) ─────────────────────────────────────────────────────
async function loadSessions(ws, proc, preferId){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions');
    STATE.sessions = r.sessions || [];
  } catch(e){ STATE.sessions = []; }
  // Choose the active session: explicit preference, else the current one if still present,
  // else the most recent (the list is newest-first).
  const want = preferId || STATE.sessionId;
  let active = STATE.sessions.find(s => s.id===want) || STATE.sessions[0];
  STATE.sessionId = active ? active.id : null;
  drawSessions(ws, proc);
  await loadChat(ws, proc);
}

function drawSessions(ws, proc){
  const list = $('#chatTabs'); if(!list) return;
  const ss = STATE.sessions || [];
  if(!ss.length){ list.innerHTML = '<div class="cs-empty">No chats yet.</div>'; return; }
  const open = STATE.csModelsOpen || (STATE.csModelsOpen = new Set());
  list.innerHTML = ss.map(s => {
    const on = s.id===STATE.sessionId ? ' on' : '';
    const when = s.updated ? fmtTime(s.updated) : '';
    // Spinner next to whichever session is actively investigating (the in-flight turn always
    // belongs to the selected session); cleared on done/error via the setChatBusy redraw.
    const spin = (STATE.chatBusy && s.id===STATE.sessionId) ? '<span class="cs-spin" title="Investigating…"></span>' : '';
    // Imported psychological traces (shared by another operator/FDE) carry a special icon;
    // the tooltip names their original dataset/model + ProcessOS version.
    const imported = s.origin==='imported'
      ? '<span class="cs-imported" title="Imported psychological trace'+(s.importedFrom?(' — '+esc(s.importedFrom)):'')+'">🧠</span>'
      : '';
    const models = Array.isArray(s.models) ? s.models : [];
    const isOpen = open.has(s.id);
    const modelsPanel = isOpen ? (
      '<div class="cs-models">'+
        '<span class="csm-lbl">Model'+(models.length===1?'':'s')+' used</span>'+
        (models.length
          ? models.map(m => '<span class="csm-item" title="'+esc(m)+'">'+esc(m)+'</span>').join('')
          : '<span class="csm-none">No model recorded yet</span>')+
      '</div>') : '';
    return '<div class="cs-tab'+on+'" data-id="'+esc(s.id)+'">'+
      '<div class="cs-main">'+
        '<div class="cs-name" title="'+esc(s.name)+'">'+spin+imported+esc(s.name)+'</div>'+
        '<div class="cs-meta">'+esc(when)+(s.turns?(' · '+s.turns+' msg'+(s.turns===1?'':'s')):'')+'</div>'+
      '</div>'+
      '<div class="cs-actions">'+
        '<button class="cs-caret'+(isOpen?' open':'')+'" title="Show the model(s) used in this chat">▾</button>'+
        '<button class="cs-btn cs-ren" title="Rename">✎</button>'+
        '<button class="cs-btn cs-del" title="Delete">✕</button>'+
      '</div>'+
      modelsPanel+
    '</div>';
  }).join('');
  list.querySelectorAll('.cs-tab').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('.cs-main').onclick = () => selectSession(ws, proc, id);
    el.querySelector('.cs-caret').onclick = (e) => {
      e.stopPropagation();
      if(open.has(id)) open.delete(id); else open.add(id);
      drawSessions(ws, proc);
    };
    el.querySelector('.cs-ren').onclick = (e) => { e.stopPropagation(); renameSession(ws, proc, id); };
    el.querySelector('.cs-del').onclick = (e) => { e.stopPropagation(); deleteSession(ws, proc, id); };
  });
}

async function selectSession(ws, proc, id){
  if(id===STATE.sessionId) return;
  STATE.sessionId = id;
  STATE.investigationTools = null; reflectInvestigationTools();
  $('#chatHint').textContent = '';
  drawSessions(ws, proc);
  await loadChat(ws, proc);
  if(STATE.chatTab === 'debug') loadDebug(ws, proc);
}

async function newSession(ws, proc){
  try {
    const s = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({})
    });
    await loadSessions(ws, proc, s.id);
    const box = $('#chatBox'); if(box) box.focus();
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function renameSession(ws, proc, id){
  const cur = (STATE.sessions||[]).find(s => s.id===id);
  const name = window.prompt('Rename chat:', cur ? cur.name : '');
  if(name==null || !name.trim()) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(id)+'/rename', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ name: name.trim() })
    });
    await loadSessions(ws, proc, STATE.sessionId);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function deleteSession(ws, proc, id){
  const cur = (STATE.sessions||[]).find(s => s.id===id);
  if(!window.confirm('Delete chat “'+(cur?cur.name:'this chat')+'”? This cannot be undone.')) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/sessions/'+encodeURIComponent(id), { method:'DELETE' });
    // If we deleted the active one, fall back to the most recent remaining session.
    const next = (id===STATE.sessionId) ? null : STATE.sessionId;
    STATE.sessionId = next;
    await loadSessions(ws, proc, next);
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function loadChatPrompts(){
  const sel = $('#chatPrompt');

    STATE.prompts = await api('/api/chat-prompts');

// Load the selectable personas (standing system prompts) into the chat picker. The default
// persona is preselected; the picker is later locked to a session's bound persona once it has

// ── LLM Pairings in the composer ─────────────────────────────────────────────
// The composer no longer wires pair/monitor/subagent ad-hoc: it offers ONE selector of saved
// pairings (see the Pairings panel). The selected pairing is translated at send time into the
// existing per-turn pair/monitor/subagent request shape (with the pairing's inline prompt).
async function loadPairings(){
  try { STATE.pairings = await api('/api/pairings') || []; }
  catch(e){ STATE.pairings = []; }
  fillPairingSelect();
  wirePairingControl();
}
function fillPairingSelect(){

  // If the remembered pairing vanished, fall back to Solo.

// The pairing currently selected in the composer, or null for Solo.
function selectedPairing(){
  const id = ($('#chatPairing')||{}).value || '';
  if(!id) return null;
  return (STATE.pairings||[]).find(p => p.id===id) || null;
}
function wirePairingControl(){
  const sel = $('#chatPairing'); if(!sel) return;
  sel.onchange = async () => {
    localStorage.setItem('processos.pairingId', sel.value || '');

      try {
        const s = await api('/api/settings') || {};
