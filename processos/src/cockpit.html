<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nano ProcessOS — Cockpit</title>
<link rel="stylesheet" href="/assets/bpmn/diagram-js.css" />
<link rel="stylesheet" href="/assets/bpmn/bpmn-embedded.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: #0a0a0b; color: #e4e4e7; }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  /* left rail */
  .rail { border-right: 1px solid #1f1f23; padding: 18px 14px; background: #0c0c0e; }
  .brand { display: block; font-weight: 700; font-size: 16px; letter-spacing: .02em; margin-bottom: 2px; }
  .brand .dot { color: #a5b4fc; }
  .tag { color: #71717a; font-size: 11px; margin-bottom: 20px; }
  .nav a { display: block; padding: 7px 10px; border-radius: 7px; color: #a1a1aa; font-weight: 500; margin-bottom: 2px; cursor: pointer; }
  .nav a:hover { background: #18181b; color: #e4e4e7; }
  .nav a.active { background: #1d1d22; color: #c7d2fe; }
  /* main */
  main { padding: 26px 30px; max-width: 1180px; }
  .crumbs { color: #71717a; font-size: 12px; margin-bottom: 14px; }
  .crumbs a { color: #a5b4fc; cursor: pointer; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px; }
  .lede { color: #a1a1aa; font-size: 13px; margin: 0 0 18px; max-width: 720px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #141417; border: 1px solid #26262b; border-radius: 10px; padding: 13px 16px; min-width: 120px; }
  .card .n { font-size: 22px; font-weight: 650; }
  .card .l { color: #8b8b93; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
  .tile { background: #141417; border: 1px solid #26262b; border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .tile:hover { border-color: #3f3f6a; transform: translateY(-1px); }
  .tile h3 { margin: 0 0 4px; font-size: 15px; font-family: ui-monospace, monospace; color: #c7d2fe; }
  .tile .meta { color: #8b8b93; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.run { background: #0c2a4a; color: #93c5fd; }
  .pill.wait { background: #3a2e07; color: #fcd34d; }
  .pill.accept { background: #06301c; color: #6ee7b7; }
  .pill.stop { background: #2a0a0a; color: #fca5a5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #1f1f23; }
  th { color: #8b8b93; font-weight: 500; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #1d1d22; color: #e4e4e7; border: 1px solid #34343c; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn:hover { border-color: #555; }
  .btn.primary { background: #4338ca; border-color: #4338ca; color: #eef2ff; }
  .btn.primary:hover { background: #4f46e5; }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: #fca5a5; background: #1f0a0a; border: 1px solid #3a1414; padding: 12px 16px; border-radius: 8px; }
  .muted { color: #71717a; }
  /* stepper */
  .stepper { display: flex; gap: 0; margin: 8px 0 24px; }
  .step { flex: 1; position: relative; padding: 14px 16px; border: 1px solid #26262b; background: #131316; }
  .step:first-child { border-radius: 10px 0 0 10px; }
  .step:last-child { border-radius: 0 10px 10px 0; }
  .step + .step { border-left: none; }
  .step .k { font-size: 11px; color: #6b6b73; text-transform: uppercase; letter-spacing: .05em; }
  .step .t { font-weight: 650; margin: 3px 0; }
  .step .d { font-size: 12px; color: #9b9ba3; min-height: 16px; }
  .step.done { border-color: #1f3a2a; background: #0e1a12; }
  .step.done .t { color: #6ee7b7; }
  .step.active { border-color: #4338ca; background: #14132a; box-shadow: inset 0 2px 0 #6366f1; }
  .step.active .t { color: #c7d2fe; }
  .step .badge { position: absolute; top: 12px; right: 14px; font-size: 13px; }
  /* cockpit layout: detail + droid pane */
  .cockpit { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  .pane { background: #0e0e11; border: 1px solid #26262b; border-radius: 12px; padding: 14px 16px; }
  .pane h2 { margin-top: 0; }
  .convo { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
  .turn { padding: 9px 12px; border-radius: 10px; font-size: 13px; }
  .turn .who { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .turn.engine { background: #121216; border: 1px solid #26262b; }
  .turn.engine .who { color: #8b8b93; }
  .turn.droid { background: #11142a; border: 1px solid #28306a; }
  .turn.droid .who { color: #a5b4fc; }
  .turn.pilot { background: #1b1407; border: 1px solid #4a3a12; }
  .turn.pilot .who { color: #fcd34d; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  /* ranked-candidates table + fidelity-tier badges */
  table.rank { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rank th, table.rank td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #1f1f24; vertical-align: top; }
  table.rank th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #8b8b93; }
  table.rank td.num, table.rank th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tier { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tier.l2 { background: #052e1b; border: 1px solid #14532d; color: #6ee7b7; }
  .tier.l3 { background: #2a1c05; border: 1px solid #5a3d12; color: #fcd34d; }
  .tier.bad { background: #2a0d0d; border: 1px solid #5a1a1a; color: #fca5a5; }
  .tier.unknown { background: #16161a; border: 1px solid #2a2a30; color: #8b8b93; }
  .hero { font-size: 30px; font-weight: 700; color: #6ee7b7; }
  .hero.sub { font-size: 12px; color: #8b8b93; font-weight: 400; }
  dialog { background: #141417; color: #e4e4e7; border: 1px solid #34343c; border-radius: 12px; padding: 0; max-width: 520px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dlg-body { padding: 20px 22px; }
  .dlg-body label { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 4px; }
  .dlg-body input, .dlg-body select { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .lbl { display: block; font-size: 12px; color: #a1a1aa; margin: 12px 0 4px; }
  #promptEditor input, #promptEditor textarea { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; }
  #promptEditor textarea { font: 12px/1.5 ui-monospace, monospace; resize: vertical; }
  #promptEditor input:disabled, #promptEditor textarea:disabled { opacity: .6; }
  #pilotNote { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 8px 10px; font: inherit; resize: vertical; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid #26262b; }
  /* workspace investigation surface */
  .ws-model { background: #fafafa; border: 1px solid #26262b; border-radius: 12px; height: 460px; margin: 14px 0; }
  .ws-grid { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 13px; margin: 10px 0; }
  .ws-grid b { color: #a1a1aa; font-weight: 500; }
  .obj-row { display: flex; gap: 8px; align-items: center; }
  .obj-row input { flex: 1; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .notebook { margin-top: 14px; }
  .step { border: 1px solid #26262b; border-radius: 9px; margin-bottom: 8px; background: #0c0c0e; }
  .step summary { cursor: pointer; padding: 9px 12px; font-family: ui-monospace, monospace; font-size: 12px; color: #c7d2fe; }
  .step pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, monospace; color: #a1a1aa; max-height: 320px; overflow: auto; }
  .step .args { color: #71717a; padding: 0 12px 6px; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .conclusion { border: 1px solid #3730a3; background: #14142b; border-radius: 12px; padding: 16px 18px; margin-top: 14px; white-space: pre-wrap; }
  /* interactive cockpit chat */
  .chat { border: 1px solid #26262b; border-radius: 12px; background: #0c0c0e; margin-top: 14px; display: flex; flex-direction: column; max-height: 64vh; }
  .chatlog { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 160px; --chat-font: 15px; }
  .chatlog .empty { color: #71717a; font-size: 13px; margin: auto; text-align: center; max-width: 420px; }
  .bub { padding: 10px 13px; border-radius: 12px; font-size: var(--chat-font, 15px); line-height: 1.55; white-space: pre-wrap; word-break: break-word; max-width: 88%; }
  .bub .who { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .bub.user { align-self: flex-end; background: #1b2540; border: 1px solid #2c3c66; }
  .bub.user .who { color: #93c5fd; }
  .bub.droid { align-self: flex-start; background: #11142a; border: 1px solid #28306a; }
  .bub.droid .who { color: #a5b4fc; }
  .bub.pending { align-self: flex-start; background: #131316; border: 1px solid #26262b; color: #a1a1aa; }
  .bub .think { margin-bottom: 8px; border: 1px solid #26262b; border-radius: 8px; background: #0b0b14; }
  .bub .think summary { cursor: pointer; padding: 5px 10px; font-size: 11px; color: #8b8b93; text-transform: uppercase; letter-spacing: .04em; }
  .bub .think .think-body { padding: 0 10px 9px; font-size: calc(var(--chat-font, 15px) - 2px); line-height: 1.5; color: #9ca3af; white-space: pre-wrap; }
  .bub .steps { margin-top: 8px; }
  .bub .steps details { border: 1px solid #26262b; border-radius: 8px; margin-bottom: 6px; background: #0c0c0e; }
  .bub .steps summary { cursor: pointer; padding: 6px 10px; font-family: ui-monospace, monospace; font-size: 11px; color: #c7d2fe; }
  .bub .steps .args { color: #71717a; padding: 0 10px 5px; font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .bub .steps pre { margin: 0; padding: 0 10px 10px; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 ui-monospace, monospace; color: #a1a1aa; max-height: 280px; overflow: auto; }
  .compose { border-top: 1px solid #26262b; padding: 12px 14px; }
  .compose-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .compose select { background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 6px 10px; font: inherit; }
  .compose textarea { width: 100%; background: #0c0c0e; border: 1px solid #34343c; color: #e4e4e7; border-radius: 8px; padding: 9px 11px; font: 13px/1.5 inherit; resize: vertical; min-height: 64px; }
  .compose-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .compose-actions .muted { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .fontctl { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; }
  .fontctl button { background: #16161a; border: 1px solid #34343c; color: #c7d2fe; border-radius: 6px; width: 24px; height: 24px; line-height: 1; cursor: pointer; font-size: 13px; }
  .fontctl button:hover { background: #1f1f27; }
  .pylink { color: #a5b4fc; cursor: pointer; text-decoration: underline; }
  .btn.warn { background: #3a1d1d; border: 1px solid #7f1d1d; color: #fca5a5; }
  .btn.warn:hover { background: #4a2424; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #111118; border: 1px solid #34343c; border-radius: 12px; padding: 20px 22px; max-width: 560px; width: 90%; max-height: 80vh; overflow: auto; }
  .modal h3 { margin: 0 0 10px; }
  .modal pre { background: #0c0c0e; border: 1px solid #26262b; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 ui-monospace, monospace; color: #c7d2fe; }
  .modal .close { margin-top: 14px; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="/">Nano Process<span class="dot">OS</span></a>
    <div class="tag">the cockpit</div>
    <nav class="nav">
      <a href="/workspace">Workspaces</a>
      <a data-view="console">Console</a>
      <a data-view="processes">Processes</a>
      <a data-view="prompts">Prompts</a>
      <a data-view="experiments">Experiments</a>
    </nav>
  </aside>
  <main id="main">Loading…</main>
</div>

<dialog id="newDlg">
  <div class="dlg-body">
    <h2 style="margin-top:0">New experiment</h2>
    <p class="muted" style="font-size:12px">Fork an experiment on <b id="dlgProc" style="font-family:ui-monospace,monospace;color:#c7d2fe"></b>. The droid proposes redesigns; the engine proves them on the recorded dataset; you decide.</p>
    <label>Droid prompt (the experimental variable)</label>
    <select id="dlgPrompt"></select>
    <label>Iteration budget (max rounds)</label>
    <input id="dlgIters" type="number" min="1" max="50" value="2" />
  </div>
  <div class="dlg-foot">
    <button class="btn ghost" onclick="document.getElementById('newDlg').close()">Cancel</button>
    <button class="btn primary" id="dlgGo">Start experiment</button>
  </div>
</dialog>

<script src="/assets/bpmn/bpmn-navigated-viewer.js"></script>
<script>
const $ = s => document.querySelector(s);
const main = $('#main');
let STATE = { view: 'console', proc: null, exp: null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ms(v){ return v==null ? '—' : (v>=1000 ? (v/1000).toFixed(2)+'s' : Math.round(v)+'ms'); }
function pct(v){ return v==null ? '—' : (v*100).toFixed(1)+'%'; }
function tierBadge(t){
  const m = {
    'recorded-replay': ['l2','L2 · replay'],
    'requires-generative-mock': ['l3','L3 · mock'],
    'infeasible': ['bad','infeasible'],
  }[t] || ['unknown','—'];
  return '<span class="tier '+m[0]+'">'+m[1]+'</span>';
}
function ago(t){ if(!t) return ''; const s=(Date.now()-t)/1000; if(s<60) return Math.round(s)+'s ago'; if(s<3600) return Math.round(s/60)+'m ago'; return Math.round(s/3600)+'h ago'; }

async function api(path, opts){
  const r = await fetch(path, opts);
  const txt = await r.text();
  const d = txt ? JSON.parse(txt) : {};
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}

function setActive(){ document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view===STATE.view)); }

function expPill(e){
  if(e.awaitingPilot) return '<span class="pill wait">awaiting you</span>';
  if(e.outcome!=='completed') return '<span class="pill run">running</span>';
  return '<span class="pill accept">done</span>';
}

// ---- Console ----
async function renderConsole(){
  STATE.view='console'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/overview'); } catch(e){ return fail(e); }
  const totI = d.processes.reduce((a,p)=>a+p.instances,0);
  const totX = d.experiments.length;
  const waiting = d.experiments.filter(e=>e.awaitingPilot).length;
  let h = '<h1>Console</h1><p class="lede">Processes that optimize themselves — with a human copilot in the loop. Read production, hypothesize better variants, prove them on real engines, roll winners to production in cohorts.</p>';
  h += '<div class="cards">'
     + card(d.processes.length,'processes') + card(totI,'instances (sampled)')
     + card(totX,'experiments') + card(waiting,'awaiting you') + '</div>';
  h += '<h2>Processes</h2>';
  h += d.processes.length ? '<div class="grid">'+d.processes.map(procTile).join('')+'</div>'
     : '<p class="muted">No target processes sampled yet. Start some instances on the cluster.</p>';
  h += '<h2>Recent experiments</h2>' + expTable(d.experiments.slice(0,8));
  main.innerHTML = h;
}
function card(n,l){ return '<div class="card"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>'; }
function procTile(p){
  return '<div class="tile" onclick="goProcess(\''+esc(p.processId)+'\')">'
    + '<h3>'+esc(p.processId)+'</h3>'
    + '<div class="meta">'+p.instances+' instances · '+p.completed+' completed · avg '+ms(p.avgDurationMs)+' · p95 '+ms(p.p95DurationMs)+'</div>'
    + '<div class="meta" style="margin-top:6px">'+(p.bottleneck?('bottleneck <b style="color:#fca5a5">'+esc(p.bottleneck)+'</b> · '):'')
    + '<b style="color:#c7d2fe">'+p.experiments+'</b> experiment'+(p.experiments===1?'':'s')+'</div></div>';
}

// ---- Processes ----
async function renderProcesses(){
  STATE.view='processes'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/overview'); } catch(e){ return fail(e); }
  let h = '<h1>Processes</h1><p class="lede">Deployed target processes. Open one to see its production baseline and its experiments.</p>';
  h += d.processes.length ? '<div class="grid">'+d.processes.map(procTile).join('')+'</div>' : '<p class="muted">No processes yet.</p>';
  main.innerHTML = h;
}

function goProcess(pid){ STATE.proc=pid; renderProcess(pid); }
async function renderProcess(pid){
  STATE.view='processes'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/overview'); } catch(e){ return fail(e); }
  const p = d.processes.find(x=>x.processId===pid);
  const xs = d.experiments.filter(e=>e.targetProcessId===pid);
  let h = '<div class="crumbs"><a onclick="renderProcesses()">Processes</a> / '+esc(pid)+'</div>';
  h += '<h1 style="font-family:ui-monospace,monospace;color:#c7d2fe">'+esc(pid)+'</h1>';
  if(p){
    h += '<div class="cards" style="margin-top:10px">'
       + card(p.instances,'instances') + card(p.completed,'completed')
       + card(ms(p.avgDurationMs),'avg e2e') + card(ms(p.p95DurationMs),'p95 e2e')
       + card(p.incidentInstances,'with incidents') + '</div>';
  }
  h += '<div style="display:flex;align-items:center;justify-content:space-between"><h2>Experiments</h2>'
     + '<button class="btn primary" onclick="openNew(\''+esc(pid)+'\')">+ New experiment</button></div>';
  h += expTable(xs);
  main.innerHTML = h;
}

// ---- Experiments list ----
async function renderExperiments(){
  STATE.view='experiments'; setActive(); main.innerHTML='Loading…';
  let xs; try { xs = await api('/api/cockpit/experiments'); } catch(e){ return fail(e); }
  let h = '<h1>Experiments</h1><p class="lede">Every optimization run across the fleet. An experiment is a pilot loop on the engine: the droid proposes, the engine proves, you decide.</p>';
  h += expTable(xs);
  main.innerHTML = h;
}
function expTable(xs){
  if(!xs || !xs.length) return '<p class="muted">No experiments yet.</p>';
  let h = '<table><thead><tr><th>Experiment</th><th>Target</th><th>Best candidate</th><th class="num">conserved</th><th class="num">round</th><th>status</th></tr></thead><tbody>';
  for(const e of xs){
    h += '<tr style="cursor:pointer" onclick="goExp(\''+esc(e.instanceKey)+'\')">'
      + '<td><b>#'+esc(e.instanceKey)+'</b> <span class="muted">'+ago(e.startedAt)+'</span></td>'
      + '<td style="font-family:ui-monospace,monospace;color:#c7d2fe">'+esc(e.targetProcessId||'—')+'</td>'
      + '<td>'+esc(e.bestName||'—')+'</td>'
      + '<td class="num">'+pct(e.bestConservedRate)+'</td>'
      + '<td class="num">'+(e.iteration==null?'—':e.iteration+(e.maxIterations?(' / '+e.maxIterations):''))+'</td>'
      + '<td>'+expPill(e)+'</td></tr>';
  }
  return h+'</tbody></table>';
}

// ---- Experiment detail (the cockpit) ----
function goExp(key){ STATE.exp=key; renderExp(key); }
async function renderExp(key){
  STATE.view='experiments'; setActive(); main.innerHTML='Loading…';
  let d; try { d = await api('/api/cockpit/experiments/'+key); } catch(e){ return fail(e); }
  const s = d.summary;
  let h = '<div class="crumbs"><a onclick="renderExperiments()">Experiments</a> / #'+esc(key)+'</div>';
  h += '<div style="display:flex;align-items:baseline;gap:12px"><h1>Experiment #'+esc(key)+'</h1>'+expPill(s)+'</div>';
  h += '<p class="lede">Optimizing <b style="font-family:ui-monospace,monospace;color:#c7d2fe">'+esc(s.targetProcessId||'—')+'</b>'

     + '. The shared instrument is the verifier’s gradient — the conserved-rate of the production boundary on real recorded traces.</p>';

  // stepper
  h += '<div class="stepper">'+d.steps.map(st => {
    const badge = st.status==='done' ? '✓' : (st.status==='active' ? '◆' : '');
    return '<div class="step '+st.status+'"><div class="badge">'+badge+'</div>'
      + '<div class="k">'+esc(st.label)+'</div>'
      + '<div class="t">'+({baseline:'Observe',hypotheses:'Hypothesize',rank:'Test',decision:'Confirm'}[st.id]||'')+'</div>'
      + '<div class="d">'+esc(st.detail||'')+'</div></div>';
  }).join('')+'</div>';

  // cockpit: hero + decision on the left, droid pane on the right
  h += '<div class="cockpit"><div>';
  h += '<div class="pane"><h2>Verifier gradient</h2>'
     + '<div class="hero">'+pct(s.bestConservedRate)+'</div>'
     + '<div class="hero sub">boundary conserved by “'+esc(s.bestName||'—')+'” on real traces</div>';
  if(d.pendingUserTaskKey){
    h += '<label class="lbl" for="pilotNote" style="margin-top:14px">Note to the droid (optional — steers the next round)</label>'
       + '<textarea id="pilotNote" rows="2" placeholder="e.g. cut the tail latency; keep the summarize step"></textarea>';
    h += '<div class="actions">'
      + '<button class="btn primary" onclick="decide(\''+esc(key)+'\',\'accept\')">Accept</button>'
      + '<button class="btn" onclick="decide(\''+esc(key)+'\',\'iterate\')">Ask droid to iterate</button>'
      + '<button class="btn ghost" onclick="decide(\''+esc(key)+'\',\'stop\')">Stop loop</button></div>'
      + '<p class="muted" style="font-size:12px;margin-top:8px">Iterate is available while round &lt; budget ('+(s.maxIterations||'?')+'). Your note is saved to the conversation and fed to the droid.</p>';
  } else if(s.outcome==='completed'){
    h += '<p class="muted" style="margin-top:12px">Loop finished — '+esc(d.finalOutcome||'')+'.</p>';
  } else {
    h += '<p class="muted" style="margin-top:12px">The droid is working — proposing and proving a round on the engine…</p>';
  }
  h += '</div>';
  // ranked candidates — §7.8 step 3: fidelity tier, metrics, confidence, new workers
  const ranking = d.rankingSummary;
  if(Array.isArray(ranking) && ranking.length){
    h += '<div class="pane"><h2>Ranked candidates</h2>'
       + '<p class="muted" style="font-size:12px;margin:-4px 0 10px">Every result carries its fidelity tier — a measured Level-2 replay is never collapsed into the same number as a speculative Level-3 estimate.</p>'
       + '<table class="rank"><thead><tr><th>Candidate</th><th>Tier</th><th class="num">conserved</th><th class="num">e2e</th><th>requires new workers</th><th>confidence</th></tr></thead><tbody>';
    ranking.forEach(c => {
      const nw = Array.isArray(c.requiresNewWorkers)&&c.requiresNewWorkers.length ? c.requiresNewWorkers.map(esc).join(', ') : '—';
      const lat = (c.avgE2eLatencyMs!=null) ? Math.round(c.avgE2eLatencyMs)+'ms' : '—';
      h += '<tr><td>'+esc(c.name||'candidate')+(c.feasible===false?' <span class="muted">(infeasible)</span>':'')+'</td>'
         + '<td>'+tierBadge(c.fidelityTier)+'</td>'
         + '<td class="num">'+pct(c.conservedRate)+'</td>'
         + '<td class="num">'+lat+'</td>'
         + '<td>'+nw+'</td>'
         + '<td class="muted" style="font-size:12px">'+esc(c.confidence||'')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  // droid pane
  h += '<div class="pane"><h2>Cockpit conversation</h2><div class="convo">'
     + d.conversation.map(t => '<div class="turn '+esc(t.role)+'"><div class="who">'+({engine:'Engine',droid:'Droid',pilot:'Pilot'}[t.role]||t.role)+'</div>'+esc(t.text)+'</div>').join('')
     + '</div></div>';
  h += '</div>';
  main.innerHTML = h;
}

async function decide(key, decision){
  document.querySelectorAll('.actions .btn').forEach(b=>b.disabled=true);
  const noteEl = document.getElementById('pilotNote');
  const note = noteEl ? noteEl.value.trim() : '';
  try { await api('/api/cockpit/experiments/'+key+'/decision', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision, note})}); }
  catch(e){ alert('Decision failed: '+e.message); }
  setTimeout(()=>renderExp(key), 600);
}

// Pull <think>/<thinking> reasoning out of the answer text so it can be shown collapsed,
// returning { think, answer } where answer is the cleaned prose.
function splitThinking(text){
  let t = text || '';
  let think = '';
  // Greedy across the whole string; tolerate an unterminated trailing <think> (streaming).
  t = t.replace(/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/gi, (_, body) => { think += (think?'\n\n':'')+body.trim(); return ''; });
  const open = t.match(/<think(?:ing)?>([\s\S]*)$/i);
  if(open){ think += (think?'\n\n':'')+open[1].trim(); t = t.slice(0, open.index); }
  return { think: think.trim(), answer: t.trim() };
}

function droidName(){ return STATE.modelName || 'Droid'; }

function chatBub(t){
  if(t.role==='user') return '<div class="bub user"><div class="who">You</div>'+esc(t.text)+'</div>';
  const { think, answer } = splitThinking(t.text);
  const thinkHtml = think ? '<details class="think"><summary>Thinking</summary><div class="think-body">'+esc(think)+'</div></details>' : '';
  const steps = (t.steps||[]).map((s,i) => `
    <details>
      <summary>${esc(s.tool)} · ${i+1}</summary>
      <div class="args">${esc(JSON.stringify(s.arguments))}</div>
      <pre>${esc(s.result)}</pre>
    </details>`).join('');
  return '<div class="bub droid"><div class="who">'+esc(droidName())+'</div>'+thinkHtml+
    '<div class="answer">'+esc(answer || (think ? '' : '(no answer)'))+'</div>'+
    (steps ? '<div class="steps">'+steps+'</div>' : '')+'</div>';
}

function drawChat(turns){
  const log = $('#chatLog');
  if(!log) return;
  if(!turns || !turns.length){ log.innerHTML = '<div class="empty">No messages yet. Ask the droid a question to begin investigating this dataset.</div>'; return; }
  log.innerHTML = turns.map(chatBub).join('');
  log.scrollTop = log.scrollHeight;
}

async function loadChat(ws, proc){
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat');
    drawChat(r.turns);
    // Fresh conversation: pre-load the open-investigation prompt so the default action is
    // an unbiased investigation the operator can send or edit.
    if((!r.turns || !r.turns.length)){
      const box = $('#chatBox');
      const open = (STATE.prompts||[]).find(x => x.id==='open') || (STATE.prompts||[])[0];
      if(box && !box.value && open) box.value = open.text;
    }
  } catch(e){ const log=$('#chatLog'); if(log) log.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'; }
}

async function loadChatPrompts(){
  const sel = $('#chatPrompt');
  try {
    STATE.prompts = await api('/api/chat-prompts');
    if(sel) sel.innerHTML = '<option value="">Load a prompt…</option>' +
      (STATE.prompts||[]).map(p => '<option value="'+esc(p.id)+'">'+esc(p.name||p.id)+(p.builtin?'':' ✎')+'</option>').join('');
  } catch(e){ /* prompts are optional */ }
}

async function sendChat(ws, proc){
  const box = $('#chatBox'); const msg = box.value.trim();
  if(!msg) return;
  const send = $('#chatSend'); const log = $('#chatLog'); const hint = $('#chatHint');
  const wrap = $('#chatWrapup');
  const allowPython = $('#chatPy').checked && !$('#chatPy').disabled;
  send.disabled = true; box.disabled = true;
  if(wrap){ wrap.style.display = ''; wrap.disabled = false; }
  // optimistic: drop the placeholder, append the user turn + a pending droid bubble.
  if(log.querySelector('.empty')) log.innerHTML = '';
  log.insertAdjacentHTML('beforeend', chatBub({role:'user', text:msg}));
  log.insertAdjacentHTML('beforeend', '<div class="bub pending" id="chatPending"><div class="who">'+esc(droidName())+'</div>reasoning over the dataset…</div>');
  log.scrollTop = log.scrollHeight;
  box.value = '';
  try {
    const r = await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ message: msg, allowPython })
    });
    drawChat(r.turns);
    const ds = r.dataset || {};
    hint.textContent = (r.rounds!=null?('round '+r.rounds+' · '):'') +
      (ds.instances!=null?(ds.instances+' instances · '+ds.jobs+' jobs · '+ds.incidents+' incidents'):'');
  } catch(e){
    const pend = $('#chatPending'); if(pend) pend.remove();
    log.insertAdjacentHTML('beforeend', '<div class="bub droid"><div class="who">'+esc(droidName())+'</div><span style="color:#fca5a5">'+esc(e.message||e)+'</span></div>');
    box.value = msg; // restore so the operator can retry
  } finally {
    send.disabled = false; box.disabled = false; box.focus();
    if(wrap) wrap.style.display = 'none';
  }
}

// Ask an in-flight investigation to stop and report its findings so far.
async function wrapUpChat(ws, proc){
  const wrap = $('#chatWrapup'); if(wrap) wrap.disabled = true;
  const pend = $('#chatPending'); if(pend) pend.innerHTML = '<div class="who">'+esc(droidName())+'</div>wrapping up — reporting findings so far…';
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/wrapup', { method:'POST' });
    $('#chatHint').textContent = 'asked the droid to wrap up…';
  } catch(e){ $('#chatHint').textContent = 'wrap-up request failed: '+(e.message||e); }
}

async function saveChatPrompt(){
  const text = $('#chatBox').value.trim();
  if(!text){ $('#chatHint').textContent = 'nothing in the compose box to save'; return; }
  const name = window.prompt('Name this prompt:');
  if(name==null) return;
  const id = (name.trim()||'prompt').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || ('prompt-'+Date.now());
  try {
    await api('/api/chat-prompts', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ id, name: name.trim()||id, text })
    });
    await loadChatPrompts();
    $('#chatHint').textContent = 'saved prompt “'+(name.trim()||id)+'”';
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function resetChat(ws, proc){
  if(!window.confirm('Forget this conversation?')) return;
  try {
    await api('/api/workspaces/'+encodeURIComponent(ws)+'/processes/'+encodeURIComponent(proc)+'/chat/reset', { method:'POST' });
    drawChat([]); $('#chatHint').textContent = '';
  } catch(e){ $('#chatHint').textContent = e.message||e; }
}

async function renderWsModel(url){
  const el = document.getElementById('wsModel');
  if(!el || typeof BpmnJS === 'undefined'){ if(el) el.innerHTML='<p class="muted" style="padding:12px">viewer unavailable</p>'; return; }
  try {
    const xml = await (await fetch(url)).text();
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(xml);
    viewer.get('canvas').zoom('fit-viewport', 'auto');
  } catch(e){ el.innerHTML = '<p class="err" style="padding:12px">could not render model: '+esc(e.message||e)+'</p>'; }
}

document.querySelectorAll('.nav a[data-view]').forEach(a => a.onclick = () => {
  const v = a.dataset.view;
  if(v==='console') renderConsole();
  else if(v==='processes') renderProcesses();
  else if(v==='prompts') renderPrompts();
  else if(v==='experiments') renderExperiments();
});

// Boot: a workspace-process deep-link (?workspace=&process=) opens the
// investigation surface; otherwise the default console.
(function(){
  const q = new URLSearchParams(location.search);
  const ws = q.get('workspace'), proc = q.get('process');
  if(ws && proc) renderWorkspace(ws, proc);
  else renderConsole();
})();
</script>
