<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nano ProcessOS — Semantics Workbench</title>
<link rel="stylesheet" href="/assets/theme.css" />
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/bpmn/diagram-js.css" />
<link rel="stylesheet" href="/assets/bpmn/bpmn-embedded.css" />
<style>
  /*
   * Semantics Workbench (slice 6 of ADR 0002) — a standalone editor for the
   * annotations sidecar that slice 5 lands. Two-column layout: bpmn-js
   * canvas on the left with a tab bar underneath (Flows / Costs & Times /
   * Provenance), per-selection properties panel on the right. All values
   * resolve through the design tokens in /assets/theme.css so light/dark
   * behave consistently with the rest of the app.
   */
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--po-app); color: var(--po-text); }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .rail { border-right: 1px solid var(--po-edge); padding: 18px 14px; background: var(--po-panel); }
  .rail .brand { display: block; font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .brand .dot { color: var(--po-accent-strong); }
  .rail .tag { color: var(--po-text-faint); font-size: 11px; margin-bottom: 20px; display: block; }
  .nav a { display: block; padding: 7px 10px; border-radius: 7px; color: var(--po-text-muted); font-weight: 500; margin-bottom: 2px; }
  .nav a:hover { background: var(--po-hover); color: var(--po-text); }
  .nav a.active { background: var(--po-hover); color: var(--po-accent-soft); }
  main { padding: 20px 24px; min-width: 0; }
  .crumbs { color: var(--po-text-faint); font-size: 12px; margin-bottom: 10px; }
  .crumbs a { color: var(--po-accent-strong); cursor: pointer; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: var(--po-text-muted); font-size: 13px; margin: 0 0 12px; max-width: 780px; }
  h2 { font-size: 12px; color: var(--po-text-muted); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 8px; }
  .muted { color: var(--po-text-faint); }
  code { font-family: ui-monospace, monospace; color: var(--po-accent-soft); font-size: 12px; }
  .err { color: var(--po-danger-soft); font-size: 13px; margin: 10px 0; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--po-edge-strong); background: var(--po-hover); color: var(--po-text); padding: 6px 12px; }
  button.primary { background: var(--po-accent); border-color: var(--po-accent); color: var(--po-on-accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(1.1); }
  input, select, textarea { font: inherit; background: var(--po-inset); border: 1px solid var(--po-edge); color: var(--po-text); border-radius: 6px; padding: 4px 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btnrow { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.inferred { background: var(--po-info-wash); color: var(--po-info-soft); }
  .pill.human    { background: var(--po-ok-wash);   color: var(--po-ok-soft); }
  .pill.mixed    { background: var(--po-hover);      color: var(--po-text-muted); }
  .pill.llm      { background: var(--po-accent-wash, var(--po-hover)); color: var(--po-accent-soft); }

  /* Two-column workbench. Grid gives the canvas + tab column all the room
     it can take, then a fixed 340px selection panel on the right. */
  .wb { display: grid; grid-template-columns: 1fr 340px; gap: 14px; align-items: start; }
  .wb-canvas { background: #fbfbfd; border: 1px solid var(--po-edge); border-radius: 10px; height: 460px; overflow: hidden; }
  .wb-canvas .djs-container { background: #fbfbfd; }
  .wb-selpanel { background: var(--po-raised); border: 1px solid var(--po-edge); border-radius: 10px; padding: 12px 14px; position: sticky; top: 12px; }
  .wb-selpanel h3 { margin: 0 0 6px; font-size: 13px; color: var(--po-accent-soft); }
  .wb-selpanel .field { margin: 10px 0 4px; }
  .wb-selpanel label { display: block; font-size: 11px; color: var(--po-text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .wb-selpanel select, .wb-selpanel input { width: 100%; }
  .wb-selpanel .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wb-selpanel .split-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .wb-selpanel .hint { color: var(--po-text-faint); font-size: 11px; margin-top: 4px; }

  /* Tab strip below the canvas. */
  .wb-tabs { border: 1px solid var(--po-edge); border-radius: 10px; overflow: hidden; background: var(--po-raised); }
  .wb-tabbar { display: flex; border-bottom: 1px solid var(--po-edge); background: var(--po-inset); }
  .wb-tabbar button { border: 0; background: transparent; padding: 8px 14px; border-radius: 0; color: var(--po-text-muted); font-weight: 500; border-bottom: 2px solid transparent; }
  .wb-tabbar button.active { color: var(--po-accent-soft); border-bottom-color: var(--po-accent-strong); background: var(--po-raised); }
  .wb-tabbody { padding: 12px 14px; min-height: 140px; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--po-edge); vertical-align: top; }
  th { color: var(--po-text-faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
  td .element-link { color: var(--po-accent-strong); cursor: pointer; font-family: ui-monospace, monospace; }
  td .element-link:hover { text-decoration: underline; }

  /* Save-with-diff modal. */
  .modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--po-raised); border: 1px solid var(--po-edge-strong); border-radius: 12px; width: 88vw; max-width: 720px; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--po-edge); display: flex; align-items: center; gap: 10px; }
  .modal-body { padding: 12px 16px; overflow: auto; }
  .modal-foot { padding: 10px 16px; border-top: 1px solid var(--po-edge); display: flex; justify-content: flex-end; gap: 8px; }
  .diff { font: 11.5px/1.45 ui-monospace, monospace; }
  .diff .add { color: var(--po-ok-soft); }
  .diff .rem { color: var(--po-danger-soft); }
  .diff .ctx { color: var(--po-text-muted); }
  .diff pre { margin: 4px 0; padding: 6px 10px; background: var(--po-inset); border-radius: 6px; white-space: pre-wrap; }

  /* Renderer picker toolbar above the canvas. */
  .wb-canvas-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .wb-canvas-toolbar .rlbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--po-text-muted); }
  .wb-canvas-toolbar .seg { display: inline-flex; border: 1px solid var(--po-edge); border-radius: 8px; overflow: hidden; background: var(--po-inset); }
  .wb-canvas-toolbar .seg button { border: 0; border-radius: 0; background: transparent; padding: 5px 12px; font-size: 12px; color: var(--po-text-muted); }
  .wb-canvas-toolbar .seg button + button { border-left: 1px solid var(--po-edge); }
  .wb-canvas-toolbar .seg button.active { background: var(--po-raised); color: var(--po-accent-soft); font-weight: 600; }
  .wb-canvas-toolbar .rhint { font-size: 11.5px; }
  .wb-canvas-toolbar .rspin { font-size: 12px; min-width: 12px; }

  /* Save status line + drift banner. */
  .status { font-size: 12px; color: var(--po-text-muted); margin-left: 8px; }
  .drift { background: var(--po-warn-wash, var(--po-inset)); border: 1px solid var(--po-warn, var(--po-edge)); color: var(--po-warn-soft, var(--po-text)); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; margin: 8px 0 4px; }

  /* Flow-membership chips (sel panel) and per-node controls (flows tab). */
  .flow-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .flow-chip { border: 1px solid var(--po-edge); background: var(--po-inset); color: var(--po-text-muted); border-radius: 999px; padding: 2px 8px; font-size: 11.5px; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .flow-chip.on { border-color: var(--po-accent-strong); background: var(--po-ok-wash); color: var(--po-text); }
  .flow-chip .pill { font-size: 10px; padding: 0 6px; }
  .flow-node { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; }
  .flow-node-btn { border: 0; background: transparent; padding: 0 2px; color: var(--po-text-faint); cursor: pointer; font-size: 11px; line-height: 1; }
  .flow-node-btn:hover { color: var(--po-accent-strong); }
  .flow-id, .flow-kind { font-size: 12px; padding: 3px 6px; }
  .flow-del { border: 0; background: transparent; padding: 2px 6px; cursor: pointer; color: var(--po-danger-soft); }
  .flow-del:hover { background: var(--po-hover); border-radius: 6px; }

  /* Semantics Curator pane (slice 12) — a collapsible strip below the header
     btnrow, above the workbench grid. Survives model reloads because it
     lives outside #wbHost. */
  .cur-pane { border: 1px solid var(--po-accent, var(--po-edge-strong)); border-radius: 10px; background: var(--po-raised); margin: 8px 0 12px; overflow: hidden; }
  .cur-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--po-edge); background: var(--po-inset); }
  .cur-head .cur-close { margin-left: auto; border: 0; background: transparent; color: var(--po-text-muted); padding: 2px 6px; }
  .cur-head .cur-close:hover { color: var(--po-danger-soft); }
  .cur-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .cur-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cur-actions .rlbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--po-text-muted); margin-right: 4px; }
  .cur-actions button[data-axis] { padding: 4px 12px; font-size: 12.5px; }
  .cur-spin { font-size: 12px; }
  .cur-chat { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .cur-msg { padding: 4px 8px; border-radius: 6px; background: var(--po-inset); }
  .cur-msg .cur-role { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--po-text-faint); margin-right: 6px; }
  .cur-msg-user { background: var(--po-hover); }
  .cur-msg-asst { background: var(--po-inset); font-family: ui-monospace, monospace; font-size: 11.5px; }
  .cur-proposal { border-top: 1px dashed var(--po-edge); padding-top: 8px; margin-top: 4px; }
  .cur-items { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .cur-item { display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .cur-item:hover { background: var(--po-hover); }
  .cur-item input[type="checkbox"] { margin-top: 3px; }
  .cur-item-body { flex: 1; font-size: 12.5px; }
  .cur-item-body code { font-size: 11.5px; }
  .cur-item-body .cur-detail { color: var(--po-text-muted); font-size: 11.5px; margin-top: 2px; font-family: ui-monospace, monospace; }
  .cur-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .cur-tag-add    { background: var(--po-ok-wash);   color: var(--po-ok-soft); }
  .cur-tag-update { background: var(--po-info-wash); color: var(--po-info-soft); }
  .cur-tag-noop   { background: var(--po-hover);     color: var(--po-text-faint); }
  .cur-foot { display: flex; gap: 8px; align-items: center; margin-top: 4px; }

</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="/">Nano Process<span class="dot">OS</span></a>
    <span class="tag">the cockpit</span>
    <nav class="nav">
      <a href="/workspace">Workspaces</a>
      <a href="/cockpit?view=processes">Processes</a>
      <a href="/semantics" class="active">Semantics</a>
      <a href="/cockpit?view=experiments">Experiments</a>
      <a href="/cockpit?view=prompts">Prompts</a>
      <a href="/cockpit?view=sidecars">LLMs</a>
    </nav>
    <div id="railTheme" style="margin-top:18px"></div>
  </aside>
  <main id="app">Loading…</main>
</div>

<script src="/assets/bpmn/bpmn-navigated-viewer.js"></script>
<script>
/*
 * Semantics Workbench — ADR 0002, slice 6.
 *
 * Reads and writes the annotations sidecar (slice 5) for a single process,
 * shown alongside its BPMN canvas. The three tabs (Flows / Costs & Times /
 * Provenance) each read from a single in-memory `S` structure and dispatch
 * back through `mutate()` so undo/save-with-diff can operate on one place.
 */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ROLES = ['decision','review','notification','compensation','external'];
const FLOW_KINDS = ['primary','exception','escalation','compensation'];

// Everything the page needs — updated by loader + mutate(), read by render().
const S = {
  ws: null, proc: null,          // path context
  process: null,                  // /api/workspaces/.../processes/... GETrsp
  revision: null,                 // sha256 hex of the current model.bpmn
  sidecar: null,                  // AnnotationsSidecar as loaded
  loaded: null,                   // AnnotationRevision.annotations at load time (baseline for diff)
  ann: emptyAnn(),                // working copy (what the user is editing)
  provenance: 'inferred',          // provenance of the loaded entry, if any
  loadedAt: null,                 // updatedAt of the loaded entry
  tab: 'flows',
  selection: null,                // { id, name, type } | null
  modeler: null,                  // bpmn-js viewer
  elements: [],                    // list of BPMN element {id, name, type} from bpmn-js
  driftBanner: false,             // true when the sidecar's current entry is for a different revision
  xml: '',                        // raw model.bpmn — the source of truth for previews
  renderer: 'default',             // 'default' | 'rowbias' | 'field' — canvas renderer
  previewDebounceTimer: null,     // debounce id for auto-refresh on annotation edits
  previewInFlight: false,         // true while a /api/layout call is pending (for spinner UX)
  // Slice 12: Semantics Curator — LLM assistant for STRUCTURAL annotations
  // only (flows/clusters/roles). Cost/time proposals are explicitly out of
  // scope and stripped server-side. See processos/src/curator.rs.
  curator: {
    open: false,          // pane is toggled by the 🤖 button in the header row
    running: false,       // true while a /api/curator/propose call is in flight
    chatHistory: [],      // [{role, content}, …] — folded into the next request
    proposal: null,       // { axis, payload, selected: {index/id: bool}, receivedAt } | null
    lastError: null,      // last error message, shown inline in the pane
  },
};
function emptyAnn(){ return { flows: [], clusters: [], roles: {}, costs: {}, times: {} }; }
function deepClone(v){ return JSON.parse(JSON.stringify(v)); }

async function api(path, opts){
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(body.error || (r.status+' '+r.statusText));
  return body;
}

// ── Loader ──────────────────────────────────────────────────────────────
async function load(ws, proc){
  S.ws = ws; S.proc = proc;
  $('#app').innerHTML = 'Loading…';
  const base = `/api/workspaces/${encodeURIComponent(ws)}/processes/${encodeURIComponent(proc)}`;
  try {
    S.process = await api(base);
  } catch(e){ $('#app').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  renderShell();
  if(!S.process.hasModel){
    $('#wbHost').innerHTML = '<p class="muted">This process has no <code>model.bpmn</code> yet. Send one from the cockpit or drop one on disk to annotate.</p>';
    return;
  }
  await loadModelAndAnnotations(base);
}

async function loadModelAndAnnotations(base){
  let xml, ann;
  try { xml = await (await fetch(base+'/model')).text(); }
  catch(e){ $('#wbHost').innerHTML = `<div class="err">could not load model.bpmn: ${esc(e.message||e)}</div>`; return; }
  try { ann = await api(base+'/annotations'); }
  catch(e){ $('#wbHost').innerHTML = `<div class="err">could not load annotations: ${esc(e.message||e)}</div>`; return; }

  S.revision = ann.revision;
  S.sidecar = ann.sidecar;
  const entry = ann.entry;
  // If there is no entry for the current model revision, seed from the
  // structural + heuristic inference the layout endpoint performs. This
  // gives the user a starting point rather than a blank slate — they can
  // then keep, tweak, or drop items and save-with-diff to persist.
  if(entry){
    S.loaded = deepClone(entry.annotations);
    S.ann = deepClone(entry.annotations);
    S.provenance = entry.provenance || 'inferred';
    S.loadedAt = entry.updatedAt || null;
    S.driftBanner = false;
  } else {
    let inferred = emptyAnn();
    try {
      const seed = await api('/api/layout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ xml, solver: 'field' }),
      });
      inferred = normAnn(seed.annotations_used);
    } catch(_){}
    S.loaded = null; // nothing saved yet ⇒ every field is "add"
    S.ann = deepClone(inferred);
    S.provenance = 'inferred';
    S.loadedAt = null;
    // Show a heads-up when the sidecar has a `current` entry for a *different*
    // revision — the user's model changed and the previous annotations may
    // still be worth reviewing.
    S.driftBanner = !!(S.sidecar && S.sidecar.current && S.sidecar.current !== S.revision);
  }
  S.xml = xml;
  await mountModeler(xml);
  render();
}

function normAnn(a){
  a = a || {};
  return {
    flows: Array.isArray(a.flows) ? a.flows : [],
    clusters: Array.isArray(a.clusters) ? a.clusters : [],
    roles: a.roles && typeof a.roles === 'object' ? a.roles : {},
    costs: a.costs && typeof a.costs === 'object' ? a.costs : {},
    times: a.times && typeof a.times === 'object' ? a.times : {},
  };
}

// ── Shell ────────────────────────────────────────────────────────────────
function renderShell(){
  const p = S.process;
  const wsName = esc(p.displayName || S.proc);
  $('#app').innerHTML = `
    <div class="crumbs">
      <a onclick="location.href='/workspace'">Workspaces</a> /
      <a onclick="location.href='/workspace#/c/${encodeURIComponent(S.ws)}'">${esc(S.ws)}</a> /
      <a onclick="location.href='/workspace#/c/${encodeURIComponent(S.ws)}/p/${encodeURIComponent(S.proc)}'">${wsName}</a> /
      Semantics
    </div>
    <h1>${wsName} — Semantics</h1>
    <p class="lede">Curate the semantic annotations for this process's <code>model.bpmn</code>. Click a shape on the canvas to edit its role, cost, and time. Changes persist to the <code>annotations.json</code> sidecar keyed by the current model revision.</p>
    <div class="btnrow">
      <button class="primary" id="btnSave">💾 Save</button>
      <button id="btnRevert" title="Discard local edits, reload the on-disk sidecar">Revert</button>
      <button id="btnCurator" title="Ask the Semantics Curator LLM to propose flows, clusters or roles">🤖 Curator</button>
      <span class="status" id="saveStatus"></span>
    </div>
    <div id="curatorPane" style="display:none"></div>
    <div id="wbHost"></div>`;

  $('#btnSave').onclick = openSaveDialog;
  $('#btnRevert').onclick = revert;
  $('#btnCurator').onclick = toggleCurator;
}

async function mountModeler(xml){
  $('#wbHost').innerHTML = `
    ${S.driftBanner ? `<div class="drift">⚠︎ The sidecar's <code>current</code> entry is for a different model revision. Editing starts from the inferred baseline; saving records a new entry for the current revision (${esc((S.revision||'').slice(0,10))}…). Historic entries are kept.</div>` : ''}
    <div class="wb">
      <div>
        <div class="wb-canvas-toolbar">
          <label class="rlbl">Renderer</label>
          <div class="seg" id="rendererSeg">
            <button type="button" data-r="default" class="active" title="Show the diagram as authored (existing BPMN DI)">As authored</button>
            <button type="button" data-r="authored-colour" title="As-authored DI with light pastel fills showing flow membership">As authored (coloured)</button>
            <button type="button" data-r="rowbias" title="Server-side Row-Bias solver: flows become horizontal centerlines by kind, coloured by flow membership">Row-Bias</button>
            <button type="button" data-r="field"   title="Server-side field/Fromme physics solver: annotations pull nodes into semantic zones, coloured by flow membership">Field</button>
          </div>
          <span class="rhint muted" id="rendererHint">Renders as-authored — edit flows/clusters, then pick Row-Bias or Field to preview.</span>
          <span class="rspin" id="rendererSpin"></span>
        </div>
        <div class="wb-canvas" id="wbCanvas"></div>
        <div class="wb-tabs" style="margin-top:12px">
          <div class="wb-tabbar">
            <button data-tab="flows"    class="active">Flows</button>
            <button data-tab="clusters">Clusters</button>
            <button data-tab="costtime">Costs &amp; Times</button>
            <button data-tab="prov">Provenance</button>
          </div>
          <div class="wb-tabbody" id="wbTabBody"></div>
        </div>
      </div>
      <div class="wb-selpanel" id="wbSelPanel"><p class="muted">Click a shape on the canvas to edit its annotations.</p></div>
    </div>`;

  $$('#wbHost .wb-tabbar button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $$('#rendererSeg button').forEach(b => b.onclick = () => setRenderer(b.dataset.r));

  if(typeof BpmnJS === 'undefined'){
    $('#wbCanvas').innerHTML = '<p class="err" style="padding:12px">bpmn-js viewer bundle unavailable</p>';
    return;
  }
  await renderCanvas();
}

// Render the canvas using the current renderer setting. `default` imports
// the raw XML with bpmn-js (as-authored DI); the semantic solvers POST to
// /api/layout with the working-copy annotations and import the re-DI'd XML.
// Every render rebuilds a fresh viewer and re-wires the click-to-select
// handler — bpmn-js has no incremental "re-import different XML" path that
// reliably clears the previous diagram.
async function renderCanvas(){
  const container = $('#wbCanvas');
  const hint = $('#rendererHint');
  const spin = $('#rendererSpin');
  if(!container) return;
  container.innerHTML = '';
  if(spin) spin.textContent = '⏳';
  S.previewInFlight = true;
  let readyXml = S.xml;
  try {
    if(S.renderer === 'authored-colour'){
      const body = { xml: S.xml, annotations: S.ann };
      const j = await api('/api/colorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      readyXml = j.bpmn_xml || S.xml;
    } else if(S.renderer !== 'default'){
      const body = { xml: S.xml, solver: S.renderer, annotations: S.ann, colorize: true };
      const j = await api('/api/layout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      readyXml = j.bpmn_xml || S.xml;
    }
    S.modeler = new BpmnJS({ container });
    await S.modeler.importXML(readyXml);
    try { S.modeler.get('canvas').zoom('fit-viewport', 'auto'); } catch(_){}
    S.elements = collectElements(S.modeler);
    // Selection wiring — clicking a shape populates the right-hand panel.
    S.modeler.get('eventBus').on('element.click', e => {
      const el = e && e.element;
      if(!el || el.type === 'label' || (el.type||'').indexOf('bpmn:') !== 0) return;
      if(el.id && el.id.indexOf('_Plane') === -1 && el.type !== 'bpmn:Process' && el.type !== 'bpmn:Definitions'){
        S.selection = { id: el.id, name: (el.businessObject && el.businessObject.name) || '', type: el.type };
        renderSelPanel();
      }
    });
    if(hint){
      if(S.renderer === 'default') hint.textContent = 'Renders as-authored — edit flows/clusters, then pick a semantic renderer or "As authored (coloured)" to see flow colours.';
      else if(S.renderer === 'authored-colour') hint.textContent = 'As-authored DI with light pastel fills: happy=blue, exception=red, escalation=amber, compensation=lavender.';
      else if(S.renderer === 'rowbias') hint.textContent = 'Row-Bias: primary flow becomes the horizontal centerline; exception/escalation/compensation bands stack around it. Shapes coloured by flow.';
      else hint.textContent = 'Field: springs + physics pull annotated nodes into semantic zones. Shapes coloured by flow. Auto-refreshes on annotation edits (500ms debounce).';
    }
  } catch(e){
    container.innerHTML = `<div class="err" style="padding:12px">${esc(S.renderer)} layout failed: ${esc((e&&e.message)||e)}</div>`;
  } finally {
    S.previewInFlight = false;
    if(spin) spin.textContent = '';
  }
}

function setRenderer(r){
  if(!r || r === S.renderer) return;
  S.renderer = r;
  $$('#rendererSeg button').forEach(b => b.classList.toggle('active', b.dataset.r === r));
  renderCanvas();
}

// Schedule a preview refresh after an annotation edit. Only active when a
// semantic renderer is selected — otherwise editing has no visual effect on
// the canvas and we can skip the layout call.
function schedulePreviewRefresh(){
  if(S.renderer === 'default') return;
  if(S.previewDebounceTimer) clearTimeout(S.previewDebounceTimer);
  S.previewDebounceTimer = setTimeout(() => {
    S.previewDebounceTimer = null;
    renderCanvas();
  }, 500);
}

const $$ = sel => Array.from(document.querySelectorAll(sel));

function collectElements(modeler){
  const registry = modeler.get('elementRegistry');
  const out = [];
  registry.forEach(el => {
    const t = el.type || '';
    if(!t.startsWith('bpmn:')) return;
    if(t === 'bpmn:Process' || t === 'bpmn:Definitions' || t === 'bpmn:Collaboration' || t === 'label') return;
    out.push({ id: el.id, name: (el.businessObject && el.businessObject.name) || '', type: t });
  });
  out.sort((a, b) => a.id.localeCompare(b.id));
  return out;
}

// ── Render ───────────────────────────────────────────────────────────────
function render(){
  renderTab();
  renderSelPanel();
}

function setTab(t){
  S.tab = t;
  $$('#wbHost .wb-tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  renderTab();
}

function renderTab(){
  const host = $('#wbTabBody');
  if(!host) return;
  if(S.tab === 'flows') host.innerHTML = flowsTabHtml();
  else if(S.tab === 'clusters') host.innerHTML = clustersTabHtml();
  else if(S.tab === 'costtime') host.innerHTML = costTimeTabHtml();
  else host.innerHTML = provenanceTabHtml();
  if(S.tab === 'flows') wireFlowsTab(host);
  else if(S.tab === 'clusters') wireClustersTab(host);
  // Delegate row-clicks on element ids to selection.
  host.querySelectorAll('[data-el]').forEach(el =>
    el.onclick = () => selectElementById(el.dataset.el));
}

function selectElementById(id){
  const el = S.elements.find(e => e.id === id);
  if(!el) return;
  S.selection = el;
  try { S.modeler.get('selection').select(S.modeler.get('elementRegistry').get(id)); } catch(_){}
  renderSelPanel();
}

function flowsTabHtml(){
  const flows = S.ann.flows || [];
  const empty = !flows.length
    ? '<p class="muted" style="margin:6px 0 10px">No named flows yet. Create one below, or select a shape and use its "Flows" chips.</p>'
    : '';
  const rows = flows.map((f, i) => {
    const kind = f.kind || 'primary';
    const kindOpts = FLOW_KINDS.map(k => `<option value="${k}"${k===kind?' selected':''}>${k}</option>`).join('');
    const nodes = (f.nodes||[]).map((n, ni) => `
      <span class="flow-node">
        <span class="element-link" data-el="${esc(n)}">${esc(n)}</span>
        <button class="flow-node-btn" title="Move up"     data-fi="${i}" data-ni="${ni}" data-act="up">▲</button>
        <button class="flow-node-btn" title="Move down"   data-fi="${i}" data-ni="${ni}" data-act="down">▼</button>
        <button class="flow-node-btn" title="Remove"      data-fi="${i}" data-ni="${ni}" data-act="rm">×</button>
      </span>`).join(' ');
    return `<tr>
      <td><input class="flow-id" data-fi="${i}" value="${esc(f.id || 'flow_'+i)}" style="width:150px"></td>
      <td><select class="flow-kind" data-fi="${i}">${kindOpts}</select></td>
      <td>${nodes || '<span class="muted">(empty — add nodes from the sel panel)</span>'}</td>
      <td><button class="flow-del" data-fi="${i}" title="Delete this flow">🗑</button></td>
    </tr>`;
  }).join('');
  const table = flows.length
    ? `<table><thead><tr><th>id</th><th>kind</th><th>nodes</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : '';
  return empty + table + `
    <div class="btnrow" style="margin-top:10px">
      <button id="flowNew" class="primary">+ New flow</button>
      <span class="hint muted">Flows are ordered lists of node ids. <code>primary</code> becomes the horizontal centerline; <code>exception</code> drops below, <code>escalation</code> rises above, <code>compensation</code> sits below the exception band.</span>
    </div>`;
}

// Wire up the editable flows-tab controls (rebuilt from scratch on every
// renderTab, so bind after innerHTML lands).
function wireFlowsTab(host){
  host.querySelectorAll('.flow-id').forEach(inp => {
    inp.onchange = () => setFlowId(+inp.dataset.fi, inp.value.trim());
  });
  host.querySelectorAll('.flow-kind').forEach(sel => {
    sel.onchange = () => setFlowKind(+sel.dataset.fi, sel.value);
  });
  host.querySelectorAll('.flow-del').forEach(btn => {
    btn.onclick = () => deleteFlow(+btn.dataset.fi);
  });
  host.querySelectorAll('.flow-node-btn').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const fi = +btn.dataset.fi, ni = +btn.dataset.ni, act = btn.dataset.act;
      if(act === 'rm') removeFlowNode(fi, ni);
      else moveFlowNode(fi, ni, act === 'up' ? -1 : +1);
    };
  });
  const newBtn = host.querySelector('#flowNew');
  if(newBtn) newBtn.onclick = () => createFlow();
}

// Clusters tab: same shape as flows but no `kind` (soft groups are one
// bucket), plus an `affinity` slider (0..1, default 0.5). Nodes have no
// meaningful order — clusters pull members toward a shared centroid — so
// only an × control per node (no ▲/▼ reorder).
function clustersTabHtml(){
  const clusters = S.ann.clusters || [];
  const empty = !clusters.length
    ? '<p class="muted" style="margin:6px 0 10px">No clusters yet. Create one below, or select a shape and use its "Clusters" chips.</p>'
    : '';
  const rows = clusters.map((c, i) => {
    const aff = (typeof c.affinity === 'number') ? c.affinity : 0.5;
    const nodes = (c.nodes||[]).map((n, ni) => `
      <span class="flow-node">
        <span class="element-link" data-el="${esc(n)}">${esc(n)}</span>
        <button class="flow-node-btn" title="Remove" data-ci="${i}" data-ni="${ni}" data-act="rm">×</button>
      </span>`).join(' ');
    return `<tr>
      <td><input class="cluster-id" data-ci="${i}" value="${esc(c.id || 'cluster_'+i)}" style="width:150px"></td>
      <td><input class="cluster-aff" data-ci="${i}" type="number" min="0" max="1" step="0.05" value="${esc(aff)}" style="width:80px"><div class="hint" style="margin-top:2px">0..1 (spring stiffness)</div></td>
      <td>${nodes || '<span class="muted">(empty — add nodes from the sel panel)</span>'}</td>
      <td><button class="cluster-del" data-ci="${i}" title="Delete this cluster">🗑</button></td>
    </tr>`;
  }).join('');
  const table = clusters.length
    ? `<table><thead><tr><th>id</th><th>affinity</th><th>nodes</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : '';
  return empty + table + `
    <div class="btnrow" style="margin-top:10px">
      <button id="clusterNew" class="primary">+ New cluster</button>
      <span class="hint muted">Clusters are soft groups. Members are pulled toward a shared centroid after flow bias is applied. Affinity is the spring stiffness — higher = tighter.</span>
    </div>`;
}

function wireClustersTab(host){
  host.querySelectorAll('.cluster-id').forEach(inp => {
    inp.onchange = () => setClusterId(+inp.dataset.ci, inp.value.trim());
  });
  host.querySelectorAll('.cluster-aff').forEach(inp => {
    inp.onchange = () => setClusterAffinity(+inp.dataset.ci, inp.value);
  });
  host.querySelectorAll('.cluster-del').forEach(btn => {
    btn.onclick = () => deleteCluster(+btn.dataset.ci);
  });
  host.querySelectorAll('.flow-node-btn[data-ci]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const ci = +btn.dataset.ci, ni = +btn.dataset.ni;
      if(btn.dataset.act === 'rm') removeClusterNode(ci, ni);
    };
  });
  const newBtn = host.querySelector('#clusterNew');
  if(newBtn) newBtn.onclick = () => createCluster();
}

function costTimeTabHtml(){
  const ids = new Set([...Object.keys(S.ann.costs||{}), ...Object.keys(S.ann.times||{})]);
  if(!ids.size) return '<p class="muted">No costs or times authored yet. Click a shape and add them from the right-hand panel.</p>';
  const rows = Array.from(ids).sort().map(id => {
    const c = (S.ann.costs||{})[id];
    const t = (S.ann.times||{})[id];
    const cellCost = c ? `${esc(c.value)}${c.currency?' '+esc(c.currency):''}${c.per?' / '+esc(c.per):''}` : '<span class="muted">—</span>';
    const cellTime = t ? `p50 ${t.p50Ms??'—'}ms · p99 ${t.p99Ms??'—'}ms${t.source?' <span class="muted">('+esc(t.source)+')</span>':''}` : '<span class="muted">—</span>';
    return `<tr><td><span class="element-link" data-el="${esc(id)}">${esc(id)}</span></td><td>${cellCost}</td><td>${cellTime}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>element</th><th>cost</th><th>time</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function provenanceTabHtml(){
  const rev = S.revision || '(no model)';
  const short = rev === '(no model)' ? rev : rev.slice(0, 16)+'…';
  const rows = Object.entries((S.sidecar && S.sidecar.revisions) || {})
    .sort((a,b) => (b[1].updatedAt||'').localeCompare(a[1].updatedAt||''))
    .map(([r, e]) => `<tr>
      <td><code>${esc(r.slice(0, 16))}…</code>${r===S.revision?' <span class="pill human">current</span>':''}</td>
      <td><span class="pill ${esc(e.provenance||'inferred')}">${esc(e.provenance||'inferred')}</span></td>
      <td>${esc(e.updatedAt||'—')}</td>
    </tr>`).join('');
  const loadedNote = S.loaded
    ? `Loaded from sidecar entry stamped <code>${esc(S.loadedAt||'—')}</code> (provenance <span class="pill ${esc(S.provenance)}">${esc(S.provenance)}</span>).`
    : `No sidecar entry for this revision yet. The workbench seeded the working copy from the inferred baseline; saving will create the first entry.`;
  return `
    <div style="margin-bottom:10px"><b>Current model revision:</b> <code>${esc(short)}</code></div>
    <p class="muted">${loadedNote}</p>
    <table><thead><tr><th>revision</th><th>provenance</th><th>updated</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="muted">— no revisions stored yet</td></tr>'}</tbody></table>`;
}

function renderSelPanel(){

  const sel = S.selection;

  const id = sel.id;

    .concat(ROLES.map(r => `<option value="${r}"${r===role?' selected':''}>${r}</option>`))

    <h3>${esc(sel.name || sel.id)}</h3>

        <input id="fTimeP50" type="number" min="0" step="1" placeholder="p50 ms" value="${time && time.p50Ms != null ? esc(time.p50Ms) : ''}">
        <input id="fTimeP99" type="number" min="0" step="1" placeholder="p99 ms" value="${time && time.p99Ms != null ? esc(time.p99Ms) : ''}">
      </div>
      <input id="fTimeSrc" placeholder="source (telemetry, sla, guess…)" value="${esc((time&&time.source)||'')}" style="margin-top:6px">
    </div>

      <label>Flows</label>
      <div class="flow-chips">

          const inFlow = (f.nodes||[]).includes(id);
          const cls = inFlow ? 'flow-chip on' : 'flow-chip';
          return `<button type="button" class="${cls}" data-fi="${i}" title="${inFlow?'Remove from':'Add to'} ${esc(f.id)} (${esc(f.kind||'primary')})">${esc(f.id)} <span class="pill inferred">${esc(f.kind||'primary')}</span></button>`;
        }).join(' ') || '<span class="muted">no flows yet</span>'}
      </div>
      <div class="row" style="margin-top:6px; gap:6px">

      </div>
      <div class="hint">Click a chip to toggle membership. Rename, reorder, and delete on the Flows tab.</div>
    </div>

    <div class="field">
      <label>Clusters</label>
      <div class="flow-chips">
        ${(S.ann.clusters||[]).map((c, i) => {
          const inCluster = (c.nodes||[]).includes(id);
          const cls = inCluster ? 'flow-chip on' : 'flow-chip';
          const aff = (typeof c.affinity === 'number') ? c.affinity : 0.5;
          return `<button type="button" class="${cls}" data-ci="${i}" title="${inCluster?'Remove from':'Add to'} ${esc(c.id)} (affinity ${aff})">${esc(c.id)} <span class="pill inferred">${esc(aff)}</span></button>`;

function applySelPanel(id){
  const roleVal = $('#fRole').value;
  const cVal = $('#fCostVal').value.trim();
  const cCcy = $('#fCostCcy').value.trim();
  const cPer = $('#fCostPer').value.trim();
  const tP50 = $('#fTimeP50').value.trim();
  const tP99 = $('#fTimeP99').value.trim();
  const tSrc = $('#fTimeSrc').value.trim();

  mutate(a => {
    a.roles = a.roles || {}; a.costs = a.costs || {}; a.times = a.times || {};
    if(roleVal) a.roles[id] = roleVal; else delete a.roles[id];
    if(cVal !== ''){
      const v = Number(cVal);
      if(!isFinite(v)){ toast('cost value must be a number'); return; }
      const c = { value: v };
      if(cCcy) c.currency = cCcy;
      if(cPer) c.per = cPer;
      a.costs[id] = c;
    } else { delete a.costs[id]; }
    if(tP50 !== '' || tP99 !== '' || tSrc){
      const t = {};
      if(tP50 !== ''){ const n = Number(tP50); if(!Number.isInteger(n)||n<0){ toast('p50 must be a non-negative integer'); return; } t.p50Ms = n; }
      if(tP99 !== ''){ const n = Number(tP99); if(!Number.isInteger(n)||n<0){ toast('p99 must be a non-negative integer'); return; } t.p99Ms = n; }
      if(tSrc) t.source = tSrc;
      if(Object.keys(t).length) a.times[id] = t; else delete a.times[id];
    } else { delete a.times[id]; }
  });
  toast('applied — remember to Save');
}

function clearSel(id){
  mutate(a => {
    if(a.roles) delete a.roles[id];
    if(a.costs) delete a.costs[id];
    if(a.times) delete a.times[id];
  });
  renderSelPanel();
  toast('cleared — remember to Save');
}

function mutate(fn){
  const next = deepClone(S.ann);
  fn(next);
  S.ann = next;
  renderTab();
  schedulePreviewRefresh();
}

// ── Semantics Curator (LLM assistant, slice 12) ─────────────────────────
// The Curator is a workbench-scoped LLM helper that proposes STRUCTURAL
// annotations (flows/clusters/roles). Cost/time proposals are out of scope
// by design and stripped server-side (see processos/src/curator.rs). The
// pane is a collapsible strip inserted between the header btnrow and the
// workbench grid — it survives model reloads because `#curatorPane` lives
// outside `#wbHost`.

function toggleCurator(){
  S.curator.open = !S.curator.open;
  renderCuratorPane();
}

function renderCuratorPane(){
  const host = $('#curatorPane');
  if(!host) return;
  if(!S.curator.open){
    host.style.display = 'none';
    host.innerHTML = '';
    return;
  }
  host.style.display = 'block';
  const c = S.curator;
  const spin = c.running ? '<span class="cur-spin">⏳</span>' : '';
  const err = c.lastError
    ? `<div class="err" style="margin:6px 0">${esc(c.lastError)}</div>` : '';
  const chatRows = c.chatHistory.length
    ? c.chatHistory.slice(-6).map(t => {
        const roleClass = t.role === 'user' ? 'cur-msg-user' : 'cur-msg-asst';
        // Assistant messages are raw JSON — truncate for the transcript view.
        const preview = t.role === 'assistant' && t.content.length > 200
          ? t.content.slice(0, 200) + '…' : t.content;
        return `<div class="cur-msg ${roleClass}"><span class="cur-role">${esc(t.role)}</span>${esc(preview)}</div>`;
      }).join('')
    : '<div class="muted" style="font-size:12px">No conversation yet — pick an axis to propose, or send a freeform note.</div>';
  const disabled = c.running ? 'disabled' : '';

  host.innerHTML = `
    <div class="cur-pane">
      <div class="cur-head">
        <strong>🤖 Semantics Curator</strong>
        <span class="muted" style="font-size:11.5px">structural axes only — no costs or times</span>
        ${spin}
        <button class="cur-close" title="Close" onclick="toggleCurator()">✕</button>
      </div>
      <div class="cur-body">
        <div class="cur-actions">
          <label class="rlbl">Propose for axis</label>
          <button data-axis="flows"    ${disabled}>Flows</button>
          <button data-axis="clusters" ${disabled}>Clusters</button>
          <button data-axis="roles"    ${disabled}>Roles</button>
          <input id="curInput" type="text" placeholder="Optional refinement, e.g. &quot;keep the happy flow short&quot;"
                 style="flex:1; min-width:180px" ${disabled}>
        </div>
        ${err}
        <div class="cur-chat">${chatRows}</div>
        ${renderCuratorProposal()}
      </div>
    </div>`;

  host.querySelectorAll('.cur-actions button[data-axis]').forEach(b => {
    b.onclick = () => proposeCurator(b.dataset.axis, $('#curInput').value.trim());
  });
  const input = host.querySelector('#curInput');
  if(input){
    input.onkeydown = ev => {
      // Enter alone = propose for the current proposal's axis, or "flows" by default.
      if(ev.key === 'Enter'){
        ev.preventDefault();
        const axis = (c.proposal && c.proposal.axis) || 'flows';
        proposeCurator(axis, input.value.trim());
      }
    };
  }
  wireProposalOverlay(host);
}

function renderCuratorProposal(){
  const p = S.curator.proposal;
  if(!p) return '';
  const items = proposalItems(p.axis, p.payload);
  if(!items.length){
    return `<div class="cur-proposal">
      <div class="cur-head" style="border:0"><strong>Proposal (${esc(p.axis)})</strong><span class="muted">— empty (nothing to add)</span></div>
    </div>`;
  }
  const rows = items.map((it, i) => `
    <label class="cur-item">
      <input type="checkbox" data-cur-i="${i}" ${p.selected[i] === false ? '' : 'checked'}>
      <span class="cur-item-body">${it.html}</span>
    </label>`).join('');
  const anySel = items.some((_, i) => p.selected[i] !== false);
  return `
    <div class="cur-proposal">
      <div class="cur-head" style="border:0">
        <strong>Proposal (${esc(p.axis)})</strong>
        <span class="muted">— ${items.length} item${items.length===1?'':'s'}, check to accept</span>
      </div>
      <div class="cur-items">${rows}</div>
      <div class="cur-foot">
        <button class="primary cur-apply" ${anySel?'':'disabled'}>Apply selected</button>
        <button class="cur-dismiss">Dismiss</button>
        <span class="muted" style="font-size:11.5px">Accepted items merge into your working copy — Save persists them.</span>
      </div>
    </div>`;
}

// Enumerate the diffable items in a proposal. Each item has:
//   { html: rendered summary, apply: function(annDraft) -> mutates draft to accept the item }
// Order matters for stable checkbox indexing across re-renders.
function proposalItems(axis, payload){
  if(axis === 'flows'){
    const flows = Array.isArray(payload && payload.flows) ? payload.flows : [];
    // Match by id against the current working copy: existing id → "update",
    // new id → "add". Deletes are NOT surfaced (Curator only proposes what
    // to keep/add; the human dismisses irrelevant items via the ☐).
    const byId = new Map((S.ann.flows||[]).map(f => [f.id, f]));
    return flows.map(f => {
      const existing = byId.get(f.id);
      const label = existing ? 'update' : 'add';
      const nodes = (f.nodes||[]).map(esc).join(' → ') || '<span class="muted">(no nodes)</span>';
      return {
        html: `<span class="cur-tag cur-tag-${label}">${label}</span>
               <code>${esc(f.id)}</code> · <em>${esc(f.kind || 'primary')}</em>
               <div class="cur-detail">${nodes}</div>`,
        apply: (draft) => {
          draft.flows = draft.flows || [];
          const i = draft.flows.findIndex(x => x.id === f.id);
          const clean = { id: f.id, kind: f.kind || 'primary', nodes: Array.isArray(f.nodes) ? f.nodes.slice() : [] };
          if(i >= 0) draft.flows[i] = clean; else draft.flows.push(clean);
        },
      };
    });
  }
  if(axis === 'clusters'){
    const clusters = Array.isArray(payload && payload.clusters) ? payload.clusters : [];
    const byId = new Map((S.ann.clusters||[]).map(c => [c.id, c]));
    return clusters.map(c => {
      const existing = byId.get(c.id);
      const label = existing ? 'update' : 'add';
      const nodes = (c.nodes||[]).map(esc).join(', ') || '<span class="muted">(no nodes)</span>';
      const aff = (typeof c.affinity === 'number') ? c.affinity.toFixed(2) : '0.50';
      return {
        html: `<span class="cur-tag cur-tag-${label}">${label}</span>
               <code>${esc(c.id)}</code> · affinity ${esc(aff)}
               <div class="cur-detail">${nodes}</div>`,
        apply: (draft) => {
          draft.clusters = draft.clusters || [];
          const i = draft.clusters.findIndex(x => x.id === c.id);
          const clean = { id: c.id, nodes: Array.isArray(c.nodes) ? c.nodes.slice() : [], affinity: typeof c.affinity === 'number' ? c.affinity : 0.5 };
          if(i >= 0) draft.clusters[i] = clean; else draft.clusters.push(clean);
        },
      };
    });
  }
  if(axis === 'roles'){
    const roles = (payload && payload.roles && typeof payload.roles === 'object') ? payload.roles : {};
    return Object.entries(roles).map(([id, role]) => {
      const existing = (S.ann.roles||{})[id];
      const label = existing ? (existing === role ? 'noop' : 'update') : 'add';
      return {
        html: `<span class="cur-tag cur-tag-${label}">${label}</span>
               <code>${esc(id)}</code> → <em>${esc(role)}</em>${existing && existing !== role ? ` <span class="muted">(was ${esc(existing)})</span>` : ''}`,
        apply: (draft) => {
          draft.roles = draft.roles || {};
          draft.roles[id] = role;
        },
      };
    });
  }
  return [];
}

function wireProposalOverlay(host){
  const p = S.curator.proposal;
  if(!p) return;
  host.querySelectorAll('.cur-item input[type="checkbox"][data-cur-i]').forEach(cb => {
    cb.onchange = () => {
      p.selected[+cb.dataset.curI] = cb.checked;
      renderCuratorPane(); // re-render to update the "Apply selected" enabled state
    };
  });
  const apply = host.querySelector('.cur-apply');
  if(apply) apply.onclick = applyCuratorProposal;
  const dismiss = host.querySelector('.cur-dismiss');
  if(dismiss) dismiss.onclick = () => { S.curator.proposal = null; renderCuratorPane(); };
}

async function proposeCurator(axis, userMessage){
  if(!['flows','clusters','roles'].includes(axis)){
    S.curator.lastError = `unknown axis: ${axis}`;
    renderCuratorPane();
    return;
  }
  if(!S.xml){
    S.curator.lastError = 'no BPMN model loaded to reason about';
    renderCuratorPane();
    return;
  }
  S.curator.running = true;
  S.curator.lastError = null;
  renderCuratorPane();
  try {
    const body = {
      xml: S.xml,
      axis,
      currentAnnotations: S.ann,
      chatHistory: S.curator.chatHistory,
      userMessage: userMessage || null,
    };
    const res = await fetch('/api/curator/propose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await res.json().catch(() => ({}));
    if(!res.ok){
      S.curator.lastError = j.error || `${res.status} ${res.statusText}`;
      // Even on parse errors the server returns assistantText — persist it so
      // the operator can see what the model wrote and correct with a
      // refinement.
      if(j.assistantText){
        if(userMessage) S.curator.chatHistory.push({ role: 'user', content: userMessage });
        S.curator.chatHistory.push({ role: 'assistant', content: j.assistantText });
      }
      return;
    }
    const items = proposalItems(axis, j.proposal);
    const selected = {};
    items.forEach((_, i) => { selected[i] = true; });
    S.curator.proposal = {
      axis,
      payload: j.proposal,
      selected,
      receivedAt: Date.now(),
    };
    if(Array.isArray(j.chatHistory)) S.curator.chatHistory = j.chatHistory;
  } catch(e){
    S.curator.lastError = e.message || String(e);
  } finally {
    S.curator.running = false;
    renderCuratorPane();
    // Clear the input after send.
    const input = $('#curInput');
    if(input) input.value = '';
  }
}

function applyCuratorProposal(){
  const p = S.curator.proposal;
  if(!p) return;
  const items = proposalItems(p.axis, p.payload);
  const accepted = items.filter((_, i) => p.selected[i] !== false);
  if(!accepted.length) return;
  mutate(draft => {
    accepted.forEach(it => it.apply(draft));
  });
  S.curator.proposal = null;
  renderCuratorPane();
  toast(`Curator: applied ${accepted.length} ${p.axis} item${accepted.length===1?'':'s'} — remember to Save`);
}


// ── Flow mutators ────────────────────────────────────────────────────────
// All flow edits go through mutate() so undo/save-with-diff see them as one
// coherent working-copy transition. Sel panel + flows tab both re-render on
// each mutation so membership pills stay in sync with the table rows.

function nextFlowId(existing, kind){
  const taken = new Set((existing || []).map(f => f.id));
  const base = kind || 'flow';
  if(!taken.has(base)) return base;
  let n = 2;
  while(taken.has(`${base}_${n}`)) n++;
  return `${base}_${n}`;
}

function createFlow(kind, seedNodeId){
  const k = FLOW_KINDS.includes(kind) ? kind : 'primary';
  mutate(a => {
    a.flows = a.flows || [];
    const id = nextFlowId(a.flows, k);
    const nodes = seedNodeId ? [seedNodeId] : [];
    a.flows.push({ id, kind: k, nodes });
  });
  renderSelPanel();
  toast(`added ${k} flow`);
}

function deleteFlow(idx){
  mutate(a => {
    if(!Array.isArray(a.flows) || idx < 0 || idx >= a.flows.length) return;
    a.flows.splice(idx, 1);
  });
  renderSelPanel();
}

function setFlowId(idx, id){
  const clean = (id || '').replace(/\s+/g, '_');
  if(!clean){ toast('flow id cannot be empty'); renderTab(); return; }
  mutate(a => {
    if(!Array.isArray(a.flows) || idx < 0 || idx >= a.flows.length) return;
    // Enforce uniqueness — bail (with a toast) if the new id collides.
    if(a.flows.some((f, i) => i !== idx && f.id === clean)){
      toast(`another flow already uses id "${clean}"`);
      return;
    }
    a.flows[idx].id = clean;
  });
  renderSelPanel();
}

function setFlowKind(idx, kind){
  if(!FLOW_KINDS.includes(kind)) return;
  mutate(a => {
    if(!Array.isArray(a.flows) || idx < 0 || idx >= a.flows.length) return;
    a.flows[idx].kind = kind;
  });
  renderSelPanel();
}

function toggleFlowMember(idx, elId){
  mutate(a => {
    if(!Array.isArray(a.flows) || idx < 0 || idx >= a.flows.length) return;
    const f = a.flows[idx];
    f.nodes = Array.isArray(f.nodes) ? f.nodes.slice() : [];
    const at = f.nodes.indexOf(elId);
    if(at >= 0) f.nodes.splice(at, 1);
    else f.nodes.push(elId);
  });
  renderSelPanel();
}

function removeFlowNode(idx, nodeIdx){
  mutate(a => {
    if(!Array.isArray(a.flows) || idx < 0 || idx >= a.flows.length) return;
    const f = a.flows[idx];
    if(!Array.isArray(f.nodes) || nodeIdx < 0 || nodeIdx >= f.nodes.length) return;
    f.nodes.splice(nodeIdx, 1);
  });
  renderSelPanel();
}

function moveFlowNode(idx, nodeIdx, dir){
  mutate(a => {
    if(!Array.isArray(a.flows) || idx < 0 || idx >= a.flows.length) return;
    const f = a.flows[idx];
    if(!Array.isArray(f.nodes)) return;
    const j = nodeIdx + dir;
    if(nodeIdx < 0 || nodeIdx >= f.nodes.length || j < 0 || j >= f.nodes.length) return;
    const tmp = f.nodes[nodeIdx]; f.nodes[nodeIdx] = f.nodes[j]; f.nodes[j] = tmp;
  });
}

// ── Cluster mutators ─────────────────────────────────────────────────────
// Mirror the flow mutators but without a `kind` axis; clusters carry an
// `affinity` (0..1, default 0.5) that scales the spring stiffness pulling
// members toward the group centroid.

function nextClusterId(existing){
  const taken = new Set((existing || []).map(c => c.id));
  const base = 'cluster';
  if(!taken.has(base)) return base;
  let n = 2;
  while(taken.has(`${base}_${n}`)) n++;
  return `${base}_${n}`;
}

function createCluster(seedNodeId){
  mutate(a => {
    a.clusters = a.clusters || [];
    const id = nextClusterId(a.clusters);
    const nodes = seedNodeId ? [seedNodeId] : [];
    a.clusters.push({ id, nodes, affinity: 0.5 });
  });
  renderSelPanel();
  toast('added cluster');
}

function deleteCluster(idx){
  mutate(a => {
    if(!Array.isArray(a.clusters) || idx < 0 || idx >= a.clusters.length) return;
    a.clusters.splice(idx, 1);
  });
  renderSelPanel();
}

function setClusterId(idx, id){
  const clean = (id || '').replace(/\s+/g, '_');
  if(!clean){ toast('cluster id cannot be empty'); renderTab(); return; }
  mutate(a => {
    if(!Array.isArray(a.clusters) || idx < 0 || idx >= a.clusters.length) return;
    if(a.clusters.some((c, i) => i !== idx && c.id === clean)){
      toast(`another cluster already uses id "${clean}"`);
      return;
    }
    a.clusters[idx].id = clean;
  });
  renderSelPanel();
}

function setClusterAffinity(idx, val){
  const n = Number(val);
  if(!isFinite(n) || n < 0 || n > 1){ toast('affinity must be a number in [0, 1]'); renderTab(); return; }
  mutate(a => {
    if(!Array.isArray(a.clusters) || idx < 0 || idx >= a.clusters.length) return;
    a.clusters[idx].affinity = n;
  });
}

function toggleClusterMember(idx, elId){
  mutate(a => {
    if(!Array.isArray(a.clusters) || idx < 0 || idx >= a.clusters.length) return;
    const c = a.clusters[idx];
    c.nodes = Array.isArray(c.nodes) ? c.nodes.slice() : [];
    const at = c.nodes.indexOf(elId);
    if(at >= 0) c.nodes.splice(at, 1);
    else c.nodes.push(elId);
  });
  renderSelPanel();
}

function removeClusterNode(idx, nodeIdx){
  mutate(a => {
    if(!Array.isArray(a.clusters) || idx < 0 || idx >= a.clusters.length) return;
    const c = a.clusters[idx];
    if(!Array.isArray(c.nodes) || nodeIdx < 0 || nodeIdx >= c.nodes.length) return;
    c.nodes.splice(nodeIdx, 1);
  });
  renderSelPanel();
}

function toast(msg){
  const el = $('#saveStatus');
  if(!el) return;
  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { if(el.textContent === msg) el.textContent = ''; }, 3500);
}

// ── Revert + Save ────────────────────────────────────────────────────────
async function revert(){
  const base = `/api/workspaces/${encodeURIComponent(S.ws)}/processes/${encodeURIComponent(S.proc)}`;
  await loadModelAndAnnotations(base);
  toast('reloaded from disk');
}

function openSaveDialog(){
  const diff = computeDiff(S.loaded || emptyAnn(), S.ann);
  const nothing = !diff.length;
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <b>Save annotations</b>
        <span class="muted">for revision <code>${esc((S.revision||'').slice(0, 16))}…</code></span>
      </div>
      <div class="modal-body">
        <div class="row" style="margin-bottom:10px">
          <label>Provenance</label>
          <select id="dlgProv">
            <option value="human" selected>human</option>
            <option value="mixed">mixed</option>
            <option value="inferred">inferred</option>
            <option value="llm">llm</option>
          </select>
        </div>
        ${nothing ? '<p class="muted">No changes since the last load. Saving now will re-stamp <code>updatedAt</code> and (optionally) change provenance.</p>' : `<div class="diff">${diff.map(diffBlockHtml).join('')}</div>`}
      </div>
      <div class="modal-foot">
        <button id="dlgCancel">Cancel</button>
        <button class="primary" id="dlgSave">${nothing ? 'Re-save' : 'Save'}</button>
      </div>
    </div>`;
  document.body.appendChild(scrim);
  scrim.querySelector('#dlgCancel').onclick = () => scrim.remove();
  scrim.addEventListener('click', e => { if(e.target === scrim) scrim.remove(); });
  scrim.querySelector('#dlgSave').onclick = async () => {
    const provenance = scrim.querySelector('#dlgProv').value;
    const btn = scrim.querySelector('#dlgSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await api(`/api/workspaces/${encodeURIComponent(S.ws)}/processes/${encodeURIComponent(S.proc)}/annotations`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ annotations: S.ann, provenance }),
      });
      // Refresh baseline from the server's response so subsequent diffs are
      // relative to what actually landed on disk.
      S.sidecar = res.sidecar;
      S.revision = res.revision;
      S.loaded = deepClone((res.entry && res.entry.annotations) || S.ann);
      S.provenance = (res.entry && res.entry.provenance) || provenance;
      S.loadedAt = (res.entry && res.entry.updatedAt) || null;
      S.driftBanner = false;
      scrim.remove();
      render();
      toast(`saved @ ${(res.revision||'').slice(0,8)}`);
    } catch(e){
      btn.disabled = false; btn.textContent = 'Save';
      const foot = scrim.querySelector('.modal-foot');
      const err = document.createElement('span'); err.className = 'err'; err.textContent = ' '+((e&&e.message)||e); err.style.marginRight = 'auto';
      foot.prepend(err);
    }
  };
}

// ── Diff ────────────────────────────────────────────────────────────────
// Reports each per-key delta in the three per-element maps (roles / costs /
// times) and enumerates per-flow / per-cluster adds / removes / renames /
// kind or affinity changes / node membership changes.
function computeDiff(a, b){
  const items = [];
  diffMap('roles', a.roles || {}, b.roles || {}, items, v => String(v));
  diffMap('costs', a.costs || {}, b.costs || {}, items, v => JSON.stringify(v));
  diffMap('times', a.times || {}, b.times || {}, items, v => JSON.stringify(v));
  diffFlows(a.flows || [], b.flows || [], items);
  diffClusters(a.clusters || [], b.clusters || [], items);
  return items;
}

// Match flows by id when possible so a node-list edit shows as one change,
// not a delete + re-add. Unmatched entries are add/remove blocks.
function diffFlows(before, after, items){
  const lines = [];
  const byIdA = new Map(before.map((f, i) => [f.id || 'flow_'+i, f]));
  const byIdB = new Map(after.map((f, i)  => [f.id || 'flow_'+i, f]));
  const keys = new Set([...byIdA.keys(), ...byIdB.keys()]);
  Array.from(keys).sort().forEach(k => {
    const fa = byIdA.get(k), fb = byIdB.get(k);
    if(fa && !fb){
      lines.push(rem(`${k} (${fa.kind||'primary'}): ${JSON.stringify(fa.nodes||[])}`));
    } else if(!fa && fb){
      lines.push(add(`${k} (${fb.kind||'primary'}): ${JSON.stringify(fb.nodes||[])}`));
    } else if(fa && fb){
      const kindA = fa.kind || 'primary', kindB = fb.kind || 'primary';
      const nodesA = JSON.stringify(fa.nodes||[]), nodesB = JSON.stringify(fb.nodes||[]);
      if(kindA !== kindB) lines.push(ctx(`${k}: kind ${kindA} → ${kindB}`));
      if(nodesA !== nodesB){
        lines.push(rem(`${k}.nodes: ${nodesA}`));
        lines.push(add(`${k}.nodes: ${nodesB}`));
      }
    }
  });
  if(lines.length) items.push({ head: 'flows', lines });
}

// Same shape as diffFlows but with `affinity` instead of `kind`.
function diffClusters(before, after, items){
  const lines = [];
  const affOf = c => (typeof c.affinity === 'number') ? c.affinity : 0.5;
  const byIdA = new Map(before.map((c, i) => [c.id || 'cluster_'+i, c]));
  const byIdB = new Map(after.map((c, i)  => [c.id || 'cluster_'+i, c]));
  const keys = new Set([...byIdA.keys(), ...byIdB.keys()]);
  Array.from(keys).sort().forEach(k => {
    const ca = byIdA.get(k), cb = byIdB.get(k);
    if(ca && !cb){
      lines.push(rem(`${k} (affinity ${affOf(ca)}): ${JSON.stringify(ca.nodes||[])}`));
    } else if(!ca && cb){
      lines.push(add(`${k} (affinity ${affOf(cb)}): ${JSON.stringify(cb.nodes||[])}`));
    } else if(ca && cb){
      const affA = affOf(ca), affB = affOf(cb);
      const nodesA = JSON.stringify(ca.nodes||[]), nodesB = JSON.stringify(cb.nodes||[]);
      if(affA !== affB) lines.push(ctx(`${k}: affinity ${affA} → ${affB}`));
      if(nodesA !== nodesB){
        lines.push(rem(`${k}.nodes: ${nodesA}`));
        lines.push(add(`${k}.nodes: ${nodesB}`));
      }
    }
  });
  if(lines.length) items.push({ head: 'clusters', lines });
}

function diffMap(name, before, after, items, fmt){
  const keys = new Set([...Object.keys(before), ...Object.keys(after)]);
  const lines = [];
  Array.from(keys).sort().forEach(k => {
    const inA = k in before, inB = k in after;
    if(inA && inB && fmt(before[k]) !== fmt(after[k])){
      lines.push(rem(`${k}: ${fmt(before[k])}`));
      lines.push(add(`${k}: ${fmt(after[k])}`));
    } else if(!inA && inB){
      lines.push(add(`${k}: ${fmt(after[k])}`));
    } else if(inA && !inB){
      lines.push(rem(`${k}: ${fmt(before[k])}`));
    }
  });
  if(lines.length) items.push({ head: name, lines });
}
const add = t => ({ kind:'add', text:t });
const rem = t => ({ kind:'rem', text:t });
const ctx = t => ({ kind:'ctx', text:t });
function diffBlockHtml(item){
  return `<div><b>${esc(item.head)}</b><pre>${item.lines.map(l => `<span class="${l.kind}">${l.kind==='add'?'+ ':l.kind==='rem'?'- ':'  '}${esc(l.text)}</span>`).join('\n')}</pre></div>`;
}

// ── Router + boot ────────────────────────────────────────────────────────
function route(){
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^\/c\/([^/]+)\/p\/([^/]+)/);
  if(m) return load(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
  const qs = new URLSearchParams(location.search);
  const ws = qs.get('workspace'); const proc = qs.get('process');
  if(ws && proc) return load(ws, proc);
  $('#app').innerHTML = `
    <h1>Semantics Workbench</h1>
    <p class="lede">Pick a process to annotate. The workbench reads and writes <code>annotations.json</code> in the process folder.</p>
    <p class="muted">Open a process from the <a href="/workspace" style="color:var(--po-accent-strong)">Workspaces</a> page, then click Semantics — or jump straight in via <code>#/c/&lt;workspace&gt;/p/&lt;process&gt;</code>.</p>`;
}
window.addEventListener('hashchange', route);
route();
