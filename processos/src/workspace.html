<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nano ProcessOS — Workspaces</title>
<link rel="stylesheet" href="/assets/theme.css" />
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/bpmn/diagram-js.css" />
<link rel="stylesheet" href="/assets/bpmn/bpmn-embedded.css" />
<style>
  /* All colours resolve through the --po-* design tokens (/assets/theme.css); the
     light/dark/system choice is applied by /assets/theme.js before first paint. */
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--po-app); color: var(--po-text); }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .rail { border-right: 1px solid var(--po-edge); padding: 18px 14px; background: var(--po-panel); }
  .rail .brand { display: block; font-weight: 700; font-size: 16px; letter-spacing: .02em; margin-bottom: 2px; }
  .brand .dot { color: var(--po-accent-strong); }
  .rail .tag { color: var(--po-text-faint); font-size: 11px; margin-bottom: 20px; display: block; }
  .nav a { display: block; padding: 7px 10px; border-radius: 7px; color: var(--po-text-muted); font-weight: 500; margin-bottom: 2px; }
  .nav a:hover { background: var(--po-hover); color: var(--po-text); }
  .nav a.active { background: var(--po-hover); color: var(--po-accent-soft); }
  .nav a.with-dot { display: flex; align-items: center; }
  .dot-status { width: 9px; height: 9px; border-radius: 50%; margin-left: auto; flex: none; background: var(--po-text-faint); box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .dot-status.on { background: var(--po-ok); box-shadow: 0 0 0 2px rgba(34,197,94,.18); }
  .dot-status.off { background: var(--po-warn); box-shadow: 0 0 0 2px rgba(234,179,8,.16); }
  main { padding: 24px 30px; max-width: 1100px; }
  .crumbs { color: var(--po-text-faint); font-size: 12px; margin-bottom: 14px; }
  .crumbs a { color: var(--po-accent-strong); cursor: pointer; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: var(--po-text-muted); font-size: 13px; margin: 0 0 18px; max-width: 760px; }
  h2 { font-size: 12px; color: var(--po-text-muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; }
  .tile { background: var(--po-raised); border: 1px solid var(--po-edge); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .tile:hover { border-color: var(--po-accent-edge); transform: translateY(-1px); }
  .tile h3 { margin: 0 0 4px; font-size: 15px; color: var(--po-accent-soft); }
  .tile .meta { color: var(--po-text-faint); font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .pill.live { background: var(--po-info-wash); color: var(--po-info-soft); }
  .pill.dataset { background: var(--po-ok-wash); color: var(--po-ok-soft); }
  .pill.unbound { background: var(--po-danger-wash); color: var(--po-danger-soft); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--po-edge-strong); background: var(--po-hover); color: var(--po-text); padding: 7px 13px; }
  button.primary { background: var(--po-accent); border-color: var(--po-accent); color: var(--po-on-accent); }
  button:hover { filter: brightness(1.1); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, textarea, select { font: inherit; background: var(--po-inset); border: 1px solid var(--po-edge); color: var(--po-text); border-radius: 8px; padding: 7px 10px; }
  input, select { min-width: 220px; }
  .dialog { background: var(--po-raised); border: 1px solid var(--po-edge); border-radius: 10px; padding: 16px; margin: 14px 0; max-width: 560px; }
  .dialog label { display: block; font-size: 12px; color: var(--po-text-muted); margin: 10px 0 3px; }
  .dialog input, .dialog textarea, .dialog select { width: 100%; }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 10px; margin-top: 6px; }
  .demo-card { background: var(--po-hover); border: 1px solid var(--po-edge); border-radius: 9px; padding: 12px 14px; display: flex; flex-direction: column; }
  .demo-card h4 { margin: 0 0 6px; font-size: 13px; color: var(--po-accent-soft); }
  .demo-card p { margin: 0 0 10px; font-size: 12px; line-height: 1.4; flex: 1; }
  .demo-card button { align-self: flex-start; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .card { background: var(--po-raised); border: 1px solid var(--po-edge); border-radius: 10px; padding: 12px 16px; min-width: 110px; }
  .card .n { font-size: 22px; font-weight: 650; }
  .card .l { color: var(--po-text-faint); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 6px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--po-edge); }
  th { color: var(--po-text-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .err { color: var(--po-danger-soft); font-size: 13px; margin: 10px 0; }
  .muted { color: var(--po-text-faint); }
  code { font-family: ui-monospace, monospace; color: var(--po-accent-soft); }
  .model { height: 420px; background: #fbfbfd; border: 1px solid var(--po-edge); border-radius: 10px; margin: 8px 0 4px; overflow: hidden; }
  .model .djs-container { background: #fbfbfd; }
  .panel { background: var(--po-raised); border: 1px solid var(--po-edge); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .panel h2 { margin-top: 0; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 0; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="/">Nano Process<span class="dot">OS</span></a>
    <span class="tag">the cockpit</span>
    <nav class="nav">
      <a href="/workspace" class="active">Workspaces</a>
      <a href="/cockpit?view=console">Console</a>
      <a href="/cockpit?view=processes">Processes</a>
      <a href="/cockpit?view=prompts">Prompts</a>
      <a href="/cockpit?view=experiments">Experiments</a>
      <a href="/cockpit?view=sidecars" class="with-dot">LLMs <span class="dot-status off" id="navLlamaDot" title="local sidecar: off"></span></a>
    </nav>
    <div id="railTheme" style="margin-top:18px"></div>
  </aside>
  <main id="app">Loading…</main>
</div>

<script src="/assets/bpmn/bpmn-navigated-viewer.js"></script>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || (r.status + ' ' + r.statusText));
  return body;
}

function bindingPill(b) { return `<span class="pill ${b}">${b}</span>`; }

// --- workspaces list ----------------------------------------------------
async function viewWorkspaces() {
  app.innerHTML = 'Loading…';
  let data;
  try { data = await api('/api/workspaces'); }
  catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  const tiles = data.workspaces.map(c => `
    <div class="tile" data-c="${esc(c.slug)}">
      <h3>${esc(c.displayName || c.slug)}</h3>
      <div class="meta">${c.processCount} process${c.processCount === 1 ? '' : 'es'} · <code>${esc(c.slug)}</code></div>
    </div>`).join('');

  app.innerHTML = `
    <h1>Workspaces</h1>
    <p class="lede">A workspace is a bounded context for one customer/deployment — a folder under <code>${esc(data.root)}</code>. Inside it you connect to a live Nano instance or load captured processes and traces, then drill into a process to study its model, its insights, and reason over it with the droid in the cockpit.</p>
    <div class="btnrow">
      <button class="primary" id="newC">+ New workspace</button>
      <button id="seed">Load demo dataset</button>
    </div>
    <div id="dlg"></div>
    <h2>Workspaces</h2>
    <div class="grid">${tiles || '<p class="muted">No workspaces yet — create one, or load a demo dataset to begin.</p>'}</div>`;

  app.querySelectorAll('.tile[data-c]').forEach(t =>
    t.onclick = () => location.hash = '#/c/' + t.dataset.c);
  document.getElementById('newC').onclick = () => showNewWorkspace();
  document.getElementById('seed').onclick = () => showDemoPicker();
}

async function showDemoPicker() {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '<div class="dialog">Loading demo datasets…</div>';
  let data;
  try { data = await api('/api/workspaces/demo-datasets'); }
  catch (e) { dlg.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  const cards = (data.datasets || []).map(d => `
    <div class="demo-card" data-id="${esc(d.id)}">
      <h4>${esc(d.workspace)} · ${esc(d.process)}</h4>
      <p class="muted">${esc(d.description || '')}</p>
      <button class="primary demo-load" data-id="${esc(d.id)}">Load</button>
    </div>`).join('');

  const el = $(`<div class="dialog">
    <label>Choose a demo scenario to generate and explore</label>
    <div class="demo-grid">${cards || '<p class="muted">No demo datasets bundled.</p>'}</div>
    <div class="row" style="margin-top:12px"><button id="democancel">Cancel</button></div>
    <div class="err" id="demoerr"></div></div>`);
  dlg.innerHTML = '';
  dlg.appendChild(el);
  el.querySelector('#democancel').onclick = () => dlg.innerHTML = '';
  el.querySelectorAll('.demo-load').forEach(b =>
    b.onclick = () => seedDemo(b, b.dataset.id));
}

async function seedDemo(btn, dataset) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Generating demo corpus…';
  try {
    const r = await api('/api/workspaces/seed-demo', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ dataset })
    });
    location.hash = '#/c/' + r.workspace + '/p/' + r.process;
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    const err = document.getElementById('demoerr') || document.getElementById('dlg');
    if (err) err.textContent = e.message;
  }
}

function showNewWorkspace() {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '';
  const el = $(`<div class="dialog">
    <label>Display name</label><input id="cn" placeholder="Northwind Bank" />
    <label>Notes (optional)</label><input id="cnotes" placeholder="priority account" />
    <div class="row" style="margin-top:12px"><button class="primary" id="save">Create</button><button id="cancel">Cancel</button></div>
    <div class="err" id="e"></div></div>`);
  dlg.appendChild(el);
  el.querySelector('#cancel').onclick = () => dlg.innerHTML = '';
  el.querySelector('#save').onclick = async () => {
    try {
      const c = await api('/api/workspaces', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ displayName: el.querySelector('#cn').value, notes: el.querySelector('#cnotes').value || null })
      });
      location.hash = '#/c/' + c.slug;
    } catch (e) { el.querySelector('#e').textContent = e.message; }
  };
}

// --- one workspace: its processes ---------------------------------------
async function viewWorkspace(slug) {
  app.innerHTML = 'Loading…';
  let data;
  try { data = await api('/api/workspaces/' + encodeURIComponent(slug)); }
  catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  const tiles = data.processes.map(p => `
    <div class="tile" data-p="${esc(p.slug)}">
      <h3>${esc(p.displayName || p.slug)} ${bindingPill(p.binding)}</h3>
      <div class="meta">${p.hasModel ? '◇ model · ' : ''}${p.objective ? esc(p.objective) + ' · ' : ''}<code>${esc(p.slug)}</code></div>
    </div>`).join('');

  app.innerHTML = `
    <div class="crumbs"><a id="up">Workspaces</a> / ${esc(data.workspace.displayName || slug)}</div>
    <h1>${esc(data.workspace.displayName || slug)}</h1>
    ${data.workspace.notes ? `<p class="lede">${esc(data.workspace.notes)}</p>` : ''}
    <div class="btnrow"><button class="primary" id="newP">+ New process</button></div>
    <div id="dlg"></div>
    <h2>Processes</h2>
    <div class="grid">${tiles || '<p class="muted">No processes yet — add one and bind it to a live engine or a trace dataset.</p>'}</div>`;

  document.getElementById('up').onclick = () => location.hash = '#/';
  app.querySelectorAll('.tile[data-p]').forEach(t =>
    t.onclick = () => location.hash = '#/c/' + slug + '/p/' + t.dataset.p);
  document.getElementById('newP').onclick = () => showNewProcess(slug);
}

function showNewProcess(workspace) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '';
  const el = $(`<div class="dialog">
    <label>Display name</label><input id="pn" placeholder="Order Fulfilment" />
    <label>Live target URL (optional — a customer/deployment Nano)</label><input id="pt" placeholder="http://customer-host:8080" />
    <label>Trace dataset folder (optional — used when no target URL)</label><input id="pd" placeholder="leave blank to use a traces/ folder beside the process" />
    <label>Objective (optional)</label><input id="po" placeholder="cut p99 latency" />
    <div class="row" style="margin-top:12px"><button class="primary" id="save">Create</button><button id="cancel">Cancel</button></div>
    <div class="muted" style="margin-top:8px;font-size:12px">Bind to a live engine <em>or</em> a dataset. Leave both blank to create the folder now and drop a <code>traces/</code> dataset and a <code>model.bpmn</code> in later.</div>
    <div class="err" id="e"></div></div>`);
  dlg.appendChild(el);
  el.querySelector('#cancel').onclick = () => dlg.innerHTML = '';
  el.querySelector('#save').onclick = async () => {
    try {
      const p = await api('/api/workspaces/' + encodeURIComponent(workspace) + '/processes', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          displayName: el.querySelector('#pn').value,
          targetUrl: el.querySelector('#pt').value || null,
          dataset: el.querySelector('#pd').value || null,
          objective: el.querySelector('#po').value || null
        })
      });
      location.hash = '#/c/' + workspace + '/p/' + p.slug;
    } catch (e) { el.querySelector('#e').textContent = e.message; }
  };
}

// --- one process: model + config + insights -----------------------------
async function viewProcess(workspace, process) {
  app.innerHTML = 'Loading…';
  let p;
  const base = `/api/workspaces/${encodeURIComponent(workspace)}/processes/${encodeURIComponent(process)}`;
  try { p = await api(base); }
  catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  const cockpitUrl = `/cockpit?workspace=${encodeURIComponent(workspace)}&process=${encodeURIComponent(process)}`;
  app.innerHTML = `
    <div class="crumbs"><a id="up0">Workspaces</a> / <a id="up1">${esc(workspace)}</a> / ${esc(p.displayName || process)}</div>
    <h1>${esc(p.displayName || process)} ${bindingPill(p.binding)}</h1>
    <p class="lede">
      Source: ${p.binding === 'live' ? `live <code>${esc(p.targetUrl)}</code>` : p.binding === 'dataset' ? `dataset <code>${esc(p.datasetPath)}</code>` : '<span class="muted">unbound — set a target URL or drop a traces/ dataset folder</span>'}
      ${p.objective ? ' · objective: ' + esc(p.objective) : ''}
    </p>
    <div class="btnrow">
      <a href="${cockpitUrl}"><button class="primary">Reason in cockpit →</button></a>
      <a href="/semantics#/c/${encodeURIComponent(workspace)}/p/${encodeURIComponent(process)}"><button ${p.hasModel ? '' : 'disabled title="needs a model.bpmn"'}>Edit semantics →</button></a>
      <button id="load" ${p.binding === 'unbound' ? 'disabled' : ''}>Load insights</button>
    </div>
    ${p.hasModel ? `<h2>Process model</h2><div class="model" id="model"></div>` : '<p class="muted" style="margin-top:14px">No <code>model.bpmn</code> for this process yet.</p>'}
    <div id="ins"></div>`;

  document.getElementById('up0').onclick = () => location.hash = '#/';
  document.getElementById('up1').onclick = () => location.hash = '#/c/' + workspace;
  const load = document.getElementById('load');
  if (load && !load.disabled) load.onclick = () => loadInsights(base);
  if (p.hasModel) renderModel(base + '/model');
}

async function renderModel(modelUrl) {
  const el = document.getElementById('model');
  if (!el || typeof BpmnJS === 'undefined') { if (el) el.innerHTML = '<p class="muted" style="padding:12px">viewer unavailable</p>'; return; }
  try {
    const xml = await (await fetch(modelUrl)).text();
    const viewer = new BpmnJS({ container: el });
    await viewer.importXML(xml);
    viewer.get('canvas').zoom('fit-viewport', 'auto');
  } catch (e) {
    el.innerHTML = `<p class="err" style="padding:12px">could not render model: ${esc(e.message || e)}</p>`;
  }
}

async function loadInsights(base) {
  const ins = document.getElementById('ins');
  ins.innerHTML = '<h2>Insights</h2><p class="muted">Reading traces…</p>';
  let r;
  try { r = await api(base + '/insights'); }
  catch (e) { ins.innerHTML = `<h2>Insights</h2><div class="err">${esc(e.message)}</div>`; return; }

  const t = r.totals;
  // Honest scope line: distinguish the true dataset size from how much of it was
  // analyzed for this report (full population for in-memory datasets; a bounded
  // most-recent window for a live gateway).
  let scope;
  if (r.datasetTotal != null) {
    scope = (r.sampledInstances >= r.datasetTotal)
      ? `${r.datasetTotal.toLocaleString()} instances · analyzed in full`
      : `${r.datasetTotal.toLocaleString()} instances · analyzed ${r.sampledInstances.toLocaleString()} (capped)`;
  } else {
    scope = `${t.instances.toLocaleString()} most-recent analyzed · element timing sampled from ${r.sampledInstances.toLocaleString()}`;
  }

  const cards = `<div class="cards">
    <div class="card"><div class="n">${(r.datasetTotal ?? t.instances).toLocaleString()}</div><div class="l">${r.datasetTotal != null ? 'dataset instances' : 'instances'}</div></div>
    <div class="card"><div class="n">${t.completed}</div><div class="l">completed</div></div>
    <div class="card"><div class="n">${t.active}</div><div class="l">active</div></div>
    <div class="card"><div class="n">${t.terminated}</div><div class="l">terminated</div></div>
    <div class="card"><div class="n">${t.incidents}</div><div class="l">incidents</div></div>
  </div>`;

  const procRows = (r.processes || []).map(pr => `
    <tr><td><code>${esc(pr.processId)}</code></td>
        <td class="num">${pr.instances}</td>
        <td class="num">${pr.avgDurationMs ?? '—'}</td>
        <td class="num">${pr.p95DurationMs ?? '—'}</td>
        <td>${pr.bottleneck ? esc(pr.bottleneck.elementId) : '<span class="muted">—</span>'}</td></tr>`).join('');

  ins.innerHTML = `
    <h2>Insights — <code>${esc(r.nanoBaseUrl)}</code></h2>
    <p class="muted" style="margin:-4px 0 10px">${scope}</p>
    ${cards}
    <table><thead><tr><th>process</th><th>instances</th><th>avg ms</th><th>p95 ms</th><th>bottleneck</th></tr></thead>
    <tbody>${procRows || '<tr><td colspan="5" class="muted">no detail sampled</td></tr>'}</tbody></table>`;
}

// --- router --------------------------------------------------------------
function route() {
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^\/c\/([^/]+)\/p\/([^/]+)/);
  if (m) return viewProcess(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
  const c = h.match(/^\/c\/([^/]+)/);
  if (c) return viewWorkspace(decodeURIComponent(c[1]));
  return viewWorkspaces();
}
window.addEventListener('hashchange', route);
route();

if (window.poMountThemeToggle) poMountThemeToggle(document.getElementById('railTheme'));

// Keep the rail's sidecar status dot live on this page too (green = a llama.cpp
// sidecar is running, yellow = off). Best-effort and non-blocking.
(function(){
  async function refreshDot(){
    const dot = document.getElementById('navLlamaDot');
    if(!dot) return;
    let on = false, count = 0;
    try { const st = await api('/api/llama/status'); on = !!(st && st.running); count = (st && st.count) || 0; } catch(e){}
    dot.classList.toggle('on', on);
    dot.classList.toggle('off', !on);
    dot.title = on ? ('local sidecars running ('+count+'/2)') : 'local sidecars: off';
  }
  refreshDot();
  setInterval(refreshDot, 4000);
})();
</script>
</body>
</html>
