[package]
name = "processos"
version = "0.1.1"
edition = "2021"
description = "ProcessOS — the runtime process-optimization plane for Nano BPM. Stage T1: ingest Nano's trace/metrics export and serve an Insights report. Talks to Nano only over its public contracts; Nano never depends on this crate."

# Independent crate, sibling to engine-core / server / engine-wasm (no root
# workspace, per repo convention). The dependency edge is one-way: ProcessOS may
# read Nano's public HTTP surfaces; Nano never links ProcessOS.
[[bin]]
name = "processos"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for the read/control contracts and the LLM hypothesis providers.
# Localhost gateway + local llama.cpp are plain HTTP, but Anthropic (and most
# hosted model APIs) require HTTPS — so we enable the pure-Rust rustls backend
# (no system OpenSSL; still builds offline from the crate cache).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
# Stream combinators for consuming the LLM's token stream (reqwest bytes_stream) and
# bridging the agent's event channel into an axum SSE response.
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
# The MVP optimization harness (SimRunner) embeds the REAL engine for
# trustworthy native replay — exactly as production runs it. engine-core is
# lean/zero-dependency and std-only; this is a one-way `path` dependency (Nano's
# engine never links ProcessOS). `serde` enables natural JSON variable I/O.
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
# Embedded analytic SQL engine for the LLM-driven data-analysis tools (querying
# the trace corpus). `bundled` compiles DuckDB from source (one-time C++ build)
# so the binary is self-contained with no system DuckDB needed.
duckdb = { version = "1", features = ["bundled"] }
# Psychological-trace export/import: bundle the investigation transcript, the LLM
# profiles used (api keys redacted), and a manifest into a single shareable zip.
# Pinned to the already-locked offline build; `deflate` keeps the archive compact.
zip = { version = "6", default-features = false, features = ["deflate"] }

# Build-time docs processor: the User Guide site at `/guide` is generated from
# the repository `README.md` (single source of truth) by `build.rs`, which chunks
# it on H2 headings and renders each section to HTML. Pinned to the offline-cached
# release; `html` is the only feature we need (no getopts/simd).
[build-dependencies]
pulldown-cmark = { version = "=0.13.3", default-features = false, features = ["html"] }

[profile.release]
opt-level = "s"
lto = true
