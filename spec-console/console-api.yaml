openapi: 3.0.3
info:
  title: Nano Console API
  description: >-
    Internal HTTP API backing the Nano web console (served by the gateway under
    /console/api, separate from the generated Camunda REST surface). This spec is
    the single source of truth for both the Rust (rust-axum) server trait and the
    TypeScript client used by the console SPA. Streaming (SSE) endpoints, the
    gateway reverse-proxy, binary file/zip downloads and static SPA assets are
    intentionally omitted here and remain hand-wired in the server.
  version: 0.1.0
servers:
  - url: /console/api
    description: Console API mounted on the gateway
tags:
  - name: cluster
    description: Topology, health and metrics
  - name: instances
    description: Process-instance explorer
  - name: traces
    description: Execution traces
  - name: models
    description: Workspace-backed BPMN models (modeler)
  - name: workers
    description: Embedded Deno job workers
  - name: lib
    description: Shared worker library files
  - name: projects
    description: RAD project lifecycle
  - name: extensions
    description: Extension packs and marketplace
  - name: config
    description: Server and IDE configuration
  - name: server
    description: Nano server version and self-update
  - name: data
    description: Urban App datasources (DB Manager) — ADR 0024
  - name: triggers
    description: Urban App trigger runtime — the durable inbox + dispatcher (ADR 0025)

paths:
  /topology:
    get:
      operationId: getTopology
      tags: [cluster]
      summary: Cluster topology
      responses:
        '200':
          description: Cluster topology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topology' }

  /cluster/health:
    get:
      operationId: getClusterHealth
      tags: [cluster]
      summary: Per-node liveness probe
      responses:
        '200':
          description: Cluster health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterHealth' }

  /metrics:
    get:
      operationId: getMetrics
      tags: [cluster]
      summary: Point-in-time metrics snapshot for this node
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSnapshot' }

  /cluster/metrics:
    get:
      operationId: getClusterMetrics
      tags: [cluster]
      summary: Per-node metrics plus cluster aggregate
      responses:
        '200':
          description: Cluster metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterMetrics' }

  /instances:
    get:
      operationId: listInstances
      tags: [instances]
      summary: List process instances (paged)
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, format: int32, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 50 } }
      responses:
        '200':
          description: One page of process instances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstancePage' }

  /instances/{key}:
    get:
      operationId: getInstance
      tags: [instances]
      summary: Process-instance detail
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Instance detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /traces:
    get:
      operationId: listTraces
      tags: [traces]
      summary: Recent execution traces
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, format: int32, default: 100 } }
      responses:
        '200':
          description: Trace summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TraceSummary' }

  /traces/{key}:
    get:
      operationId: getTrace
      tags: [traces]
      summary: Full execution trace for one instance
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Instance trace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceTrace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /traces/{key}/otel:
    get:
      operationId: getTraceOtel
      tags: [traces]
      summary: OpenTelemetry trace export for one instance
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Opaque OTLP/OpenTelemetry trace document
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List BPMN models in the workspace
      responses:
        '200':
          description: Model summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelSummary' }
    post:
      operationId: createModel
      tags: [models]
      summary: Create a new BPMN model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRequest' }
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /models/{name}:
    get:
      operationId: getModel
      tags: [models]
      summary: Get one BPMN model
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveModel
      tags: [models]
      summary: Save (overwrite) a BPMN model's XML
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          text/xml:
            schema: { type: string }
      responses:
        '200':
          description: Saved model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteModel
      tags: [models]
      summary: Delete a BPMN model
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List embedded workers
      responses:
        '200':
          description: Workers plus runtime availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkersResponse' }
    post:
      operationId: createWorker
      tags: [workers]
      summary: Scaffold a new worker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkerRequest' }
      responses:
        '201':
          description: Worker created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workers/{name}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get one worker
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Worker summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete a worker
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{name}/file:
    get:
      operationId: getWorkerFile
      tags: [workers]
      summary: Read a worker source file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      responses:
        '200':
          description: File contents
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveWorkerFile
      tags: [workers]
      summary: Write a worker source file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createWorkerFile
      tags: [workers]
      summary: Create an empty worker file
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFileRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerFile
      tags: [workers]
      summary: Delete a worker file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workers/{name}/start:
    post:
      operationId: startWorker
      tags: [workers]
      summary: Start a worker process
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Worker runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRuntime' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{name}/stop:
    post:
      operationId: stopWorker
      tags: [workers]
      summary: Stop a worker process
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Worker runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRuntime' }
        '404': { $ref: '#/components/responses/NotFound' }

  /worker-sdk:
    get:
      operationId: getWorkerSdk
      tags: [workers]
      summary: Embedded worker SDK source (text)
      responses:
        '200':
          description: Worker SDK source
          content:
            text/plain:
              schema: { type: string }

  /deno-types:
    get:
      operationId: getDenoTypes
      tags: [workers]
      summary: Ambient Deno type declarations (text)
      responses:
        '200':
          description: Deno type declarations
          content:
            text/plain:
              schema: { type: string }

  /lib:
    get:
      operationId: listLibFiles
      tags: [lib]
      summary: List shared library files
      responses:
        '200':
          description: Library file paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibFilesResponse' }

  /lib/file:
    get:
      operationId: getLibFile
      tags: [lib]
      summary: Read a shared library file
      parameters: [ { $ref: '#/components/parameters/PathQuery' } ]
      responses:
        '200':
          description: File contents
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveLibFile
      tags: [lib]
      summary: Write a shared library file
      parameters: [ { $ref: '#/components/parameters/PathQuery' } ]
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createLibFile
      tags: [lib]
      summary: Create an empty shared library file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFileRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteLibFile
      tags: [lib]
      summary: Delete a shared library file
      parameters: [ { $ref: '#/components/parameters/PathQuery' } ]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /config/server:
    get:
      operationId: getServerConfig
      tags: [config]
      summary: Server configuration (SLA mode + parameters)
      responses:
        '200':
          description: Server config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerConfig' }

  /config/server/sla:
    put:
      operationId: setSlaMode
      tags: [config]
      summary: Switch the runtime SLA mode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSlaRequest' }
      responses:
        '200':
          description: Updated server config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /config/ide:
    get:
      operationId: getIdeConfig
      tags: [config]
      summary: IDE configuration (dependencies + language packs)
      responses:
        '200':
          description: IDE config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdeConfig' }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List RAD projects
      responses:
        '200':
          description: Projects plus runtime availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectsResponse' }
    post:
      operationId: createProject
      tags: [projects]
      summary: Scaffold a new project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{name}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Project detail
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/config:
    get:
      operationId: getProjectConfig
      tags: [projects]
      summary: Project configuration
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Project config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveProjectConfig
      tags: [projects]
      summary: Save project configuration
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectConfig' }
      responses:
        '200':
          description: Saved project config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /projects/{name}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: Project file tree
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: File tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectFilesResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/file:
    put:
      operationId: saveProjectFile
      tags: [projects]
      summary: Write a project file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createProjectPath
      tags: [projects]
      summary: Create an empty file or directory in a project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectPathRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteProjectPath
      tags: [projects]
      summary: Delete a project file or directory
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /projects/{name}/run:
    post:
      operationId: runProject
      tags: [projects]
      summary: Run a project's application
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/stop:
    post:
      operationId: stopProject
      tags: [projects]
      summary: Stop a running project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/rename:
    post:
      operationId: renameProject
      tags: [projects]
      summary: Rename a project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameProjectRequest' }
      responses:
        '200':
          description: Updated project config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{name}/compile:
    post:
      operationId: compileProject
      tags: [projects]
      summary: Compile a project (optionally cross-platform)
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileRequest' }
      responses:
        '200':
          description: Whether a compile was started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileStarted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/run-configs:
    get:
      operationId: getRunConfigs
      tags: [projects]
      summary: List a project's run configurations
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Run configurations plus the active id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRunConfigsResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/active-run-config:
    put:
      operationId: setActiveRunConfig
      tags: [projects]
      summary: Pin (or clear) the active run configuration
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveRunConfigRequest' }
      responses:
        '200':
          description: The active run-config id (or null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveRunConfigResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/sources:
    get:
      operationId: getDataSources
      tags: [data]
      summary: List an App project's declared datasources
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Datasources plus the default source name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSourcesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/schema:
    get:
      operationId: getDataSchema
      tags: [data]
      summary: Introspect a datasource's tables/columns/indexes
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: Datasource schema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSchemaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/query:
    post:
      operationId: queryData
      tags: [data]
      summary: Run a row-returning statement against a datasource
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataQueryRequest' }
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/exec:
    post:
      operationId: execData
      tags: [data]
      summary: Run a non-row statement (INSERT/UPDATE/DELETE/DDL)
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataQueryRequest' }
      responses:
        '200':
          description: Exec result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExecResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/script:
    post:
      operationId: execDataScript
      tags: [data]
      summary: Run several statements atomically in one transaction
      description: >
        Runs the supplied statements in a single transaction (the console
        structure editor's SQLite 12-step table rebuild: create → copy → drop →
        rename). A failure in any statement rolls the whole batch back, so the
        table is never left half-migrated. DDL only — no bind parameters.
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataScriptRequest' }
      responses:
        '200':
          description: Script result (rows changed across the batch)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExecResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/migrations:
    get:
      operationId: getDataMigrations
      tags: [data]
      summary: List a datasource's migrations with applied status
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: Migration status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataMigrationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/migrate:
    post:
      operationId: migrateData
      tags: [data]
      summary: Apply a datasource's pending migrations
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: Migrations applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataMigrateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/domaintypes:
    post:
      operationId: regenerateDomainTypes
      tags: [data]
      summary: Regenerate the generated TypeScript domain types from the live schema
      description: >
        Reifies the datasource schema into `.nanobpm/domain.d.ts` (ADR 0029
        §4.1/§6): one `interface` per table plus a `DomainTables` lookup, so
        workers type against the current tables. Also runs automatically after a
        schema change (script/DDL exec/migrate) and at App boot; this endpoint is
        the maker's explicit "regenerate now" affordance. Types are erased at
        `deno compile` — this is an authoring-time convenience only.
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: The emitted domain types (and where they were written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainTypesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/domaintypes/preview:
    post:
      operationId: previewDomainTypes
      tags: [data]
      summary: Resolve the in-editor composed shapes for a live preview, writing nothing
      description: >
        The authoring-time counterpart to `regenerateDomainTypes` (ADR 0040
        §9/§10): resolve the composed motion-shapes the modeller is *currently
        editing* — sent in the request body, not scanned from the saved `.bpmn`
        — against the live datasource + manifest-type fuse, and return the
        emitted domain text plus the per-shape diagnostics. Writes nothing: it
        powers the shape composer's live field preview and inline diagnostics, so
        it never touches the generated SDK on disk. `write:false` under the hood.
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainTypesPreviewRequest' }
      responses:
        '200':
          description: The resolved domain text and per-shape diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainTypesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /server/update:
    get:
      operationId: getServerUpdate
      tags: [server]
      summary: Nano server version and self-update availability
      description: >
        Reports the running server version, the latest available version for
        the channel this binary was launched from, and whether the launcher can
        self-update. Self-managed / dev binaries (a configured binary path, a
        --binary flag, or a repo build) report canSelfUpdate=false and suppress
        the update nag (updateAvailable=false) even when a newer version exists.
        Best-effort and offline-soft: version resolution failures degrade to a
        null latest rather than an error.
      responses:
        '200':
          description: Server update status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerUpdateStatus' }

  /extensions:
    get:
      operationId: getExtensions
      tags: [extensions]
      summary: Installed extensions overview
      responses:
        '200':
          description: Extensions overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionsOverview' }

  /extensions/marketplace:
    get:
      operationId: getMarketplace
      tags: [extensions]
      summary: Marketplace of installable extension packs
      responses:
        '200':
          description: Marketplace listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marketplace' }

  /extensions/readme:
    get:
      operationId: getExtensionReadme
      tags: [extensions]
      summary: README (markdown) for an extension pack
      description: >
        Returns the pack's README as raw markdown. For an installed pack this is
        read from the bundled `README.md`; otherwise it is fetched from npm
        (`npm view <pkg> readme`). Used by the marketplace to show pack detail.
      parameters:
        - name: pkg
          in: query
          required: true
          description: The npm package name (e.g. `@nanobpm/nano-ide-trigger-mqtt`).
          schema: { type: string }
      responses:
        '200':
          description: Pack README
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionReadme' }
        '404': { $ref: '#/components/responses/NotFound' }

  /extensions/install:
    post:
      operationId: installExtension
      tags: [extensions]
      summary: Install an extension pack from npm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtPkgRequest' }
      responses:
        '201':
          description: Installed extension
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extension' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /extensions/remove:
    post:
      operationId: removeExtension
      tags: [extensions]
      summary: Remove an installed extension pack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtPkgRequest' }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }

  /extensions/trust:
    post:
      operationId: trustExtension
      tags: [extensions]
      summary: Approve or revoke trust for extension toolchains
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustRequest' }
      responses:
        '200':
          description: Updated extensions overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionsOverview' }

  /projects/{name}/triggers:
    get:
      operationId: getTriggers
      tags: [triggers]
      summary: Configured triggers + resolved source registry (ADR 0025 phase 2)
      description: >
        Lists the App manifest's declared triggers, each resolved against the
        source registry — the union of the compiled-in core kinds
        (cron/webhook/file/manual) and every installed pack's declared source
        kinds (`nano-ide-trigger-*`, ADR 0025 §6). `builtin` says whether the
        kind runs in-process (core) or is driven by a pack/ingress. Also returns
        the full registry so the console can offer a source picker, and any
        config errors (e.g. a malformed cron spec). This is the data the phase-3
        Triggers panel renders.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Triggers + source registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addTrigger
      tags: [triggers]
      summary: Append a trigger to the App manifest (the console "Add trigger" form)
      description: >
        Adds a trigger to `nano.app.json`'s `triggers[]` from the console's
        Add-trigger dialog, so a maker wires a source without hand-editing the
        manifest. The server places the supplied `config` fields into the shape
        each source kind expects (core kinds read some keys at the trigger's top
        level, e.g. cron's `spec` and file's `path`; pack kinds read a nested
        `config`), validates the id is unique and the kind is recognised, writes
        the manifest, and returns the refreshed triggers + registry.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTriggerRequest' }
      responses:
        '200':
          description: Trigger added; refreshed triggers + source registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/triggers/enqueue:
    post:
      operationId: enqueueTriggerEvent
      tags: [triggers]
      summary: Enqueue a synthetic trigger event into the durable inbox
      description: >
        The manual/synthetic source of ADR 0025 phase 1 (and the Triggers
        panel's "run now"): persists an event for a declared trigger into the
        App's durable inbox with a deterministic idempotency key, so the
        dispatcher applies its `action` to the engine exactly once per key. A
        repeat of the same idempotency key is a no-op (`enqueued=false`),
        proving the §3 dedup boundary.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerEnqueueRequest' }
      responses:
        '200':
          description: Enqueue outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerEnqueueResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/triggers/inbox:
    get:
      operationId: getTriggerInbox
      tags: [triggers]
      summary: Trigger inbox status (row counts by state + most recent rows)
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Inbox status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerInboxResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    NamePath:
      name: name
      in: path
      required: true
      schema: { type: string }
    PathQuery:
      name: path
      in: query
      required: true
      description: Project/worker-relative, forward-slash separated file path.
      schema: { type: string }
    SourcePath:
      name: source
      in: path
      required: true
      description: The datasource name from the App manifest's `data.sources`.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema: { type: string }
    NotFound:
      description: Not found
      content:
        text/plain:
          schema: { type: string }
    Conflict:
      description: Already exists
      content:
        text/plain:
          schema: { type: string }

  schemas:
    # ---- Cluster / topology (snake_case wire fields) ----------------------
    NodeInfo:
      type: object
      required: [node_id, address, is_self]
      properties:
        node_id: { type: integer, format: int64 }
        address: { type: string }
        is_self: { type: boolean }
    PartitionInfo:
      type: object
      required: [partition_id, replicas, owner, leader, raft_term, recovering]
      properties:
        partition_id: { type: integer, format: int64 }
        replicas:
          type: array
          items: { type: integer, format: int64 }
        owner: { type: integer, format: int64 }
        leader: { type: integer, format: int64, nullable: true }
        raft_term: { type: integer, format: int64, nullable: true }
        recovering: { type: boolean }
    Topology:
      type: object
      required: [node_id, num_nodes, num_partitions, replication_factor, raft_enabled, gateway_version, nodes, partitions]
      properties:
        node_id: { type: integer, format: int64 }
        num_nodes: { type: integer, format: int64 }
        num_partitions: { type: integer, format: int64 }
        replication_factor: { type: integer, format: int64 }
        raft_enabled: { type: boolean }
        gateway_version: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeInfo' }
        partitions:
          type: array
          items: { $ref: '#/components/schemas/PartitionInfo' }

    # ---- Cluster health (camelCase wire fields) --------------------------
    NodeHealth:
      type: object
      required: [nodeId, address, isSelf, reachable, version, latencyMs, error]
      properties:
        nodeId: { type: integer, format: int64 }
        address: { type: string }
        isSelf: { type: boolean }
        reachable: { type: boolean }
        version: { type: string, nullable: true }
        latencyMs: { type: number, format: double, nullable: true }
        error: { type: string, nullable: true }
    ClusterHealth:
      type: object
      required: [checkedAtMs, nodes]
      properties:
        checkedAtMs: { type: integer, format: int64 }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeHealth' }

    # ---- Instances (snake_case wire fields) ------------------------------
    Instance:
      type: object
      required: [key, process_id, process_definition_key, version, state, start_date_ms, has_incident, business_id, tags]
      properties:
        key: { type: string }
        process_id: { type: string }
        process_definition_key: { type: string }
        version: { type: integer, format: int64 }
        state: { type: string }
        start_date_ms: { type: integer, format: int64 }
        has_incident: { type: boolean }
        business_id: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
    Variable:
      type: object
      required: [name, value, scope_key]
      properties:
        name: { type: string }
        value: { type: string }
        scope_key: { type: string }
    Job:
      type: object
      required: [key, element_id, job_type, state, retries, worker, deadline_ms]
      properties:
        key: { type: string }
        element_id: { type: string }
        job_type: { type: string }
        state: { type: string }
        retries: { type: integer, format: int32 }
        worker: { type: string, nullable: true }
        deadline_ms: { type: integer, format: int64, nullable: true }
    Incident:
      type: object
      required: [key, element_id, kind, state, reason, created_at_ms]
      properties:
        key: { type: string }
        element_id: { type: string }
        kind: { type: string }
        state: { type: string }
        reason: { type: string }
        created_at_ms: { type: integer, format: int64 }
    InstancePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Instance' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        pageSize: { type: integer, format: int32 }
    InstanceDetail:
      type: object
      required: [instance, variables, jobs, incidents]
      properties:
        instance: { $ref: '#/components/schemas/Instance' }
        variables:
          type: array
          items: { $ref: '#/components/schemas/Variable' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }

    # ---- Traces (camelCase wire fields) ----------------------------------
    TraceOutcome:
      type: string
      enum: [active, completed, terminated]
    TraceSummary:
      type: object
      required: [instanceKey, processId, version, businessId, outcome, startedAt, endedAt, durationMs, elementCount, incidentCount]
      properties:
        instanceKey: { type: string }
        processId: { type: string }
        version: { type: integer, format: int64, nullable: true }
        businessId: { type: string, nullable: true }
        outcome: { $ref: '#/components/schemas/TraceOutcome' }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
        elementCount: { type: integer, format: int32 }
        incidentCount: { type: integer, format: int32 }
    TraceJob:
      type: object
      required: [type, worker, createdAt, activatedAt, completedAt, waitMs, queueMs, serviceMs, attempts, failures]
      properties:
        type: { type: string }
        worker: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
        activatedAt: { type: integer, format: int64, nullable: true }
        completedAt: { type: integer, format: int64, nullable: true }
        waitMs: { type: integer, format: int64, nullable: true }
        queueMs: { type: integer, format: int64, nullable: true }
        serviceMs: { type: integer, format: int64, nullable: true }
        attempts: { type: integer, format: int32 }
        failures: { type: integer, format: int32 }
    TraceElement:
      type: object
      required: [elementId, elementInstanceKey, scope, enteredAt, exitedAt, durationMs, incidents, job]
      properties:
        elementId: { type: string }
        elementInstanceKey: { type: string }
        scope: { type: string }
        enteredAt: { type: integer, format: int64 }
        exitedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
        incidents: { type: integer, format: int32 }
        job:
          allOf: [ { $ref: '#/components/schemas/TraceJob' } ]
          nullable: true
    TraceIncident:
      type: object
      required: [elementId, elementInstanceKey, kind, reason, raisedAt, resolvedAt]
      properties:
        elementId: { type: string }
        elementInstanceKey: { type: string }
        kind: { type: string }
        reason: { type: string }
        raisedAt: { type: integer, format: int64 }
        resolvedAt: { type: integer, format: int64, nullable: true }
    InstanceTrace:
      type: object
      required: [instanceKey, processId, version, businessId, tags, startedAt, endedAt, durationMs, outcome, elements, incidents, path]
      properties:
        instanceKey: { type: string }
        processId: { type: string }
        version: { type: integer, format: int64, nullable: true }
        businessId: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
        outcome: { $ref: '#/components/schemas/TraceOutcome' }
        elements:
          type: array
          items: { $ref: '#/components/schemas/TraceElement' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/TraceIncident' }
        path:
          type: array
          items: { type: string }

    # ---- Metrics (camelCase wire fields) ---------------------------------
    MetricsSnapshot:
      type: object
      required:
        - timestampMs
        - activeInstances
        - createsRest
        - createsStream
        - createsTotal
        - completionsRest
        - completionsStream
        - completionsTotal
        - connectionsActive
        - commitInflight
        - commitsTotal
        - writesTotal
        - bytesTotal
        - creditStallsTotal
        - fsyncMeanMs
        - commitWaitMeanMs
        - commitBatchMean
        - frameProcessingMeanMs
        - writerBusyRatio
        - residentBytes
        - ceilingThroughput
        - ceilingMemory
        - ceilingExporter
        - ceilingFlowControl
        - exporterFillPermille
        - slaMode
        - pendingCreateQueue
        - activeBacklog
        - admissionBacklogLimit
        - admissionCreateQueueLimit
        - admissionShedTotal
        - recovery
      properties:
        timestampMs: { type: integer, format: int64 }
        activeInstances: { type: integer, format: int64 }
        createsRest: { type: integer, format: int64 }
        createsStream: { type: integer, format: int64 }
        createsTotal: { type: integer, format: int64 }
        completionsRest: { type: integer, format: int64 }
        completionsStream: { type: integer, format: int64 }
        completionsTotal: { type: integer, format: int64 }
        connectionsActive: { type: integer, format: int64 }
        commitInflight: { type: integer, format: int64 }
        commitsTotal: { type: integer, format: int64 }
        writesTotal: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64 }
        creditStallsTotal: { type: integer, format: int64 }
        fsyncMeanMs: { type: number, format: double }
        commitWaitMeanMs: { type: number, format: double }
        commitBatchMean: { type: number, format: double }
        frameProcessingMeanMs: { type: number, format: double }
        writerBusyRatio: { type: number, format: double }
        residentBytes: { type: integer, format: int64, nullable: true }
        ceilingThroughput: { type: boolean }
        ceilingMemory: { type: boolean }
        ceilingExporter: { type: boolean }
        ceilingFlowControl: { type: boolean }
        exporterFillPermille: { type: integer, format: int64 }
        slaMode: { type: string, enum: [latency, admission] }
        pendingCreateQueue: { type: integer, format: int64 }
        activeBacklog: { type: integer, format: int64 }
        admissionBacklogLimit: { type: integer, format: int64 }
        admissionCreateQueueLimit: { type: integer, format: int64 }
        admissionShedTotal: { type: integer, format: int64 }
        recovery: { $ref: '#/components/schemas/Recovery' }
    Recovery:
      type: object
      description: >-
        Per-node Raft recovery/leadership state so the cluster view can show
        "up but catching up" while a restarted owner reclaims its partitions
        (and the failover incumbent hands leadership back).
      required: [recovering, owned, reclaimed, catchingUp, handingOff, detail]
      properties:
        recovering: { type: boolean }
        owned: { type: integer, format: int64 }
        reclaimed: { type: integer, format: int64 }
        catchingUp: { type: integer, format: int64 }
        handingOff: { type: integer, format: int64 }
        handoffLagEntries: { type: integer, format: int64, nullable: true }
        detail: { type: string }
    NodeMetrics:
      type: object
      required: [nodeId, address, isSelf, reachable, error, metrics]
      properties:
        nodeId: { type: integer, format: int64 }
        address: { type: string }
        isSelf: { type: boolean }
        reachable: { type: boolean }
        error: { type: string, nullable: true }
        metrics:
          allOf: [ { $ref: '#/components/schemas/MetricsSnapshot' } ]
          nullable: true
    AggregateMetrics:
      type: object
      required: [reachableNodes, totalNodes, activeInstances, createsTotal, completionsTotal, connectionsActive, commitInflight, residentBytes]
      properties:
        reachableNodes: { type: integer, format: int64 }
        totalNodes: { type: integer, format: int64 }
        activeInstances: { type: integer, format: int64 }
        createsTotal: { type: integer, format: int64 }
        completionsTotal: { type: integer, format: int64 }
        connectionsActive: { type: integer, format: int64 }
        commitInflight: { type: integer, format: int64 }
        residentBytes: { type: integer, format: int64 }
    ClusterMetrics:
      type: object
      required: [checkedAtMs, nodes, aggregate]
      properties:
        checkedAtMs: { type: integer, format: int64 }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeMetrics' }
        aggregate: { $ref: '#/components/schemas/AggregateMetrics' }

    # ---- Models (snake_case wire fields) ---------------------------------
    DeployStatus:
      type: string
      enum: [not_deployed, in_sync, modified, unparsable]
    ModelSummary:
      type: object
      required: [name, process_ids, deploy_status, deployed_version, deployed_key, updated_at_ms, size]
      properties:
        name: { type: string }
        process_ids:
          type: array
          items: { type: string }
        deploy_status: { $ref: '#/components/schemas/DeployStatus' }
        deployed_version: { type: integer, format: int64, nullable: true }
        deployed_key: { type: string, nullable: true }
        updated_at_ms: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
    Model:
      type: object
      required: [name, xml, process_ids, deploy_status, deployed_version, deployed_key]
      properties:
        name: { type: string }
        xml: { type: string }
        process_ids:
          type: array
          items: { type: string }
        deploy_status: { $ref: '#/components/schemas/DeployStatus' }
        deployed_version: { type: integer, format: int64, nullable: true }
        deployed_key: { type: string, nullable: true }
    CreateModelRequest:
      type: object
      required: [name, xml]
      properties:
        name: { type: string }
        xml: { type: string }

    # ---- Workers (camelCase wire fields) ---------------------------------
    WorkerPhase:
      type: string
      enum: [stopped, starting, running, crashed]
    WorkerMetrics:
      type: object
      required: [completed, failed, inFlight, throughput, uptimeMs, connected]
      properties:
        completed: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        inFlight: { type: integer, format: int64 }
        throughput: { type: number, format: double }
        uptimeMs: { type: integer, format: int64 }
        connected: { type: boolean }
    WorkerRuntime:
      type: object
      required: [status, pid, startedAtMs, restarts, lastError, metrics]
      properties:
        status: { $ref: '#/components/schemas/WorkerPhase' }
        pid: { type: integer, format: int64, nullable: true }
        startedAtMs: { type: integer, format: int64, nullable: true }
        restarts: { type: integer, format: int32 }
        lastError: { type: string, nullable: true }
        metrics: { $ref: '#/components/schemas/WorkerMetrics' }
    WorkerSummary:
      type: object
      required: [name, files, updatedAtMs, runtime]
      properties:
        name: { type: string }
        files:
          type: array
          items: { type: string }
        updatedAtMs: { type: integer, format: int64 }
        runtime: { $ref: '#/components/schemas/WorkerRuntime' }
    WorkersResponse:
      type: object
      required: [workers, denoAvailable, nodeAvailable]
      properties:
        workers:
          type: array
          items: { $ref: '#/components/schemas/WorkerSummary' }
        # Deno present. Node-first (ADR 0038): Deno is optional, needed only to
        # compile a project to a standalone binary; workers RUN on Node.
        denoAvailable: { type: boolean }
        # Node >= 22.6 present — the primary runtime for running workers/projects.
        nodeAvailable: { type: boolean }
    CreateWorkerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        jobType: { type: string, nullable: true }

    # ---- Shared library --------------------------------------------------
    LibFilesResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { type: string }

    # ---- Generic file-create bodies --------------------------------------
    CreateFileRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    CreateProjectPathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        dir: { type: boolean, default: false }

    # ---- Config (camelCase wire fields) ----------------------------------
    SlaOption:
      type: object
      required: [id, label, tagline, description]
      properties:
        id: { type: string }
        label: { type: string }
        tagline: { type: string }
        description: { type: string }
    SlaModeConfig:
      type: object
      required: [current, description, source, options]
      properties:
        current: { type: string }
        description: { type: string }
        source: { type: string }
        switchable: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/SlaOption' }
    ServerParam:
      type: object
      required: [key, category, label, description, default, value]
      properties:
        key: { type: string }
        category: { type: string }
        label: { type: string }
        description: { type: string }
        default: { type: string }
        value: { type: string, nullable: true }
    ServerConfig:
      type: object
      required: [slaMode, readOnly, params]
      properties:
        slaMode: { $ref: '#/components/schemas/SlaModeConfig' }
        readOnly: { type: boolean }
        params:
          type: array
          items: { $ref: '#/components/schemas/ServerParam' }
    SetSlaRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string }
    ConfigDependency:
      type: object
      required: [id, name, purpose, bin, present, version, installUrl, hint]
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        bin: { type: string }
        present: { type: boolean }
        version: { type: string, nullable: true }
        installUrl: { type: string }
        hint: { type: string }
    PackConfigField:
      type: object
      required: [key, label, description, env, default, value]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        env: { type: string, nullable: true }
        default: { type: string, nullable: true }
        value: { type: string, nullable: true }
    LangPackConfig:
      type: object
      required: [id, displayName, builtin, detect, available, configFields]
      properties:
        id: { type: string }
        displayName: { type: string }
        builtin: { type: boolean }
        detect:
          type: array
          items: { type: string }
        available: { type: boolean }
        configFields:
          type: array
          items: { $ref: '#/components/schemas/PackConfigField' }
    IdeConfig:
      type: object
      required: [dependencies, langPacks]
      properties:
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/ConfigDependency' }
        langPacks:
          type: array
          items: { $ref: '#/components/schemas/LangPackConfig' }

    # ---- Projects (camelCase wire fields) --------------------------------
    ProjectSummary:
      type: object
      required: [name, description, deployTarget, updatedMs, processes, decisions, forms, workers, running, lang]
      properties:
        name: { type: string }
        description: { type: string }
        deployTarget: { type: string }
        updatedMs: { type: integer, format: int64 }
        processes: { type: integer, format: int32 }
        decisions: { type: integer, format: int32 }
        forms: { type: integer, format: int32 }
        workers: { type: integer, format: int32 }
        running: { type: boolean }
        lang:
          type: string
          description: >-
            Language pack id driving the project (e.g. "deno", "rust", "java").
            The console resolves the card's language icon by matching this to an
            Extension of kind "lang".
        template:
          type: string
          description: >-
            Id of the scaffold template the project was created from (e.g.
            "starter", "throughput", "java-starter"), when known. Surfaced on the
            card so a bug can be traced back to the built-in template or pack.
        scaffoldedFrom:
          $ref: '#/components/schemas/ProjectScaffoldedFrom'
    ProjectRunConfig:
      type: object
      required: [id, label, run, compile]
      properties:
        id: { type: string }
        label: { type: string }
        default: { type: boolean }
        run:
          type: array
          items: { type: string }
        compile:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
    ProjectRunConfigsResponse:
      type: object
      required: [runConfigs, active]
      properties:
        runConfigs:
          type: array
          items: { $ref: '#/components/schemas/ProjectRunConfig' }
        active: { type: string, nullable: true }
    ProjectToolchain:
      type: object
      required: [run, compile]
      properties:
        run:
          type: array
          items: { type: string }
        compile:
          type: array
          items: { type: string }
        runConfigs:
          type: array
          items: { $ref: '#/components/schemas/ProjectRunConfig' }
        activeRunConfig: { type: string, nullable: true }
    ProjectScaffoldedFrom:
      type: object
      required: [pack]
      properties:
        pack: { type: string }
        version: { type: string }
    ProjectConfig:
      type: object
      required: [name, description, deployTarget, main, platforms, lang, app, createdMs, updatedMs]
      properties:
        name: { type: string }
        description: { type: string }
        deployTarget: { type: string }
        main: { type: string }
        platforms:
          type: array
          items: { type: string }
        lang: { type: string }
        app: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        toolchain: { $ref: '#/components/schemas/ProjectToolchain' }
        scaffoldedFrom: { $ref: '#/components/schemas/ProjectScaffoldedFrom' }
        template:
          type: string
          description: >-
            Id of the scaffold template this project was created from, when known.
        createdMs: { type: integer, format: int64 }
        updatedMs: { type: integer, format: int64 }
    FileNode:
      type: object
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind:
          type: string
          enum: [dir, file]
        children:
          type: array
          items: { $ref: '#/components/schemas/FileNode' }
    ProjectFilesResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/FileNode' }
    RunStatus:
      type: string
      enum: [stopped, starting, running, stopping, error]
    RunState:
      type: object
      required: [status, pid, startedAtMs, lastError, compiling]
      properties:
        status: { $ref: '#/components/schemas/RunStatus' }
        pid: { type: integer, format: int64, nullable: true }
        startedAtMs: { type: integer, format: int64, nullable: true }
        lastError: { type: string, nullable: true }
        compiling: { type: boolean }
    ProjectTemplate:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    ProjectDetail:
      type: object
      required: [config, files, runState, denoAvailable, nodeAvailable, runnable, platforms, rootPath]
      properties:
        config: { $ref: '#/components/schemas/ProjectConfig' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileNode' }
        runState: { $ref: '#/components/schemas/RunState' }
        rootPath:
          type: string
          description: >-
            Absolute path of the project directory on the host running the
            server. Surfaced so users can locate the project's files on disk
            (header display + "copy path" actions in the file tree). When the
            console talks to a remote/containerized gateway this is the server's
            path, not the client's, so treat it as informational.
        # Deno present (needed only for `deno compile`, ADR 0038).
        denoAvailable: { type: boolean }
        # Node >= 22.6 present — the primary Run runtime.
        nodeAvailable: { type: boolean }
        runnable: { type: boolean }
        missingToolchain:
          allOf: [ { $ref: '#/components/schemas/MissingToolchain' } ]
          nullable: true
          description: >-
            Present only when `runnable` is false. Names exactly what the server
            probed for (and could not find) so the Console can tell the user
            which tool to install, instead of a generic "toolchain missing".
        platforms:
          type: array
          items: { type: string }
    MissingToolchain:
      type: object
      description: >-
        What the run/compile toolchain probe looked for and did not find. Used
        by the project workspace banner to give an actionable install hint.
      required: [probes]
      properties:
        displayName:
          type: string
          nullable: true
          description: Human name of the missing toolchain (e.g. "Rust", "Deno / Node").
        probes:
          type: array
          description: >-
            Executable names searched for on PATH; finding ANY one satisfies the
            probe (e.g. ["cargo"] for a Rust pack, ["deno", "node"] for Deno).
          items: { type: string }
        installHint:
          type: string
          nullable: true
          description: One-line, actionable install hint for the missing toolchain.
        installUrl:
          type: string
          nullable: true
          description: Official install page for the missing toolchain.
    ProjectsResponse:
      type: object
      required: [projects, denoAvailable, nodeAvailable, platforms]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        # Deno present (needed only for `deno compile`, ADR 0038).
        denoAvailable: { type: boolean }
        # Node >= 22.6 present — the primary Run runtime.
        nodeAvailable: { type: boolean }
        platforms:
          type: array
          items: { type: string }
        templates:
          type: array
          items: { $ref: '#/components/schemas/ProjectTemplate' }
        extensions: { $ref: '#/components/schemas/ExtensionsOverview' }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        template: { type: string, nullable: true }
    RenameProjectRequest:
      type: object
      required: [newName]
      properties:
        newName: { type: string }
    CompileRequest:
      type: object
      properties:
        targets:
          type: array
          items: { type: string }
    CompileStarted:
      type: object
      required: [started]
      properties:
        started: { type: boolean }
    ActiveRunConfigRequest:
      type: object
      properties:
        id: { type: string, nullable: true }
    ActiveRunConfigResponse:
      type: object
      required: [active]
      properties:
        active: { type: string, nullable: true }

    # ---- Extensions (camelCase wire fields) ------------------------------
    ExtensionFileType:
      type: object
      required: [ext, monacoLang]
      properties:
        ext: { type: string }
        monacoLang: { type: string }
    ExtensionTheme:
      type: object
      required: [id, label, appearance, tokens]
      properties:
        id: { type: string }
        label: { type: string }
        appearance:
          type: string
          enum: [light, dark]
        tokens:
          type: object
          additionalProperties: { type: string }
    ExtensionTemplate:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    Extension:
      type: object
      required: [id, kind, displayName, builtin, fileTypes, templates, toolchainAvailable, trusted]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [lang, app, example, theme]
        displayName: { type: string }
        icon:
          type: string
          description: >-
            Optional icon for the pack, as an inline SVG XML string (preferred)
            or a data:/http: URL. Lang packs supply this so the console can badge
            project cards with a language icon.
        builtin: { type: boolean }
        fileTypes:
          type: array
          items: { $ref: '#/components/schemas/ExtensionFileType' }
        templates:
          type: array
          items: { $ref: '#/components/schemas/ExtensionTemplate' }
        themes:
          type: array
          items: { $ref: '#/components/schemas/ExtensionTheme' }
        intellisense:
          type: array
          description: >-
            SDK-derived Monaco IntelliSense contributed by the pack, one entry per
            monacoLang. Optional; the console registers completion/hover/signature
            providers from these.
          items: { $ref: '#/components/schemas/ExtensionIntellisense' }
        components:
          type: array
          description: >-
            Zeebe element templates the pack contributes as installable BPMN
            components (ADR 0033 §4). The console merges these under a project's
            own components (project wins on an id collision) to drive the palette.
            Kept as free-form objects so the full element-template shape survives
            the response round-trip; the modeler validates them at registration.
          items:
            type: object
            additionalProperties: true
        toolchainAvailable: { type: boolean }
        trusted: { type: boolean }
    ExtensionCompletion:
      type: object
      required: [label]
      properties:
        label: { type: string }
        kind: { type: string }
        insertText: { type: string }
        snippet: { type: boolean }
        detail: { type: string }
        documentation: { type: string }
    ExtensionHover:
      type: object
      required: [symbol, contents]
      properties:
        symbol: { type: string }
        contents: { type: string }
    ExtensionSignatureParam:
      type: object
      required: [label]
      properties:
        label: { type: string }
        documentation: { type: string }
    ExtensionSignature:
      type: object
      required: [trigger, label]
      properties:
        trigger: { type: string }
        label: { type: string }
        documentation: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ExtensionSignatureParam' }
    ExtensionIntellisense:
      type: object
      required: [monacoLang]
      properties:
        monacoLang: { type: string }
        triggerCharacters:
          type: array
          items: { type: string }
        completions:
          type: array
          items: { $ref: '#/components/schemas/ExtensionCompletion' }
        hovers:
          type: array
          items: { $ref: '#/components/schemas/ExtensionHover' }
        signatures:
          type: array
          items: { $ref: '#/components/schemas/ExtensionSignature' }
    ExtensionsOverview:
      type: object
      required: [extensions, yolo]
      properties:
        extensions:
          type: array
          items: { $ref: '#/components/schemas/Extension' }
        yolo: { type: boolean }
    MarketEntry:
      type: object
      required: [name, version, description, category, installed, updateAvailable]
      properties:
        name: { type: string }
        version: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [lang, app, example, theme, trigger, other]
        installed: { type: boolean }
        installedVersion: { type: string }
        updateAvailable: { type: boolean }
    Marketplace:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/MarketEntry' }
    ExtensionReadme:
      type: object
      required: [pkg, readme, installed]
      properties:
        pkg: { type: string }
        readme:
          type: string
          description: The pack's README as raw markdown.
        installed:
          type: boolean
          description: True when the README came from an installed pack (vs npm).
    ServerUpdateStatus:
      type: object
      required: [current, updateAvailable, canSelfUpdate, installMethod]
      properties:
        current:
          type: string
          description: >
            Installed version in the update channel's version space — the basis
            for the update comparison and shown next to latest. For the npm
            channel this is the launcher/plugin version; otherwise the running
            server build.
        serverVersion:
          type: string
          description: >
            The actual running server binary build (NANOBPM_VERSION). Present
            (and distinct from current) when the update unit versions in a
            different space than the server build, e.g. an npm-managed install.
        latest:
          type: string
          description: >
            Latest available version for the launch channel, or absent if it
            could not be resolved (offline, unknown channel, self-managed).
        updateAvailable:
          type: boolean
          description: >
            True only when a self-updatable install has a newer latest than
            current. Always false for self-managed / dev binaries.
        canSelfUpdate:
          type: boolean
          description: >
            True when the launcher manages this binary (managed npm platform
            package or managed download) and can perform an in-place update.
        installMethod:
          type: string
          description: >
            How the running binary was provisioned, as reported by the
            launcher.
          enum: [managed-npm, managed-download, configured, flag, repo-release, repo-debug, unknown]
        channel:
          type: string
          description: Update channel the launcher resolves latest from (npm or download).
        launcher:
          type: string
          description: Identifier of the launcher that started the server (e.g. c8ctl-plugin-nano).
        updateHint:
          type: string
          description: Human-readable guidance for updating (method-specific).
    ExtPkgRequest:
      type: object
      required: [pkg]
      properties:
        pkg: { type: string }
    TrustRequest:
      type: object
      properties:
        yolo: { type: boolean, nullable: true }
        approve: { type: string, nullable: true }
        revoke: { type: string, nullable: true }

    # ---- Data / datasources (ADR 0024, camelCase wire fields) -------------
    DataSourceInfo:
      type: object
      required: [name, driver, url]
      properties:
        name: { type: string }
        driver: { type: string }
        url: { type: string }
        migrations: { type: string, nullable: true }
    DataSourcesResponse:
      type: object
      required: [sources]
      properties:
        default: { type: string, nullable: true }
        sources:
          type: array
          items: { $ref: '#/components/schemas/DataSourceInfo' }
    DataColumnMeta:
      type: object
      required: [name, type, notNull, primaryKey]
      properties:
        name: { type: string }
        type: { type: string }
        notNull: { type: boolean }
        primaryKey: { type: boolean }
    DataForeignKey:
      type: object
      required: [column, refTable, refColumn, onDelete]
      description: >-
        A foreign-key constraint: `column` in this table references
        `refTable(refColumn)`. `refColumn` is empty when the FK targets the
        parent's primary key. `onDelete` is the referential action (e.g.
        `CASCADE`), empty when none was declared.
      properties:
        column: { type: string }
        refTable: { type: string }
        refColumn: { type: string }
        onDelete: { type: string }
    DataTableMeta:
      type: object
      required: [name, columns, indexes, foreignKeys]
      properties:
        name: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/DataColumnMeta' }
        indexes:
          type: array
          items: { type: string }
        foreignKeys:
          type: array
          items: { $ref: '#/components/schemas/DataForeignKey' }
    DataSchemaResponse:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items: { $ref: '#/components/schemas/DataTableMeta' }
    DataQueryRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string }
        params:
          type: array
          description: Positional bind values for the statement's `?` placeholders.
          items: {}
    DataQueryResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    DataExecResult:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, format: int64 }
        lastInsertId: { type: integer, format: int64, nullable: true }
    DataScriptRequest:
      type: object
      required: [statements]
      properties:
        statements:
          type: array
          description: >
            DDL statements to run atomically in one transaction, in order.
          items: { type: string }
    DataMigrationEntry:
      type: object
      required: [name, applied]
      properties:
        name: { type: string }
        applied: { type: boolean }
        appliedAt: { type: string, nullable: true }
    DataMigrationsResponse:
      type: object
      required: [dir, entries]
      properties:
        dir: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/DataMigrationEntry' }
    DataMigrateResult:
      type: object
      required: [applied, pending]
      properties:
        applied:
          type: array
          items: { type: string }
        pending: { type: integer, format: int64 }
    DomainTypesResult:
      type: object
      required: [text, tables, shapeDiagnostics]
      properties:
        path:
          type: string
          nullable: true
          description: >
            The file written (relative to the project root), or null when the
            op only returned the text without writing (e.g. the preview
            endpoint, which resolves with `write:false`).
        text:
          type: string
          description: The emitted `domain.d.ts` contents.
        tables:
          type: integer
          format: int64
          description: Number of tables reified into interfaces.
        shapeDiagnostics:
          type: array
          description: >
            Resolve-time problems with the composed `nano:shape` declarations
            (ADR 0040 §10). Always present (empty when every shape resolved);
            the preview endpoint surfaces these live for the in-editor shapes.
          items: { $ref: '#/components/schemas/ShapeDiagnostic' }
    ShapeOpSpec:
      type: object
      required: [op]
      description: >
        One composition operation of a composed motion-shape, in author order
        (ADR 0040 §9). Which fields apply depends on `op`: `carry`/`project`/
        `reference` name a source entity in `ref`; `project` adds the `fields`
        subset (and an optional `via` FK path); `extend`/`reference` add a `name`;
        `extend` adds a scalar/entity `type`.
      properties:
        op:
          type: string
          enum: [carry, project, extend, reference]
        ref: { type: string }
        fields:
          type: array
          items: { type: string }
        via: { type: string }
        name: { type: string }
        type: { type: string }
        optional: { type: boolean }
        list: { type: boolean }
        spread: { type: boolean }
    ShapeDeclSpec:
      type: object
      required: [id, ops]
      description: A composed motion-shape the modeller is editing (ADR 0040 §9).
      properties:
        id: { type: string }
        name: { type: string }
        ops:
          type: array
          items: { $ref: '#/components/schemas/ShapeOpSpec' }
    DomainTypesPreviewRequest:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          description: >
            The composed shapes currently in the editor, resolved instead of the
            saved-model scan so the preview reflects unsaved edits.
          items: { $ref: '#/components/schemas/ShapeDeclSpec' }
    ShapeDiagnostic:
      type: object
      required: [shape, kind, severity, message]
      description: >
        A resolve-time problem with a composed shape, surfaced like the
        `workers[]` drift warning (ADR 0040 §10). A shape with any `error`
        diagnostic is omitted from the fuse; a `warning` still resolves.
      properties:
        shape: { type: string }
        kind:
          type: string
          enum:
            - unresolved-reference
            - reference-cycle
            - field-conflict
            - unknown-field
            - duplicate-id
            - ambiguous-reference
            - nominal-table-ref
            - same-id-collision
        severity:
          type: string
          enum: [error, warning]
        message: { type: string }
    TriggerEnqueueRequest:
      type: object
      required: [triggerId, body]
      properties:
        triggerId:
          type: string
          description: >
            Id of a `triggers[]` entry in the App manifest whose `action` this
            event drives.
        idempotencyKey:
          type: string
          nullable: true
          description: >
            Deterministic dedup key (ADR 0025 §3). Omit to have the server
            derive a content hash of the body — repeat submissions of the same
            body then collapse to one inbox row.
        body:
          type: object
          additionalProperties: true
          description: The event body; the action's FEEL evaluates over `body`.
    TriggerEnqueueResult:
      type: object
      required: [enqueued]
      properties:
        enqueued:
          type: boolean
          description: >
            true if a new inbox row was persisted; false if the idempotency key
            already existed (a no-op — the §3 dedup boundary).
        id:
          type: integer
          format: int64
          nullable: true
          description: Inbox row id when a new row was persisted.
    TriggerInboxRow:
      type: object
      required: [id, triggerId, status, attempts, createdAt]
      properties:
        id: { type: integer, format: int64 }
        triggerId: { type: string }
        status:
          type: string
          description: pending | done | failed (failed = dead-lettered after max attempts).
        attempts: { type: integer, format: int64 }
        lastError: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
    TriggerInboxResponse:
      type: object
      required: [pending, done, failed, recent]
      properties:
        pending: { type: integer, format: int64 }
        done: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        recent:
          type: array
          description: The most recently updated inbox rows (newest first).
          items: { $ref: '#/components/schemas/TriggerInboxRow' }
    TriggersResponse:
      type: object
      required: [triggers, sources, errors]
      description: >
        The App's configured triggers resolved against the source registry
        (ADR 0025 phase 2).
      properties:
        triggers:
          type: array
          description: The manifest's declared triggers, resolved.
          items: { $ref: '#/components/schemas/TriggerInfo' }
        sources:
          type: array
          description: >
            The full source registry — core kinds plus every installed pack's
            declared kinds — for the console source picker.
          items: { $ref: '#/components/schemas/SourceKindInfo' }
        errors:
          type: array
          description: Per-trigger source config errors (e.g. a malformed cron spec).
          items: { type: string }
    TriggerInfo:
      type: object
      required: [id, type, builtin]
      properties:
        id: { type: string }
        type:
          type: string
          description: The trigger's source kind (its manifest `type`).
        builtin:
          type: boolean
          description: >
            true if the kind is a compiled-in core source (cron/webhook/file/
            manual); false if it is a pack/external source driven via the ingress.
        recognized:
          type: boolean
          description: >
            Whether the kind is in the source registry at all (a false value
            flags a typo or a not-yet-installed pack).
        action:
          type: object
          additionalProperties: true
          nullable: true
          description: The trigger's action block, verbatim from the manifest.
    SourceKindInfo:
      type: object
      required: [kind, builtin, configFields]
      properties:
        kind: { type: string }
        builtin:
          type: boolean
          description: true for a compiled-in core source; false for a pack source.
        displayName: { type: string, nullable: true }
        configFields:
          type: array
          description: >
            The fields the console's Add-trigger form renders for this kind — the
            core kinds' known keys (e.g. cron `spec`, file `path`) or a pack's
            declared `triggerSources[].configFields`.
          items: { $ref: '#/components/schemas/TriggerConfigField' }
    TriggerConfigField:
      type: object
      required: [key, label, required]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        default: { type: string, nullable: true }
        required:
          type: boolean
          description: Whether the Add-trigger form must have a value for this field.
    AddTriggerRequest:
      type: object
      required: [id, type, action]
      description: A new trigger to append to the App manifest's triggers[].
      properties:
        id:
          type: string
          description: Unique trigger id within the App (also the ingress path segment).
        type:
          type: string
          description: The source kind (a recognised core or pack `type`).
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >
            Flat map of the kind's config field values (keyed by
            TriggerConfigField.key). The server places each into the manifest
            shape the kind expects.
        connection:
          type: string
          nullable: true
          description: Optional named connection reference (for pack sources that use one).
        action:
          type: object
          additionalProperties: true
          description: >
            The action to apply on each event, e.g. `{ "start": "processId" }` or
            `{ "message": "messageName" }`.
