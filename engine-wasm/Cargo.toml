[package]
name = "nanobpmn-engine-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm-bindgen wrapper around nanobpmn-engine-core for in-browser (modeler) test execution."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
