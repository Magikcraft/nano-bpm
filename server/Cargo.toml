[package]
name = "nanobpm-gateway-rest-server"
version = "0.0.10"
edition = "2024"
publish = false
description = "NanoBPM gateway: stub server for the generated Camunda 8 Orchestration Cluster v2 REST layer, wired to the embedded nanobpmn engine."

[dependencies]
nanobpm-gateway-rest = { path = "../generated" }
# Generated console API layer (models + axum router + per-tag Api traits) from
# spec-console/console-api.yaml. Only needed with the `console` feature.
nanobpm-console-api = { path = "../generated-console", optional = true }
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "query", "typed-header"] }
bytes = "1"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
headers = "0.4"
http = "1"
prometheus = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# YAML for the optional runtime config file (ADR 0035). Chosen over TOML to match
# the Kubernetes ecosystem operators deploy into. Only used to parse a small,
# flat observability config at startup — no hot-path involvement.
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
# WebSocket *client* for the intra-cluster peer uplink: a node speaks the same
# Falcon protocol it serves (axum's `ws` feature is server-only). Pinned
# to the same tungstenite the server already pulls in via axum. No TLS — the
# cluster mesh is a trusted private network; `ws://` only.
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "http2"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
anyhow = "1.0.102"

# Embedded web console assets (the built Vite/React SPA under ../console/dist).
# Feature-gated so the default gateway build is byte-identical and never needs a
# built frontend. In debug builds rust-embed reads the files from disk (live
# reload); release builds bake them into the binary for a self-contained
# single-file distribution.
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# Console-only HTTP client for the cluster-health probe: each node probes its
# peers' always-on `GET /v2/topology` to report remote liveness/version/latency
# in the Topology tab. hyper(-util) is already in the tree via axum, and peers
# speak plain HTTP (no TLS — same as the Falcon uplink), so this adds no
# new TLS stack. serde_json (already a dependency) parses the probed
# `gatewayVersion`.
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
flate2 = "1.1.9"
# CRC-32 for the console's "export workers as an application" zip writer (a tiny
# self-contained STORED-archive builder, see console/worker_export.rs). Already
# in the lock as a transitive flate2 dep, so promoting it is offline-safe.
crc32fast = "1"
base64 = "0.22.1"
tower-http = { version = "0.7.0", features = ["cors"] }
# Unix filesystem stats (statvfs) for the disk-relative adaptive read-model
# retention watermark. Unix-only; the feature falls back to a fixed default off
# Unix (e.g. MSVC).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# jemalloc as the global allocator. Unlike the system allocator (macOS libmalloc,
# Linux glibc), it returns freed memory to the OS on a decay schedule and exposes
# a portable `mallctl` purge knob, so an idle server's resident footprint falls
# back down after a load burst instead of pinning the peak (see `memory.rs` and
# the idle-purge tick). It is vendored and built from source, so the binary stays
# self-contained. Not available on MSVC; the system allocator is used there.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["use_std", "stats"] }
tikv-jemalloc-sys = "0.6"

[dev-dependencies]
serde_json = "1"

# The self-contained single-node distribution: bundle the web console (cluster
# console, BPMN modeler, process-instance explorer, embedded workers) into the
# gateway binary. Off by default — the production gateway build is unaffected and
# does not require a built frontend under ../console/dist.
[features]
console = ["dep:nanobpm-console-api", "dep:rust-embed", "dep:mime_guess", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "tokio/process", "tokio/io-util"]
# ADR 0034: build the console with the lean "observe" operator profile instead of
# the full "studio" IDE. Additive over `console` — it only swaps the embedded
# bundle from `console/dist` to `console/dist-observe` (~158KB gzip vs ~4.7MB),
# so build that folder first with `npm run build:observe` in `console/`.
console-observe = ["console"]
# Diagnostic-only: builds jemalloc with heap profiling (--enable-prof) and turns
# on sampled allocation-backtrace capture at startup. Adds per-allocation
# sampling overhead, so it is NEVER enabled in a production build — it exists to
# pin the structure behind a live-heap growth via `/debug/heap/prof` + jeprof.
heapprof = ["tikv-jemallocator/profiling", "tikv-jemalloc-sys/profiling"]

# Optimized for a small production binary. `strip` removes ~8 MB of symbols;
# fat LTO + a single codegen unit let the linker drop dead code across crate
# boundaries. opt-level stays at 3 so request handling keeps its speed.
#
# `panic = "unwind"` (NOT abort): this is a *clustered* server — each node hosts
# many partitions, each an independent openraft group running on its own task.
# A panic in one partition's Raft task (e.g. openraft 0.9.24's degenerate
# apply-range edge case during a rejoin) must unwind *that task* only, never
# abort the process and take the other partitions — and the cluster's quorum —
# down with it. Genuine unrecoverable corruption still fails fast via the
# explicit `std::process::abort()` guards in `journal.rs`, which are unaffected
# by the panic strategy. (The unwinding tables cost a little binary size; node
# availability during a single-partition fault is worth it.)
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"

# Profile for running the test suite with release-level optimizations. Inherits
# `release` (already `panic = "unwind"`, which `#[test]`'s `catch_unwind`
# requires); kept as a named profile so `cargo test --profile release-test`
# stays a stable entry point in the Makefile/CI.
[profile.release-test]
inherits = "release"
panic = "unwind"

# Fast-iteration profile for building deploy/soak binaries (NOT for shipping).
# Keeps opt-level 3 (runtime throughput must stay realistic — the debug build is
# ~3.5x slower), but trades the production-binary polish for build speed:
#   * `lto = "thin"` instead of fat LTO — recovers ~all cross-crate inlining wins
#     at a fraction of the whole-program link cost, and (unlike fat LTO) does NOT
#     serialize codegen or nullify incremental.
#   * `codegen-units = 16` re-enables intra-crate codegen parallelism (the server
#     is a single ~48k-line crate, so this matters a lot).
#   * `incremental = true` — small edits to one file (e.g. falcon.rs/main.rs, our
#     hot loop) recompile only the changed codegen units.
#   * `strip = false` skips the strip pass (symbols are fine for a soak binary).
# Build with: cargo build --profile deploy-fast --features console
[profile.deploy-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false


# Vendored openraft 0.9.24 with a one-line correctness fix. Upstream 0.9.24 (the
# latest 0.9.x) panics in `RaftCore::apply_to_state_machine` when a node rejoins a
# loaded cluster: it guards only the `since == end` apply window, so a transient
# degenerate `since > end` window indexes `entries[len - 1]` on an empty slice
# (usize underflow) and permanently wedges that partition's Raft (leaderless).
# The patch changes that guard to `since >= end`. See third_party/openraft-0.9.24
# (only src/core/raft_core.rs differs from the crates.io release).
[patch.crates-io]
openraft = { path = "../third_party/openraft-0.9.24" }

# Vendored proc-macro-error2 2.0.1 (pulled in transitively via validator_derive)
# with the one-line upstream fix from GnomedDev/proc-macro-error-2#14: its
# top-level `extern crate proc_macro;` is private, so the `pub use proc_macro;`
# re-export in the crate's hidden `__export` module trips future-incompat lint
# E0365 (rust-lang/rust#127909), which will become a hard error. Project policy
# bans warnings (`[lints.rust] warnings = "deny"` below), so we carry the fix
# (`pub extern crate proc_macro;`) until an upstream release ships it. Only
# src/lib.rs differs from the crates.io release. See third_party/proc-macro-error2-2.0.1.
proc-macro-error2 = { path = "../third_party/proc-macro-error2-2.0.1" }

[lints.rust]
# Project policy: warnings are banned. `cargo build`/`check` fail on any rustc
# warning (unused code, deprecations, future-incompat lints, etc.).
warnings = "deny"
# The one documented exception: on macOS Apple `ld` emits a benign
# `linker_messages` warning because the gateway bin's `__eh_frame` unwind section
# (release keeps `panic = "unwind"`) is too large to encode into the Mach-O
# compact-unwind table, so `ld` falls back to the full DWARF `__eh_frame` (valid,
# just not compacted). The only real fix — dropping unwind tables — would break
# `panic = "unwind"` (the test harness needs it; `-Wl,-no_compact_unwind` breaks
# macOS unwinding outright). It's a platform-local artifact the deployed
# x86_64-linux binary never emits, so we allow just this lint.
linker_messages = "allow"
