[package]
name = "nanobpm-gateway-rest-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "NanoBPM gateway: stub server for the generated Camunda 8 Orchestration Cluster v2 REST layer, wired to the embedded nanobpmn engine."

[dependencies]
nanobpm-gateway-rest = { path = "../generated" }
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "query", "typed-header"] }
bytes = "1"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
headers = "0.4"
http = "1"
prometheus = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
# WebSocket *client* for the intra-cluster peer uplink: a node speaks the same
# command-stream protocol it serves (axum's `ws` feature is server-only). Pinned
# to the same tungstenite the server already pulls in via axum. No TLS — the
# cluster mesh is a trusted private network; `ws://` only.
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = "0.3"
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
anyhow = "1.0.102"

# Embedded web console assets (the built Vite/React SPA under ../console/dist).
# Feature-gated so the default gateway build is byte-identical and never needs a
# built frontend. In debug builds rust-embed reads the files from disk (live
# reload); release builds bake them into the binary for a self-contained
# single-file distribution.
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# jemalloc as the global allocator. Unlike the system allocator (macOS libmalloc,
# Linux glibc), it returns freed memory to the OS on a decay schedule and exposes
# a portable `mallctl` purge knob, so an idle server's resident footprint falls
# back down after a load burst instead of pinning the peak (see `memory.rs` and
# the idle-purge tick). It is vendored and built from source, so the binary stays
# self-contained. Not available on MSVC; the system allocator is used there.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["use_std", "stats"] }
tikv-jemalloc-sys = "0.6"

[dev-dependencies]
serde_json = "1"

# The self-contained single-node distribution: bundle the web console (cluster
# console, BPMN modeler, process-instance explorer, embedded workers) into the
# gateway binary. Off by default — the production gateway build is unaffected and
# does not require a built frontend under ../console/dist.
[features]
console = ["dep:rust-embed", "dep:mime_guess", "tokio/process", "tokio/io-util"]

# Optimized for a small production binary. `strip` removes ~8 MB of symbols;
# fat LTO + a single codegen unit let the linker drop dead code across crate
# boundaries; `panic = "abort"` removes the unwinding tables and landing pads
# (the server treats a panic as fatal anyway). opt-level stays at 3 so request
# handling keeps its speed.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

