[package]
name = "rust-worker"
version = "0.1.0"
edition = "2021"
description = "Native Rust load-testing harness for nanobpmn: a saturation driver (loadgen) and an over-provisioning job worker (worker-unit), both built on the camunda-orchestration-sdk."

[[bin]]
name = "worker-unit"
path = "src/main.rs"

[[bin]]
name = "loadgen"
path = "src/loadgen.rs"

[dependencies]
# Both binaries drive the gateway through the published Rust SDK, which
# transparently selects the Falcon command stream or REST long-poll based on the
# gateway's advertised capabilities:
#   - loadgen (src/loadgen.rs): instance creation + job completion,
#   - worker-unit (src/main.rs): job activation + completion for the node-scaling
#     harness, gated on the SDK's on_ready subscription signal (>= 0.2.2).
camunda-orchestration-sdk = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
