name: release-engine-testkit-npm

# Triggered by tags of the form `engine-testkit-npm-v0.1.0`. Builds & publishes
# @nanobpm/engine-testkit to the npm registry.
#
# Unlike release-nano-bernd-npm, this package is pure TypeScript with ZERO
# runtime dependencies and no wasm — so there is no engine build / wasm sync
# step. It just installs, verifies the tag, builds (tsc), tests, and publishes.
#
# Authentication is npm OIDC trusted publishing — NO NPM_TOKEN. The package must
# have a Trusted Publisher configured on npmjs.com pointing at this repo + this
# workflow file (see clients/engine-testkit/RELEASING.md).
#
# Note: npm provenance is intentionally disabled (NPM_CONFIG_PROVENANCE=false) —
# it requires a public source repository, and nano-bpm is private by design.

on:
  push:
    tags:
      - 'engine-testkit-npm-v*'
  workflow_dispatch: {}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/engine-testkit-npm-v')
    name: Publish @nanobpm/engine-testkit
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write lets npm exchange the GitHub OIDC token for a
      # short-lived publish token (trusted publishing).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; pin a known-good
      # version (explicit, not @latest) so the publish pipeline is reproducible.
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@11.5.1

      - name: Install
        working-directory: clients/engine-testkit
        run: npm ci

      - name: Verify tag matches package version
        working-directory: clients/engine-testkit
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#engine-testkit-npm-v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::tag $tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "releasing @nanobpm/engine-testkit $pkg_version"

      - name: Build
        working-directory: clients/engine-testkit
        run: npm run build

      - name: Test
        working-directory: clients/engine-testkit
        run: npm test

      - name: Publish
        working-directory: clients/engine-testkit
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm publish --access public
