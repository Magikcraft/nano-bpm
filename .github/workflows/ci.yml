# Test + clippy gate. Runs on every push to main and on PRs so a red build is
# caught BEFORE a release tag is cut. Each crate is independent (no root
# workspace), so it gets its own job with a scoped cache.
#
# Scope: clippy (-D warnings) + cargo test per crate, plus a formatting gate.
# Formatting uses a PINNED NIGHTLY rustfmt (see the `fmt` job and rustfmt.toml):
# the canonical style relies on unstable rustfmt options (group_imports) that
# stable `cargo fmt` silently ignores, so only the pinned nightly reproduces it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap change-detection so the expensive per-crate jobs only run when their
  # sources actually change. A skipped required check is treated as success by
  # branch protection, so gating a job with `if:` still lets a docs/scripts-only
  # PR merge without burning a full crate build.
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      processos: ${{ steps.filter.outputs.processos }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            processos:
              - 'processos/**'
              - 'engine-core/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt (pinned nightly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Keep this version in lockstep with FMT_TOOLCHAIN in the Makefile. The
      # canonical style uses unstable rustfmt options, so a specific nightly is
      # pinned; bump it deliberately in a single style commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-26
          components: rustfmt
      # server/src/stub_impls.rs is codegen (gitignored) but is a `mod` of the
      # server crate, so rustfmt needs *a* file there to resolve the module tree.
      # A canonical one-line stub suffices for a parse-only format check — no need
      # for the full Java/uv codegen the build jobs run.
      - name: Stub codegen module
        run: printf '// fmt stub\n' > server/src/stub_impls.rs
      - name: Format check
        run: make fmt-check

  engine-core:
    name: engine-core (clippy + test)
    runs-on: ubuntu-24.04
    # sccache gives a content-addressed rustc cache shared across CI runs (and
    # across the engine-core/server/processos jobs that all compile this crate as
    # a path dep). Unlike Swatinem's all-or-nothing target restore, sccache still
    # hits per-crate when a cache key is busted (e.g. the mold rustflag), so a
    # flag change no longer forces a full cold rebuild. CARGO_INCREMENTAL=0 is
    # required — incremental is incompatible with a compiler cache.
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-core
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@nextest
      - name: Clippy
        working-directory: engine-core
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: engine-core
        # nextest for the unit/integration suite (process isolation + retries,
        # consistent with the server job). nextest CANNOT run doctests, so the
        # crate's `///` examples (ProcessBuilder, parse_bpmn) run separately.
        run: cargo nextest run
      - name: Doctests
        working-directory: engine-core
        run: cargo test --doc

  engine-wasm-ffi-dist:
    name: engine-wasm-ffi (dist + verify)
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-core
          # Cache-key rider so this job doesn't fight the engine-core job's cache
          # (they build the same crate for different targets).
          key: wasm32
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build + verify + emit dist
        run: make engine-wasm-ffi-dist
      - name: Show manifest
        run: cat dist/engine-wasm-ffi/manifest.json
      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: engine-wasm-ffi
          path: dist/engine-wasm-ffi/
          if-no-files-found: error
          retention-days: 14

  nano-bernd-npm:
    name: '@nanobpm/nano-bernd (build + test)'
    runs-on: ubuntu-24.04
    needs: engine-wasm-ffi-dist
    defaults:
      run:
        working-directory: clients/nano-bernd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Download engine-wasm-ffi artifact
        uses: actions/download-artifact@v7
        with:
          name: engine-wasm-ffi
          path: dist/engine-wasm-ffi/
      - name: Install
        run: npm install
      - name: Sync wasm from dist
        run: npm run sync-wasm
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  nano-bernd-jvm:
    name: 'io.github.jwulf:nano-bernd (JVM, Chicory)'
    runs-on: ubuntu-24.04
    needs: engine-wasm-ffi-dist
    defaults:
      run:
        working-directory: clients/nano-bernd-jvm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download engine-wasm-ffi artifact
        uses: actions/download-artifact@v7
        with:
          name: engine-wasm-ffi
          path: dist/engine-wasm-ffi/
      - name: Sync wasm into resources
        run: bash scripts/sync-wasm.sh
      - name: Verify + test
        run: mvn --batch-mode --no-transfer-progress verify

  processos:
    name: processos (clippy + test)
    runs-on: ubuntu-24.04
    # processos compiles engine-core as a path dep, so it must re-run when either
    # crate changes (or when this workflow changes). It's the heaviest job
    # (DuckDB/libduckdb-sys builds a large C++ tree), so skipping it on unrelated
    # PRs — docs, scripts, other crates — is the biggest CI-minute saver.
    needs: changes
    if: ${{ needs.changes.outputs.processos == 'true' }}
    env:
      RUSTC_WRAPPER: 'sccache'
      # Local sccache backend persisted by a dedicated actions/cache below, so the
      # DuckDB C/C++ objects survive independently of the shared, LRU-evicted GHA
      # cache pool. cc-rs auto-routes the libduckdb-sys compile through this
      # wrapper (RUSTC_WRAPPER fallback), so ~590 DuckDB translation units are
      # content-addressed and reused instead of recompiled (~20 min when cold).
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      # Comfortably above one cold build's writes (~590 DuckDB objects + Rust
      # crates, ~3G) so DuckDB objects are never LRU-evicted mid-run, while still
      # bounding the cached dir so it can't monopolise the repo cache quota.
      SCCACHE_CACHE_SIZE: '5G'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      # DuckDB (libduckdb-sys) compiles a large amount of C++; a cold build (e.g.
      # when the cache key changes) writes enough object files to exhaust the
      # runner's root disk. Reclaim space from preinstalled SDKs we don't use.
      # NOTE: this MUST run before sccache-action / taiki-e install tools, because
      # $AGENT_TOOLSDIRECTORY == /opt/hostedtoolcache, which is where those
      # actions place their binaries — wiping it afterwards deletes sccache.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      # Key the DuckDB object cache on the libduckdb-sys version: it's the one C++
      # build input that "doesn't change" between unrelated commits. The run-id
      # suffix makes every saved entry unique, and the save step below only fires
      # when DuckDB was actually (re)compiled — so warm-cache runs (where Swatinem
      # served target/ and nothing hit sccache) never overwrite the entry with an
      # empty dir. Restore falls back by prefix to the newest populated entry.
      - name: Resolve libduckdb-sys version
        id: duckdb
        run: |
          ver=$(awk -F'"' '/name = "libduckdb-sys"/{getline; print $2}' processos/Cargo.lock)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "libduckdb-sys=$ver"
      - name: Restore DuckDB sccache
        id: duckcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-duckdb-${{ runner.os }}-${{ steps.duckdb.outputs.ver }}-${{ github.run_id }}
          restore-keys: |
            sccache-duckdb-${{ runner.os }}-${{ steps.duckdb.outputs.ver }}-
            sccache-duckdb-${{ runner.os }}-
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: processos
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@nextest
      - name: Clippy
        working-directory: processos
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: processos
        # processos is a binary crate (no lib target) => no doctests, so nextest
        # loses no coverage and gains process isolation + retries.
        run: cargo nextest run
      - name: sccache stats
        id: sccstats
        if: always()
        run: |
          sccache --show-stats
          # Count C/C++ objects compiled+stored this run. >0 means DuckDB was
          # actually (re)built, so the sccache dir now holds fresh DuckDB objects
          # worth persisting; ==0 means Swatinem served target/ and the dir is
          # only whatever we restored — don't re-save it (avoids empty overwrites).
          cpp=$(sccache --show-stats --stats-format=json \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['stats'].get('cache_misses',{}).get('counts',{}).get('C/C++',0))")
          echo "cpp_writes=$cpp" >> "$GITHUB_OUTPUT"
          echo "C/C++ objects compiled this run: $cpp"
      - name: Save DuckDB sccache
        # Only persist when DuckDB C++ actually compiled, and only if this exact
        # run-id key isn't already stored.
        if: ${{ always() && steps.sccstats.outputs.cpp_writes != '0' && steps.sccstats.outputs.cpp_writes != '' && steps.duckcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-duckdb-${{ runner.os }}-${{ steps.duckdb.outputs.ver }}-${{ github.run_id }}

  server:
    name: server (clippy + test)
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@nextest
      - name: Generate REST layer + stub impls
        # The server depends on the path crate ../generated and on
        # server/src/stub_impls.rs, both produced by codegen (gitignored). Mirror
        # the release `prepare` job's codegen (Java + uv); no Node/wasm needed.
        run: |
          set -euo pipefail
          uv sync
          make generate
      - name: Stub console assets
        # The `console` feature embeds ../console/dist via rust-embed, but that
        # built frontend is gitignored. A stub satisfies the proc-macro so the
        # gate can clippy/test the console code without a full npm build.
        run: mkdir -p console/dist && printf '<!doctype html>\n' > console/dist/index.html
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets --features console -- -D warnings
      - name: Test
        working-directory: server
        # Run with nextest so the heavy, timing-sensitive integration tests
        # (`clustered_startup_tests` spin up multi-node Raft clusters on a
        # worker_threads=4 runtime; `seglog::tests` drive snapshot+tail recovery)
        # run in a single-threaded group with a couple of retries — see
        # .config/nextest.toml. This eliminates the cross-test CPU oversubscription
        # AND absorbs the residual timing flakes that even a serial run hit on a
        # slow runner, while the rest of the suite stays strict and parallel.
        # (The server crate is a binary with no lib target, so there are no
        # doctests to run separately.)
        run: cargo nextest run --features console
