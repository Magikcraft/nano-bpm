name: release-nano-app-schema-npm

# Triggered by tags of the form `nano-app-schema-npm-v0.1.0`. Builds & publishes
# @nanobpm/nano-app-schema (the canonical Urban App manifest schema + types +
# validator) to the npm registry.
#
# Authentication is npm OIDC trusted publishing — NO NPM_TOKEN. The package must
# have a Trusted Publisher configured on npmjs.com pointing at this repo + this
# workflow file (see spec-app/RELEASING.md).
#
# Note: npm provenance is intentionally disabled (NPM_CONFIG_PROVENANCE=false) —
# it requires a public source repository, and nano-bpm is private by design.

on:
  push:
    tags:
      - 'nano-app-schema-npm-v*'
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish @nanobpm/nano-app-schema
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write lets npm exchange the GitHub OIDC token for a
      # short-lived publish token (trusted publishing).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; pin a known-good
      # version (explicit, not @latest) so the publish pipeline is reproducible.
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@11.5.1

      - name: Install
        working-directory: spec-app
        run: npm ci

      - name: Verify tag matches package version
        working-directory: spec-app
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#nano-app-schema-npm-v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::tag $tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "releasing @nanobpm/nano-app-schema $pkg_version"

      - name: Build
        working-directory: spec-app
        run: npm run build

      - name: Test
        working-directory: spec-app
        run: npm test

      - name: Publish
        working-directory: spec-app
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm publish --access public
