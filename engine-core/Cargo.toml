[package]
name = "nanobpmn-engine-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal, embeddable BPMN execution core: a deterministic single-writer command/event/applier state machine (Camunda 8 / Zeebe-style), with zero dependencies so it builds for server, mobile (iOS/Android via FFI) and wasm targets."
license = "Apache-2.0"

# Intentionally dependency-free by default: std-only so the same crate compiles
# for aarch64-apple-ios, aarch64-linux-android and wasm32 without pulling a DB,
# async runtime or networking. Persistence is a caller concern (replay the log).
# The optional `serde` feature derives (de)serialization on the event log and
# model so a host can persist and replay it; it is off by default.
[dependencies]
# `rc` lets the optional control-state snapshot (cold spill) (de)serialize the
# `Arc`-shared `variables` payload on `ProcessInstance`; it has no effect when
# the `serde` feature is off.
serde = { version = "1", optional = true, features = ["derive", "rc"] }
# `rmp-serde` powers the opt-in msgpack variable codec (see `packed.rs`): a
# compact binary encoding of the create/job `variables` payload that rides the
# hot path opaquely (Zeebe-style) so replica followers need not inflate a
# `HashMap<String, Value>`. Gated behind the `msgpack` feature so the default
# build stays dependency-free for the mobile/wasm embed targets.
rmp-serde = { version = "1.3", optional = true }

[features]
serde = ["dep:serde"]
# Opt-in msgpack variable codec. Implies `serde` (the codec (de)serializes the
# `serde`-derived `Value`/`HashMap`). Hosts that evaluate FEEL conditions on
# packed payloads (i.e. the server) must enable this; pure embedders need not.
msgpack = ["dep:rmp-serde", "serde"]
# Exposes the coarse C-ABI surface in `ffi.rs` (paired with the `cdylib`
# crate-type below) so a non-Rust host can embed the engine via FFI/wasm.
ffi = []

[lib]
name = "nanobpmn_engine_core"
path = "src/lib.rs"
# `lib` for Rust consumers and the test/bench harness; `cdylib` so a C/Swift/
# Kotlin host or the `wasm32-unknown-unknown` target gets a loadable artifact
# exporting the `ffi` functions (built with `--features ffi`).
crate-type = ["lib", "cdylib"]

[dev-dependencies]
# Used only by the `serde`-gated snapshot round-trip test to exercise actual
# (de)serialization (catches issues like non-string map keys).
serde_json = "1"

[lints.rust]
# Project policy: warnings are banned. `cargo build`/`check` fail on any rustc
# warning (unused code, deprecations, future-incompat lints, linker_messages,
# etc.). See .cargo/config.toml for the macOS `__eh_frame` linker-warning fix.
warnings = "deny"
